name: test-163-regenerate-package-projections

on:
  push:
    branches:
      - "test/163-minimal-package"
    paths:
      - ".github/workflows/test-163-regenerate-package-projections.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/163-minimal-package
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet jsonschema
      - name: Regenerate governed data and TEST pages
        run: |
          python3 Shared/tools/build_web_data.py
          python3 Shared/tools/build_test_site.py
          python3 Shared/tools/build_pages_site.py
      - name: Refuse unexpected write surface
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(tools/data\.js|public/data/data\.js|public/test/.*|docs/data/data\.js|docs/tools/data\.js|docs/test/.*|docs/\.pages-manifest\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit governed generated outputs
        run: |
          if git diff --quiet; then
            echo "Generated outputs already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js public/data/data.js public/test docs/data/data.js docs/tools/data.js docs/test docs/.pages-manifest.json
          git commit -m "build(test): project minimal Rational Numbers package"
          git push origin HEAD:test/163-minimal-package
