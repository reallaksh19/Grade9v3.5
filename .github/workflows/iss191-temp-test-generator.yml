name: ISS191 temporary TEST generator receipt
on:
  push:
    branches:
      - trial/iss191-u5-test-header-portal-root-20261008
    paths:
      - .github/workflows/iss191-temp-test-generator.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: trial/iss191-u5-test-header-portal-root-20261008
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install builder requirements
        run: python3 -m pip install --quiet jsonschema pypdf
      - name: Regenerate governed TEST and Pages outputs
        run: |
          python3 Shared/tools/build_test_site.py
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
      - name: Enforce all three generated freshness checks
        run: |
          python3 Shared/tools/build_test_site.py --check
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_test_area.TestPages.test_test_shell_subject_links_stay_under_portal_root_at_each_depth -v
          python3 -m unittest tests.test_test_area.TestPages.test_committed_pages_are_what_the_generator_writes -v
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Commit generated outputs only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- public/test docs/test docs/.pages-manifest.json docs/architecture-manifest.json
          echo "Generated delta:"
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No generated differences"
            exit 0
          fi
          git commit -m "build(test): refresh TEST pages and Pages mirror after portal-root repair"
          git push origin HEAD:trial/iss191-u5-test-header-portal-root-20261008
