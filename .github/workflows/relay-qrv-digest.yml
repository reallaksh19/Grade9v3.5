name: relay-qrv-digest

on:
  push:
    branches:
      - takeover/topic-atlas-browser-correctness
    paths:
      - .github/workflows/relay-qrv-digest.yml

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: takeover/topic-atlas-browser-correctness
      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: d9b84069683977b5c370f536f1c50095de926338
          path: _common
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pyyaml
      - name: Compute QRV digest
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("_common/skills/engineering-pr-delivery-v2.5/scripts").resolve()))
          from takeoverlib import yaml_digest
          print("QRV_DIGEST=" + yaml_digest(Path("agents/relay/quality/QRV-TA-008.yaml")))
          PY
