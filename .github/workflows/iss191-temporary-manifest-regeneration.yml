name: ISS191 temporary governed manifest regeneration
on:
  push:
    branches:
      - integration/iss191-clean-core-recovery
    paths:
      - .github/workflows/iss191-temporary-manifest-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate-exact-derived-manifest:
    if: github.repository == 'reallaksh19/Grade9v3.5' && github.ref == 'refs/heads/integration/iss191-clean-core-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove ephemeral generator workflow from final source inventory
        run: git rm -- .github/workflows/iss191-temporary-manifest-regeneration.yml
      - name: Generate governed architecture manifest from final intended tree
        run: python3 Shared/tools/build_manifest.py
      - name: Commit exact generated manifest and temporary workflow removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/architecture-manifest.json .github/workflows/iss191-temporary-manifest-regeneration.yml
          actual="$(git diff --cached --name-only)"
          expected="$(printf '%s\n' '.github/workflows/iss191-temporary-manifest-regeneration.yml' 'docs/architecture-manifest.json')"
          printf '%s\n' "$actual"
          test "$actual" = "$expected"
          git commit -m 'build(iss191): freeze generated manifest without ephemeral worker'
          git push origin "HEAD:${{ github.ref_name }}"
