name: ISS191 temporary governed manifest regeneration
on:
  push:
    branches:
      - integration/iss191-clean-core-recovery
    paths:
      - .github/workflows/iss191-temporary-manifest-regeneration.yml

permissions:
  contents: write

jobs:
  regenerate-exact-derived-manifest:
    if: github.repository == 'reallaksh19/Grade9v3.5' && github.ref == 'refs/heads/integration/iss191-clean-core-recovery'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate governed architecture manifest
        run: python3 Shared/tools/build_manifest.py
      - name: Commit only generated architecture manifest to this branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/architecture-manifest.json; then
            echo "Architecture manifest already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/architecture-manifest.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = 'docs/architecture-manifest.json'
          git commit -m 'build(iss191): regenerate architecture manifest from merged authority'
          git push origin "HEAD:${{ github.ref_name }}"
