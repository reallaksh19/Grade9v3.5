name: phase5-regression-reconcile

on:
  push:
    branches:
      - audit/core1-delivery-phase5

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-regression-reconcile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core1-delivery-phase5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Run reconciled regression oracles
        run: |
          python3 -m unittest \
            tests.test_issue212_atlas_index \
            tests.test_readiness_join_215 \
            tests.test_topic_atlas_browser_runtime
      - name: Regenerate governed artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit exact generator output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[phase5-regression-reconcile] Refresh generated manifest"
          git push origin HEAD:audit/core1-delivery-phase5
