name: phase-e-final-handoff

on:
  push:
    branches:
      - integration/iss69-e03-final-handoff

permissions:
  contents: write

env:
  E02_BASE: 7d9a53d11daa8f54a8ebb32e0eeda284f1b0db1e
  E03_BRANCH: integration/iss69-e03-final-handoff

jobs:
  refresh-architecture-manifest:
    if: ${{ !contains(github.event.head_commit.message, '[iss69-e03-manifest-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/iss69-e03-final-handoff
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install manifest dependencies
        run: python -m pip install --quiet jsonschema pypdf

      - name: Enforce E03 declared write surface
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$E02_BASE" HEAD
          bad=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/phase-e-final-handoff.yml|              docs/architecture-manifest.json|              evidence/architectural-recovery/ISS69/phase-e-delp-execution-graph.v32.json|              evidence/architectural-recovery/ISS69/phase-e-e03-final-handoff.v1.json|              tests/test_phase_e_final_handoff.py)
                ;;
              *) bad+=("$path") ;;
            esac
          done < <(git diff --name-only "$E02_BASE"...HEAD)
          if [ "${#bad[@]}" -ne 0 ]; then
            echo "E03 contains undeclared path(s):"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi

      - name: Regenerate architecture manifest mechanically
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py
          bad=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              docs/architecture-manifest.json) ;;
              *) bad+=("$path") ;;
            esac
          done < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          if [ "${#bad[@]}" -ne 0 ]; then
            echo "Manifest regeneration touched undeclared path(s):"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi
          python3 Shared/tools/build_manifest.py --check

      - name: Commit generated manifest if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "Architecture manifest already current."
            exit 0
          fi
          git commit -m "[iss69-e03-manifest-refresh] Refresh architecture manifest for final handoff"
          git push origin HEAD:"$E03_BRANCH"

  qualify-final-handoff:
    needs: refresh-architecture-manifest
    if: ${{ always() && (needs.refresh-architecture-manifest.result == 'success' || needs.refresh-architecture-manifest.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/iss69-e03-final-handoff
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install qualification dependencies
        run: python -m pip install --quiet jsonschema pypdf

      - name: Verify exact branch head and manifest freshness
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$E02_BASE" HEAD
          python3 Shared/tools/build_manifest.py --check
          echo "E03_HEAD=$(git rev-parse HEAD)"

      - name: Run E03 final handoff contract
        run: python3 -m unittest -v tests.test_phase_e_final_handoff

      - name: Prove E03 has no production/runtime delta
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/phase-e-final-handoff.yml|              docs/architecture-manifest.json|              evidence/architectural-recovery/ISS69/phase-e-delp-execution-graph.v32.json|              evidence/architectural-recovery/ISS69/phase-e-e03-final-handoff.v1.json|              tests/test_phase_e_final_handoff.py)
                ;;
              *) bad+=("$path") ;;
            esac
          done < <(git diff --name-only "$E02_BASE"...HEAD)
          if [ "${#bad[@]}" -ne 0 ]; then
            echo "Unexpected E03 delta:"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi
          echo "E03 declared-surface-only delta: PASS"
