name: phase-e-final-handoff

on:
  push:
    branches:
      - integration/iss69-e03-final-handoff

env:
  E02_BASE: 7d9a53d11daa8f54a8ebb32e0eeda284f1b0db1e

jobs:
  final-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: python -m pip install --quiet jsonschema pypdf

      - name: Verify E03 exclusive write surface and generated freshness
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$E02_BASE" HEAD

          bad=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/phase-e-final-handoff.yml|              evidence/architectural-recovery/ISS69/phase-e-delp-execution-graph.v32.json|              evidence/architectural-recovery/ISS69/phase-e-e03-final-handoff.v1.json)
                ;;
              *) bad+=("$path") ;;
            esac
          done < <(git diff --name-only "$E02_BASE"...HEAD)

          if [ "${#bad[@]}" -ne 0 ]; then
            echo "Unexpected E03 material delta:"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi

          python3 Shared/tools/build_manifest.py --check

      - name: Validate final coverage, frontier and programme result
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          repo = Path(".")
          evidence_path = repo / "evidence/architectural-recovery/ISS69/phase-e-e03-final-handoff.v1.json"
          graph_path = repo / "evidence/architectural-recovery/ISS69/phase-e-delp-execution-graph.v32.json"
          matrix_path = repo / "Shared/quality/question-demand-matrix.v1.json"
          blueprints_path = repo / "Shared/web/interactive-page-blueprints.v1.json"

          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          matrix = json.loads(matrix_path.read_text(encoding="utf-8"))
          blueprints = json.loads(blueprints_path.read_text(encoding="utf-8"))["blueprints"]

          node = next(row for row in graph["nodes"] if row["ref"].endswith("#117"))
          assert node["responsibility_id"] == "ISS69-E03-FINAL-HANDOFF"
          assert len(node["units"]) == 5
          total = sum(row["weight"] for row in node["units"])
          assert all(row["weight"] * 100 <= total * 40 for row in node["units"])
          assert node["size_budget"]["target_loc"] <= 700
          assert node["size_budget"]["hard_loc"] <= 1500
          assert node["write_surface"] == [
              ".github/workflows/phase-e-final-handoff.yml",
              "evidence/architectural-recovery/ISS69/phase-e-e03-final-handoff.v1.json",
          ]
          assert all(row["verify"] == "phase-e-final-handoff workflow" for row in node["units"])

          coverage = evidence["accepted_coverage"]
          demands = list(matrix["demands"])
          bands = list(matrix["band_policies"])
          expected = {f"{d}-{b}" for d in demands for b in bands}
          assert len(demands) == 7 and len(bands) == 4
          assert coverage["accepted_row_count"] == 0
          assert coverage["accepted_cell_count"] == 0
          assert coverage["unsupported_cell_count"] == 28
          assert coverage["coverage_fraction"] == "0/28"
          assert coverage["accepted_rows"] == []
          assert coverage["accepted_cells"] == []
          assert set(coverage["unsupported_cells"]) == expected
          assert coverage["unsupported_status"] == "UNSUPPORTED_NO_CURRENT_INDEPENDENT_RENDERED_ACCEPTANCE"

          def git_blob_sha(path: Path) -> str:
              data = path.read_bytes()
              return hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()

          frontier = evidence["frontier"]
          for relative, expected_blob in [
              (frontier["phase_d"]["evidence_path"], frontier["phase_d"]["evidence_blob"]),
              (frontier["phase_e"]["e01"]["evidence_path"], frontier["phase_e"]["e01"]["evidence_blob"]),
              (frontier["phase_e"]["e02"]["evidence_path"], frontier["phase_e"]["e02"]["evidence_blob"]),
          ]:
              assert git_blob_sha(repo / relative) == expected_blob, relative

          wanted = {"BP-CORE1A-CONSTRUCTION", "BP-CORE2-SOURCE-QUESTION"}
          active = {
              f'{row["id"]}@{row["version"]}'
              for row in blueprints
              if row["status"] == "ACTIVE" and row["id"] in wanted
          }
          compat = evidence["compatibility_and_migration"]
          assert active == set(compat["current_blueprints"])
          assert compat["legacy_blueprints"]["disposition"] == "OBSERVABLE_COMPATIBILITY_NOT_CURRENT_AUTHORITY"
          assert compat["generated_projection_migration"]["final_state"] == "FRESH_ON_E02_EXACT_TREE"
          assert compat["historical_classification_replay"]["state"] == "REPLAY_REQUIRED_NONACCEPTING"
          assert compat["rendered_review_receipt"]["disposition"] == "REVIEW_STALE_DO_NOT_REUSE"

          appendix = frontier["appendix_a"]
          assert appendix["technical_state"] == "COMPLETE_BROWSER_PASS"
          assert appendix["promotion_release_state"] == "SEPARATE_NOT_GRANTED"

          atlas = next(row for row in frontier["returned_architecture_findings"] if row["issue"] == 125)
          assert atlas["responsibility_complete"] is True
          assert atlas["merge_release_granted"] is False
          assert atlas["validation"] == "DEDICATED_BROWSER_AND_EXACT_TEST_ID_PASS"

          result = evidence["task_result"]
          assert result == {
              "RESULT_SCOPE": "RESPONSIBILITY",
              "COVERAGE": "architectural recovery programme #69",
              "RESPONSIBILITY_COMPLETE": "YES",
              "ACCEPTED_QRT_COVERAGE": "0/28",
          }

          assert evidence["non_grants"] == {
              "merge_to_main": False,
              "golden_promotion": False,
              "learner_publication": False,
              "independent_academic_acceptance": False,
              "learning_effectiveness": False,
          }

          limitations = {row["id"]: row["state"] for row in evidence["limitations"]}
          assert limitations["UNSUPPORTED_QRT_COVERAGE"] == "28_CELLS_UNSUPPORTED"
          assert limitations["INHERITED_REPOSITORY_DEBT"] == "109_NOT_NEW"
          assert limitations["INDEPENDENT_ACADEMIC_ACCEPTANCE"] == "NOT_GRANTED"
          assert limitations["APPENDIX_A_PROMOTION"] == "SEPARATE_NOT_GRANTED"
          assert limitations["OPEN_DRAFT_PRS"] == "NOT_MERGED_BY_E03"

          print("E03 final handoff contract: PASS")
          PY

      - name: Report exact head
        run: |
          echo "E03_HEAD=$(git rev-parse HEAD)"
          echo "E03 final handoff has no product/runtime/generated delta."
