name: qb-admission-generate-q11-q20

on:
  push:
    branches:
      - feat/admit-ncert-poly-q11-q20
    paths:
      - "Mathematics/library/polynomials.v1.json"
      - "tests/test_question_bank_web.py"
      - "tests/test_question_bank_platform.py"
      - "tests/test_question_bank_platform_runtime.py"
      - "tests/test_ncert_polynomial_admission.py"
      - ".github/workflows/qb-admission-generate-q11-q20.yml"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admit-ncert-poly-q11-q20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Question Bank artifacts
        run: |
          python3 Shared/tools/build_question_bank_web.py
          python3 Shared/tools/build_question_bank_platform.py --write
          cp public/data/question-bank-data.js docs/data/question-bank-data.js
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qb-q11-q20-generated-${{ github.sha }}
          if-no-files-found: error
          path: |
            public/data/question-bank-data.js
            public/data/question-bank-catalog.js
            public/data/question-bank-search.js
            public/data/question-bank-questions.js
            public/data/question-bank-resources.js
            public/data/question-bank-manifest.js
            public/data/question-bank-details/*.js
            docs/data/question-bank-data.js
            docs/data/question-bank-catalog.js
            docs/data/question-bank-search.js
            docs/data/question-bank-questions.js
            docs/data/question-bank-resources.js
            docs/data/question-bank-manifest.js
            docs/data/question-bank-details/*.js
            artifacts/question-bank/dedup-report.json
            artifacts/question-bank/lineage.json
            artifacts/question-bank/build-receipt.json
