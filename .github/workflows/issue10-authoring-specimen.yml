name: issue10-authoring-cold-run

on:
  push:
    branches:
      - feat/minimal-prompt-authoring-intake
    paths:
      - evidence/authoring/issue10-surface-areas-volumes/**
      - Shared/tools/render_core.py
      - tests/test_authoring_applicability.py
      - .github/workflows/issue10-authoring-specimen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-specimen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install authoring dependencies
        run: pip install --quiet jsonschema pypdf
      - name: Apply PR8 authority reconciliations
        run: |
          python3 evidence/authoring/issue10-surface-areas-volumes/apply_u4_reconciliation.py
          python3 evidence/authoring/issue10-surface-areas-volumes/apply_shell_compatibility.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Shared/web/interactive-page-blueprints.v1.json Shared/quality/learner-quality.v1.json Shared/tools/quality_contract.py docs/specs/PAGE-BLUEPRINT-COMPONENTS.md Shared/tools/render_core.py; then
            git add Shared/web/interactive-page-blueprints.v1.json Shared/quality/learner-quality.v1.json Shared/tools/quality_contract.py docs/specs/PAGE-BLUEPRINT-COMPONENTS.md Shared/tools/render_core.py
            git commit -m "fix(renderer): restore governed tablet shell markers"
            git push origin HEAD:feat/minimal-prompt-authoring-intake
          fi
      - name: Focused authoring and Blueprint regressions
        shell: bash
        run: |
          set -o pipefail
          {
            python3 Shared/tools/blueprint_spec.py --check
            python3 Shared/tools/quality_contract.py --check
            python3 -m unittest \
              tests.test_authoring_applicability \
              tests.test_authoring_intake \
              tests.test_question_review_matrix.QuestionReviewMatrixTests.test_source_contract_is_valid_and_projection_is_current \
              tests.test_question_review_matrix.QuestionReviewMatrixTests.test_compiler_emits_exactly_twenty_eight_unique_cells \
              tests.test_question_review_matrix.QuestionReviewMatrixTests.test_resolver_selects_one_cell_and_fills_learner_relative_slots \
              tests.test_question_review_matrix.QuestionReviewMatrixTests.test_percentage_never_routes_or_changes_slots
          } 2>&1 | tee /tmp/issue10-focused-tests.log
      - name: Materialize Issue 10 inputs
        run: |
          PYTHONPATH=. python3 evidence/authoring/issue10-surface-areas-volumes/build_specimen.py
          python3 evidence/authoring/issue10-surface-areas-volumes/finalize_specimen.py
      - name: Validate owner custody and reference-depth Core2 support
        run: |
          python3 Shared/tools/owner_bank.py check \
            evidence/authoring/issue10-surface-areas-volumes/generated/owner.bank.json
      - name: Validate package schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path('Shared/library/package.schema.json').read_text(encoding='utf-8'))
          package=json.loads(Path('evidence/authoring/issue10-surface-areas-volumes/generated/package.v1.json').read_text(encoding='utf-8'))
          Draft202012Validator(schema).validate(package)
          print('package schema: PASS')
          PY
      - name: Strict governed render of requested roles
        run: |
          rm -rf /tmp/issue10-sav
          python3 Shared/tools/render_core.py build \
            --manifest evidence/authoring/issue10-surface-areas-volumes/generated/product.manifest.json \
            --out /tmp/issue10-sav \
            --mode PAGES
          test -f /tmp/issue10-sav/core1a.html
          test -f /tmp/issue10-sav/core2.html
          test ! -f /tmp/issue10-sav/core1b.html
          test ! -f /tmp/issue10-sav/core2a.html
          test ! -f /tmp/issue10-sav/core2b.html
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser audit dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Strict learner quality gate
        run: |
          python3 Shared/tools/quality_gate.py /tmp/issue10-sav \
            --subject Mathematics \
            --product-id EVIDENCE-MAT-ISSUE10-SAV \
            --report /tmp/issue10-sav/quality-gate.json \
            --strict
      - name: Tablet 12.7 browser audit
        run: |
          node tools/site-audit/core-page-audit.mjs \
            /tmp/issue10-sav \
            --profile tablet-12.7 \
            --http-root /tmp/issue10-sav \
            --json /tmp/issue10-sav/tablet-audit.json
      - name: Record exact head
        if: always()
        run: |
          mkdir -p /tmp/issue10-sav
          git rev-parse HEAD > /tmp/issue10-sav/exact-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue10-surface-areas-volumes-cold-run
          path: |
            /tmp/issue10-sav
            /tmp/issue10-focused-tests.log
            evidence/authoring/issue10-surface-areas-volumes/generated
          if-no-files-found: error
          retention-days: 14
