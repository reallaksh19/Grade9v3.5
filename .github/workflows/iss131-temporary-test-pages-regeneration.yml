name: ISS131 temporary TEST page regeneration
on:
  push:
    branches:
      - feat/131-ncert-number-systems-q01-test-product-20261008
    paths:
      - .github/workflows/iss131-temporary-test-pages-regeneration.yml

permissions:
  contents: write

jobs:
  publish-producer-bytes-to-draft-branch:
    if: github.repository == 'reallaksh19/Grade9v3.5' && github.ref == 'refs/heads/feat/131-ncert-number-systems-q01-test-product-20261008'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact TEST draft branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove this worker before generating the final tree
        run: git rm -- .github/workflows/iss131-temporary-test-pages-regeneration.yml
      - name: Regenerate authoritative TEST-only draft site pages
        run: |
          pip install --quiet jsonschema pypdf
          python3 Shared/tools/deploy_test.py pages
      - name: Ensure only governed page mirrors are staged
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/test/index.html public/test/atlas/index.html public/test/rungs/index.html public/test/deployments/index.html docs/test/index.html docs/test/atlas/index.html docs/test/rungs/index.html docs/test/deployments/index.html
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          worker = '.github/workflows/iss131-temporary-test-pages-regeneration.yml'
          allowed = {worker}
          for root in ('public/test', 'docs/test'):
              allowed |= {f'{root}/{path}' for path in ('index.html', 'atlas/index.html', 'rungs/index.html', 'deployments/index.html')}
          unexpected = changed - allowed
          assert not unexpected, f'Unapproved generated paths: {sorted(unexpected)}'
          for path in ('index.html', 'atlas/index.html', 'rungs/index.html', 'deployments/index.html'):
              left, right = Path('public/test') / path, Path('docs/test') / path
              assert left.is_file() and right.is_file() and left.read_bytes() == right.read_bytes(), path
          assert worker in changed, 'temporary worker must be deleted'
          print('PASS: governed TEST site pages match their Pages mirrors:', sorted(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(test): regenerate Q1 parked TEST and Pages mirrors (#131)'
          git push origin "HEAD:${{ github.ref_name }}"
