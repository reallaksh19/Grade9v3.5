name: test-dashboard-browser-evidence

on:
  pull_request:
    paths:
      - ".github/workflows/test-dashboard-browser-evidence.yml"
      - "tests/test_area_browser.mjs"
      - "tests/test_dashboard_browser_evidence.mjs"
      - "Shared/tools/build_test_site.py"
      - "TEST/question-bank/intake/**"
      - "tests/test_test_intake_dashboard.py"
      - "public/test/**"
      - "public/js/site-header.js"
      - "public/index.html"
      - "public/physics/index.html"
      - "public/chemistry/index.html"
      - "public/mathematics/index.html"
  push:
    paths:
      - ".github/workflows/test-dashboard-browser-evidence.yml"
      - "tests/test_area_browser.mjs"
      - "tests/test_dashboard_browser_evidence.mjs"
      - "Shared/tools/build_test_site.py"
      - "TEST/question-bank/intake/**"
      - "tests/test_test_intake_dashboard.py"
      - "public/test/**"
      - "public/js/site-header.js"
      - "public/index.html"
      - "public/physics/index.html"
      - "public/chemistry/index.html"
      - "public/mathematics/index.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-dashboard-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet jsonschema

      - uses: actions/setup-node@v4
        with:
          node-version: "22"


      - name: Committed TEST hub matches its producer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from Shared.tools import build_pages_site, build_test_site
          repo = Path.cwd()
          payload = build_test_site.hub_page().encode("utf-8")
          public = (repo / "public/test/index.html").read_bytes()
          docs = (repo / "docs/test/index.html").read_bytes()
          if public != payload:
              raise SystemExit("public/test/index.html is stale against build_test_site.hub_page()")
          expected_docs = build_pages_site._public_payload("test/index.html", payload)
          if docs != expected_docs:
              raise SystemExit("docs/test/index.html is stale against governed Pages transform")
          print("TEST hub public/docs projection is current")
          PY

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Existing TEST area browser contract (informational)
        id: test-area-browser
        continue-on-error: true
        run: node tests/test_area_browser.mjs

      - name: Dashboard screenshots, overflow and keyboard order
        if: always()
        run: node tests/test_dashboard_browser_evidence.mjs /tmp/test-dashboard-browser-evidence

      - name: Upload TEST dashboard browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-dashboard-browser-evidence
          path: /tmp/test-dashboard-browser-evidence
          if-no-files-found: error
