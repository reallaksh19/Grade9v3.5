name: qb-admission-generate-number-systems-q01-q10

on:
  push:
    branches:
      - feat/admit-ncert-number-systems-q01-q10
    paths:
      - ".github/workflows/qb-admission-generate-number-systems-q01-q10.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Question Bank artifacts
        run: |
          python3 Shared/tools/build_question_bank_web.py
          python3 Shared/tools/build_question_bank_platform.py --write
          cp public/data/question-bank-data.js docs/data/question-bank-data.js
      - name: Commit generated admission artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/question-bank-data.js \
            public/data/question-bank-catalog.js \
            public/data/question-bank-search.js \
            public/data/question-bank-questions.js \
            public/data/question-bank-resources.js \
            public/data/question-bank-manifest.js \
            public/data/question-bank-details \
            artifacts/question-bank/dedup-report.json \
            artifacts/question-bank/lineage.json \
            artifacts/question-bank/build-receipt.json \
            docs/data/question-bank-data.js \
            docs/data/question-bank-catalog.js \
            docs/data/question-bank-search.js \
            docs/data/question-bank-questions.js \
            docs/data/question-bank-resources.js \
            docs/data/question-bank-manifest.js \
            docs/data/question-bank-details
          if git diff --cached --quiet; then
            echo "Generated artifacts already current"
          else
            git commit -m "chore(qb): regenerate after Number Systems Q1-Q10 admission"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

# current-head retry
