name: Core1A actual-render maturity (TEST only)

on:
  pull_request:
    paths:
      - '.github/workflows/core1a-render-maturity.yml'
      - 'TEST/products/core1a-divisibility-render-maturity.manifest.json'
      - 'TEST/library/core1a-render-qualified-divisibility.v1.json'
      - 'TEST/library/figures/core1a-consecutive-divisibility-staged.svg'
      - 'TEST/library/figures/core2a-three-consecutive-attempt-safe.svg'
      - 'TEST/products/core-authored-qrt-repair-journey.manifest.json'
      - 'tests/test_core_authored_qrt_repair_journey.py'
      - 'tools/site-audit/core-authored-qrt-repair-journey-audit.mjs'
      - 'docs/method/CORE-LEARNER-JOURNEY-ACADEMIC-REVIEW.md'
      - 'tests/test_imo_core1a_renderer_maturity.py'
      - 'tools/site-audit/core1a-render-maturity-audit.mjs'
      - 'docs/method/CORE1A-RENDERER-AGENT-HANDOFF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-core1a-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing renderer and browser QA dependencies
        run: |
          python -m pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Preserve QRT 7 by 4 semantics and current 28-cell generated projection
        run: |
          python Shared/tools/question_review_matrix.py check
          python Shared/tools/question_review_matrix.py write --check
          python -m unittest tests.test_question_review_matrix -v
      - name: Exercise exact manifest through real renderer and falsify bad selection
        run: python -m unittest tests.test_imo_core1a_renderer_maturity -v
      - name: Verify authored QRT JUSTIFY-D2 question and same-concept repair joins
        run: python -m unittest tests.test_core_authored_qrt_repair_journey -v
      - name: Actual registered-blueprint render, TEST stamping and print receipt
        run: |
          python Shared/tools/deploy_test.py product \
            TEST/products/core1a-divisibility-render-maturity.manifest.json --no-mirror
      - name: Browser viewport, 200 percent text and screenshots of actual generated product
        run: |
          node tools/site-audit/core1a-render-maturity-audit.mjs \
            public/test/products/core1a-divisibility-render-maturity
      - name: Verify actual PDF, hash-bound receipt and non-acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          from Shared.tools import render_core
          p=Path('public/test/products/core1a-divisibility-render-maturity')
          j=json.loads((p/'deploy-receipt.json').read_text())
          assert j['subject']=='TEST' and j['accepted'] is False and j['draft'] is True
          assert j['roles']==['CORE1A'] and j['selection_counts']['microtopics']==1
          assert j['pdf']['status']=='PRINTED', j['pdf']
          assert not render_core.pdf_publication_problems(p), render_core.pdf_publication_problems(p)
          pdf=p/'core1a.pdf'
          assert pdf.stat().st_size>1000
          reader=PdfReader(pdf)
          extracted=' '.join(page.extract_text() or '' for page in reader.pages)
          assert 'TEST' in extracted and ('divisible' in extracted.lower() or 'consecutive' in extracted.lower())
          proof={'pages':len(reader.pages),'pdf_bytes':pdf.stat().st_size,
            'render_digest':j['render_digest'],'source_input_sha256':j['inputs_sha256'],
            'gap_count':j['gap_count'],'gaps':j['gaps'],'advisories':j['advisories'],
            'waivers':j['waived'],'pdf_status':j['pdf']['status'],
            'accepted':False,'publisher_rights_granted':False,
            'human_a11y':'NOT_RUN','academic_owner_signoff':'NOT_GRANTED'}
          (p/'maturity-evidence.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({k:v for k,v in proof.items() if k!='gaps'},indent=2))
          # Maturity requires no unidentified REQUIRED reference-depth gaps.
          assert j['gap_count']==0, 'Canonical content gaps remain: see uploaded evidence; do not issue agent restart.'
          PY
      - name: Actual authored Core2A -> Core1A TEST journey render and print
        run: |
          python Shared/tools/deploy_test.py product \\
            TEST/products/core-authored-qrt-repair-journey.manifest.json --no-mirror
      - name: Browser-observed attempt, keyboard reveal, QRT-safe repair routing, zoom
        run: |
          node tools/site-audit/core-authored-qrt-repair-journey-audit.mjs \\
            public/test/products/core-authored-qrt-repair-journey
      - name: Verify BOTH role PDFs, honest TEST receipt and no source Core2
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from pypdf import PdfReader
          p=Path('public/test/products/core-authored-qrt-repair-journey')
          r=json.loads((p/'deploy-receipt.json').read_text())
          assert r['accepted'] is False and r['draft'] is True and r['subject']=='TEST'
          assert r['roles']==['CORE1A','CORE2A'] and r['gap_count']==0, r
          assert r['selection_counts']['core2']==0 and r['selection_counts']['core2a']==1
          assert r['pdf']['status']=='PRINTED', r['pdf']
          for name in ('core1a','core2a'):
              f=p/(name+'.pdf')
              assert f.is_file() and f.stat().st_size>1000,name
              reader=PdfReader(f)
              extracted=' '.join(page.extract_text() or '' for page in reader.pages)
              assert 'TEST' in extracted, name
              assert ('consecutive' in extracted.lower() or 'factor' in extracted.lower()),name
          q=json.loads((p/'journey-evidence'/'journey-browser-report.json').read_text())
          assert not q['failures'],q['failures']
          assert q['learning']['repair_destination']['found']
          summary={'schema':'core-author-to-qrt-to-repair-evidence/v1',
            'head_bound_input_digests':r['inputs_sha256'],
            'render_digest':r['render_digest'],
            'roles':r['roles'],'question_origin':'AUTHORED',
            'qrt_cell':'QRT-JUSTIFY-D2','qrt_28_cell_projection_unchanged':True,
            'source_core2_admitted':False,'gap_count':r['gap_count'],
            'pdfs':['core1a.pdf','core2a.pdf'],
            'browser_failures':q['failures'],'human_screen_reader':'NOT_RUN',
            'learner_trial':'NOT_RUN','academic_review':'NOT_GRANTED',
            'canonical_published':False,'owner_acceptance':False}
          (p/'journey-evidence'/'journey-qualification.json').write_text(json.dumps(summary,indent=2)+'\\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve rendered HTML, real PDF and failure evidence for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core1a-canonical-render-maturity-evidence
          path: |
            public/test/products/core1a-divisibility-render-maturity/
            public/test/products/core-authored-qrt-repair-journey/
          if-no-files-found: warn
