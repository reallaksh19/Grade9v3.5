name: imo-g9-q26-authored-core1a-render-evidence

on:
  pull_request:
    paths:
      - ".github/workflows/imo-q26-authored-core1a-render.yml"
      - "TEST/imo-research/candidates/imo-g9-q26-common-base-core1a.v1.json"
      - "TEST/imo-research/candidates/assets/REP-TEST-IMO-G9-COMMON-BASE-RELATION.svg"
      - "TEST/imo-research/candidates/imo-g9-q26-common-base-core1a.test.manifest.json"
      - "tests/test_imo_q26_common_base_core1a.py"
      - "tools/site-audit/imo-q26-core1a-render-review.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authored-canonical-core1a:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install schema, PDF and existing repository browser harness
        run: |
          python -m pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate authored package and mathematical assertions
        run: |
          python -m unittest discover -s tests -p 'test_imo_q26_common_base_core1a.py' -v
      - name: Build with the canonical render_core.py engine into isolated temporary TEST artifacts
        run: |
          python Shared/tools/render_core.py build \
            --manifest TEST/imo-research/candidates/imo-g9-q26-common-base-core1a.test.manifest.json \
            --out /tmp/imo-q26-core-render --mode PAGES --draft
          test -f /tmp/imo-q26-core-render/core1a.html
          test -f /tmp/imo-q26-core-render/render-receipt.json
      - name: Render learner-review PDF using canonical print-product.mjs path
        run: |
          node tools/print/print-product.mjs /tmp/imo-q26-core-render
          test -f /tmp/imo-q26-core-render/core1a.pdf
          test -f /tmp/imo-q26-core-render/print-receipt.json
      - name: Actual Chromium responsive/keyboard review
        run: |
          node tools/site-audit/imo-q26-core1a-render-review.mjs
      - name: Verify generated HTML and exact printed PDF receipt independently
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from pypdf import PdfReader

          folder=Path('/tmp/imo-q26-core-render')
          manifest=json.loads((folder/'render-receipt.json').read_text())
          assert manifest['renderer']=='render_core/2'
          assert manifest['output_roles']==['CORE1A']
          assert manifest['pages']==['core1a.html','index.html']
          assert manifest['mode']=='PAGES'
          assert manifest['manifest']=='TEST/imo-research/candidates/imo-g9-q26-common-base-core1a.test.manifest.json'
          page=folder/'core1a.html'
          html=page.read_text()
          assert '3^(2x+1)=9^x+162' in html
          assert '2^(2y+1)=4^y+64' in html
          assert 'SOF-IMO-G09' not in html
          assert 'authored' in html.lower()
          assert 'data-g9-role="CORE1A"' in html
          assert (folder/'q26-browser-review.json').is_file()
          browser=json.loads((folder/'q26-browser-review.json').read_text())
          assert browser['browser_exercised'] and browser['failures']==[]
          assert len(browser['widths'])==4 and browser['zoom200']['extra']<=0
          printed=json.loads((folder/'print-receipt.json').read_text())
          assert printed['mode']=='LEARNER_PDF'
          assert len(printed['pages'])==1 and printed['pages'][0]['page']=='core1a.html'
          pdf=folder/'core1a.pdf'
          row=printed['pages'][0]
          digest=lambda p:'sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          assert row['page_digest']==digest(page)
          assert row['pdf_digest']==digest(pdf)
          assert pdf.stat().st_size>3000
          reader=PdfReader(pdf)
          txt=' '.join(p.extract_text() or '' for p in reader.pages)
          assert len(reader.pages)>=1 and len(txt)>200, 'printed product lost authored lesson'
          assert 'SOF-IMO-G09' not in txt
          assert 'TEST' in txt or 'Core' in txt, 'PDF lost authored TEST identity'
          print(json.dumps({'result':'AUTHORED_Q26_CANONICAL_TEST_RENDER_HTML_PDF_VERIFIED',
            'renderer':manifest['renderer'],'output_roles':manifest['output_roles'],
            'render_gaps':len(manifest['gaps']),'pdf_pages':len(reader.pages),
            'pdf_bytes':pdf.stat().st_size,'pdf_sha256':digest(pdf),
            'viewport_widths':[r['width'] for r in browser['widths']],
            'zoom_overflow_px':browser['zoom200']['extra'],
            'original_sof_stems_reproduced':0,'source_core2_admitted':0,
            'canonical_learner_product_accepted':False},sort_keys=True))
          PY
      - name: Upload exact rendered authored TEST HTML/PDF, actual Chromium screenshots and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imo-q26-authored-core1a-canonical-review
          path: /tmp/imo-q26-core-render/
          if-no-files-found: warn
