name: phase1-manifest-refresh

on:
  push:
    branches:
      - audit/core1-orientation-phase1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[phase1-manifest-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core1-orientation-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Regenerate governed artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit exact generator output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "[phase1-manifest-refresh] Regenerate architecture manifest"
          git push origin HEAD:audit/core1-orientation-phase1
