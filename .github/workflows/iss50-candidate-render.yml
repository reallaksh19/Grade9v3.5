name: iss50-candidate-render

on:
  push:
    branches:
      - "candidate/iss50-d2-polynomials-r1"

permissions:
  contents: read

jobs:
  render-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation and browser dependencies
        run: |
          python3 -m pip install --quiet jsonschema
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify frozen intake and owner bank
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected="984f011770d466640d809b8caaa80e4dc0ae4c4b9c510ccdc8ab75b2793ea2cf"
          p=Path("evidence/benchmark/ISS50/owner-core-prompt.md")
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          print("owner_core_sha256",actual)
          if actual != expected:
              raise SystemExit(f"owner core hash mismatch: {actual} != {expected}")
          bank=json.loads(Path("evidence/benchmark/ISS50/bank.json").read_text())
          core=p.read_text()
          if len(bank["questions"]) != 10:
              raise SystemExit("bank denominator is not 10")
          for q in bank["questions"]:
              held=q["extensions"]["grade9v3:source_custody"]["text_sha256"].removeprefix("sha256:")
              actual=hashlib.sha256(q["stem"].encode()).hexdigest()
              if actual != held or q["stem"] not in core:
                  raise SystemExit(f"custody mismatch: {q['id']}")
          print("custody 10/10 PASS")
          PY
          python3 Shared/tools/owner_bank.py check evidence/benchmark/ISS50/bank.json
      - name: Validate package schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema=json.loads(Path("Shared/library/package.schema.json").read_text())
          pkg=json.loads(Path("evidence/benchmark/ISS50/package.json").read_text())
          errors=sorted(Draft202012Validator(schema).iter_errors(pkg), key=lambda e:list(e.path))
          if errors:
              for e in errors:
                  print("SCHEMA",list(e.path),e.message)
              raise SystemExit(f"{len(errors)} package schema error(s)")
          bank=json.loads(Path("evidence/benchmark/ISS50/bank.json").read_text())
          for q in bank["questions"]:
              d=q["extensions"]["grade9v3:analysis"]["difficulty"]
              if sum(d["components"].values()) != d["score"]:
                  raise SystemExit(f"difficulty sum mismatch: {q['id']}")
          print("package schema PASS; difficulty sums PASS")
          PY
      - name: Reference-depth gaps and governed render
        run: |
          rm -rf /tmp/iss50-site /tmp/iss50-out
          mkdir -p /tmp/iss50-site/products/mathematics/iss50-polynomials /tmp/iss50-site/products/css /tmp/iss50-site/products/js /tmp/iss50-out
          set +e
          python3 Shared/tools/render_core.py gaps --manifest evidence/benchmark/ISS50/manifest.json --reference | tee /tmp/iss50-gaps.txt
          gaps_rc=${PIPESTATUS[0]}
          set -e
          echo "gaps_exit_code=${gaps_rc}"
          python3 Shared/tools/render_core.py build --manifest evidence/benchmark/ISS50/manifest.json --out /tmp/iss50-out --mode PAGES --reference
          cp /tmp/iss50-out/* /tmp/iss50-site/products/mathematics/iss50-polynomials/
          cp public/css/tablet-12-7.css /tmp/iss50-site/products/css/
          cp public/css/modern-learner.css /tmp/iss50-site/products/css/
          cp public/js/display-controls.js /tmp/iss50-site/products/js/
          cp public/js/site-header.js /tmp/iss50-site/products/js/
      - name: Verify denominator order and protected initial page
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path("evidence/benchmark/ISS50/manifest.json").read_text())
          text=Path("/tmp/iss50-out/core2.html").read_text()
          actual=re.findall(r'<article\\b[^>]*data-g9-unit="([^"]+)"[^>]*data-g9-kind="QUESTION"',text)
          expected=manifest["selection"]["core2"]
          print("Core2 denominator/order",len(actual),"/",len(expected))
          if actual != expected: raise SystemExit(f"order mismatch {actual}")
          if 'data-g9-draft=' in text: raise SystemExit("strict render unexpectedly marked draft")
          PY
          python3 -m http.server 8765 --directory /tmp/iss50-site >/tmp/iss50-http.log 2>&1 &
          echo $! >/tmp/iss50-http.pid
          python3 - <<'PY'
          import socket,time
          for _ in range(60):
              try:
                  socket.create_connection(("127.0.0.1",8765),timeout=.2).close()
                  break
              except OSError:
                  time.sleep(.1)
          else:
              raise SystemExit("http server failed")
          PY
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:1366,height:854}});
            await p.goto('http://127.0.0.1:8765/products/mathematics/iss50-polynomials/core2.html');
            const visible=await p.locator('body').innerText();
            const hiddenTemplates=await p.locator('template').count();
            console.log({hiddenTemplates,visibleChars:visible.length});
            const forbidden=[
              'The remainder is 1, because division by x-2',
              'The domain of r is all real x except 1',
              'If a=1, it is the zero polynomial'
            ];
            for(const phrase of forbidden){
              if(visible.includes(phrase)) throw new Error('protected answer visible before commitment: '+phrase);
            }
            const count=await p.locator('article[data-g9-kind="QUESTION"]').count();
            if(count!==10) throw new Error('expected 10 questions, got '+count);
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Tablet browser audit
        run: |
          node tools/site-audit/core-page-audit.mjs /tmp/iss50-site/products/mathematics/iss50-polynomials --profile tablet-12.7 --http-root /tmp/iss50-site --json /tmp/iss50-browser-audit.json
      - name: Runtime receipt and exact render digests
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,platform
          from pathlib import Path
          root=Path("/tmp/iss50-out")
          files={}
          if root.exists():
              for p in sorted(root.iterdir()):
                  if p.is_file():
                      files[p.name]={"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size}
          out={"python":platform.python_version(),"files":files}
          Path("/tmp/iss50-runtime-receipt.json").write_text(json.dumps(out,indent=2)+"\n")
          PY
      - name: Upload exact render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iss50-candidate-render
          path: |
            /tmp/iss50-out
            /tmp/iss50-browser-audit.json
            /tmp/iss50-runtime-receipt.json
            /tmp/iss50-gaps.txt
            /tmp/iss50-http.log
          if-no-files-found: warn
          retention-days: 7
