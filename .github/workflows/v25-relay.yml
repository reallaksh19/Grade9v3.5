name: v25-relay

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grade9V3 execution branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Make current main available as a local ref
        run: git fetch origin main:refs/heads/main

      - name: Checkout pinned Common V2.5 protocol
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 85e59a93d469035e7924dfbbb1f5918adc203647
          path: _common
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay validator dependencies
        run: pip install --quiet pyyaml jsonschema

      # SKILL.md defines Common's unit/stress/self-consistency suites as Common
      # development/release checks. A downstream repository executes the repository
      # validation entrypoints below against the pinned Common implementation.
      - name: Relay semantic conformance
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_relay_conformance.py .

      - name: Cold-start reconstructability
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/cold_start_check.py .

      - name: Zero-context reconstruction
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_zero_context_reconstruction.py .

      - name: Baton readiness
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_baton_readiness.py .

      - name: Discovery receipt validity
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_discovery_receipt.py .

      - name: Question-set validity
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_question_set.py .

      - name: Qualification receipt validity
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_qualification_receipt.py .

      - name: Takeover certification validity
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/validate_takeover_certification.py .

      - name: Resolve execution route
        run: python3 _common/skills/engineering-pr-delivery-v2.5/scripts/resolve_execution_route.py .

      - name: Inspect live Git context
        shell: bash
        run: |
          set +e
          python3 _common/skills/engineering-pr-delivery-v2.5/scripts/inspect_git_context.py .
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi

      - name: Material write gate
        shell: bash
        run: |
          read -r relay_state write_authority <<EOF
          $(python3 - <<'PY'
          import yaml
          with open("agents/relay/REPO_STATE.yaml", "r", encoding="utf-8") as handle:
              state = yaml.safe_load(handle) or {}
          execution = ((state.get("status_planes") or {}).get("execution") or {})
          print(state.get("relay_state", ""), execution.get("material_authority", ""))
          PY
          )
          EOF
          if { [ "$relay_state" = "ACTIVE" ] || [ "$relay_state" = "PARALLEL" ]; } && [ "$write_authority" = "WRITE" ]; then
            python3 _common/skills/engineering-pr-delivery-v2.5/scripts/material_write_ready.py . --candidate-id chatgpt-sol-core173-20260922-r1
          else
            echo "Material write check: not applicable for relay_state=$relay_state"
          fi
