name: ISS191 one-shot TEST mirror reconstruction
# Temporary, scoped workflow; on successful verification it removes its own file.
on:
  push:
    branches:
      - integration/iss191-main-custody-source-resolved-20261008
    paths:
      - .github/workflows/iss191-one-shot-test-mirror-rebuild.yml

permissions:
  contents: write

concurrency:
  group: iss191-one-shot-test-mirror-rebuild
  cancel-in-progress: false

jobs:
  exact-source-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded TEST generator dependencies
        run: python3 -m pip install --quiet jsonschema pypdf
      - name: Run actual TEST generator and Pages mirror
        shell: bash
        run: |
          set -euo pipefail
          python3 Shared/tools/build_test_site.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_test_site.py --check
          python3 Shared/tools/build_pages_site.py --check
      - name: Check combined TEST visual and custody output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path("public/test/index.html").read_bytes()
          b = Path("docs/test/index.html").read_bytes()
          assert a == b, "TEST public and docs home mirrors disagree"
          text = a.decode("utf-8")
          assert ".g9-header-inner{width:100%;min-width:0;box-sizing:border-box;padding:0;gap:12px}" in text, "recovered responsive header is missing"
          assert "EVIDENCE PENDING" in text and "SOURCE EVIDENCED" in text, "current official-source custody lanes are absent"
          assert "Recorded answer" in text, "evidence-pending answer text is not correctly qualified"
          assert "not accepted" in text, "TEST-only draft boundary vanished"
          print("combined TEST home: source-custody, mobile shell, and draft disclaimer PASS")
          PY
      - name: Run direct TEST source and owner regression tests
        run: |
          python3 -m unittest             tests.test_test_area             tests.test_test_intake_identity             tests.test_test_source_custody             tests.test_test_source_review             tests.test_test_question_bank -v
      - name: Refuse collateral generated or source modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          allowed = ("public/test/", "docs/test/")
          extra = ("docs/.pages-manifest.json",)
          changed = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True).splitlines()
          paths = [row[3:] for row in changed if row.strip()]
          unexpected = [path for path in paths if not path.startswith(allowed)
                        and path not in extra]
          print("generated file changes:", paths)
          if unexpected:
              raise SystemExit("Refused unreviewed generator drift: " + ", ".join(unexpected))
          if "public/test/index.html" not in paths or "docs/test/index.html" not in paths:
              raise SystemExit("Expected both stale TEST home mirrors to regenerate")
          PY
      - name: Commit only generated projections and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/test docs/test docs/.pages-manifest.json
          git rm -- .github/workflows/iss191-one-shot-test-mirror-rebuild.yml
          git diff --cached --check
          git commit -m "build(test): regenerate independently verified U5 custody and responsive home mirrors"
          git push origin HEAD:refs/heads/integration/iss191-main-custody-source-resolved-20261008
