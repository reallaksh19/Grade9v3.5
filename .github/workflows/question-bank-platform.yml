name: question-bank-platform

permissions:
  contents: write

on:
  push:
    branches: ["**"]
    paths:
      - "Shared/tools/build_question_bank_web.py"
      - "Shared/tools/build_question_bank_platform.py"
      - "Shared/tools/question_bank_platform.py"
      - "Shared/tools/question_bank_scale.py"
      - "*/library/**"
      - "*/question-bank/**"
      - "docs/gcdr-suites/**"
      - "public/question-bank/**"
      - "public/js/question-bank.js"
      - "public/js/question-bank-data-service.js"
      - "public/data/question-bank-*.js"
      - "public/data/question-bank-details/**"
      - "tests/test_question_bank_web.py"
      - "tests/test_question_bank_platform.py"
      - "tests/test_question_bank_platform_runtime.py"
      - "tests/question_bank_data_service.test.mjs"
      - ".github/workflows/question-bank-platform.yml"
  pull_request:
    paths:
      - "Shared/tools/build_question_bank_web.py"
      - "Shared/tools/build_question_bank_platform.py"
      - "Shared/tools/question_bank_platform.py"
      - "Shared/tools/question_bank_scale.py"
      - "*/library/**"
      - "*/question-bank/**"
      - "docs/gcdr-suites/**"
      - "public/question-bank/**"
      - "public/js/question-bank.js"
      - "public/js/question-bank-data-service.js"
      - "public/data/question-bank-*.js"
      - "public/data/question-bank-details/**"
      - "tests/test_question_bank_web.py"
      - "tests/test_question_bank_platform.py"
      - "tests/test_question_bank_platform_runtime.py"
      - "tests/question_bank_data_service.test.mjs"
      - ".github/workflows/question-bank-platform.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Question Bank contract and growth falsifiers
        run: python3 -m unittest tests.test_question_bank_web tests.test_question_bank_platform tests.test_question_bank_platform_runtime
      - name: Progressive browser data service
        run: node tests/question_bank_data_service.test.mjs
      - name: Legacy browser projection remains current
        run: python3 Shared/tools/build_question_bank_web.py --check
      - name: Generate shared Question Bank platform artifacts
        run: python3 Shared/tools/build_question_bank_platform.py --write
      - name: Generated platform artifacts are deterministic
        run: python3 Shared/tools/build_question_bank_platform.py --check
      - name: Generate Pages mirror from public source tree
        run: python3 Shared/tools/build_pages_site.py
      - name: Pages mirror is deterministic and internally linked
        run: python3 Shared/tools/build_pages_site.py --check
      - name: Lineage explain witness
        run: python3 Shared/tools/build_question_bank_platform.py --explain PYQ-CHEM-IITJEE-2008-P1-Q66
      - name: Measure 5000-question scale fixture
        run: python3 Shared/tools/question_bank_scale.py --questions 5000 --out artifacts/question-bank/scale-observation.json
      - name: Show scale observation
        run: cat artifacts/question-bank/scale-observation.json
      - name: Commit generated platform and Pages outputs once on the implementation branch
        if: github.event_name == 'push' && github.ref_name == 'issue-359/qb-growth-foundation'
        run: |
          git add \
            public/data/question-bank-catalog.js \
            public/data/question-bank-search.js \
            public/data/question-bank-resources.js \
            public/data/question-bank-manifest.js \
            public/data/question-bank-details/*.js \
            artifacts/question-bank/dedup-report.json \
            artifacts/question-bank/lineage.json \
            artifacts/question-bank/build-receipt.json \
            docs/data/question-bank-catalog.js \
            docs/data/question-bank-search.js \
            docs/data/question-bank-resources.js \
            docs/data/question-bank-manifest.js \
            docs/data/question-bank-details/*.js \
            docs/js/question-bank-data-service.js \
            docs/.pages-manifest.json
          if git diff --cached --quiet; then
            echo "generated outputs already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(qb): commit generated platform projections"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated platform evidence
        uses: actions/upload-artifact@v4
        with:
          name: question-bank-platform-${{ github.sha }}
          if-no-files-found: error
          path: |
            public/data/question-bank-catalog.js
            public/data/question-bank-search.js
            public/data/question-bank-resources.js
            public/data/question-bank-manifest.js
            public/data/question-bank-details/*.js
            artifacts/question-bank/dedup-report.json
            artifacts/question-bank/lineage.json
            artifacts/question-bank/build-receipt.json
            artifacts/question-bank/scale-observation.json
