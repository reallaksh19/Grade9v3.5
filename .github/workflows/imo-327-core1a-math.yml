name: IMO Index Laws Core1A math and source holds

on:
  pull_request:
    paths:
      - "TEST/imo-research/candidates/imo-g9-q26-common-base-core1a.v1.json"
      - "TEST/imo-research/candidates/README-imo-327-core1a-math-gate.md"
      - "tests/test_imo_327_core1a_math_proof.py"
      - "tests/test_imo_327_help_mode_separation.py"
      - "tests/test_imo_327_qrt_help_golden.py"
      - "tests/test_imo_327_help_runtime_contract.py"
      - "Shared/tools/render_core.py"
      - "tools/site-audit/imo-r1-authored-qrt-core2a-audit.mjs"
      - "TEST/imo-research/golden/**"
      - "TEST/imo-research/candidates/README-imo-327-concept-first-vs-hints.md"
      - "tools/print/print-product.mjs"
      - ".github/workflows/imo-327-core1a-math.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-and-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate shared print utility syntax
        run: node --check tools/print/print-product.mjs
      - name: Independently verify exponential laws, inverse and repair guards
        run: python -m unittest discover -s tests -p 'test_imo_327_core1a_math_proof.py' -v
      - name: Verify concept-first teaching is not indistinguishable from Core2A hints
        run: python -m unittest discover -s tests -p 'test_imo_327_help_mode_separation.py' -v
      - name: Validate three actual 7-by-4 QRT golden fixtures, maths and disclosure boundaries
        run: python -m unittest discover -s tests -p 'test_imo_327_qrt_help_golden.py' -v
      - name: Assert real emitted TEST HTML has opt-in hints and concept-first format gate
        run: python -m unittest discover -s tests -p 'test_imo_327_help_runtime_contract.py' -v
