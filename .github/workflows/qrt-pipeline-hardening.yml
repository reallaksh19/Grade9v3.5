name: qrt-pipeline-hardening

on:
  pull_request:
    paths:
      - "Shared/quality/qrt-pipeline-run.schema.json"
      - "Shared/library/package.schema.json"
      - "Shared/vocabularies/learner-question-metadata.v1.json"
      - "Shared/vocabularies/cognitive-demand.v1.json"
      - "tests/test_difficulty_contract.py"
      - "tests/test_demand_move_binding.py"
      - "Shared/tools/authoring_intake.py"
      - "Shared/tools/qrt_pipeline_guard.py"
      - "Shared/tools/qrt_coverage_report.py"
      - "Shared/tools/qrt_change_discovery.py"
      - "docs/qrt-coverage-index.v1.json"
      - "Physics/**/*.json"
      - "Chemistry/**/*.json"
      - "Mathematics/**/*.json"
      - "TEST/**/*.json"
      - "TEST/**/*.jsonl"
      - "Physics/**/publication/**"
      - "Chemistry/**/publication/**"
      - "Mathematics/**/publication/**"
      - "TEST/**/publication/**"
      - "TEST/products/*.manifest.json"
      - "Shared/tools/render_core.py"
      - "Shared/tools/core2_v2.py"
      - "Shared/tools/question_review_matrix.py"
      - "Shared/tools/question_difficulty.py"
      - "Shared/quality/question-demand-matrix.v1.json"
      - "Shared/quality/question-demand-templates.v1.json"
      - "Shared/web/interactive-page-blueprints.v1.json"
      - "Shared/web/explorer-runtime.js"
      - "Shared/web/explorer-model.js"
      - "Shared/web/explorer-profiles.v1.json"
      - "Shared/web/explorer-spec.schema.json"
      - "Physics/**/*.svg"
      - "Chemistry/**/*.svg"
      - "Mathematics/**/*.svg"
      - "TEST/**/*.svg"
      - "Physics/**/*.css"
      - "Chemistry/**/*.css"
      - "Mathematics/**/*.css"
      - "TEST/**/*.css"
      - "Physics/**/*.js"
      - "Chemistry/**/*.js"
      - "Mathematics/**/*.js"
      - "TEST/**/*.js"
      - "Physics/**/*.html"
      - "Chemistry/**/*.html"
      - "Mathematics/**/*.html"
      - "TEST/**/*.html"
      - "Physics/**/*.jsonl"
      - "Chemistry/**/*.jsonl"
      - "Mathematics/**/*.jsonl"
      - "Shared/tools/qrt_pipeline_precheck.py"
      - "Shared/tools/qrt_content_self_audit.py"
      - "Shared/tools/qrt_pipeline_gate.py"
      - "tools/site-audit/interactive-page-audit.mjs"
      - "tests/fixtures/qrt/interactive-smoke.html"
      - "tests/test_authoring_intake.py"
      - "tests/test_qrt_pipeline_guard.py"
      - "tests/test_qrt_coverage_report.py"
      - "tests/test_qrt_change_discovery.py"
      - "tests/test_qrt_content_self_audit.py"
      - "docs/method/QRT-MINIMAL-PROMPT-PIPELINE.md"
      - ".github/workflows/qrt-pipeline-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: pip install --quiet jsonschema

      - name: Intake policy
        run: python Shared/tools/authoring_intake.py check

      - name: Focused QRT hardening regressions
        run: |
          python -m unittest \
            tests.test_authoring_intake \
            tests.test_qrt_pipeline_guard \
            tests.test_qrt_coverage_report \
            tests.test_qrt_change_discovery \
            tests.test_qrt_content_self_audit \
            tests.test_difficulty_contract \
            tests.test_demand_move_binding

      - name: Read-only QRT question coverage and scoped freshness gate
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          items = json.loads(Path("docs/qrt-coverage-index.v1.json").read_text(encoding="utf-8")).get("items", [])
          command = ["python", "Shared/tools/qrt_coverage_report.py",
                     "--index", "docs/qrt-coverage-index.v1.json",
                     "--out", "/tmp/qrt-coverage-report.json"]
          if items:
              command.append("--enforce-scoped")
          subprocess.run(command, check=True)
          report = json.loads(Path("/tmp/qrt-coverage-report.json").read_text(encoding="utf-8"))
          assert report["repository_wide_qrt_acceptance"] == "NOT_EVALUATED"
          assert report["academic_acceptance"] == "NOT_EVALUATED"
          if not items:
              assert report["empty_scope"] and not report["passed_scoped_evidence"]
              print("NO CANDIDATES INDEXED — coverage preview only, not academic acceptance")
          PY
      - name: Upload nonrelease QRT evidence coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qrt-candidate-coverage
          path: /tmp/qrt-coverage-report.json
          if-no-files-found: warn

      - name: Discover changed question IDs and linked resource review gaps
        if: github.event_name == 'pull_request'
        env:
          QRT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python Shared/tools/qrt_change_discovery.py \
            --base "$QRT_BASE_SHA" \
            --index docs/qrt-coverage-index.v1.json \
            --out /tmp/qrt-change-discovery.json \
            --enforce
      - name: Upload QRT changed-scope receipt (no academic verdict)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qrt-changed-scope
          path: /tmp/qrt-change-discovery.json
          if-no-files-found: ignore

      - name: Chromium audit script syntax
        run: node --check tools/site-audit/interactive-page-audit.mjs

      - name: Install pinned Chromium harness
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run mandatory interactive Chromium smoke audit
        run: |
          node tools/site-audit/interactive-page-audit.mjs \
            tests/fixtures/qrt/interactive-smoke.html \
            --profile tablet-12.7 \
            --head "$GITHUB_SHA" \
            --json /tmp/qrt-interactive-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/qrt-interactive-audit.json').read_text(encoding='utf-8'))
          assert report['schema'] == 'interactive-page-audit/v1'
          assert report['engine'] == 'playwright.chromium'
          assert report['profile'] == 'tablet-12.7'
          assert report['status'] == 'PASS', json.dumps(report, indent=2)
          assert len(report['viewports']) == 4
          PY
