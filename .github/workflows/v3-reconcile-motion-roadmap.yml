name: v3-reconcile-motion-roadmap-complete

on:
  push:
    branches:
      - relay/v3-reconcile-motion-roadmap-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: relay/v3-reconcile-motion-roadmap-complete
          fetch-depth: 0

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install V3 dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Reconcile completed Motion roadmap row
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          root = Path(".").resolve()
          scripts = root / "_common_v3/skills/engineering-pr-delivery-v3/scripts"
          sys.path.insert(0, str(scripts))
          from snapshot_projection import build as build_snapshot

          state_path = root / "relay/STATE.yaml"
          roadmap_path = root / "relay/ROADMAP/ROADMAP.yaml"
          state = yaml.safe_load(state_path.read_text(encoding="utf-8"))
          roadmap = yaml.safe_load(roadmap_path.read_text(encoding="utf-8"))

          assert state["execution"]["lifecycle"] == "TERMINAL", state["execution"]
          assert state["accepted"]["checkpoint"] == "CP-CANONICAL-174-MOTION-002"
          target = next(row for row in roadmap["work_packages"] if row["id"] == "WP-CANONICAL-174-MOTION")
          assert target["state"] == "ACTIVE", target
          target["state"] = "COMPLETE"

          revision = "RM-V3-ISS174-MOTION-003"
          roadmap["revision"] = revision
          roadmap["owner"]["current_goal"] = (
              "Integrate delivered Issue 173 reasoning/projection contracts and Issue 174 canonical "
              "NLM/Motion data into the existing Issue 175 learner-page builder, then migrate one real explorer."
          )
          state["roadmap"]["revision"] = revision

          snapshot = build_snapshot(root, state_override=state, roadmap_override=roadmap)
          roadmap_path.write_text(yaml.safe_dump(roadmap, sort_keys=False), encoding="utf-8")
          state_path.write_text(yaml.safe_dump(state, sort_keys=False), encoding="utf-8")
          (root / "relay/GENERATED/CURRENT_SNAPSHOT.yaml").write_text(
              yaml.safe_dump(snapshot, sort_keys=False), encoding="utf-8"
          )
          PY

      - name: Validate reconciled V3 authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/protocol_cutover.py . validate

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/ROADMAP/ROADMAP.yaml relay/STATE.yaml relay/GENERATED/CURRENT_SNAPSHOT.yaml
          git commit -m "[relay-v3] Reconcile completed Motion roadmap state"
          git push origin HEAD:relay/v3-reconcile-motion-roadmap-complete
