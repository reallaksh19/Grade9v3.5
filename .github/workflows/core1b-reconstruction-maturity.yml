name: Core1B learner reconstruction maturity (TEST only)

on:
  pull_request:
    paths:
      - '.github/workflows/core1b-reconstruction-maturity.yml'
      - 'TEST/imo-research/pilots/core1a-render-qualified-divisibility.v1.json'
      - 'TEST/library/figures/core1b-three-factor-attempt-safe.svg'
      - 'TEST/products/core1b-authored-reconstruction-journey.manifest.json'
      - 'tests/test_core1b_reconstruction_maturity.py'
      - 'tools/site-audit/core1b-reconstruction-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconstruction-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing schema, print and Chromium test dependencies
        run: |
          python -m pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Require original 28-cell QRT projection and no Core-role rewrite
        run: |
          python Shared/tools/question_review_matrix.py check
          python Shared/tools/question_review_matrix.py write --check
          python -m unittest tests.test_question_review_matrix -v
      - name: Prove same-concept learner reconstruction and real canonical render
        run: python -m unittest tests.test_core1b_reconstruction_maturity -v
      - name: Build all three TEST role pages through existing renderer and printed PDF path
        run: |
          python Shared/tools/deploy_test.py product \
            TEST/products/core1b-authored-reconstruction-journey.manifest.json --no-mirror
      - name: Browser attempt-first reconstruction and boundary evaluation
        run: |
          node tools/site-audit/core1b-reconstruction-audit.mjs \
            public/test/products/core1b-authored-reconstruction-journey
      - name: Check role PDFs and nonrelease, non-source admission receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('public/test/products/core1b-authored-reconstruction-journey')
          r=json.loads((p/'deploy-receipt.json').read_text())
          assert r['subject']=='TEST' and r['draft'] is True and r['accepted'] is False
          assert r['roles']==['CORE1A','CORE1B','CORE2A'] and r['gap_count']==0, r
          assert r['selection_counts']['core2']==0 and r['selection_counts']['core2a']==1
          assert r['pdf']['status']=='PRINTED',r['pdf']
          for role in ['core1a','core1b','core2a']:
              pdf=p/(role+'.pdf')
              assert pdf.is_file() and pdf.stat().st_size>1000,role
              content=' '.join(page.extract_text() or '' for page in PdfReader(pdf).pages)
              assert 'TEST' in content,role
              if role=='core1b':
                  assert 'Predict' in content and 'Boundary test' in content, 'Core1B task print incomplete'
          qa=json.loads((p/'core1b-evidence'/'core1b-browser-report.json').read_text())
          assert not qa['failures'],qa
          assert qa['reconstruction']['precommit_blocked']
          proof={'schema':'core1b-test-maturity-receipt/v1','roles':r['roles'],
              'render_digest':r['render_digest'],'source_input_sha256':r['inputs_sha256'],
              'gap_count':r['gap_count'],'pdfs':['core1a.pdf','core1b.pdf','core2a.pdf'],
              'QRT_cells':28,'authentic_source_Core2':0,'student_mastery':'NOT_MEASURED',
              'human_screen_reader':'NOT_RUN','academic_owner_acceptance':False,
              'canonical_publication':False}
          (p/'core1b-evidence'/'qualification.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps(proof,indent=2))
          PY
      - name: Upload honest generated HTML PDFs, browsers and precise failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core1b-reconstruction-qualification-evidence
          path: public/test/products/core1b-authored-reconstruction-journey/
          if-no-files-found: warn
