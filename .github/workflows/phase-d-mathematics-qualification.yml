name: phase-d-mathematics-qualification

on:
  pull_request:
    paths:
      - "tests/iss69_d02_mathematics_fixture.py"
      - "tests/test_phase_d_mathematics_qualification.py"
      - "evidence/architectural-recovery/ISS69/d02/**"
      - "Mathematics/library/linear-equations.v1.json"
      - "Mathematics/adapter/**"
      - "Shared/tools/render_core.py"
      - "Shared/tools/core2_v2.py"
      - "Shared/tools/question_review_matrix.py"
      - "Shared/web/interactive-page-blueprints.v1.json"
      - ".github/workflows/phase-d-mathematics-qualification.yml"
  workflow_dispatch:

jobs:
  mathematics-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install qualification dependencies
        run: |
          pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Mathematics qualification contracts
        run: python3 -m unittest tests.test_phase_d_mathematics_qualification
      - name: Render exact qualification pages
        run: |
          rm -rf /tmp/iss69-d02-mathematics
          python3 -m tests.iss69_d02_mathematics_fixture --out /tmp/iss69-d02-mathematics
      - name: Audit current rendered Mathematics pages
        run: |
          node tools/site-audit/core-page-audit.mjs \
            /tmp/iss69-d02-mathematics \
            --profile tablet-12.7 \
            --http-root /tmp/iss69-d02-mathematics \
            --json /tmp/iss69-d02-mathematics-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: iss69-d02-mathematics-qualification
          path: |
            /tmp/iss69-d02-mathematics
            /tmp/iss69-d02-mathematics-audit.json
          if-no-files-found: error
          retention-days: 14
