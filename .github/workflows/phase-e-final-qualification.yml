name: phase-e-final-qualification

on:
  push:
    branches:
      - integration/iss69-e02-final-qualification

permissions:
  contents: write

env:
  E01_BASE: d5508d10f95347f004d3d57dfc3aee53e004a50e
  E02_BRANCH: integration/iss69-e02-final-qualification

jobs:
  regenerate-final-tree:
    if: ${{ !contains(github.event.head_commit.message, '[iss69-e02-generated-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/iss69-e02-final-qualification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator dependencies
        run: python -m pip install --quiet jsonschema pypdf

      - name: Verify V3.2 E02 write surface and E01 ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$E01_BASE" HEAD
          bad=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/phase-e-final-qualification.yml|              evidence/architectural-recovery/ISS69/phase-e-delp-execution-graph.v32.json|              evidence/architectural-recovery/ISS69/phase-e-e02-final-qualification.v1.json|              tests/test_phase_e_final_qualification.py|              docs/architecture-manifest.json|              tools/data.js|              public/data/data.js|              public/core-learning/*|              public/js/core-learning/*|              standalone/core-learning/*|              docs/.pages-manifest.json|              docs/data/data.js|              docs/core-learning/*|              docs/js/core-learning/*|              docs/tools/data.js)
                ;;
              *) bad+=("$path") ;;
            esac
          done < <(git diff --name-only "$E01_BASE"...HEAD)
          if [ "${#bad[@]}" -ne 0 ]; then
            echo "E02 contains undeclared path(s):"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi

      - name: Run governed final-tree generators
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py

      - name: Enforce mechanical generated write surface
        run: |
          set -euo pipefail
          bad=()
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              docs/architecture-manifest.json|              tools/data.js|              public/data/data.js|              public/core-learning/*|              public/js/core-learning/*|              standalone/core-learning/*|              docs/.pages-manifest.json|              docs/data/data.js|              docs/core-learning/*|              docs/js/core-learning/*|              docs/tools/data.js)
                ;;
              *) bad+=("$path") ;;
            esac
          done < <(git status --porcelain --untracked-files=all | sed -E 's/^.. //')
          if [ "${#bad[@]}" -ne 0 ]; then
            echo "Generator touched undeclared path(s):"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi

      - name: Verify final-tree freshness and active authority
        run: |
          set -euo pipefail
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 - <<'PY'
          from pathlib import Path
          from Shared.tools import build_core_learning_data

          public = Path("public/core-learning/data.js")
          docs = Path("docs/core-learning/data.js")
          rows = build_core_learning_data.build().get("core_projections", [])

          core1a = [r for r in rows if (r.get("projection") or {}).get("core") == "CORE1A"]
          assert core1a, "no Core1A projection emitted"
          for row in core1a:
              web = ((row.get("projection") or {}).get("delivery") or {}).get("web") or {}
              assert web.get("blueprint_ref") == "BP-CORE1A-CONSTRUCTION@1.8.0", web

          core2 = [r for r in rows if (r.get("projection") or {}).get("core") == "CORE2"]
          for row in core2:
              web = ((row.get("projection") or {}).get("delivery") or {}).get("web") or {}
              assert web.get("blueprint_ref") == "BP-CORE2-SOURCE-QUESTION@1.11.0", web

          assert public.read_bytes() == docs.read_bytes(), "public/docs Core-learning mirror mismatch"
          assert "BP-CORE1A-CONSTRUCTION@1.7.0" not in public.read_text(encoding="utf-8")
          print(f"E02 generated authority PASS: Core1A={len(core1a)}, Core2={len(core2)}")
          PY
          python3 -m unittest tests.test_tools.Manifest tests.test_tools.WebData tests.test_pages_site

      - name: Commit final-tree generated bytes
        id: generated
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/architecture-manifest.json             tools/data.js             public/data/data.js             public/core-learning             public/js/core-learning             standalone/core-learning             docs/.pages-manifest.json             docs/data/data.js             docs/core-learning             docs/js/core-learning             docs/tools/data.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "[iss69-e02-generated-refresh] Regenerate final-tree governed artifacts"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:"$E02_BRANCH"

  qualify-exact-branch-head:
    needs: regenerate-final-tree
    if: ${{ always() && (needs.regenerate-final-tree.result == 'success' || needs.regenerate-final-tree.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/iss69-e02-final-qualification
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install qualification dependencies
        run: |
          pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Verify generated exact-head freshness
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$E01_BASE" HEAD
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_tools.Manifest tests.test_tools.WebData tests.test_pages_site
          if [ -f tests/test_phase_e_final_qualification.py ]; then
            python3 -m unittest tests.test_phase_e_final_qualification
          fi

      - name: Render exact Motion-in-2D learner surfaces
        run: |
          set -euo pipefail
          rm -rf /tmp/iss69-e02
          mkdir -p /tmp/iss69-e02/pages /tmp/iss69-e02/single /tmp/iss69-e02/css
          python3 Shared/tools/render_core.py build             --manifest products/physics/phy-kin-2d-motion.manifest.json             --out /tmp/iss69-e02/pages             --mode PAGES
          python3 Shared/tools/render_core.py build             --manifest products/physics/phy-kin-2d-motion.manifest.json             --out /tmp/iss69-e02/single             --mode SINGLE_FILE
          cp public/css/tablet-12-7.css /tmp/iss69-e02/css/tablet-12-7.css
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("/tmp/iss69-e02/pages/render-receipt.json").read_text())
          print("E02_RENDER_DIGEST=" + receipt["digest"])
          print("E02_SEMANTIC_DIGEST=" + str(receipt.get("semantic_digest")))
          print("E02_RENDER_GAPS=" + str(len(receipt.get("gaps", []))))
          PY

      - name: Browser layout audit
        run: |
          node tools/site-audit/core-page-audit.mjs             /tmp/iss69-e02/pages             --profile tablet-12.7             --http-root /tmp/iss69-e02             --json /tmp/iss69-e02/core-page-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/iss69-e02/core-page-audit.json").read_text())
          for page, row in report.items():
              assert not row.get("errors"), (page, row.get("errors"))
              for viewport, facts in row.get("viewports", {}).items():
                  assert facts.get("horizontalOverflowPx", 0) <= 0, (page, viewport, facts.get("horizontalOverflowPx"))
          print("E02 browser layout minimum gate: PASS")
          PY

      - name: Core2 exact-state browser audit
        run: |
          python3 -m http.server 8765 --directory /tmp/iss69-e02 >/tmp/iss69-e02-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time
          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 8765), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("E02 local HTTP server did not start")
          PY
          node tools/site-audit/core2-v2-browser-audit.mjs             --base http://127.0.0.1:8765/pages/             --single-base http://127.0.0.1:8765/single/             --witness PYQ-PHY-IITJEE-2011-P2-Q33             --audit-json /tmp/iss69-e02/core-page-audit.json

      - name: Emit exact-byte provenance
        run: |
          set -euo pipefail
          mkdir -p /tmp/iss69-e02/evidence
          {
            echo "head_sha=$(git rev-parse HEAD)"
            echo "e01_base=$E01_BASE"
            sha256sum               docs/architecture-manifest.json               public/core-learning/data.js               docs/core-learning/data.js               /tmp/iss69-e02/pages/core1a.html               /tmp/iss69-e02/pages/core2.html               /tmp/iss69-e02/pages/render-receipt.json
          } | tee /tmp/iss69-e02/evidence/exact-byte-provenance.txt
          cp /tmp/iss69-e02/core-page-audit.json /tmp/iss69-e02/evidence/
          cp /tmp/iss69-e02/pages/render-receipt.json /tmp/iss69-e02/evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: iss69-e02-exact-head-qualification
          path: /tmp/iss69-e02/evidence
          if-no-files-found: error
          retention-days: 30
