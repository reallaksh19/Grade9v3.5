name: grade9-generated-data-bridge

on:
  push:
    branches:
      - takeover/topic-atlas-browser-correctness
    paths:
      - .github/workflows/grade9-generated-data-bridge.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: takeover/topic-atlas-browser-correctness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate canonical generated artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated outputs and remove bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/data.js public/data/data.js docs/architecture-manifest.json
          git rm .github/workflows/grade9-generated-data-bridge.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore(generated): refresh Grade 9 web data"
          git push origin HEAD:takeover/topic-atlas-browser-correctness
