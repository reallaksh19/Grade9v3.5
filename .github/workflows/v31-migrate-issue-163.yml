name: v31-migrate-issue-163

on:
  push:
    branches:
      - integration/issue-163-portable-workbench
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grade9V3
        uses: actions/checkout@v4
        with:
          ref: integration/issue-163-portable-workbench
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: edb845f06f32c87453dee6fbfcc2f84937017279
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Preserve V3 basis and initialize clean V3.1 authority
        env:
          OWNER_UTTERANCE: "proceed next phase and fix, use latest https://github.com/reallaksh19/Common/tree/edb845f06f32c87453dee6fbfcc2f84937017279/skills/engineering-pr-delivery-v3.1 not v3"
          OWNER_TIMESTAMP: "2026-09-22T15:49:12Z"
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, yaml

          root = Path(".")
          relay = root / "relay"
          source_commit = os.popen("git rev-parse HEAD").read().strip()

          def load(path):
              return yaml.safe_load((relay / path).read_text(encoding="utf-8"))

          old_selector = load("PROTOCOL_SELECTION.yaml")
          old_roadmap = load("ROADMAP/ROADMAP.yaml")
          old_controls = load("CONTROLS/controls.yaml")
          old_state = load("STATE.yaml")

          assert old_selector["selected_protocol"] == "V3" and old_selector["status"] == "ACTIVE"
          assert old_state["execution"]["ep"] == "EP-PORTABLE-163-001"
          assert old_state["accepted"]["checkpoint"] == "CP-PORTABLE-163-001"

          h = hashlib.sha256()
          for path in sorted(p for p in relay.rglob("*") if p.is_file()):
              rel = path.relative_to(relay).as_posix().encode()
              h.update(len(rel).to_bytes(8, "big"))
              h.update(rel)
              data = path.read_bytes()
              h.update(len(data).to_bytes(8, "big"))
              h.update(data)
          relay_digest = "sha256:" + h.hexdigest()

          owner_utterance = os.environ["OWNER_UTTERANCE"]
          owner_digest = "sha256:" + hashlib.sha256(owner_utterance.encode("utf-8")).hexdigest()
          owner_timestamp = os.environ["OWNER_TIMESTAMP"]

          shutil.rmtree(relay)
          (relay / "ROADMAP").mkdir(parents=True)
          (relay / "CONTROLS").mkdir(parents=True)
          (relay / "GENERATED").mkdir(parents=True)
          (relay / "MIGRATION").mkdir(parents=True)

          roadmap = old_roadmap
          roadmap["schema_version"] = "relay-v3.1-roadmap"
          roadmap["revision"] = "RM-V31-ISS163-PORTABLE-001"
          for wp in roadmap["work_packages"]:
              if wp["id"] == "WP-PORTABLE-163":
                  wp["state"] = "PLANNED"
          (relay / "ROADMAP/ROADMAP.yaml").write_text(yaml.safe_dump(roadmap, sort_keys=False), encoding="utf-8")

          prior_merge = next(
              row for row in old_controls["controls"]
              if row["id"] == "CTRL-OWNER-MERGE-ISS163-PORTABLE-20260922"
          )
          controls = {
              "schema_version": "relay-v3.1-controls",
              "controls": [{
                  "id": "CTRL-OWNER-MERGE-ISS163-PORTABLE-20260922",
                  "kind": "OWNER",
                  "state": "OPEN",
                  "source": {
                      "type": "OWNER",
                      "ref": prior_merge["source"]["ref"] + "; protocol-update:" + owner_timestamp,
                  },
                  "condition": "Owner merge intent for PR 192 remains in force; the later Owner command changes relay implementation from V3 to the pinned V3.1 line and does not revoke the merge intent.",
                  "blocks": [],
                  "permits": ["MERGE"],
                  "resolution": {
                      "condition": "PR 192 is merged or the Owner revokes this authority.",
                      "evidence": [],
                  },
              }],
          }
          (relay / "CONTROLS/controls.yaml").write_text(yaml.safe_dump(controls, sort_keys=False), encoding="utf-8")

          state = {
              "schema_version": "relay-v3.1",
              "roadmap": {"revision": roadmap["revision"], "path": "relay/ROADMAP/ROADMAP.yaml"},
              "execution": {"lifecycle": "IDLE", "ep": None, "lease": None, "route": None},
              "accepted": {"checkpoint": None},
              "controls": {"path": "relay/CONTROLS/controls.yaml"},
              "delivery": {"required": False, "primary_vehicle": None},
              "generated": {"snapshot": "relay/GENERATED/CURRENT_SNAPSHOT.yaml"},
          }
          (relay / "STATE.yaml").write_text(yaml.safe_dump(state, sort_keys=False), encoding="utf-8")

          report = {
              "schema_version": "relay-v3-to-v3.1-migration-evidence",
              "authority": "MIGRATION_EVIDENCE",
              "source": {
                  "protocol": "V3",
                  "commit": source_commit,
                  "relay_tree_digest": relay_digest,
                  "accepted_checkpoint": "CP-PORTABLE-163-001",
              },
              "target": {
                  "protocol": "V3_1",
                  "common_ref": "edb845f06f32c87453dee6fbfcc2f84937017279",
                  "skill": "skills/engineering-pr-delivery-v3.1",
              },
              "owner_basis": {
                  "direct_utterance_digest": owner_digest,
                  "session_timestamp": owner_timestamp,
              },
              "policy": [
                  "The V3 relay tree is preserved byte-for-byte by the pinned source Git commit and relay_tree_digest.",
                  "No relay-v3 event line is rewritten as relay-v3.1 history.",
                  "The V3 Issue 163 checkpoint is migration evidence only and is not promoted as a V3.1 checkpoint.",
                  "Issue 163 is re-admitted and re-validated natively under V3.1 before provider delivery continues.",
              ],
          }
          canonical = json.dumps(report, sort_keys=True, separators=(",", ":"), ensure_ascii=False)
          report_digest = "sha256:" + hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          (relay / "MIGRATION/V3_TO_V31.yaml").write_text(yaml.safe_dump(report, sort_keys=False), encoding="utf-8")

          legacy = old_selector["legacy"]
          freeze = old_selector["cutover"]["legacy_freeze_digest"]
          selector = {
              "schema_version": "relay-v3.1-protocol-selection",
              "selected_protocol": "V3_1",
              "status": "ACTIVE",
              "legacy": {
                  "root": "agents/relay",
                  "tree_digest": legacy["tree_digest"],
                  "policy": "READ_ONLY_HISTORY",
              },
              "v3": {"state_path": "relay/STATE.yaml", "validation": "PASS"},
              "cutover": {
                  "owner_authorized": True,
                  "owner_basis": {
                      "direct_utterance_digest": owner_digest,
                      "session_timestamp": owner_timestamp,
                  },
                  "legacy_freeze_digest": freeze,
                  "readiness_digest": report_digest,
                  "activated_at": owner_timestamp,
              },
          }
          (relay / "PROTOCOL_SELECTION.yaml").write_text(yaml.safe_dump(selector, sort_keys=False), encoding="utf-8")

          event = {
              "schema_version": "relay-v3.1-event",
              "event_id": "EVT-V31-UPGRADE-ISS163-001",
              "type": "PROTOCOL_CUTOVER_ACTIVATED",
              "timestamp": owner_timestamp,
              "actor": "owner",
              "subject": "V3_1",
              "basis": [report_digest, source_commit, "Common@edb845f06f32c87453dee6fbfcc2f84937017279"],
              "details": {
                  "from_protocol": "V3",
                  "selected_protocol": "V3_1",
                  "historical_v3_checkpoint": "CP-PORTABLE-163-001",
              },
          }
          (relay / "EVENTS.jsonl").write_text(json.dumps(event, sort_keys=True) + "\n", encoding="utf-8")

          notice = f"""# Engineering Relay legacy deprecation notice

Status: **READ_ONLY_HISTORY**

Engineering Relay V3.1 is the selected protocol under direct Owner authority dated {owner_timestamp}.

- V2.5 remains preserved under `agents/relay/**` with freeze digest `{freeze}`.
- The prior V3 authority is preserved by Git source commit `{source_commit}` and relay digest `{relay_digest}`.
- New relay authority must be written through Common@edb845f06f32c87453dee6fbfcc2f84937017279 `skills/engineering-pr-delivery-v3.1`.
- No V3 event has been rewritten as V3.1 history.
"""
          (relay / "MIGRATION/V25_DEPRECATION.md").write_text(notice, encoding="utf-8")
          PY

      - name: Generate and validate initial V3.1 snapshot
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/generate_snapshot.py . --base-ref origin/main --apply
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_default.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate

      - name: Re-admit Issue 163 natively under V3.1
        run: |
          cat > /tmp/issue-163-v31.yaml <<'YAML'
          schema_version: relay-v3.1-task-admission
          roadmap:
            disposition: MAPPED_EXISTING_WP
            new_revision: RM-V31-ISS163-PORTABLE-002
            basis:
              - "Owner directed migration from V3 to Common@edb845f06f32c87453dee6fbfcc2f84937017279 Engineering Relay V3.1."
              - "The prior V3 checkpoint is historical migration evidence only; acceptance will be re-proven under V3.1."
              - "WP-PORTABLE-163 is reused without changing title, weight, dependencies, or technical scope."
            work_package:
              id: WP-PORTABLE-163
              title: Deliver detachable versioned workbench packages and external/offline hosts
              weight: 8
              state: ACTIVE
              depends_on:
                - WP-LEARNER-175-PRODUCTION
          ep:
            schema_version: relay-v3.1-ep
            id: EP-PORTABLE-163-V31-001
            work_package: WP-PORTABLE-163
            outcome:
              statement: "Re-prove and deliver the already-authored Issue 163 portable-workbench implementation under the pinned V3.1 protocol without modifying delivered Core or canonical subject truth."
            basis:
              predecessor_checkpoint: null
              material_base: c6f1ce51ae0631a346487609e88f544fece2fa08
              protocol_basis: "reallaksh19/Common@edb845f06f32c87453dee6fbfcc2f84937017279:skills/engineering-pr-delivery-v3.1"
              semantic_dependencies:
                - path: relay/MIGRATION/V3_TO_V31.yaml
                  reason: "Pins the preserved V3 source authority and records that the old checkpoint is historical evidence only."
                - path: Shared/workbench/runtime.mjs
                  reason: "Delivered Core runtime remains the semantic execution engine."
                - path: Shared/workbench/semantic-workbench.mjs
                  reason: "Delivered Web Component remains the public runtime surface."
                - path: Shared/portable/package.py
                  reason: "Issue 163 portable package contract already authored on PR 192."
                - path: Shared/tools/build_portable_workbench.py
                  reason: "Issue 163 one-source host/package generator already authored on PR 192."
            scope:
              write:
                - Shared/portable/**
                - Shared/tools/build_portable_workbench.py
                - public/portable-workbench/**
                - standalone/portable-workbench/**
                - tests/fixtures/portable-workbench/**
                - tests/test_portable_workbench.py
                - tests/portable_workbench.test.mjs
                - docs/portable-workbench.md
                - docs/architecture-manifest.json
                - .github/workflows/v3-relay.yml
              read:
                - Shared/workbench/**
                - Shared/library/**
                - Chemistry/**
                - Mathematics/**
                - Physics/**
                - public/chemistry/**
                - standalone/chemistry-redox-reactions-master-suite.html
                - tests/fixtures/workbench/**
                - relay/MIGRATION/V3_TO_V31.yaml
              protect:
                - Shared/workbench/**
                - Shared/library/**
                - Shared/publication_host/**
                - Physics/**
                - Chemistry/**
                - Mathematics/**
                - public/core-learning/**
                - standalone/core-learning/**
                - agents/relay/**
              prohibit:
                - "Do not treat prior V3 acceptance as a V3.1 checkpoint."
                - "Do not add page-local learner mastery, support policy or question routing."
                - "Do not put executable JavaScript inside portable package data."
                - "Do not create a new canonical curriculum database."
                - "Do not modify delivered Core runtime merely to make a portability proof pass."
            acceptance:
              - id: AC-163-PACKAGE
                statement: "Versioned package seams fail closed on mismatch/malformed/executable/pixel payloads."
                evidence_requirements:
                  - test: "python -m unittest tests.test_portable_workbench"
                  - test: "node --test tests/portable_workbench.test.mjs"
              - id: AC-163-HOSTS
                statement: "The same package works in repository static, external plain-HTML, and true single-file hosts."
                evidence_requirements:
                  - test: "real Chrome cross-host proof"
              - id: AC-163-CROSS-SUBJECT
                statement: "Long division, Redox and integration use one portable runtime/build contract without Core edits."
                evidence_requirements:
                  - test: "cross-subject portable package tests"
              - id: AC-163-BOUNDARY
                statement: "Core, learner shell and canonical subject truth remain outside portability ownership."
                evidence_requirements:
                  - oracle: "protected paths are unchanged from main"
              - id: AC-163-PARITY
                statement: "Public, external and offline artifacts are generated from one source/build path and freshness-checked."
                evidence_requirements:
                  - test: "python -m Shared.tools.build_portable_workbench --check"
              - id: AC-163-REPO
                statement: "Exact-head guardrails and pinned V3.1 validation pass."
                evidence_requirements:
                  - test: "guardrails and v31-relay on exact PR 192 material head"
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Run the full Issue 163 acceptance against the current material head under V3.1, accept a fresh V3.1 checkpoint, then continue provider delivery."
              stop_conditions:
                - "Any Shared/workbench Core source change requires a new generic runtime falsifier and separate scope."
                - "Any canonical subject-data change is outside Issue 163."
                - "No merge may occur unless GitHub is mergeable and V3.1 MERGE authorization passes."
          lease:
            id: LEASE-PORTABLE-163-V31-001
            executor_id: chatgpt-sol-portable-v31-20260922
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: integration/issue-163-portable-workbench
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 192
          YAML
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_tx.py . admit-task             --tx-id TX-V31-ADMIT-ISS163-001             --event-id EVT-V31-ADMIT-ISS163-001             --actor chatgpt-sol-portable-v31-20260922             --admission /tmp/issue-163-v31.yaml             --base-ref origin/main

      - name: Validate active V3.1 authority
        run: |
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_default.py .
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py TEST . --base-ref origin/main
          python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/relay_can.py CHECKPOINT . --base-ref origin/main

      - name: Replace permanent relay validation with pinned V3.1
        run: |
          cat > .github/workflows/v3-relay.yml <<'YAML'
          name: v31-relay

          on:
            push:
              branches: ["**"]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate-v31:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout Grade9V3
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0

                - name: Checkout pinned Engineering Relay V3.1
                  uses: actions/checkout@v4
                  with:
                    repository: reallaksh19/Common
                    ref: edb845f06f32c87453dee6fbfcc2f84937017279
                    path: _common_v31
                    fetch-depth: 1

                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"

                - name: Install relay validator dependencies
                  run: python -m pip install --disable-pip-version-check pyyaml jsonschema

                - name: Resolve selected protocol
                  run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_default.py .

                - name: Validate V3.1 foundation
                  run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .

                - name: Validate active protocol selection and frozen V2.5 history
                  run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/protocol_cutover.py . validate
          YAML

      - name: Commit V3.1 protocol-line migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v31-migrate-issue-163.yml
          git add relay .github/workflows/v3-relay.yml
          git commit -m "[relay-v3.1] migrate Issue 163 active delivery"
          git push origin HEAD:integration/issue-163-portable-workbench
