name: v3-admit-issue-174-motion

on:
  push:
    branches:
      - content/issue-174-motion2d-canonical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Motion branch
        uses: actions/checkout@v4
        with:
          ref: content/issue-174-motion2d-canonical
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install V3 dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Normalize completed-task context for new admission
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          state_path = Path("relay/STATE.yaml")
          state = yaml.safe_load(state_path.read_text(encoding="utf-8"))
          assert state["execution"]["lifecycle"] == "TERMINAL", state["execution"]
          assert state["accepted"]["checkpoint"] == "CP-CANONICAL-174-NLM-002"
          state["execution"] = {"lifecycle": "IDLE", "ep": None, "lease": None, "route": None}
          state["accepted"] = {"checkpoint": None}
          state["delivery"] = {"required": False, "primary_vehicle": None}
          state_path.write_text(yaml.safe_dump(state, sort_keys=False), encoding="utf-8")
          PY

      - name: Write Motion admission
        run: |
          cat > /tmp/motion-admission.yaml <<'YAML'
          schema_version: relay-v3-task-admission
          roadmap:
            disposition: ADDED_EXECUTION_WP
            new_revision: RM-V3-ISS174-MOTION-001
            basis:
              - "Issue 174 requires Motion-in-2D as the second canonical-data production proof after NLM."
              - "WP-CANONICAL-174-NLM is COMPLETE and PR 179 is merged."
              - "The Motion family matrix is already the canonical family-level academic authority and must not be duplicated into the library."
              - "PR 187 is the dedicated Motion-in-2D delivery vehicle."
            work_package:
              id: WP-CANONICAL-174-MOTION
              title: Deliver Motion-in-2D canonical reasoning and representation proof
              weight: 4
              state: ACTIVE
              depends_on:
                - WP-CANONICAL-174-NLM
          ep:
            schema_version: relay-v3-ep
            id: EP-CANONICAL-174-MOTION-001
            work_package: WP-CANONICAL-174-MOTION
            outcome:
              statement: "Promote canonical Motion-in-2D representations and structured familiar/transfer reasoning into the real Physics library, preserve matrix and source authority, and prove delivered Core projection retains crux/scaffold/protected-transfer semantics."
            basis:
              predecessor_checkpoint: CP-CANONICAL-174-NLM-002
              material_base: 1b92a943fe0b90fc829140e63ea4121b02dfd225
              protocol_basis: "reallaksh19/Common@c87cf87b313801e42ecd0fcc7d36af0d90c5f400:skills/engineering-pr-delivery-v3"
              semantic_dependencies:
                - path: Physics/matrices/phy-kin-2d-motion.rungs.json
                  reason: "Family invariant demand, difficult move, independent check and support ladder remain academic authority."
                - path: Physics/activities/phy-kin-2d-motion.activities.json
                  reason: "Existing GCDR activities supply representation resources and locators but are not academic authority."
                - path: Shared/library
                  reason: "Delivered canonical package schema and intake contract."
                - path: Shared/publication_host
                  reason: "Delivered Core2A/Core2B projection and protected-move publication semantics."
            scope:
              write:
                - Physics/library/phy-kin-2d-motion.v1.json
                - tests/test_motion2d_canonical.py
                - docs/architecture-manifest.json
              read:
                - Physics/matrices/phy-kin-2d-motion.rungs.json
                - Physics/activities/**
                - Shared/**
                - tests/**
              protect:
                - Physics/matrices/phy-kin-2d-motion.rungs.json
                - Physics/activities/**
                - Shared/**
                - Physics/library/phy-nlm-first-law.v1.json
                - agents/relay/**
              prohibit:
                - Mathematics/**
                - Chemistry/**
                - public/physics/**
                - standalone/**
            acceptance:
              - id: AC-MOTION-CANONICAL
                statement: "Three canonical Motion-in-2D representations bind existing activities and teaching steps, while familiar and transfer items use structured routes with stable crux moves, staged scaffolds, preserved source hints and protected transfer reasoning."
                evidence_requirements:
                  - test: "python -m unittest discover -s tests -p test_motion2d_canonical.py"
              - id: AC-MOTION-AUTHORITY
                statement: "The Motion matrix remains family-level authority; library normalization does not restate invariant-demand, difficult-move, independent-check or support-ladder prose."
                evidence_requirements:
                  - oracle: "Physics/matrices/phy-kin-2d-motion.rungs.json remains unchanged and focused tests assert matrix authority."
              - id: AC-MOTION-PIPELINE
                statement: "Delivered Core projection preserves Motion reasoning/scaffolds/protected transfer semantics and rejects protected-decision leakage."
                evidence_requirements:
                  - test: "python -m unittest tests.test_core_projection_pipeline tests.test_core_projection_contract"
              - id: AC-MOTION-REPO
                statement: "Exact-head guardrails and pinned V3 validation pass with generated architecture metadata current."
                evidence_requirements:
                  - test: "guardrails and v3-relay workflows on the exact PR 187 head"
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Author the three canonical Motion representations and structured familiar/transfer routes without changing the Motion matrix or existing source hints."
              stop_conditions:
                - "Do not duplicate family-level matrix authority into the library."
                - "Do not change existing source hints or activity academic authority."
                - "Do not modify delivered Shared Core code unless a generic falsifier proves a separate regression."
                - "Keep PR 187 Motion-only."
          lease:
            id: LEASE-CANONICAL-174-MOTION-001
            executor_id: chatgpt-sol-canonical-20260922
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: content/issue-174-motion2d-canonical
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 187
          YAML

      - name: Admit Motion slice
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . admit-task \
            --tx-id TX-ADMIT-ISS174-MOTION-001 \
            --event-id EVT-ADMIT-ISS174-MOTION-001 \
            --actor chatgpt-sol-canonical-20260922 \
            --admission /tmp/motion-admission.yaml \
            --base-ref origin/main

      - name: Validate Motion authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/protocol_cutover.py . validate
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
            --path Physics/library/phy-kin-2d-motion.v1.json \
            --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
            --path tests/test_motion2d_canonical.py \
            --base-ref origin/main

      - name: Commit native Motion admission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3] Admit Issue 174 Motion canonical slice"
          git push origin HEAD:content/issue-174-motion2d-canonical
