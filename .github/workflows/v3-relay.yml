name: v31-relay

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v31:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Grade9V3
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Engineering Relay V3.1
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: 5676b61141c2cdc7816ca624a288a27b48f3e412
          path: _common_v31
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install relay validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Validate V3.1 recorder foundation
        run: python _common_v31/skills/engineering-pr-delivery-v3.1/scripts/validate_foundation.py .
