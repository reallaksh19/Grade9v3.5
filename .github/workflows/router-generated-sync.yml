name: router-generated-sync

on:
  push:
    branches:
      - takeover/topic-atlas-browser-correctness
    paths:
      - .github/workflows/router-generated-sync.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: takeover/topic-atlas-browser-correctness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate repository artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated outputs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/router-generated-sync.yml
          git add docs/architecture-manifest.json public/data/data.js tools/data.js
          git diff --cached --check
          git commit -m "chore(generated): sync merged topic atlas artifacts"
          git push origin HEAD:takeover/topic-atlas-browser-correctness
