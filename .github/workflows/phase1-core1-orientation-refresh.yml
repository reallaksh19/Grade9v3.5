name: phase1-core1-orientation-refresh

on:
  push:
    branches:
      - audit/core1-orientation-phase1

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[core1-orientation-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core1-orientation-phase1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate Core1 orientation evidence
        run: |
          python3 -m Shared.library.core1_orientation \
            --write-report docs/core1-orientation-report.json \
            --write-baseline docs/core1-orientation-baseline.json
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/core1-orientation-report.json docs/core1-orientation-baseline.json
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "[core1-orientation-refresh] Generate Phase-1 Core1 inventory"
          git push origin HEAD:audit/core1-orientation-phase1
