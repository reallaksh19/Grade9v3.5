name: test-160-pages-manifest

on:
  push:
    branches:
      - "test/160-q1-derivative"
    paths:
      - ".github/workflows/test-160-pages-manifest.yml"

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/160-q1-derivative
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate governed Pages mirror
        run: python3 Shared/tools/build_pages_site.py
      - name: Refuse unexpected generated surface
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v '^docs/.pages-manifest.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Pages changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit manifest
        run: |
          if git diff --quiet -- docs/.pages-manifest.json; then
            echo "Pages manifest already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/.pages-manifest.json
          git commit -m "build(test): refresh Pages manifest for Q1 derivative"
          git push origin HEAD:test/160-q1-derivative
