name: v3-build-issue-163-portable

on:
  push:
    branches:
      - integration/issue-163-portable-workbench
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portability branch
        uses: actions/checkout@v4
        with:
          ref: integration/issue-163-portable-workbench
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Prove generated-write authority
        run: |
          for path in             public/portable-workbench/index.html             standalone/portable-workbench/index.html             tests/fixtures/portable-workbench/external-host.html             docs/architecture-manifest.json
          do
            python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE .               --path "$path" --base-ref origin/main
          done

      - name: Generate one-source portable artifacts
        run: |
          python -m Shared.tools.build_portable_workbench
          python Shared/tools/build_manifest.py
          python -m Shared.tools.build_portable_workbench --check
          python Shared/tools/build_manifest.py --check

      - name: Focused package and browser falsifiers
        run: |
          python -m unittest tests.test_portable_workbench
          node --test tests/portable_workbench.test.mjs
          node --test tests/workbench_runtime.test.mjs

      - name: Prove delivered Core and subject truth unchanged
        run: |
          git diff --exit-code origin/main --             Shared/workbench             Shared/library             Shared/publication_host             Physics             Chemistry             Mathematics             public/core-learning             standalone/core-learning

      - name: Commit generated proof and retire one-shot runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v3-admit-issue-163-bootstrap.yml
          git add             Shared/portable             Shared/tools/build_portable_workbench.py             public/portable-workbench             standalone/portable-workbench             tests/fixtures/portable-workbench             tests/test_portable_workbench.py             tests/portable_workbench.test.mjs             docs/portable-workbench.md             docs/architecture-manifest.json
          git commit -m "Portability: generate detachable workbench proof"
          git push origin HEAD:integration/issue-163-portable-workbench
