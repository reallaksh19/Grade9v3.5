name: learner-platform-code-tests

# Informational code regression signal. Content findings never decide publication.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install --quiet jsonschema pypdf
      - name: Physics Motion-in-2D source figure references resolve
        run: python3 -m unittest tests.test_motion_2d_figure_resolution -v
      - name: TEST Question Bank regressions
        run: python3 -m unittest tests.test_test_question_bank
      - name: TEST official intake identity/shape gate
        run: python3 -m unittest tests.test_test_intake_identity -v
      - name: TEST verified source custody and ready-only handoff
        run: |
          python3 -m unittest tests.test_test_source_custody -v
          python3 Shared/tools/test_source_custody.py
      - name: R4 primary-source review is bounded and non-promoting
        run: |
          python3 -m unittest tests.test_test_source_review -v
          python3 Shared/tools/test_source_review.py
      - name: Authenticate pilot witness pointers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest tests.test_test_witness_authentication -v
          python3 Shared/tools/verify_test_source_witnesses.py
      - name: Blocking TEST hub custody and generator freshness
        run: |
          python3 -m unittest tests.test_test_area.TestPages.test_test_search_index_covers_parked_questions_without_becoming_canonical_search -v
          python3 -m unittest tests.test_test_area.TestPages.test_committed_pages_are_what_the_generator_writes -v
          python3 -m unittest tests.test_test_area.TestPages.test_test_shell_subject_links_stay_under_portal_root_at_each_depth -v
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_html_entities_are_decoded_for_official_links_and_traversal -v
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_generated_html_links_do_not_escape_docs_root -v
          python3 -m unittest tests.test_pages_site.PagesSiteTest.test_committed_pages_mirror_is_current -v
      - name: Capture exact generator output after a blocking failure
        if: failure()
        run: |
          python3 Shared/tools/build_test_site.py
          git diff --stat -- public/test/index.html public/test/rungs/index.html public/test/deployments/index.html
      - name: Upload TEST regeneration evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-generator-freshness-diagnostic
          path: |
            public/test/index.html
            public/test/rungs/index.html
            public/test/deployments/index.html
          if-no-files-found: error
          retention-days: 7
      - name: Informational platform code tests
        continue-on-error: true
        run: >-
          python3 -m unittest
          tests.test_publication
          tests.test_render_core
          tests.test_renderer_inventory
          tests.test_quality_contract
          tests.test_core2_v2
          tests.test_core2_v2_layout
          tests.test_core2_v2_motion2d
          tests.test_core2_v2_quality
          tests.test_core2_v2_boundaries


  test-question-bank-browser-audit:
    # Blocking technical evidence for the TEST-only NCERT intake browser.
    # Passing this does not admit or publish any question to the production Question Bank.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TEST Question Bank browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit 210-question TEST Question Bank
        run: node tests/test_test_question_bank_browser.mjs

  core2-v2-browser-audit:
    # Rendered acceptance evidence only. This job is deliberately non-gating;
    # content/release authority remains with the Owner and the governed review flow.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser-audit dependencies
        run: |
          pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render real Motion-in-2D product
        run: |
          rm -rf /tmp/g9-core2-v2-site
          mkdir -p \
            /tmp/g9-core2-v2-site/products/physics/phy-kin-2d-motion \
            /tmp/g9-core2-v2-site/products/physics/phy-kin-2d-motion-single \
            /tmp/g9-core2-v2-site/css
          python3 Shared/tools/render_core.py build \
            --manifest products/physics/phy-kin-2d-motion.manifest.json \
            --out /tmp/g9-core2-v2-site/products/physics/phy-kin-2d-motion \
            --mode PAGES
          python3 Shared/tools/render_core.py build \
            --manifest products/physics/phy-kin-2d-motion.manifest.json \
            --out /tmp/g9-core2-v2-site/products/physics/phy-kin-2d-motion-single \
            --mode SINGLE_FILE
          cp public/css/tablet-12-7.css /tmp/g9-core2-v2-site/css/tablet-12-7.css
      - name: Shared tablet rendered audit
        run: |
          node tools/site-audit/core-page-audit.mjs \
            /tmp/g9-core2-v2-site/products/physics/phy-kin-2d-motion \
            --profile tablet-12.7 \
            --json /tmp/core-page-audit.json
      - name: Physics tablet standalone local HTTP audits
        # Evidence-only reuse of the existing shared Chromium audit. No --enforce:
        # measured findings remain review evidence and never become a publication gate.
        # Run both the broad viewport set and the exact 12.7-inch target profile.
        run: |
          rm -rf /tmp/g9-physics-tablet-standalone
          mkdir -p /tmp/g9-physics-tablet-standalone
          cp standalone/core1a-motion-in-a-plane-tablet.html /tmp/g9-physics-tablet-standalone/
          cp standalone/core1a-motion-1d-straight-line-tablet.html /tmp/g9-physics-tablet-standalone/
          cp standalone/core1a-vector-add-sub-tablet.html /tmp/g9-physics-tablet-standalone/
          cp standalone/core1a-physics-nlm-tablet.html /tmp/g9-physics-tablet-standalone/
          cp standalone/core2-motion-in-a-plane-tablet.html /tmp/g9-physics-tablet-standalone/
          node tools/site-audit/core-page-audit.mjs \
            /tmp/g9-physics-tablet-standalone \
            --profile core1a-spec \
            --http-root /tmp/g9-physics-tablet-standalone \
            --json /tmp/physics-tablet-standalone-audit.json
          node tools/site-audit/core-page-audit.mjs \
            /tmp/g9-physics-tablet-standalone \
            --profile tablet-12.7 \
            --http-root /tmp/g9-physics-tablet-standalone \
            --json /tmp/physics-tablet-standalone-12-7-audit.json
      - name: Core2 v2 local HTTP interaction audit
        run: |
          python3 -m http.server 8765 --directory /tmp/g9-core2-v2-site >/tmp/g9-core2-v2-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import socket, time
          for _ in range(50):
              try:
                  with socket.create_connection(("127.0.0.1", 8765), timeout=0.2):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit("local HTTP server did not start")
          PY
          node tools/site-audit/core2-v2-browser-audit.mjs \
            --base http://127.0.0.1:8765/products/physics/phy-kin-2d-motion/ \
            --single-base http://127.0.0.1:8765/products/physics/phy-kin-2d-motion-single/ \
            --witness PYQ-PHY-IITJEE-2011-P2-Q33 \
            --audit-json /tmp/core-page-audit.json

  test-area-browser-audit:
    # Informational TEST-sandbox layout/runtime evidence. Never grants publication.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TEST browser dependencies
        run: |
          pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render current ISS55 polynomial TEST draft
        run: |
          python3 Shared/tools/deploy_test.py product TEST/products/iss55-poly.manifest.json
          python3 Shared/tools/deploy_test.py pages
      - name: Audit polynomial Core2 TEST draft
        run: |
          node tools/site-audit/core-page-audit.mjs             public/test/products/iss55-poly             --profile tablet-12.7             --json /tmp/iss55-poly-core2-audit.json
      - name: Audit TEST hub, Atlas, rungs and deployments
        run: node tests/test_area_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-iss55-poly-current-render
          path: |
            public/test/products/iss55-poly
            /tmp/iss55-poly-core2-audit.json
          if-no-files-found: error
          retention-days: 7

  blueprint-v2-render-snapshots:
    # Regenerate review snapshots from the live merged blueprint-v2 authority on main.
    # These are review artifacts only; they do not publish or accept products.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer dependencies
        run: pip install --quiet jsonschema pypdf
      - name: Materialize current main authority
        run: |
          git fetch origin main --depth=1
          rm -rf /tmp/g9-main
          git worktree add --detach /tmp/g9-main origin/main
      - name: Render blueprint-v2 Physics snapshots
        working-directory: /tmp/g9-main
        run: |
          set -eux
          rm -rf /tmp/g9-blueprint-v2
          mkdir -p /tmp/g9-blueprint-v2/{motion2d,motion1d,vectors,nlm,export}
          python3 Shared/tools/render_core.py build \
            --manifest products/physics/phy-kin-2d-motion.manifest.json \
            --out /tmp/g9-blueprint-v2/motion2d --mode PAGES --draft
          python3 Shared/tools/render_core.py build \
            --manifest products/physics/phy-kin-1d-motion.manifest.json \
            --out /tmp/g9-blueprint-v2/motion1d --mode PAGES --draft
          python3 Shared/tools/render_core.py build \
            --manifest products/physics/phy-vec-add-sub.manifest.json \
            --out /tmp/g9-blueprint-v2/vectors --mode PAGES --draft
          python3 Shared/tools/render_core.py build \
            --manifest products/physics/phy-nlm-first-law.manifest.json \
            --out /tmp/g9-blueprint-v2/nlm --mode PAGES --draft
          cp /tmp/g9-blueprint-v2/motion2d/core1a.html /tmp/g9-blueprint-v2/export/core1a-motion-in-a-plane-tablet.html
          cp /tmp/g9-blueprint-v2/motion2d/core2.html /tmp/g9-blueprint-v2/export/core2-motion-in-a-plane-tablet.html
          cp /tmp/g9-blueprint-v2/motion1d/core1a.html /tmp/g9-blueprint-v2/export/core1a-motion-1d-straight-line-tablet.html
          cp /tmp/g9-blueprint-v2/vectors/core1a.html /tmp/g9-blueprint-v2/export/core1a-vector-add-sub-tablet.html
          cp /tmp/g9-blueprint-v2/nlm/core1a.html /tmp/g9-blueprint-v2/export/core1a-physics-nlm-tablet.html
          cp Shared/web/interactive-page-blueprints.v1.json /tmp/g9-blueprint-v2/export/blueprint-authority.json
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/g9-blueprint-v2/export/main-authority-sha.txt
      - name: Verify Motion2D Core2 denominator and order
        working-directory: /tmp/g9-main
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          manifest = json.loads(Path('products/physics/phy-kin-2d-motion.manifest.json').read_text(encoding='utf-8'))
          expected = manifest['selection']['core2']
          text = Path('/tmp/g9-blueprint-v2/export/core2-motion-in-a-plane-tablet.html').read_text(encoding='utf-8')
          actual = re.findall(r'<article\b[^>]*data-g9-unit="([^"]+)"[^>]*data-g9-kind="QUESTION"', text)
          print(f'Core2 manifest tally: {len(actual)}/{len(expected)}')
          if actual != expected:
              missing = [x for x in expected if x not in actual]
              unexpected = [x for x in actual if x not in expected]
              raise SystemExit(f'Core2 manifest/order mismatch; missing={missing}; unexpected={unexpected}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: physics-blueprint-v2-render-snapshots
          path: /tmp/g9-blueprint-v2/export
          if-no-files-found: error
          retention-days: 7
