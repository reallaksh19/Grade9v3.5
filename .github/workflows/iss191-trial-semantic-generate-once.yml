# Temporary, exact-ref-gated trial semantic generator for #191 U3; remove after verified output.
# Not a production workflow, never operates on main or other branches.
name: iss191-trial-semantic-generate-once
on:
  push:
    branches:
      - trial/iss191-u5-main-sync-20261008
    paths:
      - .github/workflows/iss191-trial-semantic-generate-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    if: >-
      github.event.before == '4b54aa7140b92de2dec5e34bc1c634b5934fab74' &&
      github.event.head_commit.message == 'ISS191 U3: run guarded semantic and generated closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate only from existing governed repository builders
        run: |
          set -euo pipefail
          pip install --quiet jsonschema
          python3 -m unittest tests.test_core2_v2.Core2V2RendererContract.test_pre_attempt_unlabeled_stage_must_not_expose_protected_purpose -v
          python3 Shared/tools/build_question_bank_web.py
          python3 Shared/tools/build_question_bank_platform.py --write
          python3 Shared/tools/build_manifest.py
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_question_bank_web.py --check
          python3 Shared/tools/build_question_bank_platform.py --check
          python3 Shared/tools/build_manifest.py --check
          python3 Shared/tools/build_pages_site.py --check
          python3 -m unittest tests.test_question_bank_web
      - name: Refuse non-generated edits; commit exact derived closure on isolated trial only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/trial/iss191-u5-main-sync-20261008"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          changed = [p for p in subprocess.check_output(
              ["git", "diff", "--name-only", "-z"]).decode().split("\0") if p]
          new = [p for p in subprocess.check_output(
              ["git", "ls-files", "--others", "--exclude-standard", "-z"]).decode().split("\0") if p]
          def governed(p):
              if p in {
                  "docs/architecture-manifest.json",
                  "docs/.pages-manifest.json",
                  "tools/data.js", "docs/tools/data.js",
                  "public/core-learning/data.js", "docs/core-learning/data.js",
                  "public/data/data.js", "docs/data/data.js",
              }:
                  return True
              if p.startswith(("public/data/question-bank-", "docs/data/question-bank-",
                              "public/data/question-bank-details/", "docs/data/question-bank-details/")):
                  return True
              if p.startswith("artifacts/question-bank/") and p.rsplit("/", 1)[-1] in {
                  "build-receipt.json", "dedup-report.json", "lineage.json",
              }:
                  return True
              if p.startswith(("public/js/core-learning/", "docs/js/core-learning/",
                               "public/core-learning/", "docs/core-learning/",
                               "standalone/core-learning/", "docs/standalone/core-learning/")):
                  return p.endswith((".js", ".mjs", ".html"))
              return False
          invalid = [p for p in changed + new if not governed(p)]
          print("Tracked generated diff:", changed)
          print("Untracked generated diff:", new)
          if invalid:
              raise SystemExit("REFUSE_UNDECLARED_WRITE_SURFACE: " + str(invalid))
          if changed or new:
              subprocess.run(["git", "add", "-A", "--", *(changed + new)], check=True)
          PY
          if git diff --cached --quiet; then
            echo "Deterministic generated closure was already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ISS191 U3: governed refresh after protected W fix"
          git push origin "HEAD:refs/heads/trial/iss191-u5-main-sync-20261008"
