name: v3-admit-issue-175-production

on:
  push:
    branches:
      - builder/core-learning-pages-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          ref: builder/core-learning-pages-r1
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install V3 dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Normalize completed prior task context
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("relay/STATE.yaml")
          state = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert state["execution"]["lifecycle"] == "TERMINAL", state["execution"]
          state["execution"] = {"lifecycle": "IDLE", "ep": None, "lease": None, "route": None}
          state["accepted"] = {"checkpoint": None}
          state["delivery"] = {"required": False, "primary_vehicle": None}
          path.write_text(yaml.safe_dump(state, sort_keys=False), encoding="utf-8")
          PY

      - name: Write Issue 175 production admission
        run: |
          cat > /tmp/issue-175-production.yaml <<'YAML'
          schema_version: relay-v3-task-admission
          roadmap:
            disposition: ADDED_EXECUTION_WP
            new_revision: RM-V3-ISS175-PRODUCTION-001
            basis:
              - "Issue 173 Core projection contract is delivered and immutable absent a generic falsifier."
              - "Issue 174 NLM and Motion canonical-data proofs are merged and WP-CANONICAL-174-MOTION is COMPLETE."
              - "PR 178 already contains the checkpointed learner shell and public/standalone host-parity sources; this task must preserve rather than rebuild them."
              - "Issue 175 remains open specifically for production projection integration, one real explorer mount/migration, and PR 134 disposition."
            work_package:
              id: WP-LEARNER-175-PRODUCTION
              title: Integrate canonical Core projections into learner-page builder
              weight: 7
              state: ACTIVE
              depends_on:
                - WP-CANONICAL-174-MOTION
          ep:
            schema_version: relay-v3-ep
            id: EP-LEARNER-175-PRODUCTION-001
            work_package: WP-LEARNER-175-PRODUCTION
            outcome:
              statement: "Restack and finish the existing Issue 175 learner-page builder by replacing fixture-backed public data with real compiler-produced Motion Core projections, preserving public/standalone parity, mounting one existing Motion shared-clock explorer through explicit host metadata, and dispositioning PR 134 without creating a second academic database."
            basis:
              predecessor_checkpoint: CP-CANONICAL-174-MOTION-002
              material_base: 8aff9d95571b68897cc0d005eb7e34b716b69f47
              protocol_basis: "reallaksh19/Common@c87cf87b313801e42ecd0fcc7d36af0d90c5f400:skills/engineering-pr-delivery-v3"
              semantic_dependencies:
                - path: Shared/library/compile_inputs.py
                  reason: "Delivered Issue 173 compiler is the production source of Core blocks."
                - path: Shared/library/package.schema.json
                  reason: "Delivered structured reasoning/scaffold/transfer fields define provider semantics."
                - path: Physics/library/phy-kin-2d-motion.v1.json
                  reason: "Delivered Issue 174 Motion canonical representations and structured reasoning are the gold production data."
                - path: Physics/matrices/phy-kin-2d-motion.rungs.json
                  reason: "Motion family authority remains outside the page builder."
                - path: public/physics/motion-2d/explorers/shared-clock/index.html
                  reason: "Existing bespoke shared-clock explorer is the representative artifact to mount without duplicating its scientific logic."
                - path: Shared/publication_host
                  reason: "Delivered projection/publication validation remains an upstream oracle."
            scope:
              write:
                - Shared/tools/build_core_learning_data.py
                - Shared/tools/build_core_learning_host.py
                - Shared/tools/build_core_learning_runtime.py
                - Shared/tools/core_learning_projection_adapter.py
                - Shared/tools/build_manifest.py
                - Shared/tools/topic_independence_allowlist.json
                - Shared/workbench/core-learning-host.mjs
                - Shared/workbench/core-learning-page.mjs
                - public/core-learning/**
                - public/js/core-learning/**
                - standalone/core-learning/**
                - tests/core_learning_host.test.mjs
                - tests/core_learning_page.test.mjs
                - tests/fixtures/workbench/core-learning-host.html
                - tests/fixtures/workbench/core-learning-projections.json
                - tests/test_core_learning_adapter.py
                - tests/test_tools.py
                - tests/test_workbench_runtime.py
                - tests/workbench_browser.test.mjs
                - docs/architecture-manifest.json
              read:
                - Shared/library/**
                - Shared/publication_host/**
                - Physics/library/phy-kin-2d-motion.v1.json
                - Physics/matrices/phy-kin-2d-motion.rungs.json
                - Physics/activities/**
                - public/physics/motion-2d/explorers/shared-clock/index.html
                - tests/test_core_projection_pipeline.py
                - tests/test_core_projection_contract.py
              protect:
                - Shared/library/**
                - Shared/publication_host/**
                - Physics/**
                - public/physics/**
                - agents/relay/**
              prohibit:
                - Mathematics/**
                - Chemistry/**
                - "Do not add page-local curriculum, capability, question-bank, mastery, or support-policy truth."
                - "Do not rewrite the shared-clock explorer's scientific implementation merely to fit the shell."
                - "Do not reopen Issues 162, 173 or 174 unless a generic falsifier proves a regression."
            acceptance:
              - id: AC-175-SHELL
                statement: "The existing Core learner shell is preserved and public/standalone hosts are generated from one source with equivalent projection-driven behavior."
                evidence_requirements:
                  - test: "node --test tests/core_learning_page.test.mjs tests/core_learning_host.test.mjs"
                  - test: "python -m unittest tests.test_workbench_runtime"
              - id: AC-175-PROVIDER
                statement: "Production public learner data is generated from real compiler-produced Motion Core projections rather than fixture rows, while the browser/runtime never compiles or discovers raw subject truth."
                evidence_requirements:
                  - test: "python -m unittest tests.test_core_learning_adapter"
                  - oracle: "public/core-learning/data.js declares production provider status and canonical source refs."
              - id: AC-175-CORE-SEMANTICS
                statement: "Core1A/Core1B share canonical concept identity with attempt-before-reveal only where projected; Core2A/Core2B preserve hints, scaffolds, reasoning route, crux and protected transfer decisions without pre-attempt leakage."
                evidence_requirements:
                  - test: "python -m unittest tests.test_core_learning_adapter"
                  - test: "python -m unittest tests.test_core_projection_pipeline tests.test_core_projection_contract"
              - id: AC-175-EXPLORER
                statement: "At least one existing bespoke Motion explorer is mounted through explicit generated host metadata while its scientific artifact remains unchanged and pedagogy remains supplied by Core projection state."
                evidence_requirements:
                  - test: "browser contract proves shared-clock explorer locator is mounted from provider data and remains same-origin/offline-safe."
                  - oracle: "public/physics/motion-2d/explorers/shared-clock/index.html remains protected."
              - id: AC-175-PR134
                statement: "PR 134 is explicitly dispositioned against the generated-builder boundary; it is not merged as a second page-local academic model."
                evidence_requirements:
                  - oracle: "PR 134 state/comment records the disposition and rationale."
              - id: AC-175-REPO
                statement: "Exact-head guardrails, pinned V3 validation and deterministic generated-file freshness all pass."
                evidence_requirements:
                  - test: "guardrails and v3-relay on exact PR 178 head"
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Keep the checkpointed learner shell, implement the thin compiler-to-CoreProjection production adapter for the Motion gold family, and switch generated public data from fixture-only to production rows."
              stop_conditions:
                - "Any implementation that duplicates canonical Physics truth in page-specific JavaScript or HTML must stop."
                - "Any protected Core2B decision exposed by pre-attempt scaffold or visual support must fail acceptance."
                - "Any requirement to modify delivered Shared library/compiler semantics must be split into a separate generic-regression task."
                - "Do not make Issue 163 portability concerns own the Issue 175 learner shell."
          lease:
            id: LEASE-LEARNER-175-PRODUCTION-001
            executor_id: chatgpt-sol-builder-20260922
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: builder/core-learning-pages-r1
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 178
          YAML

      - name: Admit Issue 175 production task
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . admit-task \
            --tx-id TX-ADMIT-ISS175-PRODUCTION-001 \
            --event-id EVT-ADMIT-ISS175-PRODUCTION-001 \
            --actor chatgpt-sol-builder-20260922 \
            --admission /tmp/issue-175-production.yaml \
            --base-ref origin/main

      - name: Validate admitted write authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/protocol_cutover.py . validate
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
            --path Shared/tools/core_learning_projection_adapter.py \
            --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
            --path Shared/tools/build_core_learning_data.py \
            --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py DRAFT_PR_UPDATE .

      - name: Commit native Issue 175 admission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3] Admit Issue 175 production integration"
          git push origin HEAD:builder/core-learning-pages-r1
