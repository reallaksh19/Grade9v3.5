name: IMO Index Laws subtopic homepage holds

on:
  pull_request:
    paths:
      - 'public/mathematics/number-systems/**'
      - 'docs/mathematics/number-systems/**'
      - 'docs/.pages-manifest.json'
      - 'tests/test_imo_327_index_laws_home.py'
      - '.github/workflows/imo-327-index-laws-home.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  held-homepage-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify actual subtopic routes, safe roles and complete Pages mirror
        run: python -m unittest discover -s tests -p 'test_imo_327_index_laws_home.py' -v
      - name: Verify generated Pages mirror and all relative links
        run: python Shared/tools/build_pages_site.py --check
