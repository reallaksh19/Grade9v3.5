name: core1-study-continuity

on:
  pull_request:
    paths:
      - "Shared/workbench/core1-continuity.mjs"
      - "Shared/workbench/familiar-transfer.mjs"
      - "public/js/core-learning/familiar-transfer.mjs"
      - "docs/js/core-learning/familiar-transfer.mjs"
      - "tests/familiar_transfer.test.mjs"
      - "public/js/core-learning/core1-continuity.mjs"
      - "docs/js/core-learning/core1-continuity.mjs"
      - "Shared/tools/build_core_learning_host.py"
      - "Shared/tools/build_core_learning_data.py"
      - "Shared/tools/core_learning_projection_adapter.py"
      - "public/core-learning/index.html"
      - "docs/core-learning/index.html"
      - "standalone/core-learning/index.html"
      - "public/core-learning/data.js"
      - "tests/core1_continuity.test.mjs"
      - "tests/core1_continuity_browser.mjs"
      - ".github/workflows/core1-study-continuity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-bound-study-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Both learner hosts must be exact generated bytes
        run: python Shared/tools/build_core_learning_host.py --check
      - name: Core1/A/B canonical path and negative identity tests
        run: node --test tests/core1_continuity.test.mjs tests/familiar_transfer.test.mjs
      - name: Existing Core page/host regression tests
        run: node --test tests/core_learning_host.test.mjs tests/core_learning_page.test.mjs
      - name: Existing canonical adapter delivery integrity
        run: python -m unittest tests.test_core_learning_adapter
      # Do not skip real-browser qualification when an unrelated baseline
      # adapter test is red. Its preceding step still fails the overall job.
      - name: Install pinned Chromium harness
        if: ${{ !cancelled() }}
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser route, independent reconstruction gate and assistance marker
        if: ${{ !cancelled() }}
        run: node tests/core1_continuity_browser.mjs
