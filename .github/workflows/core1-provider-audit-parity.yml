name: core1-provider-audit-parity

on:
  push:
    branches:
      - "fix/326-core1-live-audit-parity"
  pull_request:
    paths:
      - "tests/test_core_learning_adapter.py"
      - "Shared/library/core1_orientation.py"
      - "Shared/tools/build_core_learning_data.py"
      - "docs/core1-orientation-report.json"
      - ".github/workflows/core1-provider-audit-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-adapter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate exact head
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full canonical Core provider and live-audit tests
        run: python -m unittest tests.test_core_learning_adapter -v
