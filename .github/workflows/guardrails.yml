name: guardrails

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: pip install --quiet jsonschema

      # Proves the guard detects a planted violation. Without this a guard that
      # scanned nothing would pass vacuously.
      - name: Topic independence guard — self-test
        run: python3 Shared/tools/topic_independence_guard.py --selftest

      - name: Topic independence guard — scan engine and tooling
        run: python3 Shared/tools/topic_independence_guard.py

      # Heavy-graphical support routes are governed separately from the academic graph.
      # The guard validates their design contract, semantic-leaf/capability bindings,
      # honest conformance status and implementation locator without granting human review.
      - name: Graphical cognitive deconstruction contracts are valid
        run: python3 Shared/tools/explorer_design_guard.py --enforce

      # Execute each governed explorer's inline JS in a DOM-lite Node runtime, mutate
      # controls, verify causal handlers/reset behavior, and reject runtime claims that
      # overstate what the artifact actually does. This is not visual/browser-layout proof.
      - name: GCDR runtime integrity claims are honest
        run: python3 Shared/tools/gcdr_runtime_audit.py --enforce

      # Subject-owned numerical/model falsifiers remain separate from the generic GCDR
      # tooling so shared governance never hard-codes projectile physics.
      - name: Motion2D GCDR scientific invariants hold
        run: python3 Physics/tools/motion2d_gcdr_properties.py --enforce

      # A role spec may not require content the schema has nowhere to keep. Enforcing:
      # the 68 findings this first reported are closed, 28 by correcting the spec's path
      # and 40 by adding the field. It is its own step rather than part of the subject
      # sweep because the specs and the schema are shared -- running it per subject would
      # report one shared finding three times and attribute it to a subject that has no
      # say in it.
      - name: Role specs resolve against the library schema
        run: python3 Shared/tools/spec_conformance.py --enforce

      # A claim about a learner must be backed by what was seen, or say it is a waiver.
      # Enforcing from the start: the store landed with its gate, and both committed
      # profiles are waiver-backed with a null percentage, which is the honest value.
      - name: Learner claims are backed by evidence or a waiver
        run: python3 Shared/tools/learner_evidence.py --enforce

      # Regression and empirical acceptance are deliberately separate evidence layers.
      # The blueprint test is enforcing; the empirical audit treats missing live evidence
      # as PENDING and fails only malformed evidence that claims LIVE_LEARNER provenance.
      - name: Blueprint architecture regression
        run: python3 -m unittest discover -s tests -p "test_blueprint_regression.py" -v

      - name: Empirical learner acceptance status
        run: python3 Shared/tools/empirical_acceptance.py --enforce

      # A matrix may reference the library and may not restate or outrank it. Enforcing
      # from the start: it has no backlog, because the schema and the gate landed before
      # any matrix data did.
      - name: Matrices reference the library without restating it
        run: python3 Shared/tools/matrix_conformance.py --enforce

      - name: Requests resolve to a plan, or refuse with a reason
        run: python3 Shared/tools/resolve_request.py --enforce

      # Acquisition metadata is content-addressed. External availability is not part of
      # CI: committed acquisitions must verify against their pinned local snapshot when
      # one is retained, while URL fetching itself stays an explicit runtime action.
      - name: Source acquisitions remain digest-pinned
        run: python3 Shared/tools/source_pipeline.py audit --enforce

      # Source coverage is evidence, not a request field. A receipt may preserve an
      # inspection fact while still reporting insufficient custody; authored questions
      # can never establish Core2 source custody.
      - name: Source inspection receipts prove their custody claims
        run: python3 Shared/tools/source_receipts.py --audit --enforce

      # A short third-agent request is allowed to be incomplete: the plan must derive
      # what the repository owns and return only the owner decisions that remain.
      - name: Cold-agent authoring requests resolve without guessing
        run: python3 Shared/tools/plan_request.py --audit --enforce

      # Every owner question emitted by the planner must have a typed, stale-safe
      # application path. Adding a new REQUIRED_OWNER_INPUT without an applier fails CI.
      - name: Planner owner inputs have executable decision handlers
        run: python3 Shared/tools/apply_owner_decisions.py --audit --enforce

      # A resolved plan becomes a pinned per-Core work packet. The packet may be partial:
      # unrelated work continues while a source or owner decision holds one Core.
      - name: Third-agent execution packets are current and internally consistent
        run: python3 Shared/tools/compile_execution_packet.py --audit --enforce

      # Every runnable execution-packet write scope must be enforceable by the authoring
      # runner. Candidate records and product outputs have separate, fail-closed paths.
      - name: Authoring run write scopes are enforceable
        run: python3 Shared/tools/execute_authoring_run.py --audit --enforce

      # REVIEWED/CURATED are authority claims, not editable labels. Every committed
      # current-stage promotion receipt must still verify against the exact record digest.
      - name: Review and curation receipts remain digest-authoritative
        run: python3 Shared/tools/review_authority.py --audit --enforce

      # Learner release is an external, recomputable authority receipt. Publication
      # manifests remain release_authorized=false and cannot self-grant approval.
      - name: Final learner-release receipts remain current
        run: python3 Shared/tools/release_authority.py --audit --enforce

      # Mechanical academic-review prerequisites are measurable. Human scientific and
      # pedagogical approval is not; report that state explicitly rather than turning
      # a green CI check into a fake review.
      - name: Academic review readiness report
        run: python3 Shared/tools/academic_readiness.py

      - name: No ceiling forbids the word its own rung teaches
        run: python3 Shared/tools/ceiling_audit.py --enforce

      - name: Every published run declares what it was built from
        run: python3 Shared/tools/publication_provenance.py --enforce

      - name: Committed publications still verify against their inputs
        run: python3 Shared/tools/republish.py

      # A library may not invent a way of depicting its subject, and a figure bound to
      # mathematics must say which part of the picture is which symbol. Runs inside the
      # subject sweep below; this step is the standalone report, which names the record
      # rather than only failing the sweep.
      - name: Representations are backed by their subject's contract
        run: python3 Shared/library/depiction.py --enforce

      # Every path a role spec requires must survive compilation. Enforcing: the
      # compiler now drops nothing the library holds. The paths nobody has authored yet
      # are reported as a named backlog and do not fail this step, because a backlog
      # that fails the build gets the build switched off rather than the backlog closed.
      - name: Requirements survive compilation
        run: python3 Shared/tools/spec_delivery.py --enforce --summary

      # One tested module, not a workflow heredoc: subject discovery is protected by
      # the suite, so CI cannot quietly go back to checking a single named subject.
      - name: Every subject's contract, gate registries and library
        run: python3 Shared/tools/check_subjects.py

      # A contract may not claim a capability nothing backs. Enforcing now that the
      # backlog it found is closed, so the claim and the code cannot drift apart again.
      - name: Contract claims are backed by code
        run: python3 Shared/tools/capability_audit.py --enforce

      # Render the expected architecture index as an artifact without modifying the
      # checkout. This makes drift repair inspectable while the following --check remains
      # read-only and still fails when the committed artifact is stale.
      - name: Render generated-artifact previews
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from Shared.tools import build_manifest, build_web_data
          Path("/tmp/architecture-manifest.json").write_text(
              json.dumps(build_manifest.collect(), indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          Path("/tmp/data.js").write_text(
              build_web_data.render(build_web_data.build()),
              encoding="utf-8",
          )
          PY

      - name: Upload generated-artifact previews
        uses: actions/upload-artifact@v4
        with:
          name: generated-artifact-preview
          path: |
            /tmp/architecture-manifest.json
            /tmp/data.js

      # --check compares the generated data file and the manifest without writing
      # either, so it covers both artifacts and leaves the checkout untouched.
      - name: Generated artifacts have not drifted
        run: python3 Shared/tools/build_manifest.py --check

      - name: Tests (engine port, gate falsifiers, library, compilation, tooling)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: All JSON parses
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          bad = []
          for path in sorted(Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all JSON documents parse")
          PY
