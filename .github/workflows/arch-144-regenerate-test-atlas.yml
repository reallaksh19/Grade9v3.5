name: arch-144-regenerate-test-atlas

on:
  push:
    branches:
      - "fix/144-test-atlas-generator"
    paths:
      - ".github/workflows/arch-144-regenerate-test-atlas.yml"
      - "Shared/web/atlas-sandbox-transform.v1.json"
      - "Shared/tools/build_test_site.py"
      - "tests/test_test_atlas_transform.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/144-test-atlas-generator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet jsonschema
      - name: Generate TEST site from governed producer
        run: |
          python3 Shared/tools/build_test_site.py
          CHANGED="$(git diff --name-only -- public/test)"
          printf '%s\n' "$CHANGED"
          EXPECTED="$(printf '%s\n' public/test/atlas/index.html public/test/deployments/index.html public/test/rungs/index.html)"
          test "$CHANGED" = "$EXPECTED"
      - name: Mirror Atlas through Pages publication transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from Shared.tools import build_pages_site
          repo = Path.cwd()
          for relative in ("test/atlas/index.html", "test/deployments/index.html", "test/rungs/index.html"):
              public = repo / "public" / relative
              docs = repo / "docs" / relative
              docs.write_bytes(build_pages_site._public_payload(relative, public.read_bytes()))
          PY
          python3 Shared/tools/build_test_site.py --check
      - name: Commit governed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/test/atlas/index.html public/test/deployments/index.html public/test/rungs/index.html \
            docs/test/atlas/index.html docs/test/deployments/index.html docs/test/rungs/index.html
          git commit -m "build(test): regenerate Atlas from current template"
          git push origin HEAD:fix/144-test-atlas-generator
