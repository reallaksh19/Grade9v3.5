name: v3-author-issue-175-production

on:
  push:
    branches:
      - builder/core-learning-pages-r1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
        with:
          ref: builder/core-learning-pages-r1
          fetch-depth: 0

      - name: Fetch current main and shell backup
        run: |
          git fetch origin main:refs/remotes/origin/main
          git fetch origin backup/pr178-pre-v3-restack:refs/remotes/origin/backup/pr178-pre-v3-restack

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Prove material-write authority
        run: |
          for path in \
            Shared/tools/core_learning_projection_adapter.py \
            Shared/tools/build_core_learning_data.py \
            Shared/tools/build_core_learning_host.py \
            Shared/tools/build_manifest.py \
            Shared/tools/topic_independence_allowlist.json \
            tests/test_core_learning_adapter.py \
            tests/workbench_browser.test.mjs \
            docs/architecture-manifest.json
          do
            python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . \
              --path "$path" --base-ref origin/main
          done

      - name: Author generic compiler-to-CoreProjection adapter
        run: |
          cat > Shared/tools/core_learning_projection_adapter.py <<'PY'
          """Adapt compiler output plus canonical records to the learner CoreProjection envelope.

          This module is a provider-side adapter. It does not own academic truth: concepts,
          questions, representations, reveal stages and explorer locators are read from the
          same canonical records the compiler consumed. Browser/runtime code receives only
          the resulting explicit projection rows.
          """
          from __future__ import annotations

          from copy import deepcopy
          from typing import Any

          CORE_ORDER = ("CORE1A", "CORE1B", "CORE2A", "CORE2B")


          class CoreLearningProjectionAdapterError(ValueError):
              pass


          def _require(condition: bool, code: str, detail: str = "") -> None:
              if not condition:
                  raise CoreLearningProjectionAdapterError(f"{code}: {detail}" if detail else code)


          def _products(compiled: dict) -> dict[str, dict]:
              return {row["core"]: row for row in (compiled.get("plan") or {}).get("products", [])}


          def _question_blocks(product: dict | None) -> list[dict]:
              if not product:
                  return []
              return [
                  block
                  for unit in product.get("units", [])
                  for block in unit.get("blocks", [])
                  if block.get("kind") == "QUESTION"
              ]


          def _initial_stage(records: dict, representation_ref: str | None) -> str | None:
              if not representation_ref:
                  return None
              rep = records.get(representation_ref) or {}
              for row in rep.get("support_stage_map") or []:
                  if row.get("support_level") == "low":
                      return row.get("visual_stage_ref")
              stages = rep.get("reveal_stages") or []
              return stages[0].get("id") if stages else None


          def _explorer_locator(records: dict, representation_ref: str | None) -> str | None:
              if not representation_ref:
                  return None
              rep = records.get(representation_ref) or {}
              for ref in rep.get("interactive_resource_refs") or []:
                  resource = records.get(ref) or {}
                  locator = resource.get("locator")
                  if isinstance(locator, str) and locator:
                      return locator
              return None


          def _concept(records: dict, microtopic_ref: str, *, eliciting: bool) -> dict:
              row = records[microtopic_ref]
              elicitation = row.get("elicitation") or {}
              predict = elicitation.get("predict") or {}
              return {
                  "microtopic_ref": row["id"],
                  "inferential_jump": row["inferential_jump"],
                  "teaching_path": deepcopy(row.get("teaching_path") or []),
                  "elicitation": (
                      {"prompt": predict["prompt"]}
                      if eliciting and isinstance(predict.get("prompt"), str) and predict["prompt"]
                      else None
                  ),
                  "misconceptions": deepcopy(row.get("misconceptions") or []),
                  "representation_refs": list(row.get("representation_refs") or []),
              }


          def _first_route_representation(block: dict) -> str | None:
              for move in (block.get("answer") or {}).get("reasoning_route") or []:
                  ref = move.get("representation_ref")
                  if isinstance(ref, str) and ref:
                      return ref
              return None


          def _application(block: dict) -> dict:
              answer = block.get("answer") or {}
              return {
                  "question_ref": block["source_question_id"],
                  "family_ref": block["family"],
                  "stem": block["stem"],
                  "reasoning_route": deepcopy(answer.get("reasoning_route") or []),
                  "crux_move_ref": answer.get("crux_move_ref"),
                  "hints": deepcopy(block.get("hints") or []),
                  "scaffolds": deepcopy(block.get("scaffolds") or []),
                  "transfer": deepcopy(block.get("transfer")) if block.get("transfer") else None,
                  "check": answer.get("check") or "",
              }


          def _row_id(subject: str, source_ref: str, core: str) -> str:
              safe_subject = subject.lower().replace(" ", "-")
              return f"{safe_subject}:{source_ref.lower()}:{core.lower()}"


          def _projection(
              *,
              core: str,
              concept: dict,
              application: dict | None,
              records: dict,
              initial_representation_ref: str | None,
          ) -> dict:
              transfer = (application or {}).get("transfer") or {}
              protected = transfer.get("protected_move_ref")
              return {
                  "contract_version": "1.0",
                  "core": core,
                  "concept": deepcopy(concept),
                  "application": deepcopy(application),
                  "presentation": {
                      "attempt_before_reveal": core in {"CORE1B", "CORE2B"},
                      "show_full_construction": core == "CORE1A",
                      "initial_visual_ref": initial_representation_ref,
                      "initial_visual_stage_ref": _initial_stage(records, initial_representation_ref),
                      "protected_move_refs": [protected] if protected else [],
                  },
              }


          def _candidate_pairs(compiled: dict) -> list[tuple[dict, dict]]:
              products = _products(compiled)
              familiar = [
                  row for row in _question_blocks(products.get("CORE2A"))
                  if (row.get("answer") or {}).get("reasoning_route")
                  and (row.get("answer") or {}).get("crux_move_ref")
              ]
              transfers = [
                  row for row in _question_blocks(products.get("CORE2B"))
                  if (row.get("transfer") or {}).get("protected_move_ref")
                  and (row.get("answer") or {}).get("reasoning_route")
              ]
              pairs = []
              for transfer in transfers:
                  builds_on = set((transfer.get("transfer") or {}).get("builds_on") or [])
                  for base in familiar:
                      if (
                          base.get("source_question_id") in builds_on
                          and base.get("family") == transfer.get("family")
                      ):
                          pairs.append((base, transfer))
              return pairs


          def _concept_for_pair(compiled: dict, records: dict, familiar: dict) -> str | None:
              rep_ref = _first_route_representation(familiar)
              candidates = []
              for ref in (compiled.get("derived_from") or {}).get("microtopics") or []:
                  row = records.get(ref) or {}
                  if (
                      rep_ref in (row.get("representation_refs") or [])
                      and row.get("elicitation")
                      and _explorer_locator(records, rep_ref)
                  ):
                      candidates.append(ref)
              return candidates[0] if candidates else None


          def adapt_compiled_bucket(compiled: dict, records: dict, *, subject: str) -> list[dict]:
              """Return production learner rows for compiler-backed parent/transfer pairs."""
              products = _products(compiled)
              if not all(core in products for core in CORE_ORDER):
                  return []

              rows: list[dict[str, Any]] = []
              for familiar, transfer in _candidate_pairs(compiled):
                  microtopic_ref = _concept_for_pair(compiled, records, familiar)
                  if not microtopic_ref:
                      continue
                  concept_a = _concept(records, microtopic_ref, eliciting=False)
                  concept_b = _concept(records, microtopic_ref, eliciting=True)
                  concept_rep = (concept_a.get("representation_refs") or [None])[0]

                  pair_rows = [
                      ("CORE1A", microtopic_ref, concept_a, None, concept_rep),
                      ("CORE1B", microtopic_ref, concept_b, None, concept_rep),
                      (
                          "CORE2A",
                          familiar["source_question_id"],
                          concept_a,
                          _application(familiar),
                          _first_route_representation(familiar) or concept_rep,
                      ),
                      (
                          "CORE2B",
                          transfer["source_question_id"],
                          concept_a,
                          _application(transfer),
                          _first_route_representation(transfer) or concept_rep,
                      ),
                  ]
                  for core, source_ref, concept, application, initial_rep in pair_rows:
                      locator = _explorer_locator(records, initial_rep)
                      projection = _projection(
                          core=core,
                          concept=concept,
                          application=application,
                          records=records,
                          initial_representation_ref=initial_rep,
                      )
                      rows.append({
                          "id": _row_id(subject, source_ref, core),
                          "subject": subject,
                          "source_ref": source_ref,
                          "projection": projection,
                          "scene_ref": None,
                          "adapter_ref": None,
                          "injection_refs": [],
                          "explorer_locator": locator,
                      })

              unique = {}
              for row in rows:
                  unique[row["id"]] = row
              return sorted(
                  unique.values(),
                  key=lambda row: (
                      row["subject"],
                      row["source_ref"],
                      CORE_ORDER.index(row["projection"]["core"]),
                  ),
              )
          PY

      - name: Switch generated learner data to canonical compiler provider
        run: |
          cat > Shared/tools/build_core_learning_data.py <<'PY'
          #!/usr/bin/env python3
          """Generate learner CoreProjection rows from canonical compiler output."""
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          REPO = Path(__file__).resolve().parents[2]
          if str(REPO) not in sys.path:
              sys.path.insert(0, str(REPO))

          from Shared.contracts import ContractError
          from Shared.library.compile_inputs import compile_bucket
          from Shared.library.resolve import build_index, load_packages
          from Shared.tools.core_learning_projection_adapter import adapt_compiled_bucket

          OUT = REPO / "public" / "core-learning" / "data.js"


          def subjects() -> list[str]:
              return sorted(p.parent.parent.name for p in REPO.glob("*/adapter/CoreContracts.json"))


          def _subject_rows(subject: str) -> list[dict]:
              paths = sorted((REPO / subject / "library").glob("*.json"))
              if not paths:
                  return []
              records = build_index(load_packages(paths))
              bucket_ids = sorted(
                  row["id"]
                  for row in records.values()
                  if isinstance(row, dict) and row.get("_collection") == "buckets"
              )
              rows = []
              for bucket_id in bucket_ids:
                  try:
                      compiled = compile_bucket(
                          records,
                          bucket_id,
                          topic_id=f"CORE-LEARNER-{bucket_id}",
                          title=records[bucket_id]["title"],
                          subject=subject,
                          practice_control={"mode": "DESIGN_PREVIEW", "purpose": "PRACTICE"},
                      )
                  except ContractError:
                      continue
                  rows.extend(adapt_compiled_bucket(compiled, records, subject=subject))
              return rows


          def build() -> dict:
              rows = []
              for subject in subjects():
                  rows.extend(_subject_rows(subject))
              rows.sort(key=lambda row: row["id"])
              return {
                  "generated_by": "Shared/tools/build_core_learning_data.py",
                  "provider_status": "PRODUCTION_COMPILED_CANONICAL",
                  "provider": {
                      "mode": "CANONICAL_LIBRARY_TO_COMPILE_BUCKET_TO_CORE_PROJECTION",
                      "contract_version": "1.0",
                  },
                  "core_projections": rows,
              }


          def render(payload: dict) -> str:
              return (
                  "// Generated by Shared/tools/build_core_learning_data.py -- do not edit by hand.\n"
                  "window.GRADE9V3_CORE = "
                  + json.dumps(payload, indent=2, ensure_ascii=False)
                  + ";\n"
              )


          def rendered_file() -> dict[str, bytes]:
              return {OUT.relative_to(REPO).as_posix(): render(build()).encode("utf-8")}


          def write() -> dict:
              payload = build()
              OUT.parent.mkdir(parents=True, exist_ok=True)
              OUT.write_text(render(payload), encoding="utf-8", newline="\n")
              return payload


          def main() -> int:
              payload = write()
              print(
                  f"wrote {OUT.relative_to(REPO)}: "
                  f"{len(payload['core_projections'])} canonical compiler projection(s)"
              )
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Generate one neutral host with canonical explorer mounting
        run: |
          cat > Shared/tools/build_core_learning_host.py <<'PY'
          #!/usr/bin/env python3
          """Generate public and standalone Core learner hosts from one neutral template."""
          from __future__ import annotations

          import argparse
          from pathlib import Path

          REPO = Path(__file__).resolve().parents[2]

          HOSTS = {
              "public/core-learning/index.html": {
                  "data_src": "./data.js",
                  "runtime_base": "../js/core-learning",
              },
              "standalone/core-learning/index.html": {
                  "data_src": "../../public/core-learning/data.js",
                  "runtime_base": "../../public/js/core-learning",
              },
          }

          TEMPLATE = r'''<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Core learner</title>
            <style>
              :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
              body{margin:0;padding:1rem} main{max-width:72rem;margin:0 auto;display:grid;gap:1rem}
              .chooser,.explorer-panel{display:grid;gap:.5rem;border:1px solid currentColor;border-radius:.75rem;padding:1rem}
              .chooser-row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:end}
              label{display:grid;gap:.35rem;min-width:min(100%,28rem);flex:1}
              select,button{font:inherit;min-height:2.75rem} button{padding:.5rem .85rem}
              [data-status]{margin:0}.explorer-frame{width:100%;min-height:30rem;border:1px solid currentColor;border-radius:.5rem;background:Canvas}
              [hidden]{display:none!important}
              @media (max-width:36rem){body{padding:.5rem}.chooser,.explorer-panel{padding:.75rem}.explorer-frame{min-height:36rem}}
            </style>
          </head>
          <body>
            <main>
              <section class="chooser" aria-labelledby="projection-title">
                <h1 id="projection-title">Core learner</h1>
                <div class="chooser-row">
                  <label>
                    Compiled learning activity
                    <select id="projection-select" aria-describedby="projection-status"></select>
                  </label>
                  <button id="load-projection" type="button">Load</button>
                </div>
                <p id="projection-status" data-status role="status" aria-live="polite"></p>
              </section>
              <section class="explorer-panel" id="explorer-panel" aria-labelledby="explorer-title" hidden>
                <h2 id="explorer-title">Interactive scientific representation</h2>
                <iframe id="explorer-frame" class="explorer-frame" title="Interactive scientific representation"></iframe>
              </section>
              <core-learning-page id="learner"></core-learning-page>
            </main>

            <script src="__CORE_DATA_SRC__"></script>
            <script type="module">
              import "__CORE_RUNTIME_BASE__/semantic-workbench.mjs";
              import "__CORE_RUNTIME_BASE__/core-learning-page.mjs";
              import { mountCoreLearningPage } from "__CORE_RUNTIME_BASE__/core-learning-host.mjs";

              const data = window.GRADE9V3_CORE;
              const rows = Array.isArray(data?.core_projections) ? data.core_projections : [];
              const learner = document.getElementById("learner");
              const select = document.getElementById("projection-select");
              const loadButton = document.getElementById("load-projection");
              const status = document.getElementById("projection-status");
              const explorerPanel = document.getElementById("explorer-panel");
              const explorerFrame = document.getElementById("explorer-frame");
              const registries = window.CORE_LEARNING_REGISTRIES || {};

              function labelFor(row) {
                const core = row?.projection?.core || "Core";
                const source = row?.source_ref || row?.id || "activity";
                return [row?.subject, core, source].filter(Boolean).join(" · ");
              }

              function setStatus(message) { status.textContent = message; }

              function explorerUrl(locator) {
                if (typeof locator !== "string" || !locator.startsWith("public/") || locator.includes("..")) return null;
                return new URL("../../" + locator, window.location.href).href;
              }

              function mountExplorer(row) {
                const url = explorerUrl(row?.explorer_locator);
                explorerPanel.hidden = !url;
                if (url) explorerFrame.src = url;
                else explorerFrame.removeAttribute("src");
              }

              function mount(id, { updateUrl = true } = {}) {
                try {
                  const row = rows.find((item) => item.id === id);
                  const result = mountCoreLearningPage(learner, data, id, registries);
                  select.value = result.id;
                  mountExplorer(row);
                  setStatus(`Loaded ${labelFor(row)}.`);
                  if (updateUrl) {
                    const url = new URL(window.location.href);
                    url.searchParams.set("projection", result.id);
                    history.replaceState(null, "", url);
                  }
                } catch (error) {
                  const code = error?.code || error?.name || "CORE_LEARNING_LOAD_FAILED";
                  setStatus(`Unable to load activity: ${code}.`);
                }
              }

              for (const row of rows) {
                if (!row || typeof row.id !== "string" || !row.id) continue;
                const option = document.createElement("option");
                option.value = row.id;
                option.textContent = labelFor(row);
                select.append(option);
              }

              if (!select.options.length) {
                select.disabled = true;
                loadButton.disabled = true;
                setStatus("No compiled Core learner projections are available in this generated data build.");
              } else {
                loadButton.addEventListener("click", () => mount(select.value));
                select.addEventListener("change", () => setStatus(`Selected ${labelFor(rows.find((row) => row.id === select.value))}.`));
                const requested = new URL(window.location.href).searchParams.get("projection");
                if (requested && rows.some((row) => row.id === requested)) mount(requested, { updateUrl: false });
                else if (requested) {
                  select.value = rows[0].id;
                  setStatus("Requested projection was not found. Select an available compiled activity.");
                } else mount(rows[0].id);
              }

              window.__coreLearningStaticHostReady = true;
            </script>
          </body>
          </html>
          '''


          def render_host(*, data_src: str, runtime_base: str) -> bytes:
              rendered = TEMPLATE.replace("__CORE_DATA_SRC__", data_src).replace("__CORE_RUNTIME_BASE__", runtime_base)
              if "__CORE_DATA_SRC__" in rendered or "__CORE_RUNTIME_BASE__" in rendered:
                  raise ValueError("CORE_LEARNING_HOST_TEMPLATE_UNRESOLVED")
              return rendered.encode("utf-8")


          def render() -> dict[str, bytes]:
              return {
                  relative: render_host(data_src=config["data_src"], runtime_base=config["runtime_base"])
                  for relative, config in HOSTS.items()
              }


          def write() -> dict[str, bytes]:
              rendered = render()
              for relative, content in rendered.items():
                  path = REPO / relative
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
              return rendered


          def main() -> int:
              parser = argparse.ArgumentParser(description="Generate or verify Core learner hosts")
              parser.add_argument("--check", action="store_true")
              args = parser.parse_args()
              rendered = render()
              if args.check:
                  stale = [
                      relative for relative, content in rendered.items()
                      if not (REPO / relative).is_file() or (REPO / relative).read_bytes() != content
                  ]
                  for relative in stale:
                      print(f"generated file is stale: {relative}")
                  return 1 if stale else 0
              write()
              for relative in sorted(rendered): print(f"wrote {relative}")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

      - name: Restore proven deterministic shell generation integration
        run: |
          git show origin/backup/pr178-pre-v3-restack:Shared/tools/build_manifest.py > Shared/tools/build_manifest.py
          git show origin/backup/pr178-pre-v3-restack:Shared/tools/topic_independence_allowlist.json > Shared/tools/topic_independence_allowlist.json

      - name: Add production adapter tests
        run: |
          cat > tests/test_core_learning_adapter.py <<'PY'
          from __future__ import annotations

          import json
          import unittest
          from pathlib import Path

          from Shared.tools import build_core_learning_data

          REPO = Path(__file__).resolve().parents[1]
          MOTION = REPO / "Physics/library/phy-kin-2d-motion.v1.json"
          FAMILIAR = "Q-PHY-KIN-2D-2A-HORIZONTAL-LAUNCH-04"
          TRANSFER = "Q-PHY-KIN-2D-2B-PROJECTILE-VALIDITY-04"
          CONCEPT = "MIC-PHY-KIN-2D-INDEPENDENT-COMPONENTS"


          class CoreLearningProductionAdapter(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.payload = build_core_learning_data.build()
                  cls.rows = cls.payload["core_projections"]
                  cls.package = json.loads(MOTION.read_text(encoding="utf-8"))

              def row(self, *, core=None, source=None, concept=None):
                  matches = [
                      row for row in self.rows
                      if (core is None or row["projection"]["core"] == core)
                      and (source is None or row["source_ref"] == source)
                      and (
                          concept is None
                          or (row["projection"].get("concept") or {}).get("microtopic_ref") == concept
                      )
                  ]
                  self.assertEqual(len(matches), 1, [row["id"] for row in matches])
                  return matches[0]

              def test_public_provider_is_compiler_backed_not_fixture_backed(self):
                  self.assertEqual(self.payload["provider_status"], "PRODUCTION_COMPILED_CANONICAL")
                  self.assertTrue(self.rows)
                  self.assertFalse(any(row["id"].startswith("fixture:") for row in self.rows))
                  self.assertEqual(
                      self.payload["provider"]["mode"],
                      "CANONICAL_LIBRARY_TO_COMPILE_BUCKET_TO_CORE_PROJECTION",
                  )

              def test_core1_pair_shares_concept_but_changes_reveal_policy(self):
                  a = self.row(core="CORE1A", concept=CONCEPT)
                  b = self.row(core="CORE1B", concept=CONCEPT)
                  self.assertEqual(a["projection"]["concept"]["microtopic_ref"], CONCEPT)
                  self.assertEqual(a["projection"]["concept"]["inferential_jump"], b["projection"]["concept"]["inferential_jump"])
                  self.assertFalse(a["projection"]["presentation"]["attempt_before_reveal"])
                  self.assertTrue(a["projection"]["presentation"]["show_full_construction"])
                  self.assertTrue(b["projection"]["presentation"]["attempt_before_reveal"])
                  self.assertFalse(b["projection"]["presentation"]["show_full_construction"])
                  self.assertTrue(b["projection"]["concept"]["elicitation"]["prompt"])

              def test_core2a_preserves_real_reasoning_crux_hints_and_scaffolds(self):
                  row = self.row(core="CORE2A", source=FAMILIAR)
                  source = next(q for q in self.package["questions"] if q["id"] == FAMILIAR)
                  app = row["projection"]["application"]
                  self.assertEqual(app["reasoning_route"], source["answer"]["reasoning_route"])
                  self.assertEqual(app["crux_move_ref"], source["answer"]["crux_move_ref"])
                  self.assertEqual(app["hints"], source["hints"])
                  self.assertEqual(app["scaffolds"], source["scaffolds"])
                  self.assertEqual(app["check"], source["answer"]["check"])

              def test_core2b_preserves_protected_transfer_without_scaffold_leak(self):
                  row = self.row(core="CORE2B", source=TRANSFER)
                  source = next(q for q in self.package["questions"] if q["id"] == TRANSFER)
                  app = row["projection"]["application"]
                  protected = source["transfer"]["protected_move_ref"]
                  self.assertEqual(app["transfer"], source["transfer"])
                  self.assertEqual(app["crux_move_ref"], protected)
                  self.assertEqual(row["projection"]["presentation"]["protected_move_refs"], [protected])
                  self.assertFalse(any(s["supports_move_ref"] == protected for s in app["scaffolds"]))

              def test_shared_clock_explorer_is_resolved_from_canonical_resource(self):
                  row = self.row(core="CORE2A", source=FAMILIAR)
                  self.assertEqual(
                      row["explorer_locator"],
                      "public/physics/motion-2d/explorers/shared-clock/index.html",
                  )
