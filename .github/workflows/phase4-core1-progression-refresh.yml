name: phase4-core1-progression-refresh

on:
  push:
    branches:
      - audit/core1-progression-phase4

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-core1-progression-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core1-progression-phase4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Generate cross-Core1 evidence and derived artifacts
        run: |
          python3 -m Shared.library.core1_orientation \
            --write-report docs/core1-orientation-report.json
          python3 -m Shared.library.core1_progression \
            --write-report docs/core1-progression-report.json \
            --write-baseline docs/core1-progression-baseline.json
          python3 Shared/tools/build_manifest.py
      - name: Commit exact generator output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[phase4-core1-progression-refresh] Generate cross-Core1 evidence"
          git push origin HEAD:audit/core1-progression-phase4
