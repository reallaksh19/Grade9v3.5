name: phase5-core1-delivery-refresh

on:
  push:
    branches:
      - audit/core1-delivery-phase5

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[phase5-core1-delivery-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core1-delivery-phase5
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Run focused Core1-family delivery falsifiers
        run: |
          python3 -m unittest tests.test_core_learning_adapter
          node --test tests/core_learning_page.test.mjs
      - name: Regenerate governed artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit exact generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[phase5-core1-delivery-refresh] Regenerate learner delivery artifacts"
          git push origin HEAD:audit/core1-delivery-phase5
