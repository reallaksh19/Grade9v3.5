name: test-160-regenerate-hub

on:
  push:
    branches:
      - "test/160-q1-derivative"
    paths:
      - ".github/workflows/test-160-regenerate-hub.yml"
      - "TEST/question-bank/*.json"
      - "tests/test_test_verified_q1_derivative.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/160-q1-derivative
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet jsonschema
      - name: Regenerate governed TEST hub only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from Shared.tools import build_pages_site, build_test_site
          repo = Path.cwd()
          public_target = repo / "public" / "test" / "index.html"
          docs_target = repo / "docs" / "test" / "index.html"
          payload = build_test_site.hub_page().encode("utf-8")
          public_target.write_bytes(payload)
          docs_target.write_bytes(build_pages_site._public_payload("test/index.html", payload))
          PY
      - name: Commit governed hub bytes
        run: |
          if git diff --quiet -- public/test/index.html docs/test/index.html; then
            echo "TEST hub already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/test/index.html docs/test/index.html
          git commit -m "build(test): project verified derivative count"
          git push origin HEAD:test/160-q1-derivative
