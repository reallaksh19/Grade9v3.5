name: qb-admission-generate

on:
  push:
    branches:
      - feat/admit-ncert-poly-q01-q10
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate Question Bank and TEST projections
        run: |
          python3 Shared/tools/build_question_bank_web.py
          python3 Shared/tools/build_question_bank_platform.py --write
          python3 Shared/tools/build_test_site.py
          python3 Shared/tools/build_pages_site.py || true
      - name: Upload generated admission artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qb-admission-generated-${{ github.sha }}
          if-no-files-found: error
          path: |
            public/data/question-bank-data.js
            public/data/question-bank-catalog.js
            public/data/question-bank-search.js
            public/data/question-bank-questions.js
            public/data/question-bank-resources.js
            public/data/question-bank-manifest.js
            public/data/question-bank-details/*.js
            artifacts/question-bank/dedup-report.json
            artifacts/question-bank/lineage.json
            artifacts/question-bank/build-receipt.json
            public/test/**
            docs/data/question-bank-data.js
            docs/data/question-bank-catalog.js
            docs/data/question-bank-search.js
            docs/data/question-bank-questions.js
            docs/data/question-bank-resources.js
            docs/data/question-bank-manifest.js
            docs/data/question-bank-details/*.js
            docs/test/**
