name: v3-reconcile-nlm-roadmap-complete

on:
  push:
    branches:
      - relay/v3-reconcile-nlm-roadmap-complete
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: relay/v3-reconcile-nlm-roadmap-complete
          fetch-depth: 0

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Reconcile closed NLM roadmap row
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          root = Path(".").resolve()
          scripts = root / "_common_v3/skills/engineering-pr-delivery-v3/scripts"
          sys.path.insert(0, str(scripts))

          from snapshot_projection import build as build_snapshot
          from v3lib import load_yaml

          state_path = root / "relay/STATE.yaml"
          roadmap_path = root / "relay/ROADMAP/ROADMAP.yaml"
          snapshot_path = root / "relay/GENERATED/CURRENT_SNAPSHOT.yaml"

          state = load_yaml(state_path)
          roadmap = load_yaml(roadmap_path)

          assert state["execution"]["lifecycle"] == "TERMINAL"
          assert state["accepted"]["checkpoint"] == "CP-CANONICAL-174-NLM-002"

          target = next(row for row in roadmap["work_packages"] if row["id"] == "WP-CANONICAL-174-NLM")
          assert target["state"] == "ACTIVE"

          target["state"] = "COMPLETE"
          roadmap["revision"] = "RM-V3-ISS174-NLM-003"
          state["roadmap"]["revision"] = roadmap["revision"]

          snapshot = build_snapshot(
              root,
              state_override=state,
              roadmap_override=roadmap,
          )

          state_path.write_text(yaml.safe_dump(state, sort_keys=False), encoding="utf-8")
          roadmap_path.write_text(yaml.safe_dump(roadmap, sort_keys=False), encoding="utf-8")
          snapshot_path.write_text(yaml.safe_dump(snapshot, sort_keys=False), encoding="utf-8")
          PY

      - name: Validate reconciled V3 authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/protocol_cutover.py . validate

      - name: Commit reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/STATE.yaml relay/ROADMAP/ROADMAP.yaml relay/GENERATED/CURRENT_SNAPSHOT.yaml
          git commit -m "[relay-v3] Reconcile completed NLM roadmap state"
          git push origin HEAD:relay/v3-reconcile-nlm-roadmap-complete
