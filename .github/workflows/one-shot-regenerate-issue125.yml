name: one-shot-regenerate-issue125
on:
  push:
    branches:
      - explorer/issue-125-accelerated-frames
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explorer/issue-125-accelerated-frames
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate repository-derived artifacts
        run: python3 Shared/tools/build_manifest.py
      - name: Commit generated outputs when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated drift"
            exit 0
          fi
          git commit -m "chore: regenerate issue125 derived artifacts"
          git push origin HEAD:explorer/issue-125-accelerated-frames
