name: v3-close-175-production

on:
  push:
    branches:
      - relay/v3-close-175-production
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: relay/v3-close-175-production
          fetch-depth: 0

      - name: Checkout pinned Engineering Relay V3
        uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install V3 dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Write GitHub provider readback
        run: |
          cat > /tmp/issue-175-delivery.yaml <<'YAML'
          schema_version: relay-v3-delivery-status
          authority: PROVIDER_READBACK
          vehicle:
            provider: GITHUB
            kind: PULL_REQUEST
            number: 178
          observed_at: '2026-09-22T13:54:04Z'
          provider_ref: https://github.com/reallaksh19/Grade9V3/pull/178
          lifecycle: MERGED
          checks: PASS
          review: NOT_APPLICABLE
          mergeability: NOT_APPLICABLE
          YAML

      - name: Sync merged delivery
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . sync-delivery \
            --tx-id TX-SYNC-ISS175-PRODUCTION-MERGED-001 \
            --event-id EVT-SYNC-ISS175-PRODUCTION-MERGED-001 \
            --actor chatgpt-sol-builder-20260922 \
            --observation /tmp/issue-175-delivery.yaml

      - name: Prove close authorization
        run: python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py CLOSE_TASK .

      - name: Close Issue 175 V3 task
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . close \
            --tx-id TX-CLOSE-ISS175-PRODUCTION-001 \
            --event-id EVT-CLOSE-ISS175-PRODUCTION-001 \
            --actor chatgpt-sol-builder-20260922

      - name: Validate terminal V3 authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/protocol_cutover.py . validate

      - name: Commit closeout transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3] Close Issue 175 production delivery"
          git push origin HEAD:relay/v3-close-175-production
