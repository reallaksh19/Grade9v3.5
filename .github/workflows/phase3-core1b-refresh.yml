name: phase3-core1b-refresh

on:
  push:
    branches:
      - audit/core1b-reconstruction-phase3

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[phase3-core1b-refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/core1b-reconstruction-phase3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install schema validator
        run: python -m pip install jsonschema
      - name: Generate Core1B evidence
        run: |
          python3 -m Shared.library.core1b_reconstruction \
            --write-report docs/core1b-reconstruction-report.json \
            --write-baseline docs/core1b-reconstruction-baseline.json
          python3 Shared/tools/build_manifest.py
      - name: Commit exact generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/core1b-reconstruction-report.json \
            docs/core1b-reconstruction-baseline.json \
            docs/architecture-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "[phase3-core1b-refresh] Generate Core1B reconstruction evidence"
          git push origin HEAD:audit/core1b-reconstruction-phase3
