name: v3-repair-motion-scope

on:
  push:
    branches:
      - content/issue-174-motion2d-canonical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/issue-174-motion2d-canonical
          fetch-depth: 0

      - run: git fetch origin main:refs/remotes/origin/main

      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Release superseded Motion lease
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . release-lease \
            --tx-id TX-RELEASE-ISS174-MOTION-001 \
            --event-id EVT-RELEASE-ISS174-MOTION-001 \
            --actor chatgpt-sol-canonical-20260922

      - name: Write corrected Motion admission
        run: |
          cat > /tmp/motion-admission-v2.yaml <<'YAML'
          schema_version: relay-v3-task-admission
          roadmap:
            disposition: MAPPED_EXISTING_WP
            new_revision: RM-V3-ISS174-MOTION-002
            basis:
              - "EP-CANONICAL-174-MOTION-001 correctly bounded academic scope but omitted deterministic web-data outputs required by build_manifest.py."
              - "Motion activities are embedded resources in the canonical library; there is no separate Physics/activities authority path."
              - "The authored Motion material already on PR 187 remains the material candidate; this transition only repairs execution scope."
            work_package:
              id: WP-CANONICAL-174-MOTION
              title: Deliver Motion-in-2D canonical reasoning and representation proof
              weight: 4
              state: ACTIVE
              depends_on:
                - WP-CANONICAL-174-NLM
          ep:
            schema_version: relay-v3-ep
            id: EP-CANONICAL-174-MOTION-002
            work_package: WP-CANONICAL-174-MOTION
            outcome:
              statement: "Promote canonical Motion-in-2D representations and structured familiar/transfer reasoning into the real Physics library, preserve matrix/source/activity authority, and prove delivered Core projection retains crux, scaffold and protected-transfer semantics."
            basis:
              predecessor_checkpoint: CP-CANONICAL-174-NLM-002
              material_base: 1b92a943fe0b90fc829140e63ea4121b02dfd225
              protocol_basis: "reallaksh19/Common@c87cf87b313801e42ecd0fcc7d36af0d90c5f400:skills/engineering-pr-delivery-v3"
              semantic_dependencies:
                - path: Physics/matrices/phy-kin-2d-motion.rungs.json
                  reason: "Family invariant demand, difficult move, independent check and support ladder remain academic authority."
                - path: Physics/tools/motion2d_gcdr_properties.py
                  reason: "Existing Motion explorer invariants and geometry truth remain validation authority for bound activity resources."
                - path: Shared/library
                  reason: "Delivered canonical package schema, intake, visual-support and compiler contract."
                - path: Shared/publication_host
                  reason: "Delivered Core2A/Core2B projection and protected-move publication semantics."
            scope:
              write:
                - Physics/library/phy-kin-2d-motion.v1.json
                - tests/test_motion2d_canonical.py
                - docs/architecture-manifest.json
                - tools/data.js
                - public/data/data.js
              read:
                - Physics/matrices/phy-kin-2d-motion.rungs.json
                - Physics/tools/motion2d_gcdr_properties.py
                - public/physics/motion-2d/**
                - Shared/**
                - tests/**
              protect:
                - Physics/matrices/phy-kin-2d-motion.rungs.json
                - Physics/tools/motion2d_gcdr_properties.py
                - public/physics/motion-2d/**
                - Shared/**
                - Physics/library/phy-nlm-first-law.v1.json
                - agents/relay/**
              prohibit:
                - Mathematics/**
                - Chemistry/**
                - standalone/**
            acceptance:
              - id: AC-MOTION-CANONICAL
                statement: "Three canonical Motion-in-2D representations bind existing activity resources and teaching steps, while familiar and transfer items use structured routes with stable crux moves, staged scaffolds, preserved source hints and protected transfer reasoning."
                evidence_requirements:
                  - test: "python -m unittest discover -s tests -p test_motion2d_canonical.py"
              - id: AC-MOTION-AUTHORITY
                statement: "The Motion matrix remains family-level authority; library normalization does not restate invariant-demand, difficult-move, independent-check or support-ladder fields."
                evidence_requirements:
                  - oracle: "Physics/matrices/phy-kin-2d-motion.rungs.json remains unchanged and focused tests assert matrix authority."
              - id: AC-MOTION-PIPELINE
                statement: "Delivered Core projection preserves Motion reasoning, scaffolds and protected transfer semantics and rejects protected-decision leakage."
                evidence_requirements:
                  - test: "python -m unittest tests.test_core_projection_pipeline tests.test_core_projection_contract"
              - id: AC-MOTION-REPO
                statement: "Exact-head guardrails and pinned V3 validation pass with generated architecture and web data current."
                evidence_requirements:
                  - test: "guardrails and v3-relay workflows on the exact PR 187 head"
            quality_policy:
              level: STANDARD
              independent_review: OPTIONAL
            admission_policy:
              qualification: NOT_REQUIRED
              question_policy: NONE
            next:
              first_action: "Run the focused Motion canonical falsifiers, delivered Core projection tests, deterministic data generation and exact-head guardrails."
              stop_conditions:
                - "Do not duplicate family-level matrix authority into the library."
                - "Do not change existing source hints, Motion matrix text, explorer artifacts or GCDR property authority."
                - "Do not modify delivered Shared Core code unless a generic falsifier proves a separate regression."
                - "Keep PR 187 Motion-only."
          lease:
            id: LEASE-CANONICAL-174-MOTION-002
            executor_id: chatgpt-sol-canonical-20260922
            method: DETERMINISTIC
            qualification: null
            owner_basis: null
            branch: content/issue-174-motion2d-canonical
          delivery:
            required: true
            primary_vehicle:
              provider: GITHUB
              kind: PULL_REQUEST
              number: 187
          YAML

      - name: Re-admit corrected Motion scope
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_tx.py . admit-task \
            --tx-id TX-READMIT-ISS174-MOTION-002 \
            --event-id EVT-READMIT-ISS174-MOTION-002 \
            --actor chatgpt-sol-canonical-20260922 \
            --admission /tmp/motion-admission-v2.yaml \
            --base-ref origin/main

      - name: Validate generated-output write authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . --path tools/data.js --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . --path public/data/data.js --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . --path docs/architecture-manifest.json --base-ref origin/main

      - name: Commit repaired V3 authority
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay
          git commit -m "[relay-v3] Repair Motion generated-output scope"
          git push origin HEAD:content/issue-174-motion2d-canonical
