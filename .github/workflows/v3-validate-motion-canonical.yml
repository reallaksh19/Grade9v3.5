name: v3-validate-motion-canonical

on:
  push:
    branches:
      - content/issue-174-motion2d-canonical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/issue-174-motion2d-canonical
          fetch-depth: 0

      - run: git fetch origin main:refs/remotes/origin/main

      - uses: actions/checkout@v4
        with:
          repository: reallaksh19/Common
          ref: c87cf87b313801e42ecd0fcc7d36af0d90c5f400
          path: _common_v3
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Prove V3 test and generated-output authority
        run: |
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/validate_foundation.py .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py TEST .
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . --path docs/architecture-manifest.json --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . --path tools/data.js --base-ref origin/main
          python _common_v3/skills/engineering-pr-delivery-v3/scripts/relay_can.py MATERIAL_WRITE . --path public/data/data.js --base-ref origin/main

      - name: Focused Motion canonical falsifiers
        run: python -m unittest discover -s tests -p test_motion2d_canonical.py

      - name: Delivered Core projection falsifiers
        run: python -m unittest tests.test_core_projection_pipeline tests.test_core_projection_contract

      - name: Regenerate deterministic architecture and web data
        run: python Shared/tools/build_manifest.py

      - name: Verify deterministic regeneration
        run: |
          python Shared/tools/build_manifest.py --check
          python Shared/tools/spec_delivery.py --enforce --summary

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture-manifest.json tools/data.js public/data/data.js
          if git diff --cached --quiet; then
            echo "No generated changes required."
          else
            git commit -m "build: regenerate Motion canonical web data"
            git push origin HEAD:content/issue-174-motion2d-canonical
          fi
