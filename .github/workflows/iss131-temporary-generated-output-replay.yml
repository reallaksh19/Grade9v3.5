name: ISS131 temporary source-derived TEST output regeneration
on:
  push:
    branches:
      - trial/iss131-postarch-live-reconcile-20261009
    paths:
      - .github/workflows/iss131-temporary-generated-output-replay.yml
permissions:
  contents: write
jobs:
  generate-q1-and-clean-up:
    if: github.repository == 'reallaksh19/Grade9v3.5' && github.ref == 'refs/heads/trial/iss131-postarch-live-reconcile-20261009'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install product and PDF printer dependencies
        run: |
          python3 -m pip install --quiet jsonschema pypdf
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exclude ephemeral workflow from final tracked tree
        run: git rm -- .github/workflows/iss131-temporary-generated-output-replay.yml
      - name: Verify source-derived Q1 view is unchanged
        run: python3 TEST/library/ncert_source_core2_view.py --check
      - name: Rebuild draft product and TEST pages through producers
        run: |
          python3 Shared/tools/deploy_test.py product TEST/products/ncert-u01-q01.manifest.json
          python3 Shared/tools/deploy_test.py pages
      - name: Regenerate and verify Pages
        run: |
          python3 Shared/tools/build_pages_site.py
          python3 Shared/tools/build_pages_site.py --check
          python3 Shared/tools/deploy_test.py pages --check
      - name: Retest unchanged Q1 source contract
        run: python3 -m unittest tests.test_test_ncert_source_product -v
      - name: Restrict all committed mutations to derived TEST assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- docs/.pages-manifest.json public/test docs/test .github/workflows/iss131-temporary-generated-output-replay.yml
          git diff --cached --name-only
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(["git","diff","--cached","--name-only"],text=True).splitlines()
          assert ".github/workflows/iss131-temporary-generated-output-replay.yml" in files
          assert all(p=="docs/.pages-manifest.json" or p.startswith(("public/test/","docs/test/")) or p==".github/workflows/iss131-temporary-generated-output-replay.yml" for p in files), files
          leftover=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          assert not leftover, f"non-allowlisted producer output: {leftover}"
          PY
      - name: Commit source-derived artifact changes and remove worker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(test): regenerate NCERT Q1 and Pages from current main (#131)'
          git push origin "HEAD:${{ github.ref_name }}"
