<svg aria-labelledby="title-bondq02 desc-bondq02" class="question-svg" role="img" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-size: 15px; fill: #18324a; font-family: system-ui, sans-serif; font-weight: 700; }
  .small { font-size: 13px; fill: #64748b; font-family: system-ui, sans-serif; }
  .equation { font-size: 15px; fill: #16324f; font-family: Cambria, "Times New Roman", serif; }
  .atom { font-size: 16px; font-weight: 700; font-family: system-ui, sans-serif; }
</style>
<title id="title-bondq02">Molecular Geometries: XeF4 and SF4</title>
<desc id="desc-bondq02">XeF4 is square planar with opposing bond dipoles canceling to zero net dipole, while SF4 is see-saw with non-canceling dipoles giving a net dipole moment.</desc>
<defs>
  <marker id="arr-dipole" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10">
    <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
  </marker>
</defs>
<rect fill="#fbfdff" height="258" rx="16" stroke="#dbe6f0" stroke-width="2" width="638" x="1" y="1"/>
<!-- Divider -->
<line stroke="#e2e8f0" stroke-dasharray="4 4" stroke-width="2" x1="320" x2="320" y1="20" y2="240"/>

<!-- LEFT PANEL: XeF4 -->
<text class="label" text-anchor="middle" x="160" y="32">XeF₄ (Steric No. 6: 4 bond + 2 lone pairs)</text>
<!-- Xe Central atom -->
<circle cx="160" cy="125" fill="#e0f2fe" r="22" stroke="#0284c7" stroke-width="2.5"/>
<text class="atom" fill="#0369a1" text-anchor="middle" x="160" y="131">Xe</text>
<!-- 4 F bonds (Square planar in xy) -->
<line stroke="#64748b" stroke-width="2.5" x1="138" x2="90" y1="125" y2="125"/>
<line stroke="#64748b" stroke-width="2.5" x1="182" x2="230" y1="125" y2="125"/>
<line stroke="#64748b" stroke-width="2.5" x1="160" x2="160" y1="103" y2="65"/>
<line stroke="#64748b" stroke-width="2.5" x1="160" x2="160" y1="147" y2="185"/>
<!-- Fluorine atoms -->
<circle cx="80" cy="125" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="80" y="130">F</text>
<circle cx="240" cy="125" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="240" y="130">F</text>
<circle cx="160" cy="55" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="160" y="60">F</text>
<circle cx="160" cy="195" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="160" y="200">F</text>
<!-- Lone pair lobes indication -->
<ellipse cx="120" cy="85" fill="#fef3c7" opacity="0.7" rx="14" ry="8" stroke="#d97706" transform="rotate(-30 120 85)"/>
<ellipse cx="200" cy="165" fill="#fef3c7" opacity="0.7" rx="14" ry="8" stroke="#d97706" transform="rotate(-30 200 165)"/>
<text class="small" text-anchor="middle" x="160" y="225">Square Planar · D₄ₕ symmetry</text>
<text class="equation" fill="#059669" font-weight="700" text-anchor="middle" x="160" y="245">Dipoles cancel: μ_net = 0 D</text>

<!-- RIGHT PANEL: SF4 -->
<text class="label" text-anchor="middle" x="480" y="32">SF₄ (Steric No. 5: 4 bond + 1 lone pair)</text>
<!-- S Central atom -->
<circle cx="480" cy="125" fill="#fef9c3" r="22" stroke="#ca8a04" stroke-width="2.5"/>
<text class="atom" fill="#854d0e" text-anchor="middle" x="480" y="131">S</text>
<!-- Axial F bonds -->
<line stroke="#64748b" stroke-width="2.5" x1="480" x2="480" y1="103" y2="65"/>
<line stroke="#64748b" stroke-width="2.5" x1="480" x2="480" y1="147" y2="185"/>
<circle cx="480" cy="55" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="480" y="60">F_ax</text>
<circle cx="480" cy="195" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="480" y="200">F_ax</text>
<!-- Equatorial F bonds (see-saw legs) -->
<line stroke="#64748b" stroke-width="2.5" x1="498" x2="540" y1="112" y2="90"/>
<line stroke="#64748b" stroke-width="2.5" x1="498" x2="540" y1="138" y2="160"/>
<circle cx="550" cy="85" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="550" y="90">F_eq</text>
<circle cx="550" cy="165" fill="#f1f5f9" r="14" stroke="#475569" stroke-width="2"/>
<text class="atom" fill="#334155" text-anchor="middle" x="550" y="170">F_eq</text>
<!-- Equatorial lone pair -->
<ellipse cx="435" cy="125" fill="#fef3c7" opacity="0.8" rx="16" ry="10" stroke="#d97706"/>
<circle cx="430" cy="122" fill="#d97706" r="2"/>
<circle cx="430" cy="128" fill="#d97706" r="2"/>
<text class="small" fill="#d97706" text-anchor="end" x="415" y="129">lone pair</text>
<!-- Net Dipole vector -->
<line marker-end="url(#arr-dipole)" stroke="#dc2626" stroke-linecap="round" stroke-width="2.5" x1="480" x2="525" y1="125" y2="125"/>
<text class="small" text-anchor="middle" x="480" y="225">See-Saw (Disphenoidal) · C₂ᵥ</text>
<text class="equation" fill="#dc2626" font-weight="700" text-anchor="middle" x="480" y="245">Dipoles do not cancel: μ_net ≠ 0</text>
</svg>