<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="ja20q13-title ja20q13-desc">
<title id="ja20q13-title">Uniform metre scale on two fingers moving inward</title><desc id="ja20q13-desc">A uniform metre scale is horizontal. Its centre is 50 centimetres. Initially the left finger is at 0 and the right at 90 centimetres. Both move slowly inward. Static and kinetic coefficients are 0.40 and 0.32. No solved transition is shown.</desc>
<defs><marker id="ja20q13-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">uniform metre scale · μ_s = 0.40 · μ_k = 0.32</text><rect x="30" y="104" width="360" height="34" fill="none" stroke-width="2" /><text x="28" y="92" stroke="none" >0 cm</text><text x="198" y="92" stroke="none" >50 cm</text><text x="326" y="92" stroke="none">90 cm</text><text x="378" y="92" stroke="none">100 cm</text><line x1="210" y1="100" x2="210" y2="142" stroke-width="2" /><text x="164" y="165" stroke="none" >centre of mass</text><line x1="58" y1="190" x2="132" y2="190" stroke-width="2" marker-end="url(#ja20q13-a)"/><line x1="356" y1="190" x2="282" y2="190" stroke-width="2" marker-end="url(#ja20q13-a)"/><text x="134" y="214" stroke="none" >both fingers move slowly inward</text><line x1="46" y1="138" x2="46" y2="188" stroke-width="2" /><text x="20" y="207" stroke="none" >left finger</text><line x1="354" y1="138" x2="354" y2="188" stroke-width="2" /><text x="326" y="207" stroke="none" >right finger</text></g></svg>
