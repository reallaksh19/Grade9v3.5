<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 245" role="img" aria-labelledby="i16q32-title i16q32-desc">
<title id="i16q32-title">Boxes P and Q moving together on a rough table</title><desc id="i16q32-desc">Box P is 4 kilograms with table coefficient 0.4; Q is 8 kilograms with coefficient 0.6. They remain in contact and move right at constant speed while a force F acts on P. No force is evaluated.</desc>
<defs><marker id="i16q32-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">constant speed right · boxes remain in contact</text><line x1="22" y1="188" x2="418" y2="188" stroke-width="2" /><rect x="104" y="126" width="84" height="62" fill="none" stroke-width="2" /><rect x="188" y="112" width="106" height="76" fill="none" stroke-width="2" /><text x="126" y="154" stroke="none" >P · 4 kg</text><text x="207" y="148" stroke="none" >Q · 8 kg</text><text x="94" y="214" stroke="none" >μ_k = 0.4</text><text x="226" y="214" stroke="none" >μ_k = 0.6</text><line x1="34" y1="154" x2="102" y2="154" stroke-width="2" marker-end="url(#i16q32-a)"/><text x="44" y="140" stroke="none" >F</text><line x1="318" y1="92" x2="390" y2="92" stroke-width="2" marker-end="url(#i16q32-a)"/><text x="326" y="78" stroke="none" >v constant</text></g></svg>
