<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade9V3 Portable Workbench Host</title><style>:root{--workbench-border:#64748b;--workbench-focus:#1d4ed8;--workbench-surface:#f8fafc}body{font:16px/1.45 system-ui,sans-serif;margin:0;padding:1rem}main{max-width:70rem;margin:auto}.diagnostic{white-space:pre-wrap;border:1px solid #b91c1c;padding:.75rem}</style>  <link rel="stylesheet" href="../css/tablet-12-7.css">
</head>
<body><main><h1>Grade9V3 Portable Workbench Host</h1><p id="package-label">Loading portable package...</p><semantic-workbench id="portable-workbench"></semantic-workbench><pre id="diagnostic" class="diagnostic" hidden></pre></main>
<script type="module">
import "./semantic-workbench.mjs";
import { mountPortableWorkbench } from "./portable-host.mjs";
const events=[];window.__portableEvents=events;const params=new URLSearchParams(location.search);
try{const catalog=await fetch("./catalog.json").then(r=>r.json());const requested=params.get("package");if(requested&&!catalog.packageIds.includes(requested))throw new Error("PORTABLE_PACKAGE_NOT_FOUND: "+requested);const id=requested||catalog.packageIds[0];const response=await fetch("./packages/"+id+".json");if(!response.ok)throw new Error("PORTABLE_PACKAGE_LOAD_FAILED: "+id);const pkg=await response.json();const element=document.querySelector("#portable-workbench");element.addEventListener("semantic-workbench-event",e=>events.push(e.detail));mountPortableWorkbench(element,pkg);document.querySelector("#package-label").textContent=pkg.title;window.__portablePackageId=pkg.id;window.__portableWorkbenchReady=true}catch(error){const d=document.querySelector("#diagnostic");d.hidden=false;d.textContent=error instanceof Error?error.message:String(error);window.__portableWorkbenchError=d.textContent}
</script></body></html>
