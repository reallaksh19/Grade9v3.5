  <title id="rep-nlm-anc-glide-title">A 3 kg cart gliding at 2 m/s on a frictionless track</title>
  <desc id="rep-nlm-anc-glide-desc">Stage 1: a 3 kg cart glides at 2 m/s on a frictionless track with no horizontal force on it. Stage 2: F_net = 0, so a = 0/3 = 0. Stage 3: 5 s later the cart still moves at 2 m/s: zero net force keeps the motion unchanged.</desc>
