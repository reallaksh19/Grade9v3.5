<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" role="img" aria-labelledby="rep-nlm-crate3dir-title rep-nlm-crate3dir-desc">
  <title id="rep-nlm-crate3dir-title">A 10 kg crate on a rough floor, pulled by a rope in one of three directions</title>
  <desc id="rep-nlm-crate3dir-desc">Stage 1: a 10 kg crate rests on a rough horizontal floor with μ_s = 0.75 and g = 10 m/s²; a rope can pull it horizontally, at 37° or at 53° above the horizontal (sin 37° = cos 53° = 0.6, cos 37° = sin 53° = 0.8); the pull P is unknown, and a worker can pull with at most 61 N. Stage 2: the crate's forces with P still unknown: weight mg = 100 N down, N = 100 − P sin θ up, the pull P at θ split into P cos θ and P sin θ, and friction f against the horizontal part. Stage 3: at the start of sliding the need equals the limit, P cos θ = 0.75(100 − P sin θ), so P = 75/(cos θ + 0.75 sin θ). Stage 4: the thresholds are 75 N at 0°, 60 N at 37° and 62.5 N at 53°; against the worker's 61 N only the 37° pull starts the crate.</desc>
  <defs>
    <marker id="rep-nlm-crate3dir-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-crate3dir-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CRATE3DIR-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 10 kg crate on a rough floor, pulled by a rope in one of three directions</text>
    <line x1="40" y1="300" x2="460" y2="300" stroke="currentColor" stroke-width="2"/>
    <line x1="50" y1="300" x2="42" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="68" y1="300" x2="60" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="86" y1="300" x2="78" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="104" y1="300" x2="96" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="122" y1="300" x2="114" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="140" y1="300" x2="132" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="158" y1="300" x2="150" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="176" y1="300" x2="168" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="194" y1="300" x2="186" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="212" y1="300" x2="204" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="230" y1="300" x2="222" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="248" y1="300" x2="240" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="266" y1="300" x2="258" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="284" y1="300" x2="276" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="302" y1="300" x2="294" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="320" y1="300" x2="312" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="338" y1="300" x2="330" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="356" y1="300" x2="348" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="374" y1="300" x2="366" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="392" y1="300" x2="384" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="410" y1="300" x2="402" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="428" y1="300" x2="420" y2="308" stroke="currentColor" stroke-width="1"/>
    <line x1="446" y1="300" x2="438" y2="308" stroke="currentColor" stroke-width="1"/>
    <rect x="120" y="220" width="110" height="80" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="175" y="265" text-anchor="middle">crate 10 kg</text>
    <line x1="230" y1="260" x2="380" y2="260" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="388" y="265">0°</text>
    <line x1="230" y1="260" x2="350" y2="170" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="358" y="168">37°</text>
    <line x1="230" y1="260" x2="320" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="300" y="128">53°</text>
    <text x="40" y="330">rough floor, μ_s = 0.75</text>
    <text x="480" y="70">g = 10 m/s²</text>
    <text x="480" y="92">sin 37° = cos 53° = 0.6</text>
    <text x="480" y="114">cos 37° = sin 53° = 0.8</text>
    <text x="480" y="136">pull P in each direction: unknown</text>
    <text x="480" y="158">the worker can pull with at most 61 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE3DIR-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="520" y="214" font-weight="600">Forces on the crate, P still unknown</text>
    <rect x="600" y="300" width="80" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="640" y="335" text-anchor="middle">crate</text>
    <line x1="640" y1="300" x2="640" y2="240" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="648" y="252">N = 100 − P sin θ</text>
    <line x1="640" y1="360" x2="640" y2="420" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="648" y="416">mg = 100 N</text>
    <line x1="680" y1="330" x2="760" y2="270" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="768" y="268">P at θ</text>
    <line x1="680" y1="330" x2="760" y2="330" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="760" y1="330" x2="760" y2="270" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="690" y="350">P cos θ</text>
    <text x="766" y="306">P sin θ</text>
    <line x1="600" y1="330" x2="540" y2="330" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate3dir-arrow)"/>
    <text x="534" y="326" text-anchor="end">f</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE3DIR-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="40" y="372" font-weight="600">At the start of sliding, the need reaches the limit:</text>
    <text x="40" y="394">P cos θ = 0.75(100 − P sin θ), so P = 75/(cos θ + 0.75 sin θ)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE3DIR-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="40" y="428" font-weight="600" fill="#1f6fb2">0°: 75 N; 37°: 60 N; 53°: 62.5 N</text>
    <text x="40" y="450" fill="#1f6fb2">Against the worker's 61 N, only the 37° pull starts the crate.</text>
  </g>
</svg>
