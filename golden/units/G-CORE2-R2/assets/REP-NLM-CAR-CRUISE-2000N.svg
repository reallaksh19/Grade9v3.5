<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="rep-nlm-cruise-title rep-nlm-cruise-desc">
  <title id="rep-nlm-cruise-title">A 1500 kg car cruising at a steady 25 m/s with a 2000 N driving force</title>
  <desc id="rep-nlm-cruise-desc">Stage 1: a 1500 kg car moves at a steady 25 m/s in a straight line on a level road; the road pushes it forward with a 2000 N driving force, and air and rolling resistance act backward. Stage 2: the velocity is not changing, so the acceleration and the net force are zero. Stage 3: the resistive forces total 2000 N backward, the net force is zero, and 10 s later the car still moves at 25 m/s in the same direction.</desc>
  <defs>
    <marker id="rep-nlm-cruise-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-cruise-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CRUISE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A car cruising along a straight, level road</text>
    <line x1="20" y1="220" x2="500" y2="220" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="220" x2="22" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="220" x2="40" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="220" x2="58" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="220" x2="76" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="220" x2="94" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="220" x2="112" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="220" x2="130" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="220" x2="148" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="220" x2="166" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="220" x2="184" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="220" x2="202" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="220" x2="220" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="220" x2="238" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="220" x2="256" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="220" x2="274" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="220" x2="292" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="220" x2="310" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="220" x2="328" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="220" x2="346" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="220" x2="364" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="220" x2="382" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="220" x2="400" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="220" x2="418" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="444" y1="220" x2="436" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="462" y1="220" x2="454" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="480" y1="220" x2="472" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="498" y1="220" x2="490" y2="228" stroke="currentColor" stroke-width="1"/>
    <rect x="180" y="158" width="140" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M205 158 L225 130 L275 130 L295 158" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="210" cy="208" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="290" cy="208" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="250.0" y="186" text-anchor="middle">1500 kg</text>
    <line x1="190" y1="100" x2="310" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-cruise-arrow)"/>
    <text x="190" y="88">v = 25 m/s, steady, in a straight line</text>
    <line x1="320" y1="180" x2="430" y2="180" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-cruise-arrow)"/>
    <text x="330" y="168">driving force 2000 N</text>
    <text x="330" y="200">(road on car)</text>
    <text x="20" y="262">Air and rolling resistance act backward on the car (size to find).</text>
    <text x="20" y="284">Find the resistive force, the net force and the velocity 10 s later.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRUISE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="540" y="70">Velocity not changing:</text>
    <text x="540" y="92">steady speed, straight line,</text>
    <text x="540" y="114">so a = 0 and the net force is zero</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRUISE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="180" y1="180" x2="70" y2="180" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-cruise-arrow-acc)"/>
    <text x="40" y="150" fill="#1f6fb2">resistance 2000 N</text>
    <text x="540" y="160">resistive forces total 2000 N backward</text>
    <text x="540" y="182">net force = 2000 − 2000 = 0</text>
    <text x="540" y="214" font-weight="600" fill="#1f6fb2">10 s later: still 25 m/s,</text>
    <text x="540" y="236" font-weight="600" fill="#1f6fb2">in the same direction</text>
  </g>
</svg>
