<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Question 1 supplied parameter polynomial" font-family="system-ui,sans-serif" font-size="24">
  <title>Question 1: parameter cubic</title><desc>The supplied cubic and factor first; parameter, grouping and complete zeros follow the attempt.</desc>
  <g data-g9-stage-id="GIVENS">
    <text x="40" y="50">Given: p_k(x) = x³ − 3x² + (k − 4)x + 12</text>
    <text x="40" y="100">Given factor: x − 3</text>
  </g>
  <g data-g9-stage-id="WORKED">
    <text x="40" y="160">p_k(3) = 3k = 0, so k = 0.</text>
    <text x="40" y="210">p_0(x) = x²(x − 3) − 4(x − 3)</text>
    <text x="40" y="260">= (x² − 4)(x − 3) = (x − 2)(x + 2)(x − 3)</text>
    <text x="40" y="315">Distinct real zeros: −2, 2, 3</text>
  </g>
</svg>
