<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Question 5 square sheet with corner cuts" font-family="system-ui,sans-serif" font-size="22">
  <title>Question 5: open box from a square sheet</title><desc>Only the ten-centimetre sheet and corner cuts appear first. The derived dimensions, model and domain follow the attempt.</desc>
  <g data-g9-stage-id="GIVENS">
    <rect x="65" y="60" width="240" height="240" fill="none" stroke="#8ac" stroke-width="2"/>
    <path d="M65 110H115V60M255 60V110H305M305 250H255V300M115 300V250H65" fill="none" stroke="#d95" stroke-width="2"/>
    <text x="150" y="43">10 cm</text><text x="73" y="92">x</text><text x="270" y="92">x</text><text x="73" y="282">x</text><text x="270" y="282">x</text>
    <text x="380" y="65">Cut corner squares of side x cm.</text><text x="380" y="105">Fold the remaining sides upwards.</text>
  </g>
  <g data-g9-stage-id="WORKED">
    <text x="130" y="185">10 − 2x</text><text x="380" y="170">Base: (10 − 2x) by (10 − 2x); height: x</text>
    <text x="380" y="220">V(x) = x(10 − 2x)²</text><text x="380" y="265">Non-degenerate domain: 0 &lt; x &lt; 5</text>
    <text x="380" y="310">At x = 3: V(3) = 48; Q(3) = 24 cm³</text>
  </g>
</svg>
