<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Question 9 given zeros and value at zero" font-family="system-ui,sans-serif" font-size="22">
  <title>Question 9: zeros −2 and 3</title><desc>The supplied points first; the quadratic x² − x − 6 follows the attempt. The curve is the exact quadratic segment.</desc>
  <g data-g9-stage-id="GIVENS">
    <path d="M60 150H580M280 30V320" fill="none" stroke="#888" stroke-width="2"/>
    <text x="570" y="140">x</text><text x="292" y="40">p(x)</text>
    <circle cx="160" cy="150" r="5" fill="#8ac"/><circle cx="460" cy="150" r="5" fill="#8ac"/><circle cx="280" cy="282" r="5" fill="#8ac"/>
    <text x="105" y="135">(−2, 0)</text><text x="450" y="135">(3, 0)</text><text x="295" y="305">(0, −6)</text>
    <text x="615" y="80">Supplied zeros: −2, 3</text><text x="615" y="125">Supplied value: p(0) = −6</text>
  </g>
  <g data-g9-stage-id="WORKED">
    <path d="M100 18 Q310 557 520 18" fill="none" stroke="#d95" stroke-width="3"/>
    <text x="615" y="200">p(x) = a(x + 2)(x − 3)</text><text x="615" y="245">−6a = −6, so a = 1</text>
    <text x="615" y="290">p(x) = x² − x − 6</text>
  </g>
</svg>
