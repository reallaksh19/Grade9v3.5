<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="nl-title nl-desc">
  <title id="nl-title">Exact solution 7/3 on a number line</title>
  <desc id="nl-desc">Stage 1: a number line from 0 to 4. Stage 2: the integers 2 and 3 that bracket the solution are highlighted. Stage 3: the point 7/3 is marked one third of the way from 2 to 3, visibly equal to neither integer.</desc>
  <g data-g9-stage-id="VIS-MATH-NL-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="16">
    <line x1="40" y1="60" x2="480" y2="60" stroke-width="2"/>
    <line x1="40" y1="52" x2="40" y2="68"/><text x="40" y="92" text-anchor="middle">0</text>
    <line x1="150" y1="52" x2="150" y2="68"/><text x="150" y="92" text-anchor="middle">1</text>
    <line x1="260" y1="52" x2="260" y2="68"/><text x="260" y="92" text-anchor="middle">2</text>
    <line x1="370" y1="52" x2="370" y2="68"/><text x="370" y="92" text-anchor="middle">3</text>
    <line x1="480" y1="52" x2="480" y2="68"/><text x="480" y="92" text-anchor="middle">4</text>
  </g>
  <g data-g9-stage-id="VIS-MATH-NL-2" fill="none" stroke="#1f5fae" stroke-width="3">
    <circle cx="260" cy="60" r="9"/><circle cx="370" cy="60" r="9"/>
    <text x="315" y="30" text-anchor="middle" fill="#1f5fae" stroke="none" font-family="system-ui,sans-serif" font-size="15">2 &lt; x &lt; 3</text>
  </g>
  <g data-g9-stage-id="VIS-MATH-NL-3" fill="#b3261e">
    <circle cx="296.7" cy="60" r="7"/>
    <text x="296.7" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15">x = 7/3 ≈ 2.33</text>
  </g>
</svg>
