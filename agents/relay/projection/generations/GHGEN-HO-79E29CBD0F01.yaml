8.yaml; source: RM-0007 WP-TA-107; ODR-0004\n- **BENCH-TA8-003** — definition: `agents/relay/execution-packages/EP-TA-008.yaml#benchmarks/BENCH-TA8-003`; pinned file: https://github.com/reallaksh19/Grade9V3/blob/cca1c200fb68a72496943a31abcab68417d51b5c/agents/relay/execution-packages/EP-TA-008.yaml; source: Shared/tools/feedback.py; Shared/tools/review_schedule.py\n\n## Expected outcomes\n- User-visible: A learner's current evidence determines how much support a capability starts with, whether a canonical visual/explorer should be surfaced, and whether the next exercise should consolidate or transfer—without a parent continuously choosing the next move.\n- User-visible: Failure escalation remains question-owned: starting support never consumes or rewrites the post-failure hint ladder, and execution/careless slips do not trigger conceptual rebuilding by default.\n- Engineering: Add one small subject-neutral derived router over existing learner_evidence, worksheet_study_plan, canonical representations and question inventory.\n- Engineering: Integrate the router into study-session planning while reusing feedback.py for hint escalation, repair, fresh verification and delayed review; add no persisted routing/mastery state.\n- Next-work result: Derived posture/support is deterministic and non-persisted.\n- Next-work result: Route starts with the right support/visual/demand using canonical refs.\n- Next-work result: Closed loop works without a duplicate post-attempt state machine.\n- Next-work result: WP-TA-107 is complete and WP-TA-105 becomes frontier.\n\n## Textual requirements and boundaries\n- Protected: Learner evidence result remains DEMONSTRATED/UNCERTAIN/MISSING/UNOBSERVED; routing posture is never persisted as evidence. — Avoids a second mastery model.\n- Protected: Owner knowledge_percentage remains a starting hint only and never creates READY. — Rough priors cannot certify capability.\n- Protected: Question.hints remains the post-failure escalation owner; starting support does not mark hints as shown. — Support and hint depth are distinct mechanisms.\n- Protected: Canonical library/matrix visual/support/demand records are read-only to this runtime slice. — Router consumes academic truth rather than rewriting it.\n- Prohibited: Physics/library or Physics/matrices edits — WP-TA-107 is runtime routing, not content authoring.\n- Prohibited: Observation/profile schema changes — Existing evidence vocabulary is sufficient.\n- Prohibited: Mastery percentages/probabilities or persisted READY/REINFORCE/REBUILD — Explicit Owner non-goal.\n- Prohibited: New hint/repair/review engine — Existing feedback and review contracts remain authoritative.\n- Non-goal: Do not persist READY/REINFORCE/REBUILD or add a mastery probability/score.\n- Non-goal: Do not change canonical Physics, matrices, question families, support ladders or visual stages.\n- Non-goal: Do not duplicate feedback.py's hint/repair/verification/review logic.\n- Non-goal: Do not require a dense question bank; return honest candidate availability/fallback when transfer or practice items are sparse.\n- Known problem: learner_evidence.effective_state does not currently expose the chosen observation's error_stage to downstream routing.\n- Known problem: worksheet route rows do not carry a routing posture, starting support, selected canonical visual stage, explorer recommendation or exercise-demand recommendation.\n- Known problem: No subject-neutral policy currently prefers transfer only after independent evidence and prerequisite readiness.\n\n## Recent concept-linked material events\n- No material event ledger is present for this current objective/phase; use RM-0007, CP-TA-007 and EP-TA-008 as authority.\n\n## Owner core requirements from this session\n- Work progress must be shown in a detailed, auditable manner.\n- Stick to Engineering PR Delivery v2.5 and use Plan for Handover.\n- Question count is not a completion denominator; use sparse questions only where needed for exercise/testing.\n- Keep representation, explorer, starting support, hint depth, exercise demand, evidence and router as separate concerns.\n- Do not create or persist a mastery percentage/probability or READY/REINFORCE/REBUILD learner state.\n\n## Reconciliation note\n- The branch already contains EP-TA-008 router/session implementation and exact-head guardrails/V2.5 were green at `12570ea45533ac52fa9a3dae9924eced1c37763e`.\n- Do **not** blindly reimplement steps 1–3. First reconcile current code/tests against AC-TA8-001..004 and TEST-TA8-001..004.\n- Accepted programme progress remains 70/100 until QRV-TA-008, CP-TA-008 and PROGRESS reconciliation durably award credit.\n\n## Completion test\n- Every INTENT item above is complete on its governing acceptance/evidence basis or explicitly dispositioned by current authority.\n\n## Linkage rule\n- Preferred: NATIVE_SUB_ISSUE_IF_SUPPORTED_AND_VERIFIED.\n- Fallback: VERIFIED_RECIPROCAL_REFERENCE.\n- No source GitHub issue is mapped to WP-TA-107, so this ACTIVE_TASK handover does not claim native parentage to Issue #118.\n",
