  "change_intake": {
    "previous_concept": "After the roadmap-first documentation slice, the remaining programme was framed primarily as cross-subject Topic Atlas surfaces, Agent A semantic inventory closure and GCDR release acceptance.",
    "requested_concept": "Treat already-delivered Atlas/Shared work as enabling infrastructure and make the next programme outcome a complete-enough Grade-9 Physics self-study layer: honest scope, low-friction prerequisite checks, model-first diagnosis/repair, reconstruction, independent verification, transfer, and an evidence-based Grade-9 to Grade-10 transition.",
    "retained_behavior": [
      "Keep completed Topic Atlas/browser and Shared diagnostic/Core work as accepted enabling foundation.",
      "Keep WP-TA-106 and EP-TA-003 as the current README-first roadmap discoverability slice.",
      "Keep rough knowledge percentage as a routing prior only; it never proves mastery or a prerequisite.",
      "Keep learner evidence, benchmark evidence, canonical academic truth and source/review authority as separate domains.",
      "Keep assisted success weaker than independent success and preserve fresh verification.",
      "Reuse the six Cores and current Shared learner/prerequisite/session machinery before adding architecture."
    ],
    "invalidated_behavior": [
      "Do not use cross-subject architecture completion as the primary near-term learner-success criterion.",
      "Do not treat connected, advanced or useful Physics as required Grade-9 scope merely because it exists in the repository.",
      "Do not treat chapter coverage, matrix readiness or aggregate percentage as proof that Grade 9 is complete.",
      "Do not silently convert unknown/missing evidence into either mastery or failure.",
      "Do not require perfection or optional enrichment before allowing a justified Grade-10 transition."
    ],
    "new_scope": [
      "Classify current Physics material into required Grade 9, genuine prerequisites, question-driven additions, deliberate enrichment and later-grade sophistication.",
      "Close only the learner-loop gaps that prevent required Grade-9 capabilities from being diagnosed, repaired, reconstructed, practised, transferred and independently verified.",
      "Create an auditable Grade-9 exit/transition view derived from existing scope and learner evidence rather than a second mastery database.",
      "Sequence Physics Grade 10 and Grade 11 after the Grade-9 transition basis is usable."
    ]
  },
  "required_reconciliation": [
    "Retitle the current objective/phase and future WP-TA-103..105 around Grade-9 Physics learner independence while preserving stable IDs, dependencies and weights.",
    "Preserve already-earned 45/100 enabling progress under a new PB-0004 progress basis; do not re-earn accepted work.",
