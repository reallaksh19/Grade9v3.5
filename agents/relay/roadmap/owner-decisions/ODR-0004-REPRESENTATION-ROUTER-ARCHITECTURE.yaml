    "statement": "Make the remaining Grade-9 learner-loop work representation-first and routing-first. Questions are sparse exercises/fixtures, not a completeness denominator. Keep canonical representations separate from interactive explorers and from questions; keep starting support separate from post-failure hint depth; add only the minimum schema needed for staged visual hints and explicit representation/explorer binding; derive support/exercise routing from learner evidence without creating a mastery model.",
