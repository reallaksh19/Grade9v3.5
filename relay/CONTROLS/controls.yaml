schema_version: relay-v3-controls
controls:
- id: CTRL-MIGRATION-RECONCILE
  kind: PROTOCOL
  state: RESOLVED
  source:
    type: VALIDATOR
    ref: relay/MIGRATION/V25_REPORT.yaml
  condition: Legacy V2.5 intent/evidence has not yet been reconciled into native V3
    execution authority.
  blocks:
  - MATERIAL_WRITE
  - TEST
  - CHECKPOINT
  - HANDOVER
  - LOCAL_EXECUTION_EXPORT
  - DRAFT_PR_UPDATE
  - PR_READY
  - MERGE
  - RELEASE
  - CLOSE_TASK
  permits:
  - READ
  - ANALYZE
  resolution:
    condition: Native V3 roadmap/frontier/EP/lease/checkpoint disposition is established
      without rewriting V2.5 history.
    evidence:
    - Native V3 present authority is intentionally IDLE; no V2.5 execution custody
      or acceptance was translated.
    - 'Current main remains delivered #173 baseline da91e9e42c641e9d2bdd970d1e87a6b8227c84a9.'
    - 'Issue #169 / PR #181 remains separate and is not imported into #174 native
      V3 authority.'
    - 'New #174 work must enter through canonical V3 admit-task after cutover.'
- id: CTRL-V25-INTELLIGENCE-CONTINUITY
  kind: PROTOCOL
  state: RESOLVED
  source:
    type: REPOSITORY
    ref: Common#421
  condition: V3 cutover must not retire V2.5 roadmap admission, ROADMAP_EVENTS, checkpoint/progress
    reconciliation, discovery, Owner-delta, or handover intelligence before continuity
    is proven.
  blocks:
  - PROTOCOL_CUTOVER
  permits:
  - READ
  - ANALYZE
  resolution:
    condition: 'Common#421 continuity acceptance is evidenced: governed roadmap/event/checkpoint/progress
      intelligence remains semantically intact across the selected V3 authority boundary.'
    evidence:
    - relay/GENERATED/INTELLIGENCE_CONTINUITY.yaml
    - Common@c87cf87b313801e42ecd0fcc7d36af0d90c5f400 continuity assessment ready=true
- id: CTRL-OWNER-MERGE-ISS174-NLM-20260922
