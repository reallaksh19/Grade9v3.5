  state: OPEN
  source:
    type: OWNER
    ref: direct-owner:2026-09-22T11:48:50Z:sha256:d982aa62202077357b1a30cde1405fcd765a1408a139f105294d1c6d5c7c73dc
  condition: Owner explicitly authorizes merging the current V3-governed delivery when GitHub reports it mergeable.
