    and fail closed.
  - Long division reuses the existing Core witness; Redox and integration are provenance-labelled
    compiled proof fixtures.
  - Delivered Core, canonical subject data and Issue 175 learner shell remain unchanged.
  - Accepted material head is 72b7d8c6e18273252c6e8faac90ff11dd4af0425.
  what_remains_uncertain:
