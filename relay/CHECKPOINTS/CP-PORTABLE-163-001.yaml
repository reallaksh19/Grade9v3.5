- Single-file embedding can reuse the exact delivered runtime/component sources while
  removing only module import statements during deterministic generation.
handoff:
  what_changed:
  - Added a versioned data-only portable package contract and declarative adapter
    host.
  - Generated repository, external plain-HTML and true single-file host forms from
    one source.
  - Added long-division, Redox and integration portability witnesses plus migration
    guidance.
  what_is_true_now:
