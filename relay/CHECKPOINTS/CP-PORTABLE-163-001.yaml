  - Do not make portability own learner mastery, support policy or page composition.
  - Do not silently accept incompatible API/package versions.
  attempted_and_rejected:
  - Using bespoke Redox page JavaScript as portable runtime authority was rejected;
    it remains reference provenance only.
  - Modifying Shared/workbench Core for portability was unnecessary and therefore
    rejected.
