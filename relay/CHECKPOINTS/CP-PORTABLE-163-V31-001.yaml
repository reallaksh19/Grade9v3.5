known_limitations:
- Historical V3 checkpoints remain migration evidence only and are not promoted into
  native V3.1 acceptance.
- Because V3.1 accepted-progress projection counts native checkpoints, historical
  completed roadmap work is not represented as V3.1 accepted progress.
- Redox and integration are portability proof fixtures, not newly canonicalized subject
  records.
discoveries:
- Issue 163 technical acceptance survives a clean protocol-line migration from V3
  to V3.1 without Core or subject-data changes.
- The portable package/runtime boundary remains data-only, versioned and fail-closed
  under V3.1 revalidation.
- Provider delivery can proceed from the fresh V3.1 checkpoint; the former V3 checkpoint
  is not needed as live authority.
