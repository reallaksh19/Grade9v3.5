schema_version: relay-v3-ep
id: EP-LEARNER-175-PRODUCTION-001
work_package: WP-LEARNER-175-PRODUCTION
outcome:
  statement: Restack and finish the existing Issue 175 learner-page builder by replacing
    fixture-backed public data with real compiler-produced Motion Core projections,
    preserving public/standalone parity, mounting one existing Motion shared-clock
    explorer through explicit host metadata, and dispositioning PR 134 without creating
    a second academic database.
basis:
  predecessor_checkpoint: CP-CANONICAL-174-MOTION-002
  material_base: 8aff9d95571b68897cc0d005eb7e34b716b69f47
  protocol_basis: reallaksh19/Common@c87cf87b313801e42ecd0fcc7d36af0d90c5f400:skills/engineering-pr-delivery-v3
  semantic_dependencies:
  - path: Shared/library/compile_inputs.py
    reason: Delivered Issue 173 compiler is the production source of Core blocks.
  - path: Shared/library/package.schema.json
    reason: Delivered structured reasoning/scaffold/transfer fields define provider
      semantics.
  - path: Physics/library/phy-kin-2d-motion.v1.json
    reason: Delivered Issue 174 Motion canonical representations and structured reasoning
      are the gold production data.
  - path: Physics/matrices/phy-kin-2d-motion.rungs.json
    reason: Motion family authority remains outside the page builder.
  - path: public/physics/motion-2d/explorers/shared-clock/index.html
    reason: Existing bespoke shared-clock explorer is the representative artifact
      to mount without duplicating its scientific logic.
  - path: Shared/publication_host
    reason: Delivered projection/publication validation remains an upstream oracle.
scope:
  write:
  - Shared/tools/build_core_learning_data.py
  - Shared/tools/build_core_learning_host.py
  - Shared/tools/build_core_learning_runtime.py
  - Shared/tools/core_learning_projection_adapter.py
  - Shared/tools/build_manifest.py
  - Shared/tools/topic_independence_allowlist.json
  - Shared/workbench/core-learning-host.mjs
  - Shared/workbench/core-learning-page.mjs
  - public/core-learning/**
  - public/js/core-learning/**
  - standalone/core-learning/**
  - tests/core_learning_host.test.mjs
  - tests/core_learning_page.test.mjs
  - tests/fixtures/workbench/core-learning-host.html
  - tests/fixtures/workbench/core-learning-projections.json
  - tests/test_core_learning_adapter.py
  - tests/test_tools.py
  - tests/test_workbench_runtime.py
  - tests/workbench_browser.test.mjs
  - docs/architecture-manifest.json
  read:
  - Shared/library/**
  - Shared/publication_host/**
  - Physics/library/phy-kin-2d-motion.v1.json
  - Physics/matrices/phy-kin-2d-motion.rungs.json
  - Physics/activities/**
  - public/physics/motion-2d/explorers/shared-clock/index.html
  - tests/test_core_projection_pipeline.py
  - tests/test_core_projection_contract.py
  protect:
  - Shared/library/**
  - Shared/publication_host/**
  - Physics/**
  - public/physics/**
  - agents/relay/**
  prohibit:
  - Mathematics/**
  - Chemistry/**
  - Do not add page-local curriculum, capability, question-bank, mastery, or support-policy
    truth.
  - Do not rewrite the shared-clock explorer's scientific implementation merely to
    fit the shell.
  - Do not reopen Issues 162, 173 or 174 unless a generic falsifier proves a regression.
acceptance:
- id: AC-175-SHELL
  statement: The existing Core learner shell is preserved and public/standalone hosts
    are generated from one source with equivalent projection-driven behavior.
  evidence_requirements:
  - test: node --test tests/core_learning_page.test.mjs tests/core_learning_host.test.mjs
  - test: python -m unittest tests.test_workbench_runtime
- id: AC-175-PROVIDER
  statement: Production public learner data is generated from real compiler-produced
    Motion Core projections rather than fixture rows, while the browser/runtime never
    compiles or discovers raw subject truth.
  evidence_requirements:
  - test: python -m unittest tests.test_core_learning_adapter
  - oracle: public/core-learning/data.js declares production provider status and canonical
      source refs.
- id: AC-175-CORE-SEMANTICS
  statement: Core1A/Core1B share canonical concept identity with attempt-before-reveal
    only where projected; Core2A/Core2B preserve hints, scaffolds, reasoning route,
    crux and protected transfer decisions without pre-attempt leakage.
  evidence_requirements:
  - test: python -m unittest tests.test_core_learning_adapter
  - test: python -m unittest tests.test_core_projection_pipeline tests.test_core_projection_contract
- id: AC-175-EXPLORER
  statement: At least one existing bespoke Motion explorer is mounted through explicit
    generated host metadata while its scientific artifact remains unchanged and pedagogy
    remains supplied by Core projection state.
  evidence_requirements:
  - test: browser contract proves shared-clock explorer locator is mounted from provider
      data and remains same-origin/offline-safe.
  - oracle: public/physics/motion-2d/explorers/shared-clock/index.html remains protected.
- id: AC-175-PR134
  statement: PR 134 is explicitly dispositioned against the generated-builder boundary;
    it is not merged as a second page-local academic model.
  evidence_requirements:
  - oracle: PR 134 state/comment records the disposition and rationale.
- id: AC-175-REPO
  statement: Exact-head guardrails, pinned V3 validation and deterministic generated-file
    freshness all pass.
  evidence_requirements:
  - test: guardrails and v3-relay on exact PR 178 head
quality_policy:
  level: STANDARD
  independent_review: OPTIONAL
admission_policy:
  qualification: NOT_REQUIRED
  question_policy: NONE
next:
  first_action: Keep the checkpointed learner shell, implement the thin compiler-to-CoreProjection
    production adapter for the Motion gold family, and switch generated public data
    from fixture-only to production rows.
  stop_conditions:
  - Any implementation that duplicates canonical Physics truth in page-specific JavaScript
    or HTML must stop.
  - Any protected Core2B decision exposed by pre-attempt scaffold or visual support
    must fail acceptance.
  - Any requirement to modify delivered Shared library/compiler semantics must be
    split into a separate generic-regression task.
  - Do not make Issue 163 portability concerns own the Issue 175 learner shell.
