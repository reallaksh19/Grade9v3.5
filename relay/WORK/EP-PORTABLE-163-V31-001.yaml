acceptance:
- id: AC-163-PACKAGE
  statement: Versioned package seams fail closed on mismatch/malformed/executable/pixel
    payloads.
  evidence_requirements:
  - test: python -m unittest tests.test_portable_workbench
  - test: node --test tests/portable_workbench.test.mjs
- id: AC-163-HOSTS
  statement: The same package works in repository static, external plain-HTML, and
    true single-file hosts.
  evidence_requirements:
  - test: real Chrome cross-host proof
- id: AC-163-CROSS-SUBJECT
  statement: Long division, Redox and integration use one portable runtime/build contract
    without Core edits.
  evidence_requirements:
  - test: cross-subject portable package tests
- id: AC-163-BOUNDARY
  statement: Core, learner shell and canonical subject truth remain outside portability
    ownership.
  evidence_requirements:
  - oracle: protected paths are unchanged from main
- id: AC-163-PARITY
  statement: Public, external and offline artifacts are generated from one source/build
    path and freshness-checked.
  evidence_requirements:
  - test: python -m Shared.tools.build_portable_workbench --check
- id: AC-163-REPO
  statement: Exact-head guardrails and pinned V3.1 validation pass.
  evidence_requirements:
  - test: guardrails and v31-relay on exact PR 192 material head
quality_policy:
