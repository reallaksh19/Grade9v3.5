acceptance:
  -
    id: "AC-212-WITNESSES"
    statement: "Independent source-derived oracles for Motion-in-2D R1, NLM R5, Mathematics R1, and the non-default NLM R4 preserve exact canonical identity and asymmetries."
    evidence_requirements:
      -
        test: "tests/test_issue212_atlas_index.py"
  -
    id: "AC-212-INTEGRITY"
    statement: "Every authored source rung is emitted exactly once; duplicate composite keys and dangling declared refs are explicit findings and no invalid ref is reported READY."
    evidence_requirements:
      -
        test: "tests/test_issue212_atlas_index.py"
  -
    id: "AC-212-SEMANTICS"
    statement: "Microtopic and capability prerequisite dimensions remain distinct when source truth differs, and representation/activity/locator/portable availability are not conflated."
    evidence_requirements:
      -
        test: "tests/test_issue212_atlas_index.py"
  -
    id: "AC-212-CORE"
    statement: "Atlas Core mapping consumes merged Issue 211 projection/availability truth; Motion projections resolve while NLM/Mathematics unsupported states remain explicit without fabricated IDs."
    evidence_requirements:
      -
        test: "tests/test_issue212_atlas_index.py"
  -
    id: "AC-212-DETERMINISM"
    statement: "Derived output is deterministic under record permutation and preserves authored matrix/rung order plus default/non-default eligibility."
    evidence_requirements:
      -
        test: "tests/test_issue212_atlas_index.py"
  -
    id: "AC-212-CONSUMER"
    statement: "One versioned subject-neutral index/visual handoff exposes stable composite identity and explicit absence/invalid states so Agents C/D do not synthesize IDs or links."
    evidence_requirements:
      -
        oracle: "Issue 212 final contract handoff to Issues 213 and 214."
  -
    id: "AC-212-REPO"
    statement: "Owned generated Atlas artifacts are fresh and identical, existing Atlas suites plus focused Issue 212 falsifiers pass, and exact-head repository guardrails remain green."
    evidence_requirements:
      -
        test: "python -m unittest discover -s tests -p 'test_topic_atlas_contract.py' -v"
      -
        test: "python -m unittest discover -s tests -p 'test_shared_topic_atlas_core.py' -v"
      -
        test: "python -m unittest discover -s tests -p 'test_topic_atlas_takeover_contract.py' -v"
      -
        test: "python -m unittest discover -s tests -p 'test_issue212_atlas_index.py' -v"
