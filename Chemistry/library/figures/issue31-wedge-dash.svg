<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Methane wedge and dash</title>
<desc id="desc">Carbon with two bonds in plane, one solid wedge toward the viewer and one dashed bond behind the plane.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="WD-1"><text x="365" y="210" font-size="30">C</text><line x1="360" y1="195" x2="250" y2="120" stroke="currentColor" stroke-width="3"/><text x="220" y="110" font-size="24">H</text><line x1="390" y1="195" x2="500" y2="120" stroke="currentColor" stroke-width="3"/><text x="515" y="110" font-size="24">H</text></g><g data-g9-stage-id="WD-2"><polygon points="355,220 235,315 325,245" fill="none" stroke="currentColor" stroke-width="4"/><text x="195" y="340" font-size="24">H toward</text><line x1="400" y1="225" x2="520" y2="315" stroke="currentColor" stroke-width="4" stroke-dasharray="10 8"/><text x="530" y="340" font-size="24">H behind</text></g><g data-g9-stage-id="WD-3"><text x="180" y="385" font-size="20">Wedge/dash encodes non-coplanar tetrahedral depth (~109.5° ideal), not a flat 90° cross.</text></g>
</svg>
