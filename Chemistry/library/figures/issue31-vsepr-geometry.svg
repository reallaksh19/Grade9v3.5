<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">VSEPR geometry naming</title>
<desc id="desc">The same NH3 domain inventory is used to distinguish electron-domain geometry from molecular geometry.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="VG-1"><text x="80" y="80" font-size="26">Count all four electron domains around N</text><text x="310" y="155" font-size="28">NH₃ + lone pair</text></g><g data-g9-stage-id="VG-2"><text x="80" y="235" font-size="24">Electron-domain geometry</text><text x="470" y="235" font-size="24">tetrahedral</text></g><g data-g9-stage-id="VG-3"><text x="80" y="315" font-size="24">Molecular geometry (atoms only)</text><text x="470" y="315" font-size="24">trigonal pyramidal</text><text x="135" y="370" font-size="19">Lone-pair direction counts for EDG but is omitted from the atom-only molecular shape name.</text></g>
</svg>
