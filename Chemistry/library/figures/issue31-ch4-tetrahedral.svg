<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Methane four-domain mapping</title>
<desc id="desc">Four bonding domains around carbon build a tetrahedral electron-domain arrangement.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="CH4-1"><text x="315" y="205" font-size="30">C</text><text x="220" y="55" font-size="22">4 C–H bonding domains</text></g><g data-g9-stage-id="CH4-2"><line x1="330" y1="180" x2="330" y2="90" stroke="currentColor" stroke-width="4"/><line x1="310" y1="210" x2="190" y2="285" stroke="currentColor" stroke-width="4"/><polygon points="350,205 525,145 490,195" fill="none" stroke="currentColor" stroke-width="4"/><line x1="350" y1="225" x2="485" y2="320" stroke="currentColor" stroke-width="3" stroke-dasharray="9 7"/><text x="315" y="75" font-size="22">H</text><text x="160" y="310" font-size="22">H</text><text x="540" y="145" font-size="22">H</text><text x="500" y="340" font-size="22">H</text></g><g data-g9-stage-id="CH4-3"><text x="170" y="380" font-size="21">4 domains → sp³ model → tetrahedral electron-domain geometry (~109.5° ideal).</text></g>
</svg>
