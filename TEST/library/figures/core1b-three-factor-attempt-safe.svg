<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 166" style="width:100%;max-width:420px!important;height:auto"
 role="img" aria-label="Three consecutive positive integer factors ending at t: t minus two, t minus one, and t"
 font-family="system-ui, sans-serif" font-size="24">
  <title>Three consecutive factor symbols</title>
  <desc>Three labeled rectangular cards, read left to right as t minus two, multiplied by t minus one, multiplied by t. All cards use the same appearance.</desc>
  <g data-g9-stage-id="CORE1B-GIVEN-FACTORS">
    <rect x="12" y="22" width="170" height="108" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="97" y="85" fill="#172033" text-anchor="middle">t − 2</text>
    <text x="201" y="86" fill="#172033">×</text>
    <rect x="225" y="22" width="170" height="108" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="310" y="85" fill="#172033" text-anchor="middle">t − 1</text>
    <text x="414" y="86" fill="#172033">×</text>
    <rect x="438" y="22" width="170" height="108" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="523" y="85" fill="#172033" text-anchor="middle">t</text>
  </g>
</svg>
