<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Polynomial sign chart derivation across real intervals" font-family="system-ui, sans-serif" font-size="20">
  <title>Polynomial sign chart derivation across real intervals</title>
  <desc>Four staged panels: factoring a cubic, partitioning the real line at three zeros, tabulating factor signs, and deriving the product sign from negative-factor parity.</desc>
  <g data-g9-stage-id="POLY-SIGN-1">
    <text x="40" y="45" font-weight="700" font-size="24">1 · Factored form and real zeros</text>
    <text x="60" y="85">p(x) = x³ - 6x² + 11x - 6 = (x - 1)(x - 2)(x - 3)</text>
    <line x1="80" y1="120" x2="820" y2="120" stroke="currentColor" stroke-width="3"/>
    <circle cx="280" cy="120" r="6" fill="currentColor"/>
    <text x="275" y="150" font-weight="700">1</text>
    <circle cx="480" cy="120" r="6" fill="currentColor"/>
    <text x="475" y="150" font-weight="700">2</text>
    <circle cx="680" cy="120" r="6" fill="currentColor"/>
    <text x="675" y="150" font-weight="700">3</text>
    <text x="140" y="105" font-style="italic">(-∞, 1)</text>
    <text x="360" y="105" font-style="italic">(1, 2)</text>
    <text x="560" y="105" font-style="italic">(2, 3)</text>
    <text x="740" y="105" font-style="italic">(3, ∞)</text>
  </g>
  <g data-g9-stage-id="POLY-SIGN-2">
    <text x="40" y="195" font-weight="700" font-size="24">2 · Individual factor signs</text>
    <text x="60" y="230">For (x - c): negative left of c; zero at c;</text>
    <text x="60" y="258">positive right of c.</text>
    <text x="80" y="292">• (x - 1):  -  |  0  |  +  |  +  |  +  |  +  |  +</text>
    <text x="80" y="322">• (x - 2):  -  |  -  |  -  |  0  |  +  |  +  |  +</text>
    <text x="80" y="352">• (x - 3):  -  |  -  |  -  |  -  |  -  |  0  |  +</text>
  </g>
  <g data-g9-stage-id="POLY-SIGN-3">
    <text x="40" y="398" font-weight="700" font-size="24">3 · Product sign from factor parity</text>
    <text x="60" y="430">(-∞, 1): 3 negatives → NEGATIVE (-)</text>
    <text x="440" y="430">(1, 2): 2 negatives → POSITIVE (+)</text>
    <text x="60" y="460">(2, 3): 1 negative → NEGATIVE (-)</text>
    <text x="440" y="460">(3, ∞): 0 negatives → POSITIVE (+)</text>
  </g>
  <g data-g9-stage-id="POLY-SIGN-4">
    <text x="40" y="495" font-weight="700" font-size="24">4 · Final sign chart from factor parity</text>
    <text x="60" y="518">(-∞,1): −; 1: 0; (1,2): +; 2: 0; (2,3): −; 3: 0; (3,∞): +</text>
  </g>
</svg>
