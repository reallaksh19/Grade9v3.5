<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" style="width:100%;max-width:500px!important;height:auto" role="img" aria-label="Three-stage authored index-law construction: common positive quantity, exponent offset as factor, then solve" preserveAspectRatio="xMidYMid meet">
  <style>@media print { g[data-g9-stage-id] { display:inline !important; } }</style>
  <title>One common exponential quantity</title>
  <desc>Stage one identifies 9 to power x with 3 to power 2x and calls it positive t. Stage two explains the extra factor of 3. Stage three solves 3t equals t plus 162 and maps back to x equal two.</desc>
  <rect width="800" height="560" fill="#f8fbff" rx="20"/>
  <text x="36" y="49" fill="#173251" font-family="Arial, sans-serif" font-weight="700" font-size="33">One quantity, two expressions</text>
  <g data-g9-stage-id="Q26-BASE">
    <rect x="32" y="73" width="736" height="143" rx="18" fill="#e3f4f2" stroke="#34726b" stroke-width="3"/>
    <text x="55" y="118" font-size="28" font-weight="700" fill="#163e38" font-family="Arial, sans-serif">1. Name the positive quantity</text>
    <text x="55" y="166" font-size="34" font-weight="700" fill="#142c31" font-family="Arial, sans-serif">9^x = 3^(2x) = t</text>
    <text x="530" y="166" font-size="34" font-weight="700" fill="#142c31" font-family="Arial, sans-serif">t &gt; 0</text>
    <text x="55" y="197" font-size="26" fill="#234c48" font-family="Arial, sans-serif">Both power forms name the same value.</text>
  </g>
  <g data-g9-stage-id="Q26-FACTOR">
    <rect x="32" y="229" width="736" height="143" rx="18" fill="#e8eaff" stroke="#5069a3" stroke-width="3"/>
    <text x="55" y="272" font-size="28" font-weight="700" fill="#263d7c" font-family="Arial, sans-serif">2. Keep the multiplicative factor</text>
    <text x="55" y="320" font-size="34" font-weight="700" fill="#172951" font-family="Arial, sans-serif">3^(2x+1) = 3 × t</text>
    <text x="55" y="355" font-size="26" fill="#263d7c" font-family="Arial, sans-serif">A +1 in the exponent multiplies by 3.</text>
  </g>
  <g data-g9-stage-id="Q26-SOLVE">
    <rect x="32" y="385" width="736" height="145" rx="18" fill="#fff4df" stroke="#9a6b27" stroke-width="3"/>
    <text x="55" y="427" font-size="28" font-weight="700" fill="#6e4718" font-family="Arial, sans-serif">3. Solve, then return to the exponent</text>
    <text x="55" y="479" font-size="34" font-weight="700" fill="#583613" font-family="Arial, sans-serif">3t = t + 162</text>
    <text x="465" y="479" font-size="34" font-weight="700" fill="#583613" font-family="Arial, sans-serif">t = 81</text>
    <text x="55" y="514" font-size="26" fill="#704919" font-family="Arial, sans-serif">81 = 3^4, so 2x = 4 and x = 2.</text>
  </g>
</svg>
