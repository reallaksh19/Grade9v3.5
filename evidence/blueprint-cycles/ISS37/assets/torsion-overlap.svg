<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="Formamide orbital alignment model for planar and twisted arrangements" font-family="system-ui, sans-serif" font-size="22">
  <title>Formamide orbital alignment model</title>
  <desc>Three reveal stages keep atom connectivity fixed while comparing orbital directions and the supplied cosine overlap-factor model. The drawing is qualitative and does not represent measured donation strength or total molecular energy.</desc>
  <g data-g9-stage-id="ISS37-ALIGN-1">
    <text x="36" y="44" font-weight="700">Same connectivity; compare orientation</text>
    <text x="75" y="125">H₂N—C(=O)H</text>
    <text x="470" y="125">H₂N—C(=O)H</text>
    <text x="100" y="165">planar reference</text>
    <text x="470" y="165">C—N twisted</text>
    <line x1="50" y1="195" x2="330" y2="195" stroke="currentColor" stroke-width="2" stroke-dasharray="8 7"/>
    <line x1="430" y1="195" x2="710" y2="195" stroke="currentColor" stroke-width="2" stroke-dasharray="8 7"/>
    <text x="90" y="225">formal electron count unchanged</text>
    <text x="470" y="225">connectivity unchanged</text>
  </g>
  <g data-g9-stage-id="ISS37-ALIGN-2">
    <line x1="145" y1="275" x2="145" y2="385" stroke="currentColor" stroke-width="5"/>
    <line x1="245" y1="275" x2="245" y2="385" stroke="currentColor" stroke-width="5"/>
    <text x="104" y="415">N donor p-like</text>
    <text x="213" y="415">carbonyl p</text>
    <line x1="520" y1="275" x2="520" y2="385" stroke="currentColor" stroke-width="5"/>
    <line x1="585" y1="330" x2="700" y2="330" stroke="currentColor" stroke-width="5"/>
    <text x="470" y="415">orthogonal directions after ~90° twist</text>
  </g>
  <g data-g9-stage-id="ISS37-ALIGN-3">
    <text x="46" y="450">Given model only: overlap factor = cos(θ). Do not infer a total-energy law without another model.</text>
  </g>
</svg>
