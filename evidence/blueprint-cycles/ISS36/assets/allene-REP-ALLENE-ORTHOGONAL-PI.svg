<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-label="Allene direction construction" font-family="sans-serif" font-size="22"><title>Allene local basis and terminal-plane directions</title><desc>Five stages construct the fixed chain, sigma axis, two perpendicular central p directions, terminal sigma-plane traces and a bounded local-model explanation. The end-on diagram looks along C=C=C.</desc><style>text{stroke:none}</style><g stroke="currentColor" stroke-width="3" fill="currentColor"><g data-g9-stage-id="ISS36-REPAIRED-REP-ALLENE-ORTHOGONAL-PI-1"><text x="25" y="40">Allene connectivity: H2C=C=CH2</text><text x="25" y="75">Construct directions; do not infer from page layout.</text></g><g data-g9-stage-id="ISS36-REPAIRED-REP-ALLENE-ORTHOGONAL-PI-2"><line x1="70" y1="125" x2="570" y2="125"/><text x="70" y="155">C1</text><text x="295" y="155">C2</text><text x="545" y="155">C3</text><text x="25" y="195">Two central sigma directions share the C=C=C axis.</text></g><g data-g9-stage-id="ISS36-REPAIRED-REP-ALLENE-ORTHOGONAL-PI-3"><line x1="320" y1="250" x2="320" y2="415"/><line x1="235" y1="330" x2="405" y2="330" stroke-dasharray="8 6"/><text x="25" y="235">End-on central p directions are perpendicular.</text></g><g data-g9-stage-id="ISS36-REPAIRED-REP-ALLENE-ORTHOGONAL-PI-4"><line x1="205" y1="330" x2="435" y2="330" stroke-width="6"/><line x1="320" y1="220" x2="320" y2="440" stroke-width="6" stroke-dasharray="8 6"/><text x="25" y="478">Terminal sigma-plane traces: perpendicular.</text></g><g data-g9-stage-id="ISS36-REPAIRED-REP-ALLENE-ORTHOGONAL-PI-5"><text x="25" y="514">Each terminal p aligns with one central p.</text><text x="25" y="550">This model uses terminal sp2 / central sp.</text><text x="25" y="586">No one-atomic-orbital-one-bond Pauli prohibition.</text></g></g></svg>