<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="Question-specific rational number line" font-size="22"><title>Question-specific rational number line</title><desc>A rational axis; exact 8/3 point stays in the protected result stage.</desc><g data-g9-stage-id="VIS-ISS29-MATH-TRANSFER-DOMAIN"><path d="M70 135H650" stroke="#334155" stroke-width="3"/><text x="70" y="55">Declared domain: rational numbers</text><text x="170" y="180">2</text><text x="570" y="180">3</text></g><g data-g9-stage-id="VIS-ISS29-MATH-TRANSFER-RESULT"><circle cx="436.67" cy="135" r="8" fill="#2563eb"/><text x="385" y="105">x = 8/3</text><text x="70" y="220">Check: 3(8/3 − 1) = 5. A truncation 2.66 gives 4.98.</text></g></svg>