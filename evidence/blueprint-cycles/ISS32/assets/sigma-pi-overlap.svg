<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-labelledby="svg-sp-title svg-sp-desc">
  <title id="svg-sp-title">Orbital Overlap Geometry: Sigma vs Pi Bonds</title>
  <desc id="svg-sp-desc">Illustration comparing end-on coaxial overlap with cylindrical symmetry (sigma bond) to lateral side-on overlap with a nodal plane on the internuclear axis (pi bond).</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .axis-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .nucleus { fill: #0f172a; }
      .lobe-pos { fill: #3b82f6; fill-opacity: 0.65; stroke: #1d4ed8; stroke-width: 1.5; }
      .lobe-neg { fill: #93c5fd; fill-opacity: 0.65; stroke: #60a5fa; stroke-width: 1.5; }
      .overlap-region { fill: #8b5cf6; fill-opacity: 0.8; stroke: #6d28d9; stroke-width: 2; }
      .nodal-line { stroke: #dc2626; stroke-width: 2; stroke-dasharray: 5,3; }
    </style>
  </defs>

  <rect width="600" height="360" rx="8" class="bg" />

  <!-- Stage 1: Internuclear Axis and Orbital Orientation -->
  <g data-g9-stage-id="SIGMA-PI-1">
    <rect x="20" y="20" width="560" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="35" y="42" class="text-title">Stage 1: Internuclear Axis Reference</text>
    <text x="35" y="62" class="text-body">The internuclear axis (z-axis) connects the nuclei of the two bonded atoms.</text>
    <line x1="280" y1="55" x2="550" y2="55" class="axis-line" />
    <circle cx="350" cy="55" r="4" class="nucleus" />
    <text x="350" y="75" class="text-sub" text-anchor="middle">Nucleus A</text>
    <circle cx="480" cy="55" r="4" class="nucleus" />
    <text x="480" y="75" class="text-sub" text-anchor="middle">Nucleus B</text>
    <text x="415" y="48" class="text-sub" text-anchor="middle">Internuclear axis</text>
  </g>

  <!-- Stage 2: Coaxial End-on Overlap (Sigma Bond) -->
  <g data-g9-stage-id="SIGMA-PI-2">
    <rect x="20" y="115" width="270" height="225" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="35" y="140" class="text-title">Stage 2: Overlap A (Sigma, σ)</text>
    <text x="35" y="160" class="text-sub">End-on (head-to-head) coaxial overlap</text>

    <!-- Axis -->
    <line x1="30" y1="215" x2="270" y2="215" class="axis-line" />

    <!-- Orbital A (left) -->
    <ellipse cx="105" cy="215" rx="35" ry="20" class="lobe-pos" />
    <circle cx="105" cy="215" r="3" class="nucleus" />

    <!-- Orbital B (right) -->
    <ellipse cx="185" cy="215" rx="35" ry="20" class="lobe-pos" />
    <circle cx="185" cy="215" r="3" class="nucleus" />

    <!-- Overlap zone -->
    <ellipse cx="145" cy="215" rx="15" ry="16" class="overlap-region" />

    <text x="145" y="270" class="text-body" text-anchor="middle" font-weight="bold" fill="#6d28d9">Maximum electron density</text>
    <text x="145" y="288" class="text-sub" text-anchor="middle">concentrated directly along the axis</text>
    <text x="145" y="315" class="text-sub" text-anchor="middle" fill="#059669">✓ Cylindrical symmetry, no nodal plane on axis</text>
  </g>

  <!-- Stage 3: Lateral Side-on Overlap (Pi Bond) -->
  <g data-g9-stage-id="SIGMA-PI-3">
    <rect x="310" y="115" width="270" height="225" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="325" y="140" class="text-title">Stage 3: Overlap B (Pi, π)</text>
    <text x="325" y="160" class="text-sub">Side-on (lateral) parallel overlap</text>

    <!-- Axis / Nodal plane -->
    <line x1="320" y1="215" x2="560" y2="215" class="nodal-line" />
    <text x="545" y="210" class="text-sub" fill="#dc2626" text-anchor="end">Nodal plane</text>

    <!-- P-orbital A (left vertical lobes) -->
    <ellipse cx="395" cy="180" rx="18" ry="30" class="lobe-pos" />
    <ellipse cx="395" cy="250" rx="18" ry="30" class="lobe-neg" />
    <circle cx="395" cy="215" r="3" class="nucleus" />

    <!-- P-orbital B (right vertical lobes) -->
    <ellipse cx="475" cy="180" rx="18" ry="30" class="lobe-pos" />
    <ellipse cx="475" cy="250" rx="18" ry="30" class="lobe-neg" />
    <circle cx="475" cy="215" r="3" class="nucleus" />

    <!-- Lateral Overlap lobes top & bottom -->
    <ellipse cx="435" cy="180" rx="12" ry="18" class="overlap-region" />
    <ellipse cx="435" cy="250" rx="12" ry="18" class="overlap-region" />

    <text x="435" y="295" class="text-body" text-anchor="middle" font-weight="bold" fill="#6d28d9">Density above &amp; below axis</text>
    <text x="435" y="318" class="text-sub" text-anchor="middle" fill="#dc2626">Zero density (nodal plane) on the internuclear axis</text>
  </g>
</svg>
