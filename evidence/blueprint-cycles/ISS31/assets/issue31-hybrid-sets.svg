<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Hybrid set size</title>
<desc id="desc">Three directions map to sp2 and four directions map to sp3; hybrid set size equals direction count.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="HYB-1"><text x="155" y="55" font-size="26">Start with direction count</text><text x="110" y="105" font-size="24">3 directions</text><text x="500" y="105" font-size="24">4 directions</text></g><g data-g9-stage-id="HYB-2"><circle cx="210" cy="205" r="25" fill="none" stroke="currentColor" stroke-width="3"/><line x1="210" y1="180" x2="210" y2="120" stroke="currentColor" stroke-width="3"/><line x1="190" y1="220" x2="120" y2="270" stroke="currentColor" stroke-width="3"/><line x1="230" y1="220" x2="300" y2="270" stroke="currentColor" stroke-width="3"/><text x="160" y="325" font-size="26">sp²</text><circle cx="535" cy="205" r="25" fill="none" stroke="currentColor" stroke-width="3"/><line x1="535" y1="180" x2="535" y2="120" stroke="currentColor" stroke-width="3"/><line x1="510" y1="210" x2="430" y2="245" stroke="currentColor" stroke-width="3"/><line x1="560" y1="210" x2="640" y2="245" stroke="currentColor" stroke-width="3"/><line x1="535" y1="230" x2="535" y2="315" stroke="currentColor" stroke-width="3"/><text x="500" y="350" font-size="26">sp³</text></g><g data-g9-stage-id="HYB-3"><text x="115" y="385" font-size="20">sp² = 3 hybrids; sp³ = 4 hybrids. Set size equals the modelled directions.</text></g>
</svg>

