<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Sigma and pi overlap</title>
<desc id="desc">End-on overlap lies along the internuclear axis; side-on overlap lies on opposite sides of the axis.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="SIG-1"><line x1="70" y1="200" x2="700" y2="200" stroke="currentColor" stroke-width="2" stroke-dasharray="6 6"/><text x="260" y="185" font-size="20">internuclear axis</text></g><g data-g9-stage-id="SIG-2"><ellipse cx="160" cy="120" rx="70" ry="35" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="240" cy="120" rx="70" ry="35" fill="none" stroke="currentColor" stroke-width="3"/><text x="105" y="75" font-size="24">σ: end-on along axis</text></g><g data-g9-stage-id="SIG-3"><ellipse cx="510" cy="120" rx="35" ry="65" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="620" cy="120" rx="35" ry="65" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="510" cy="280" rx="35" ry="65" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="620" cy="280" rx="35" ry="65" fill="none" stroke="currentColor" stroke-width="3"/><text x="455" y="380" font-size="22">π: side-on; nodal plane contains axis</text></g>
</svg>

