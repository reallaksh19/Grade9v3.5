<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Ammonia four electron domains</title>
<desc id="desc">Nitrogen with three bonding domains and one lone-pair domain arranged tetrahedrally.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="NH3-1"><text x="345" y="210" font-size="30">N</text><text x="205" y="55" font-size="22">3 N–H domains + 1 lone-pair domain</text></g><g data-g9-stage-id="NH3-2"><line x1="365" y1="185" x2="365" y2="80" stroke="currentColor" stroke-width="4"/><text x="325" y="65" font-size="21">lone pair</text><line x1="345" y1="210" x2="210" y2="275" stroke="currentColor" stroke-width="4"/><polygon points="385,210 535,150 505,195" fill="none" stroke="currentColor" stroke-width="4"/><line x1="380" y1="225" x2="505" y2="310" stroke="currentColor" stroke-width="3" stroke-dasharray="9 7"/><text x="180" y="300" font-size="22">H</text><text x="550" y="150" font-size="22">H</text><text x="520" y="330" font-size="22">H</text></g><g data-g9-stage-id="NH3-3"><text x="125" y="380" font-size="20">Electron-domain geometry: tetrahedral. Atom-only NH₃ molecular geometry: trigonal pyramidal.</text></g>
</svg>

