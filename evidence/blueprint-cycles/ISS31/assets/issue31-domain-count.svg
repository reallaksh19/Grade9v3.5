<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">Electron-domain counting</title>
<desc id="desc">A central atom with three distinct neighbour directions; a double bond remains one direction.</desc>
<rect x="1" y="1" width="758" height="398" rx="18" fill="white" stroke="currentColor"/>
<g data-g9-stage-id="DOM-1"><circle cx="270" cy="200" r="34" fill="none" stroke="currentColor" stroke-width="3"/><text x="255" y="207" font-size="24">C</text><text x="210" y="55" font-size="22">Choose the counting centre</text></g><g data-g9-stage-id="DOM-2"><line x1="304" y1="200" x2="430" y2="200" stroke="currentColor" stroke-width="3"/><line x1="307" y1="210" x2="430" y2="210" stroke="currentColor" stroke-width="3"/><line x1="245" y1="175" x2="170" y2="95" stroke="currentColor" stroke-width="3"/><line x1="245" y1="225" x2="170" y2="305" stroke="currentColor" stroke-width="3"/><text x="445" y="208" font-size="22">O — one direction</text><text x="130" y="90" font-size="22">H</text><text x="130" y="325" font-size="22">H</text></g><g data-g9-stage-id="DOM-3"><text x="170" y="365" font-size="20">Count local directions/regions, not bond lines or neighbour lone pairs.</text></g>
