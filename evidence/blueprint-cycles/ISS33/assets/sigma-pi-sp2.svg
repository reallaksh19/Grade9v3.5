<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Staged sigma-framework and perpendicular p-orbital scaffold" font-family="system-ui, sans-serif" font-size="23">
<title>Sigma framework and remaining p-orbital scaffold</title>
<desc>A staged generic local-centre diagram. It separates three coplanar sigma directions from a perpendicular p orbital and then shows side-on p overlap with a neighbouring centre. It does not name a molecule or give a final hybridisation answer.</desc>
<g data-g9-stage-id="HYB-SP2-1">
  <text x="55" y="38">Stage 1 — sigma-direction frame in the molecular plane</text>
  <circle cx="300" cy="250" r="24" fill="none" stroke="currentColor" stroke-width="4"/>
  <line x1="300" y1="250" x2="455" y2="250" stroke="currentColor" stroke-width="6"/>
  <line x1="285" y1="230" x2="185" y2="125" stroke="currentColor" stroke-width="6"/>
  <line x1="285" y1="270" x2="185" y2="375" stroke="currentColor" stroke-width="6"/>
  <text x="155" y="430">page = molecular plane</text>
</g>
<g data-g9-stage-id="HYB-SP2-2">
  <text x="505" y="105">perpendicular p direction</text>
  <ellipse cx="300" cy="155" rx="30" ry="70" fill="none" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="300" cy="345" rx="30" ry="70" fill="none" stroke="currentColor" stroke-width="4"/>
  <text x="500" y="140">shown projected onto page;</text>
  <text x="500" y="170">physically above/below plane</text>
</g>
<g data-g9-stage-id="HYB-SP2-3">
  <circle cx="535" cy="250" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="535" cy="155" rx="30" ry="70" fill="none" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="535" cy="345" rx="30" ry="70" fill="none" stroke="currentColor" stroke-width="4"/>
  <path d="M330 155 C390 125 445 125 505 155" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="10 7"/>
  <path d="M330 345 C390 375 445 375 505 345" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="365" y="95">side-on overlap requires parallel p directions</text>
</g>
<g data-g9-stage-id="HYB-SP2-4">
  <text x="55" y="462">Inventory check: give each local orbital one job; do not count a pi component as a new sigma direction.</text>
</g>
</svg>