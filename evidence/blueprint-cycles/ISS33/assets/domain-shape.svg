<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Electron-domain geometry and atom-only shape scaffold" font-family="system-ui, sans-serif" font-size="24">
<title>Electron-domain geometry and molecular-shape scaffold</title>
<desc>Staged comparison of three and four electron-domain directions, then bond versus lone-pair occupancy. No hybridisation label is stated.</desc>
<g data-g9-stage-id="HYB-DOMAIN-1">
  <text x="70" y="45">Count directions / regions first</text>
  <circle cx="200" cy="205" r="25" fill="none" stroke="currentColor" stroke-width="4"/>
  <line x1="200" y1="180" x2="200" y2="90" stroke="currentColor" stroke-width="5"/>
  <line x1="178" y1="218" x2="95" y2="270" stroke="currentColor" stroke-width="5"/>
  <line x1="222" y1="218" x2="305" y2="270" stroke="currentColor" stroke-width="5"/>
  <text x="135" y="330">3 domain directions</text>
  <circle cx="550" cy="205" r="25" fill="none" stroke="currentColor" stroke-width="4"/>
  <line x1="550" y1="180" x2="550" y2="90" stroke="currentColor" stroke-width="5"/>
  <line x1="528" y1="218" x2="445" y2="270" stroke="currentColor" stroke-width="5"/>
  <line x1="572" y1="218" x2="655" y2="270" stroke="currentColor" stroke-width="5"/>
  <line x1="565" y1="195" x2="655" y2="155" stroke="currentColor" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="485" y="330">4 domain directions</text>
</g>
<g data-g9-stage-id="HYB-DOMAIN-2">
  <text x="70" y="375">A lone pair occupies a domain direction even though no atom sits there.</text>
  <circle cx="655" cy="155" r="9" fill="currentColor"/>
  <circle cx="682" cy="143" r="9" fill="currentColor"/>
  <text x="610" y="115">lone-pair position</text>
</g>
<g data-g9-stage-id="HYB-DOMAIN-3">
  <text x="70" y="410">Electron-domain geometry counts every region; molecular shape follows bonded-atom positions.</text>
</g>
</svg>