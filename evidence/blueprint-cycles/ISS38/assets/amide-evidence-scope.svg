<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" role="img" aria-label="Amide evidence and model-scope map" font-family="sans-serif" font-size="22"><title>Inventory, model and physical evidence</title><desc>Construct the planar nuclear framework and local Lewis inventory, then distinguish a qualitative aligned-donor account from the evidence needed for quantitative claims. This is not the torsion diagram.</desc><style>text{stroke:none}</style><g stroke="currentColor" stroke-width="3" fill="currentColor"><g data-g9-stage-id="ISS38-SCOPE-1"><text x="25" y="40">Amide: local inventory and physical inference</text><text x="310" y="220">N</text><text x="170" y="310">H</text><text x="470" y="310">H</text><text x="310" y="100">C(=O)H</text></g><g data-g9-stage-id="ISS38-SCOPE-2"><line x1="320" y1="200" x2="320" y2="120"/><line x1="305" y1="230" x2="200" y2="290"/><line x1="340" y1="230" x2="450" y2="290"/><text x="25" y="350">Given approximately planar sigma framework.</text></g><g data-g9-stage-id="ISS38-SCOPE-3"><text x="25" y="390">Lewis bookkeeping: three bonds + one pair.</text></g><g data-g9-stage-id="ISS38-SCOPE-4"><rect x="25" y="410" width="270" height="70" fill="none"/><rect x="325" y="410" width="285" height="70" fill="none"/><text x="40" y="440">Aligned donor model</text><text x="340" y="440">Physical measurements</text><text x="40" y="465">qualitative account</text><text x="340" y="465">needed for strength</text></g><g data-g9-stage-id="ISS38-SCOPE-5"><text x="25" y="520">Geometry constrains a model.</text><text x="25" y="555">It does not measure a unique orbital basis.</text></g></g></svg>