<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Conjugation continuity: Direct amide vs saturated spacer" font-family="system-ui, sans-serif" font-size="24">
<title>Conjugation continuity: Direct amide vs saturated spacer</title>
<desc>Comparison of site A direct amide where continuous pz orbitals enable delocalisation with site B separated amine where intervening sp3 CH2 group blocks conjugation.</desc>
<g data-g9-stage-id="CONT-1">
  <text x="40" y="45" font-weight="700">Site A · Direct amide: continuous aligned p-orbital highway</text>
  <line x1="220" y1="130" x2="360" y2="130" stroke="currentColor" stroke-width="6"/>
  <line x1="360" y1="130" x2="500" y2="130" stroke="currentColor" stroke-width="6"/>
  <circle cx="220" cy="130" r="28" fill="white" stroke="currentColor" stroke-width="3"/>
  <circle cx="360" cy="130" r="28" fill="white" stroke="currentColor" stroke-width="3"/>
  <circle cx="500" cy="130" r="28" fill="white" stroke="currentColor" stroke-width="3"/>
  <text x="212" y="138">O</text>
  <text x="352" y="138">C</text>
  <text x="492" y="138">N</text>
  <ellipse cx="220" cy="90" rx="18" ry="30" fill="#bbf7d0" stroke="currentColor" stroke-width="2"/>
  <ellipse cx="360" cy="90" rx="18" ry="30" fill="#bbf7d0" stroke="currentColor" stroke-width="2"/>
  <ellipse cx="500" cy="90" rx="18" ry="30" fill="#bbf7d0" stroke="currentColor" stroke-width="2"/>
  <text x="545" y="110">Contiguous p_z orbitals → Delocalised π system</text>
</g>
<g data-g9-stage-id="CONT-2">
  <text x="40" y="240" font-weight="700">Site B · Intervening saturated CH2 node (sp3 insulated)</text>
  <line x1="160" y1="320" x2="280" y2="320" stroke="currentColor" stroke-width="6"/>
  <line x1="280" y1="320" x2="440" y2="320" stroke="currentColor" stroke-width="6"/>
  <line x1="440" y1="320" x2="600" y2="320" stroke="currentColor" stroke-width="6"/>
  <circle cx="160" cy="320" r="28" fill="white" stroke="currentColor" stroke-width="3"/>
  <circle cx="280" cy="320" r="28" fill="white" stroke="currentColor" stroke-width="3"/>
  <circle cx="440" cy="320" r="28" fill="#fed7aa" stroke="currentColor" stroke-width="3"/>
  <circle cx="600" cy="320" r="28" fill="white" stroke="currentColor" stroke-width="3"/>
  <text x="152" y="328">O</text>
  <text x="272" y="328">C</text>
  <text x="422" y="328">CH2</text>
  <text x="592" y="328">N</text>
  <ellipse cx="160" cy="280" rx="18" ry="30" fill="#bbf7d0" stroke="currentColor" stroke-width="2"/>
  <ellipse cx="280" cy="280" rx="18" ry="30" fill="#bbf7d0" stroke="currentColor" stroke-width="2"/>
  <text x="380" y="400">CH2 is saturated sp3: no unhybridised p orbital</text>
</g>
<g data-g9-stage-id="CONT-3">
  <text x="40" y="470" font-weight="700">Conjugation broken: N lone pair remains localized, pyramidal (sp3), basic</text>
  <text x="40" y="505">Spatial proximity in folded conformations does NOT create continuous conjugation</text>
</g>
</svg>