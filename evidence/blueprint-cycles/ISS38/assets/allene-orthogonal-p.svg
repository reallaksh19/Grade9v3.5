<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Allene orthogonal p-orbital and perpendicular planes model" font-family="system-ui, sans-serif" font-size="24">
<title>Allene orthogonal p-orbital and perpendicular planes model</title>
<desc>Staged orbital model showing the central sp carbon of allene having two orthogonal p orbitals forming independent pi bonds with terminal sp2 carbons, resulting in mutually perpendicular terminal CH2 planes.</desc>
<g data-g9-stage-id="HYB-ALLENE-1">
  <text x="40" y="45" font-weight="700">1 · Linear sigma axis and orbital hybridization (sp2 = sp = sp2)</text>
  <line x1="220" y1="160" x2="680" y2="160" stroke="currentColor" stroke-width="7"/>
  <circle cx="220" cy="160" r="34" fill="white" stroke="currentColor" stroke-width="4"/>
  <circle cx="450" cy="160" r="34" fill="white" stroke="currentColor" stroke-width="4"/>
  <circle cx="680" cy="160" r="34" fill="white" stroke="currentColor" stroke-width="4"/>
  <text x="205" y="170">C</text>
  <text x="435" y="170">C</text>
  <text x="665" y="170">C</text>
  <text x="180" y="220">sp2</text>
  <text x="425" y="220">sp</text>
  <text x="640" y="220">sp2</text>
</g>
<g data-g9-stage-id="HYB-ALLENE-2">
  <text x="40" y="270" font-weight="700">2 · First π overlap (vertical p_y alignment on C1 and C2)</text>
  <ellipse cx="335" cy="125" rx="90" ry="24" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="6 4"/>
  <ellipse cx="335" cy="195" rx="90" ry="24" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="250" y="250">p_y orbitals aligned in vertical plane</text>
</g>
<g data-g9-stage-id="HYB-ALLENE-3">
  <text x="470" y="270" font-weight="700">3 · Second π overlap (horizontal p_z alignment on C2 and C3)</text>
  <ellipse cx="565" cy="115" rx="24" ry="82" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="6 4"/>
  <ellipse cx="565" cy="205" rx="24" ry="82" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="500" y="320">orthogonal p_z direction on central carbon</text>
</g>
<g data-g9-stage-id="HYB-ALLENE-4">
  <text x="40" y="380" font-weight="700">4 · Geometric consequence: mutually perpendicular terminal CH2 planes (90° dihedral)</text>
  <rect x="170" y="410" width="210" height="70" fill="none" stroke="currentColor" stroke-width="4"/>
  <polygon points="590,400 700,445 590,490 480,445" fill="none" stroke="currentColor" stroke-width="4"/>
  <text x="190" y="455">terminal CH2 in vertical plane</text>
  <text x="500" y="515">terminal CH2 in horizontal plane</text>
</g>
</svg>