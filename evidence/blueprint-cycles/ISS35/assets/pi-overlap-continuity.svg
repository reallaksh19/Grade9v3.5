<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Sigma rotation and p-orbital continuity model" font-family="system-ui, sans-serif" font-size="25">
<title>Sigma rotation and p-orbital continuity model</title><desc>Four staged qualitative views: sigma bond axis, parallel p orbitals for pi overlap, a continuous four-p-orbital chain, and an sp3 interruption between separated double bonds.</desc>
<g data-g9-stage-id="HYB-PI-1"><text x="35" y="45" font-weight="700">1 · Sigma axis</text><circle cx="190" cy="115" r="34" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="420" cy="115" r="34" fill="none" stroke="currentColor" stroke-width="4"/><line x1="224" y1="115" x2="386" y2="115" stroke="currentColor" stroke-width="8"/><text x="465" y="125">end-on overlap stays on the C–C axis</text></g>
<g data-g9-stage-id="HYB-PI-2"><text x="35" y="205" font-weight="700">2 · π overlap needs parallel p orbitals</text><ellipse cx="260" cy="265" rx="26" ry="60" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="360" cy="265" rx="26" ry="60" fill="none" stroke="currentColor" stroke-width="4"/><text x="430" y="272">twisting changes their relative orientation</text></g>
<g data-g9-stage-id="HYB-PI-3"><text x="35" y="365" font-weight="700">3 · Continuous p pathway: CH2=CH–CH=CH2</text><g transform="translate(170 395)"><ellipse cx="0" cy="0" rx="24" ry="55" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="150" cy="0" rx="24" ry="55" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="300" cy="0" rx="24" ry="55" fill="none" stroke="currentColor" stroke-width="4"/><ellipse cx="450" cy="0" rx="24" ry="55" fill="none" stroke="currentColor" stroke-width="4"/></g><text x="660" y="405">p–p–p–p</text></g>
<g data-g9-stage-id="HYB-PI-4"><text x="35" y="490" font-weight="700">4 · Interrupted pathway: CH2=CH–CH2–CH=CH2</text><text x="155" y="530">p–p</text><rect x="340" y="495" width="180" height="38" fill="none" stroke="currentColor" stroke-width="3"/><text x="365" y="525">sp3 CH2: no p bridge</text><text x="650" y="530">p–p</text></g>
</svg>
