<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Cone on hemisphere with hidden joining circle" font-family="system-ui, sans-serif" font-size="26">
  <title>Composite solid and hidden interface</title>
  <desc>Three complete staged views of a cone mounted on a hemisphere. The common circular joining face is shown as an internal dashed interface so the learner can reason about exposed surfaces without seeing the final area expression.</desc>
  <g data-g9-stage-id="SAV-JOINT-1">
    <path d="M320 45 L155 235 L485 235 Z" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M155 235 C170 455 470 455 485 235" fill="none" stroke="currentColor" stroke-width="5"/>
    <ellipse cx="320" cy="235" rx="165" ry="38" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="11 9"/>
  </g>
  <g data-g9-stage-id="SAV-JOINT-2">
    <path d="M320 45 L155 235 L485 235 Z" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M155 235 C170 455 470 455 485 235" fill="none" stroke="currentColor" stroke-width="5"/>
    <ellipse cx="320" cy="235" rx="165" ry="38" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="11 9"/>
    <text x="92" y="205">shared joining circle</text>
    <line x1="290" y1="210" x2="315" y2="226" stroke="currentColor" stroke-width="3"/>
    <text x="92" y="340">outside hemisphere</text>
    <line x1="290" y1="330" x2="250" y2="345" stroke="currentColor" stroke-width="3"/>
  </g>
  <g data-g9-stage-id="SAV-JOINT-3">
    <path d="M320 45 L155 235 L485 235 Z" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M155 235 C170 455 470 455 485 235" fill="none" stroke="currentColor" stroke-width="5"/>
    <ellipse cx="320" cy="235" rx="165" ry="38" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="11 9"/>
    <text x="92" y="205">shared joining circle</text>
    <line x1="290" y1="210" x2="315" y2="226" stroke="currentColor" stroke-width="3"/>
    <text x="92" y="340">outside hemisphere</text>
    <line x1="290" y1="330" x2="250" y2="345" stroke="currentColor" stroke-width="3"/>
    <text x="82" y="410">Touch test: which surfaces can be reached after assembly?</text>
