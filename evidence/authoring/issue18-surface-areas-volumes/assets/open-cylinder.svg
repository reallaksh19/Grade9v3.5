<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Open cylinder surface inventory" font-family="system-ui, sans-serif" font-size="26">
  <title>Open cylinder surface inventory</title>
  <desc>An open cylinder showing its curved wall, bottom circular base, and the absent top. The drawing supports deciding which physical surfaces exist without giving an area formula.</desc>
  <g data-g9-stage-id="SAV-SURF-1">
    <ellipse cx="260" cy="95" rx="120" ry="38" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="12 10"/>
    <path d="M140 95 V300 M380 95 V300" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M140 300 C140 350 380 350 380 300" fill="none" stroke="currentColor" stroke-width="5"/>
    <path d="M140 300 C140 250 380 250 380 300" fill="none" stroke="currentColor" stroke-width="5"/>
    <text x="410" y="105">open top</text>
    <line x1="385" y1="100" x2="360" y2="95" stroke="currentColor" stroke-width="3"/>
  </g>
  <g data-g9-stage-id="SAV-SURF-2">
    <text x="410" y="205">curved wall</text>
    <line x1="400" y1="195" x2="375" y2="195" stroke="currentColor" stroke-width="3"/>
    <text x="410" y="315">bottom disk</text>
    <line x1="400" y1="305" x2="360" y2="300" stroke="currentColor" stroke-width="3"/>
  </g>
  <g data-g9-stage-id="SAV-SURF-3">
    <text x="80" y="390">Inventory physical surfaces before choosing a formula.</text>
  </g>
</svg>