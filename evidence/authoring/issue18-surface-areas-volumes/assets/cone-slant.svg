<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Cone axial cross-section for slant height" font-family="system-ui, sans-serif" font-size="26">
  <title>Cone axial cross-section for slant height</title>
  <desc>Three complete staged views of a cone cross-section showing radius r, vertical height h, and slant height l as a right triangle without revealing the numerical slant height.</desc>
  <g data-g9-stage-id="SAV-CONE-1">
    <path d="M320 55 L130 325 L510 325 Z" fill="none" stroke="currentColor" stroke-width="5"/>
    <line x1="320" y1="55" x2="320" y2="325" stroke="currentColor" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="320" y1="325" x2="510" y2="325" stroke="currentColor" stroke-width="4"/>
    <path d="M320 295 H350 V325" fill="none" stroke="currentColor" stroke-width="3"/>
  </g>
  <g data-g9-stage-id="SAV-CONE-2">
    <path d="M320 55 L130 325 L510 325 Z" fill="none" stroke="currentColor" stroke-width="5"/>
    <line x1="320" y1="55" x2="320" y2="325" stroke="currentColor" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="320" y1="325" x2="510" y2="325" stroke="currentColor" stroke-width="4"/>
    <path d="M320 295 H350 V325" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="395" y="350">r</text>
    <text x="285" y="200">h</text>
    <text x="430" y="185">l ?</text>
  </g>
  <g data-g9-stage-id="SAV-CONE-3">
    <path d="M320 55 L130 325 L510 325 Z" fill="none" stroke="currentColor" stroke-width="5"/>
    <line x1="320" y1="55" x2="320" y2="325" stroke="currentColor" stroke-width="4" stroke-dasharray="10 8"/>
    <line x1="320" y1="325" x2="510" y2="325" stroke="currentColor" stroke-width="4"/>
    <path d="M320 295 H350 V325" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="395" y="350">r</text>
    <text x="285" y="200">h</text>
    <text x="430" y="185">l ?</text>
    <text x="88" y="395">Which relation links r, h and the needed length?</text>
  </g>
</svg>