<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" role="img" aria-labelledby="poly-title poly-desc">
  <title id="poly-title">Power slots after combining like terms</title>
  <desc id="poly-desc">Powers zero through three are candidate slots. Combine coefficients in each slot, then mark the highest slot with a nonzero coefficient.</desc>
  <g data-g9-stage-id="VIS-POLY-POWERS">
    <rect x="20" y="20" width="560" height="130" fill="#fff" stroke="#263444"/>
    <text x="48" y="55" font-size="18">power 0</text><text x="180" y="55" font-size="18">power 1</text>
    <text x="315" y="55" font-size="18">power 2</text><text x="448" y="55" font-size="18">power 3</text>
  </g>
  <g data-g9-stage-id="VIS-POLY-COEFF">
    <text x="48" y="95" font-size="16">combine</text><text x="180" y="95" font-size="16">combine</text>
    <text x="315" y="95" font-size="16">combine</text><text x="448" y="95" font-size="16">combine</text>
  </g>
  <g data-g9-stage-id="VIS-POLY-DEGREE">
    <rect x="153" y="105" width="300" height="32" fill="#e6f2ff" stroke="#17589a"/>
    <text x="165" y="127" font-size="16">choose highest nonzero slot</text>
  </g>
</svg>
