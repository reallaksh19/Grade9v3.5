<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Solutions of 3x plus 4y equals 12</title>
  <desc id="desc">A staged coordinate-plane construction: first the equation and axes, then a table of valid solution pairs, then the plotted pairs, then the straight line through all solutions and its intercepts.</desc>
  <rect width="800" height="520" fill="white"/>
  <g data-g9-stage-id="VIS-MAT-LEQ-04-G0">
    <text x="36" y="44" font-size="26" font-weight="700">3x + 4y = 12</text>
    <line x1="100" y1="400" x2="650" y2="400" stroke="black" stroke-width="3"/>
    <line x1="250" y1="470" x2="250" y2="90" stroke="black" stroke-width="3"/>
    <text x="660" y="407" font-size="20">x</text>
    <text x="240" y="80" font-size="20">y</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-LEQ-04-G1">
    <rect x="520" y="90" width="225" height="150" fill="none" stroke="black" stroke-width="2"/>
    <text x="545" y="122" font-size="19" font-weight="700">Solution pairs</text>
    <text x="545" y="156" font-size="18">(0, 3)</text>
    <text x="545" y="188" font-size="18">(2, 1.5)</text>
    <text x="545" y="220" font-size="18">(4, 0)</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-LEQ-04-G2">
    <circle cx="250" cy="220" r="8" fill="black"/>
    <circle cx="350" cy="310" r="8" fill="black"/>
    <circle cx="450" cy="400" r="8" fill="black"/>
    <text x="265" y="212" font-size="18">(0, 3)</text>
    <text x="365" y="302" font-size="18">(2, 1.5)</text>
    <text x="462" y="394" font-size="18">(4, 0)</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-LEQ-04-G3">
    <line x1="180" y1="157" x2="500" y2="445" stroke="black" stroke-width="4"/>
    <text x="365" y="458" font-size="18">Every point on this line is a solution.</text>
    <text x="282" y="248" font-size="18">y-intercept</text>
    <text x="455" y="430" font-size="18">x-intercept</text>
  </g>
</svg>
