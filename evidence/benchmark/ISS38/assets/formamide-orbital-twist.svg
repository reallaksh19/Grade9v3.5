<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Formamide orbital alignment and torsional rotation" font-family="system-ui, sans-serif" font-size="24">
<title>Formamide orbital alignment and torsional rotation</title>
<desc>Staged qualitative model showing planar formamide parallel p-orbital alignment, continuous 3-center pi delocalisation, 90-degree twist around C-N, and resulting orbital orthogonality with zero overlap.</desc>
<g data-g9-stage-id="HYB-TWIST-1">
  <text x="40" y="45" font-weight="700">1 · Planar ground state: parallel p-orbital alignment</text>
  <line x1="220" y1="160" x2="440" y2="160" stroke="currentColor" stroke-width="6"/>
  <line x1="440" y1="160" x2="660" y2="160" stroke="currentColor" stroke-width="6"/>
  <circle cx="220" cy="160" r="32" fill="white" stroke="currentColor" stroke-width="4"/>
  <circle cx="440" cy="160" r="32" fill="white" stroke="currentColor" stroke-width="4"/>
  <circle cx="660" cy="160" r="32" fill="white" stroke="currentColor" stroke-width="4"/>
  <text x="210" y="168">O</text>
  <text x="430" y="168">C</text>
  <text x="650" y="168">N</text>
  <ellipse cx="220" cy="105" rx="22" ry="40" fill="#dbeafe" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="220" cy="215" rx="22" ry="40" fill="#bfdbfe" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="440" cy="105" rx="22" ry="40" fill="#dbeafe" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="440" cy="215" rx="22" ry="40" fill="#bfdbfe" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="660" cy="105" rx="22" ry="40" fill="#dbeafe" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="660" cy="215" rx="22" ry="40" fill="#bfdbfe" stroke="currentColor" stroke-width="3"/>
  <text x="165" y="285">p_z (O)</text>
  <text x="405" y="285">p_z (C)</text>
  <text x="615" y="285">p_z (N lone pair)</text>
</g>
<g data-g9-stage-id="HYB-TWIST-2">
  <text x="40" y="335" font-weight="700">2 · Delocalised 3-center 4-electron π system</text>
  <path d="M 220 90 Q 440 60 660 90 Q 440 120 220 90 Z" fill="#3b82f6" opacity="0.25" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 220 230 Q 440 260 660 230 Q 440 200 220 230 Z" fill="#3b82f6" opacity="0.25" stroke="#2563eb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="260" y="375">Continuous π overlap: maximum delocalisation (cos θ = 1.0)</text>
</g>
<g data-g9-stage-id="HYB-TWIST-3">
  <text x="40" y="425" font-weight="700">3 · Conformation twisted 90° about C–N bond</text>
  <text x="60" y="460">Rotation turns nitrogen p-orbital into xy plane (now p_y, perpendicular to C p_z)</text>
</g>
<g data-g9-stage-id="HYB-TWIST-4">
  <text x="40" y="495" font-weight="700">4 · Orthogonality: zero overlap integral (cos 90° = 0.0), electron count invariant</text>
</g>
</svg>