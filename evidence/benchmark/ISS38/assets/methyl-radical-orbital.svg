<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Methyl radical planar sp2 and SOMO p-orbital model" font-family="system-ui, sans-serif" font-size="24">
<title>Methyl radical planar sp2 and SOMO p-orbital model</title>
<desc>Staged orbital model of neutral methyl radical CH3 dot, showing the trigonal planar sp2 sigma framework in the xy plane and the perpendicular unhybridised pz orbital holding one unpaired electron (SOMO).</desc>
<g data-g9-stage-id="RAD-1">
  <text x="40" y="45" font-weight="700">1 · Planar sp2 carbon sigma framework (120° angles in xy plane)</text>
  <circle cx="450" cy="260" r="36" fill="white" stroke="currentColor" stroke-width="4"/>
  <text x="440" y="268">C</text>
  <line x1="450" y1="260" x2="230" y2="260" stroke="currentColor" stroke-width="6"/>
  <line x1="450" y1="260" x2="560" y2="140" stroke="currentColor" stroke-width="6"/>
  <line x1="450" y1="260" x2="560" y2="380" stroke="currentColor" stroke-width="6"/>
  <circle cx="230" cy="260" r="24" fill="white" stroke="currentColor" stroke-width="3"/>
  <circle cx="560" cy="140" r="24" fill="white" stroke="currentColor" stroke-width="3"/>
  <circle cx="560" cy="380" r="24" fill="white" stroke="currentColor" stroke-width="3"/>
  <text x="222" y="268">H</text>
  <text x="552" y="148">H</text>
  <text x="552" y="388">H</text>
  <text x="290" y="240">sp2–s σ</text>
  <text x="510" y="210">sp2–s σ</text>
  <text x="510" y="320">sp2–s σ</text>
</g>
<g data-g9-stage-id="RAD-2">
  <text x="40" y="95" font-weight="700">2 · Perpendicular unhybridised 2p_z orbital</text>
  <ellipse cx="450" cy="150" rx="35" ry="65" fill="#fed7aa" stroke="currentColor" stroke-width="3"/>
  <ellipse cx="450" cy="370" rx="35" ry="65" fill="#ffedd5" stroke="currentColor" stroke-width="3"/>
  <text x="380" y="110">p_z lobe (+)</text>
  <text x="380" y="455">p_z lobe (-)</text>
</g>
<g data-g9-stage-id="RAD-3">
  <text x="40" y="495" font-weight="700">3 · SOMO occupancy: 1 unpaired electron (distinct from 0e- carbocation and 2e- carbanion)</text>
  <circle cx="450" cy="150" r="9" fill="#ea580c"/>
</g>
</svg>