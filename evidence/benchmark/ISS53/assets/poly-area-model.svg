<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" role="img" aria-labelledby="t d">
<title id="t">Changed-anchor binomial square construction</title>
<desc id="d">An authored square of side x plus two is partitioned into x squared, two rectangles of area two x, and a square of area four, showing where both cross terms arise.</desc>
<rect width="620" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="24" y="32" font-family="system-ui" font-size="18" font-weight="700">Authored square: side (x + 2)</text>
<g data-g9-stage-id="AREA-STAGE-1">
  <text x="24" y="64" font-family="system-ui" font-size="14">A square uses the same binomial for both dimensions.</text>
  <rect x="60" y="88" width="220" height="220" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <line x1="220" y1="88" x2="220" y2="308" stroke="#64748b"/><line x1="60" y1="248" x2="280" y2="248" stroke="#64748b"/>
  <text x="140" y="80" font-family="monospace">x</text><text x="247" y="80" font-family="monospace">2</text>
  <text x="43" y="170" font-family="monospace">x</text><text x="43" y="285" font-family="monospace">2</text>
</g>
<g data-g9-stage-id="AREA-STAGE-2">
  <text x="140" y="172" text-anchor="middle" font-family="monospace" font-size="18">x²</text>
  <text x="250" y="172" text-anchor="middle" font-family="monospace" font-size="18">2x</text>
  <text x="140" y="282" text-anchor="middle" font-family="monospace" font-size="18">2x</text>
  <text x="250" y="282" text-anchor="middle" font-family="monospace" font-size="18">4</text>
</g>
<g data-g9-stage-id="AREA-STAGE-3">
  <text x="330" y="120" font-family="system-ui" font-size="14" font-weight="700">Four regions, not two</text>
  <text x="330" y="155" font-family="monospace" font-size="15">x² + 2x + 2x + 4</text>
  <text x="330" y="185" font-family="monospace" font-size="15">= x² + 4x + 4</text>
  <text x="330" y="225" font-family="system-ui" font-size="13">The middle term comes from two cross rectangles.</text>
</g>
</svg>
