<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" role="img" aria-labelledby="t d">
<title id="t">Changed-anchor linear polynomial synthesis</title>
<desc id="d">An authored example with constant term minus four and zero two. The two conditions determine a line through zero minus four and two zero, giving r of x equals two x minus four.</desc>
<rect width="620" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="24" y="32" font-family="system-ui" font-size="18" font-weight="700">Authored constraints: constant −4, zero 2</text>
<line x1="70" y1="220" x2="320" y2="220" stroke="#64748b" stroke-width="2"/><line x1="150" y1="70" x2="150" y2="310" stroke="#64748b" stroke-width="2"/>
<g data-g9-stage-id="LIN-STAGE-1">
  <circle cx="150" cy="280" r="6"/><text x="165" y="283" font-family="system-ui" font-size="13">(0, −4): b = −4</text>
</g>
<g data-g9-stage-id="LIN-STAGE-2">
  <circle cx="270" cy="220" r="6"/><text x="280" y="211" font-family="system-ui" font-size="13">(2, 0): r(2)=0</text>
</g>
<g data-g9-stage-id="LIN-STAGE-3">
  <line x1="120" y1="310" x2="300" y2="190" stroke="#059669" stroke-width="3"/>
  <text x="350" y="112" font-family="monospace" font-size="14">r(x)=ax+b, a≠0</text>
  <text x="350" y="145" font-family="monospace" font-size="14">b=−4</text>
  <text x="350" y="178" font-family="monospace" font-size="14">2a−4=0 → a=2</text>
  <text x="350" y="211" font-family="monospace" font-size="14">r(x)=2x−4</text>
  <text x="350" y="247" font-family="system-ui" font-size="13">The changed constraints fix one non-zero a and one b.</text>
</g>
</svg>
