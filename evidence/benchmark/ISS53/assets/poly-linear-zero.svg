<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-labelledby="svg-lin-title svg-lin-desc">
  <title id="svg-lin-title">Linear Polynomial Synthesis: Constant Term and Zero Uniqueness</title>
  <desc id="svg-lin-desc">Geometric graph demonstrating how the constant term fixes the y-intercept at (0, 2) and the zero fixes the x-intercept at (1, 0), uniquely determining the linear polynomial p(x) = -2x + 2.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .border { stroke: #cbd5e1; stroke-width: 1.5; }
      .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #475569; }
      .axis { stroke: #64748b; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2; }
      .axis-label { font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b; }
      .point-const { fill: #2563eb; stroke: #1d4ed8; stroke-width: 2; }
      .point-zero { fill: #dc2626; stroke: #b91c1c; stroke-width: 2; }
      .plot-line { stroke: #059669; stroke-width: 3; stroke-linecap: round; }
      .point-label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; }
      .proof-box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
      .proof-header { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .proof-step { font-family: system-ui, sans-serif; font-size: 12px; fill: #334155; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="8" class="bg border"/>

  <!-- Canvas Header -->
  <text x="30" y="30" class="text-title">Linear Polynomial Synthesis: p(x) = ax + b</text>
  <text x="30" y="48" class="text-sub">Two independent geometric constraints uniquely fix both real coefficients (a, b)</text>

  <!-- Grid & Coordinate System (Origin at x=180, y=230, scale=60px per unit) -->
  <!-- Grid lines -->
  <line x1="60" y1="230" x2="320" y2="230" class="axis"/> <!-- X-axis -->
  <line x1="180" y1="70" x2="180" y2="310" class="axis"/> <!-- Y-axis -->

  <!-- Grid markers -->
  <text x="325" y="234" class="axis-label">x</text>
  <text x="175" y="65" class="axis-label">y</text>
  <text x="168" y="246" class="axis-label">0</text>
  <text x="240" y="246" class="axis-label">1</text>
  <text x="300" y="246" class="axis-label">2</text>
  <text x="120" y="246" class="axis-label">-1</text>
  <text x="160" y="174" class="axis-label">1</text>
  <text x="160" y="114" class="axis-label">2</text>
  <text x="160" y="294" class="axis-label">-1</text>

  <!-- Stage 1: Constant Term Condition (0, 2) -->
  <g data-g9-stage-id="LIN-STAGE-1">
    <!-- Point (0, 2) at x=180, y=110 -->
    <circle cx="180" cy="110" r="6" class="point-const"/>
    <text x="195" y="115" class="point-label" fill="#2563eb">p(0) = 2  → (0, 2)</text>
    <text x="195" y="132" font-family="system-ui, sans-serif" font-size="11px" fill="#1d4ed8">Condition 1: Constant term b = 2</text>
  </g>

  <!-- Stage 2: Zero Condition (1, 0) -->
  <g data-g9-stage-id="LIN-STAGE-2">
    <!-- Point (1, 0) at x=240, y=230 -->
    <circle cx="240" cy="230" r="6" class="point-zero"/>
    <text x="250" y="220" class="point-label" fill="#dc2626">p(1) = 0  → (1, 0)</text>
    <text x="250" y="236" font-family="system-ui, sans-serif" font-size="11px" fill="#b91c1c">Condition 2: Zero at x = 1</text>
  </g>

  <!-- Stage 3: Unique Straight Line and Proof of Uniqueness -->
  <g data-g9-stage-id="LIN-STAGE-3">
    <!-- Line connecting (-0.5, 3) to (1.5, -1) -> from x=150, y=50 to x=270, y=290 -->
    <line x1="140" y1="30" x2="280" y2="310" class="plot-line"/>
    <text x="270" y="295" font-family="monospace" font-size="14px" font-weight="700" fill="#047857">y = −2x + 2</text>

    <!-- Right Side Deduction Panel -->
    <rect x="350" y="70" width="220" height="255" class="proof-box"/>
    <text x="365" y="95" class="proof-header">Algebraic Deduction:</text>

    <text x="365" y="120" class="proof-step" font-weight="600">1. General linear form:</text>
    <text x="375" y="138" font-family="monospace" font-size="12px" fill="#2563eb">p(x) = ax + b,  a ≠ 0</text>

    <text x="365" y="162" class="proof-step" font-weight="600">2. Constant term condition:</text>
    <text x="375" y="180" font-family="monospace" font-size="12px" fill="#2563eb">p(0) = a(0) + b = 2  ⇒  b = 2</text>

    <text x="365" y="204" class="proof-step" font-weight="600">3. Zero condition:</text>
    <text x="375" y="222" font-family="monospace" font-size="12px" fill="#dc2626">p(1) = a(1) + 2 = 0  ⇒  a = −2</text>

    <text x="365" y="246" class="proof-step" font-weight="600">4. Uniqueness Proof:</text>
    <text x="375" y="264" font-family="system-ui, sans-serif" font-size="11px" fill="#0f172a">a + 2 = 0 has a unique solution</text>
    <text x="375" y="280" font-family="system-ui, sans-serif" font-size="11px" fill="#0f172a">in ℝ: a = −2 (non-zero, deg = 1).</text>
    <text x="375" y="302" font-family="system-ui, sans-serif" font-size="12px" font-weight="700" fill="#059669">Exactly ONE polynomial satisfies both!</text>
  </g>
</svg>
