<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t d">
<title id="t">Changed-anchor exponent criterion and substitution</title>
<desc id="d">Authored examples distinguish non-negative integer exponents from negative or fractional exponents, then show bracketed substitution on a different polynomial.</desc>
<rect width="640" height="360" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="24" y="32" font-family="system-ui" font-size="18" font-weight="700">Polynomial criterion: every exponent of x is 0, 1, 2, …</text>
<g data-g9-stage-id="EXP-STAGE-1">
  <text x="24" y="70" font-family="system-ui" font-size="14">Changed valid examples:</text>
  <text x="50" y="96" font-family="monospace">2x⁴ − x + 3  → exponents {4,1,0}</text>
  <text x="50" y="121" font-family="monospace">8 = 8x⁰        → exponent {0}</text>
</g>
<g data-g9-stage-id="EXP-STAGE-2">
  <text x="24" y="160" font-family="system-ui" font-size="14">Changed boundary examples:</text>
  <text x="50" y="186" font-family="monospace">2/x + 1 = 2x⁻¹ + 1  → negative exponent</text>
  <text x="50" y="211" font-family="monospace">x^(2/3) + 4          → fractional exponent</text>
</g>
<g data-g9-stage-id="EXP-STAGE-3">
  <text x="24" y="252" font-family="system-ui" font-size="14" font-weight="700">Separate skill: bracketed substitution</text>
  <text x="50" y="280" font-family="monospace">s(x)=2x²+x−1, x=3</text>
  <text x="50" y="305" font-family="monospace">s(3)=2(3)²+(3)−1</text>
  <text x="50" y="330" font-family="system-ui" font-size="13">Brackets preserve the multiplication and power structure before arithmetic.</text>
</g>
</svg>
