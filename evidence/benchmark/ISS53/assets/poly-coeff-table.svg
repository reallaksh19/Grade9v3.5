<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" role="img" aria-labelledby="t d">
<title id="t">Changed-anchor coefficient construction</title>
<desc id="d">An authored example r of x equals six x cubed minus x plus four. Powers three through zero are aligned so the omitted x squared power can be represented by coefficient zero.</desc>
<rect width="620" height="350" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="24" y="32" font-family="system-ui" font-size="18" font-weight="700">Authored example: r(x) = 6x³ − x + 4</text>
<g data-g9-stage-id="COEFF-STAGE-1">
  <text x="24" y="67" font-family="system-ui" font-size="14">Inventory powers from degree 3 down to 0 before filling coefficients.</text>
  <text x="24" y="91" font-family="monospace" font-size="15">r(x) = 6x³ + [?]x² − x + 4</text>
</g>
<g data-g9-stage-id="COEFF-STAGE-2">
  <rect x="24" y="112" width="572" height="150" fill="#fff" stroke="#cbd5e1"/>
  <text x="100" y="138" font-family="system-ui" font-size="13" font-weight="700">power</text>
  <text x="260" y="138" font-family="system-ui" font-size="13" font-weight="700">coefficient</text>
  <text x="430" y="138" font-family="system-ui" font-size="13" font-weight="700">term</text>
  <text x="100" y="169" font-family="monospace">3</text><text x="260" y="169" font-family="monospace">6</text><text x="430" y="169" font-family="monospace">6x³</text>
  <text x="100" y="199" font-family="monospace">2</text><text x="260" y="199" font-family="monospace" font-weight="700">0</text><text x="430" y="199" font-family="monospace">0x²</text>
  <text x="100" y="229" font-family="monospace">1</text><text x="260" y="229" font-family="monospace">−1</text><text x="430" y="229" font-family="monospace">−x</text>
  <text x="100" y="255" font-family="monospace">0</text><text x="260" y="255" font-family="monospace">4</text><text x="430" y="255" font-family="monospace">4</text>
</g>
<g data-g9-stage-id="COEFF-STAGE-3">
  <text x="24" y="296" font-family="system-ui" font-size="14" font-weight="700">Reconstruct to check correspondence</text>
  <text x="24" y="322" font-family="monospace" font-size="14">6x³ + 0x² − x + 4 = 6x³ − x + 4</text>
</g>
</svg>
