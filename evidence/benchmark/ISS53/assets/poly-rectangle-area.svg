<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-labelledby="t d">
<title id="t">Changed-anchor rectangle area model</title>
<desc id="d">An authored rectangle with length x plus four and width x plus two, partitioned into four regions to connect side lengths, polynomial multiplication, and square units.</desc>
<rect width="620" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="24" y="32" font-family="system-ui" font-size="18" font-weight="700">Authored rectangle: (x + 4) cm by (x + 2) cm</text>
<g data-g9-stage-id="RECT-STAGE-1">
 <rect x="65" y="85" width="260" height="205" fill="#fff" stroke="#64748b" stroke-width="2"/>
 <line x1="235" y1="85" x2="235" y2="290" stroke="#64748b"/><line x1="65" y1="235" x2="325" y2="235" stroke="#64748b"/>
 <text x="150" y="76" font-family="monospace">x</text><text x="278" y="76" font-family="monospace">4</text>
 <text x="48" y="160" font-family="monospace">x</text><text x="48" y="270" font-family="monospace">2</text>
</g>
<g data-g9-stage-id="RECT-STAGE-2">
 <text x="150" y="165" text-anchor="middle" font-family="monospace" font-size="18">x²</text>
 <text x="280" y="165" text-anchor="middle" font-family="monospace" font-size="18">4x</text>
 <text x="150" y="267" text-anchor="middle" font-family="monospace" font-size="18">2x</text>
 <text x="280" y="267" text-anchor="middle" font-family="monospace" font-size="18">8</text>
</g>
<g data-g9-stage-id="RECT-STAGE-3">
 <text x="360" y="120" font-family="system-ui" font-size="14" font-weight="700">Area is the sum of all four regions</text>
 <text x="360" y="155" font-family="monospace" font-size="15">x² + 4x + 2x + 8</text>
 <text x="360" y="185" font-family="monospace" font-size="15">= x² + 6x + 8 cm²</text>
 <text x="360" y="225" font-family="system-ui" font-size="13">cm × cm gives cm².</text>
</g>
</svg>
