<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="28"><title id="title">Blank axes for plotting p of x</title><desc id="desc">Labelled x and p of x axes with x ticks at minus 2, minus 1, 0, 1 and 2. No polynomial values, points or zeros are plotted.</desc><g data-g9-stage-id="axes-1"><path d="M75 265 H655 M360 55 V445" fill="none" stroke="currentColor" stroke-width="4"/><text x="665" y="275">x</text><text x="375" y="70">p(x)</text></g><g data-g9-stage-id="axes-2"><path d="M180 253 V277 M270 253 V277 M360 253 V277 M450 253 V277 M540 253 V277" stroke="currentColor" stroke-width="3"/><text x="164" y="315">−2</text><text x="254" y="315">−1</text><text x="351" y="315">0</text><text x="441" y="315">1</text><text x="531" y="315">2</text><text x="85" y="485">Plot your own values; no answer points are shown.</text></g></svg>