<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="30"><title id="title">Parameter branch for degree and zero-polynomial scope</title><desc id="desc">Four stages show a common parameter coefficient, a zero versus nonzero branch, degree assignment only on the nonzero branch, and the nonzero-polynomial hypothesis of the zero-count theorem.</desc><rect x="16" y="16" width="688" height="488" rx="22" fill="none" stroke="currentColor" stroke-width="3"/><g data-g9-stage-id="param-1"><text x="42" y="75" font-weight="700">1 · Expose the scalar</text><text x="42" y="118">family = scalar × fixed polynomial</text></g><g data-g9-stage-id="param-2"><text x="42" y="195" font-weight="700">2 · Branch first</text><text x="42" y="238">scalar = 0 → every coefficient is 0</text><text x="42" y="280">scalar ≠ 0 → nonzero polynomial</text></g><g data-g9-stage-id="param-3"><text x="42" y="357" font-weight="700">3 · Assign degree</text><text x="42" y="400">Only after the nonzero branch is known.</text></g><g data-g9-stage-id="param-4"><text x="42" y="467" font-weight="700">4 · Check theorem scope: “nonzero”</text></g></svg>