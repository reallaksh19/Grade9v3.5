<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="29"><title id="title">Original-domain ledger for cancellation</title><desc id="desc">Three stages keep the original denominator restriction visible, simplify conditionally, then compare both formula and domain when deciding function equality.</desc><g data-g9-stage-id="domain-1"><rect x="35" y="35" width="650" height="125" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="82" font-weight="700">1 · Original first</text><text x="65" y="130">Record inputs excluded by the denominator.</text></g><g data-g9-stage-id="domain-2"><rect x="35" y="198" width="650" height="125" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="245" font-weight="700">2 · Simplify conditionally</text><text x="65" y="293">Cancel only where the factor is nonzero.</text></g><g data-g9-stage-id="domain-3"><rect x="35" y="361" width="650" height="125" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="408" font-weight="700">3 · Compare functions</text><text x="65" y="456">Compare both formula and domain.</text></g></svg>