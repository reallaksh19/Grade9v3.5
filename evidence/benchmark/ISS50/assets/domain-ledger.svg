<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="29"><title id="title">Original-domain ledger for cancellation</title><desc id="desc">Four stages keep the original denominator restriction visible, simplify conditionally, compare formula and domain, then inspect the excluded input explicitly.</desc><g data-g9-stage-id="domain-1"><rect x="35" y="28" width="650" height="115" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="72" font-weight="700">1 · Original first</text><text x="65" y="116">Record inputs excluded by the denominator.</text></g><g data-g9-stage-id="domain-2"><rect x="35" y="170" width="650" height="115" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="214" font-weight="700">2 · Simplify conditionally</text><text x="65" y="258">Cancel only where the factor is nonzero.</text></g><g data-g9-stage-id="domain-3"><rect x="35" y="312" width="650" height="115" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="356" font-weight="700">3 · Compare functions</text><text x="65" y="400">Compare both formula and domain.</text></g><g data-g9-stage-id="domain-4"><rect x="35" y="454" width="650" height="150" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="65" y="498" font-weight="700">4 · Test the boundary</text><text x="65" y="542">Inspect the excluded input after simplifying.</text><text x="65" y="582">Cancellation cannot restore a missing original value.</text></g></svg>