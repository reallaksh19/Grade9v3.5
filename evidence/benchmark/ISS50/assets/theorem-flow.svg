<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc" font-family="system-ui, sans-serif" font-size="30"><title id="title">Remainder and factor theorem flow</title><desc id="desc">Three stages connect division by x minus c to evaluation at c, the remainder, and the zero-remainder factor case.</desc><g data-g9-stage-id="theorem-1"><rect x="40" y="35" width="640" height="105" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="72" y="98">p(x) = (x − c) q(x) + r</text></g><g data-g9-stage-id="theorem-2"><path d="M360 140 V195" stroke="currentColor" stroke-width="4"/><rect x="40" y="195" width="640" height="120" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="72" y="245">Set x = c: p(c) = 0·q(c) + r</text><text x="72" y="292">so p(c) = r</text></g><g data-g9-stage-id="theorem-3"><path d="M360 315 V365" stroke="currentColor" stroke-width="4"/><rect x="40" y="365" width="640" height="90" rx="18" fill="none" stroke="currentColor" stroke-width="3"/><text x="72" y="420">p(c)=0 ⇔ r=0 ⇔ x−c is a factor</text></g></svg>