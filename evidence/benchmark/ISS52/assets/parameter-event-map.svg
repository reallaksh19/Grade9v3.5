<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" role="img" aria-labelledby="iss52-param-title iss52-param-desc">
<title id="iss52-param-title">Parameter-event map for a changed polynomial family</title>
<desc id="iss52-param-desc">A staged construction for G_t(x)=x(x+3)((t-2)x^2+(t+1)). Stage one shows the factor structure. Stage two adds the degree-drop test. Stage three adds the real-root existence boundary. Stage four adds the collision test with the fixed root negative three. The diagram teaches which event equations to derive before splitting parameter cases.</desc>
<rect x="18" y="18" width="564" height="664" rx="18" fill="white" stroke="currentColor" stroke-width="3"/>
<g data-g9-stage-id="VIS-ISS52-PARAM-0">
 <text x="42" y="70" font-size="34" font-weight="700">Changed family G_t(x)</text>
 <text x="42" y="112" font-size="30">x(x+3)((t−2)x²+(t+1))</text>
 <text x="42" y="154" font-size="30">Start from factors, not samples.</text>
</g>
<g data-g9-stage-id="VIS-ISS52-PARAM-1">
 <rect x="42" y="188" width="516" height="104" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
 <text x="64" y="230" font-size="32" font-weight="700">1 · Degree event</text>
 <text x="64" y="272" font-size="30">When does t−2 = 0?</text>
</g>
<g data-g9-stage-id="VIS-ISS52-PARAM-2">
 <rect x="42" y="316" width="516" height="126" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
 <text x="64" y="358" font-size="32" font-weight="700">2 · Existence event</text>
 <text x="64" y="400" font-size="30">When can the x² condition</text>
 <text x="64" y="432" font-size="30">produce real extra roots?</text>
</g>
<g data-g9-stage-id="VIS-ISS52-PARAM-3">
 <rect x="42" y="466" width="516" height="104" rx="12" fill="none" stroke="currentColor" stroke-width="3"/>
 <text x="64" y="508" font-size="32" font-weight="700">3 · Collision event</text>
 <text x="64" y="550" font-size="30">Can an extra root equal −3?</text>
 <text x="42" y="614" font-size="30">Derive all events first.</text>
 <text x="42" y="654" font-size="30">Then order them and split cases.</text>
</g>
</svg>
