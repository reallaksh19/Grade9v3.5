<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="q5-title q5-desc">
<title id="q5-title">Ten centimetre square sheet with four corner squares of side x marked for cutting</title>
<desc id="q5-desc">A square sheet is shown before folding. The full top side is labelled 10 centimetres. Equal corner squares are outlined at all four corners, with one horizontal and one vertical side labelled x. Dashed fold lines continue inward from the cut boundaries. No base dimension or volume formula is supplied.</desc>
<rect x="130" y="80" width="420" height="420" fill="none" stroke="currentColor" stroke-width="4"/>
<g fill="none" stroke="currentColor" stroke-width="3">
  <rect x="130" y="80" width="82" height="82"/>
  <rect x="468" y="80" width="82" height="82"/>
  <rect x="130" y="418" width="82" height="82"/>
  <rect x="468" y="418" width="82" height="82"/>
</g>
<g fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="9 8">
  <line x1="212" y1="80" x2="212" y2="500"/>
  <line x1="468" y1="80" x2="468" y2="500"/>
  <line x1="130" y1="162" x2="550" y2="162"/>
  <line x1="130" y1="418" x2="550" y2="418"/>
</g>
<g stroke="currentColor" stroke-width="2" fill="none">
  <line x1="130" y1="45" x2="550" y2="45"/>
  <line x1="130" y1="35" x2="130" y2="55"/>
  <line x1="550" y1="35" x2="550" y2="55"/>
  <line x1="130" y1="520" x2="212" y2="520"/>
  <line x1="120" y1="80" x2="120" y2="162"/>
</g>
<g fill="currentColor" font-family="system-ui, sans-serif" font-size="24">
  <text x="305" y="32">10 cm</text>
  <text x="164" y="548">x</text>
  <text x="82" y="130">x</text>
  <text x="266" y="300" font-size="21">sheet remaining after the corner cuts</text>
  <text x="250" y="332" font-size="18">dashed lines mark folds</text>
</g>
</svg>
