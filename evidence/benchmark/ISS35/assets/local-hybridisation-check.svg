<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Atom-local hybridisation decision procedure" font-family="system-ui, sans-serif" font-size="25">
<title>Atom-local hybridisation decision procedure</title><desc>Four staged boxes: choose one atom, count sigma directions and lone-pair domains, assign a local introductory hybridisation model, then verify leftover p orbitals against the pi system.</desc>
<g data-g9-stage-id="HYB-LOCAL-1"><rect x="45" y="55" width="180" height="90" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="70" y="92" font-weight="700">1 · One atom</text><text x="70" y="125">at a time</text></g>
<g data-g9-stage-id="HYB-LOCAL-2"><path d="M225 100 H305" stroke="currentColor" stroke-width="4"/><polygon points="305,100 285,88 285,112" fill="currentColor"/><rect x="310" y="55" width="220" height="90" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="330" y="92" font-weight="700">2 · Count domains</text><text x="330" y="125">σ directions + lone pairs</text></g>
<g data-g9-stage-id="HYB-LOCAL-3"><path d="M530 100 H610" stroke="currentColor" stroke-width="4"/><polygon points="610,100 590,88 590,112" fill="currentColor"/><rect x="615" y="55" width="235" height="90" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="635" y="92" font-weight="700">3 · Local model</text><text x="635" y="125">2→sp · 3→sp2 · 4→sp3</text></g>
<g data-g9-stage-id="HYB-LOCAL-4"><path d="M735 145 V230 H450 V275" stroke="currentColor" stroke-width="4" fill="none"/><polygon points="450,275 438,255 462,255" fill="currentColor"/><rect x="225" y="280" width="450" height="130" rx="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="255" y="322" font-weight="700">4 · Orbital consistency check</text><text x="255" y="360">Enough unhybridised p orbitals?</text><text x="255" y="395">Correct orientations for every required π overlap?</text><text x="95" y="465">If not, revisit the local assignment/model — never force one label onto the whole molecule.</text></g>
</svg>
