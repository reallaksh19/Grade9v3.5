<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Nitrate contributor to delocalised orbital translation" font-family="system-ui, sans-serif" font-size="25">
  <title>Nitrate contributor to delocalised orbital translation</title>
  <desc>Four staged panels: three formal Lewis contributors, their invariant planar sigma skeleton, p orbitals perpendicular to the plane, and one qualitative delocalised pi overlay. The final stage states that the contributors are not time states.</desc>
  <g data-g9-stage-id="HYB-DELOC-1">
    <text x="40" y="45" font-weight="700">1 · Compare the contributors</text>
    <g transform="translate(75 130)"><circle cx="80" cy="70" r="30" fill="none" stroke="currentColor" stroke-width="4"/><text x="68" y="80">N</text><text x="0" y="75">O</text><text x="145" y="20">O</text><text x="145" y="135">O</text><line x1="45" y1="70" x2="18" y2="70" stroke="currentColor" stroke-width="5"/><line x1="105" y1="48" x2="140" y2="26" stroke="currentColor" stroke-width="5"/><line x1="108" y1="92" x2="142" y2="124" stroke="currentColor" stroke-width="5"/><line x1="102" y1="39" x2="137" y2="17" stroke="currentColor" stroke-width="3"/></g>
    <text x="300" y="205" font-size="34">↔</text>
    <g transform="translate(365 130)"><circle cx="80" cy="70" r="30" fill="none" stroke="currentColor" stroke-width="4"/><text x="68" y="80">N</text><text x="0" y="75">O</text><text x="145" y="20">O</text><text x="145" y="135">O</text><line x1="45" y1="70" x2="18" y2="70" stroke="currentColor" stroke-width="5"/><line x1="40" y1="61" x2="13" y2="61" stroke="currentColor" stroke-width="3"/><line x1="105" y1="48" x2="140" y2="26" stroke="currentColor" stroke-width="5"/><line x1="108" y1="92" x2="142" y2="124" stroke="currentColor" stroke-width="5"/></g>
    <text x="590" y="205" font-size="34">↔</text>
    <g transform="translate(655 130)"><circle cx="80" cy="70" r="30" fill="none" stroke="currentColor" stroke-width="4"/><text x="68" y="80">N</text><text x="0" y="75">O</text><text x="145" y="20">O</text><text x="145" y="135">O</text><line x1="45" y1="70" x2="18" y2="70" stroke="currentColor" stroke-width="5"/><line x1="105" y1="48" x2="140" y2="26" stroke="currentColor" stroke-width="5"/><line x1="108" y1="92" x2="142" y2="124" stroke="currentColor" stroke-width="5"/><line x1="113" y1="84" x2="147" y2="116" stroke="currentColor" stroke-width="3"/></g>
  </g>
  <g data-g9-stage-id="HYB-DELOC-2">
    <text x="40" y="305" font-weight="700">2 · What stays invariant?</text>
    <text x="70" y="345">Same N–O connectivity · same three planar sigma directions · same total charge/electron inventory</text>
  </g>
  <g data-g9-stage-id="HYB-DELOC-3">
    <text x="40" y="395" font-weight="700">3 · Choose the p-orbital direction</text>
    <line x1="500" y1="365" x2="500" y2="455" stroke="currentColor" stroke-width="5"/>
    <ellipse cx="500" cy="350" rx="24" ry="42" fill="none" stroke="currentColor" stroke-width="4"/>
    <ellipse cx="500" cy="470" rx="24" ry="42" fill="none" stroke="currentColor" stroke-width="4"/>
    <text x="540" y="425">perpendicular to molecular plane</text>
  </g>
  <g data-g9-stage-id="HYB-DELOC-4">
    <text x="40" y="505" font-weight="700">4 · One delocalised π description — contributors are formal components, not time states</text>
  </g>
</svg>
