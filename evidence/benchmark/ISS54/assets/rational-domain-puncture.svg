<svg aria-labelledby="title-rat-punct desc-rat-punct" class="question-svg" role="img" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
<style>
  .label { font-size: 15px; fill: #18324a; font-family: system-ui, sans-serif; font-weight: 700; }
  .caption { font-size: 13px; fill: #475569; font-family: system-ui, sans-serif; }
  .axis { font-size: 12px; fill: #94a3b8; font-family: system-ui, sans-serif; font-style: italic; }
  .math { font-size: 15px; fill: #0f172a; font-family: Cambria, "Times New Roman", serif; font-weight: 600; }
  .alert { font-size: 13px; fill: #b91c1c; font-family: system-ui, sans-serif; font-weight: 700; }
</style>
<title id="title-rat-punct">Rational Expression Domain Puncture: r(x) vs q(x)</title>
<desc id="desc-rat-punct">Comparison of rational function r(x)=(x^2-1)/(x-1) and linear polynomial q(x)=x+1, illustrating algebraic cancellation conditional on x!=1, the removable singularity hole at (1,2), and domain inequality on real numbers.</desc>

<rect fill="#f8fafc" height="358" rx="12" stroke="#cbd5e1" stroke-width="2" width="638" x="1" y="1"/>

<!-- Background Grid / Coordinate Axes -->
<g stroke="#e2e8f0" stroke-width="1.5">
  <line x1="60" y1="240" x2="580" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="260" y1="30" x2="260" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Grid tick lines -->
  <line x1="180" y1="30" x2="180" y2="330" stroke="#f1f5f9" stroke-dasharray="3 3"/>
  <line x1="340" y1="30" x2="340" y2="330" stroke="#f1f5f9" stroke-dasharray="3 3"/>
  <line x1="420" y1="30" x2="420" y2="330" stroke="#f1f5f9" stroke-dasharray="3 3"/>
  <line x1="60" y1="160" x2="580" y2="160" stroke="#f1f5f9" stroke-dasharray="3 3"/>
  <line x1="60" y1="80" x2="580" y2="80" stroke="#f1f5f9" stroke-dasharray="3 3"/>
</g>
<text class="axis" x="570" y="256">x</text>
<text class="axis" x="268" y="45">y</text>
<text class="axis" x="248" y="255">0</text>
<text class="axis" x="335" y="255">1</text>
<text class="axis" x="415" y="255">2</text>
<text class="axis" x="175" y="255">-1</text>
<text class="axis" x="245" y="165">1</text>
<text class="axis" x="245" y="85">2</text>

<!-- STAGE 1: Expression comparison -->
<g data-g9-stage-id="stage-expression">
  <rect fill="#ffffff" opacity="0.95" x="25" y="20" width="220" height="90" rx="8" stroke="#cbd5e1" stroke-width="1"/>
  <text class="label" x="35" y="42">Stage 1: Formula vs Domain</text>
  <text class="math" x="35" y="65">r(x) = (x² - 1)/(x - 1)</text>
  <text class="caption" x="35" y="84">Denominator: x - 1 ≠ 0</text>
  <text class="caption" x="35" y="100">Domain(r) = ℝ \ {1}</text>
</g>

<!-- STAGE 2: Puncture at x=1 -->
<g data-g9-stage-id="stage-puncture">
  <rect fill="#ffffff" opacity="0.95" x="380" y="20" width="235" height="95" rx="8" stroke="#fca5a5" stroke-width="1.5"/>
  <text class="label" fill="#b91c1c" x="390" y="42">Stage 2: Critical Value x = 1</text>
  <text class="math" x="390" y="64">r(1) = (1 - 1)/(1 - 1) = 0/0 (undef)</text>
  <text class="math" x="390" y="84">q(1) = 1 + 1 = 2</text>
  <text class="alert" x="390" y="103">r(1) ≠ q(1)  ⇒  r ≠ q on ℝ</text>
</g>

<!-- STAGE 3: Graphical comparison showing removable hole -->
<g data-g9-stage-id="stage-graph">
  <!-- Line for q(x) = x + 1 (dashed or underlying guide) -->
  <line x1="100" y1="320" x2="500" y2="80" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>

  <!-- Plotted points for q(x) -->
  <circle cx="180" cy="240" fill="#2563eb" r="4"/>
  <text class="caption" x="145" y="235">(-1, 0)</text>

  <circle cx="260" cy="160" fill="#2563eb" r="4"/>
  <text class="caption" x="210" y="160">(0, 1)</text>

  <circle cx="420" cy="80" fill="#2563eb" r="4"/>
  <text class="caption" x="430" y="80">(2, 3)</text>

  <!-- Removable Hole for r(x) at (1, 2) which is x=340, y=80? wait:
       x=260 is 0, dx=80 per unit.
       x=1 is 260 + 80 = 340.
       y=0 is 240, dy=80 per unit.
       y=1 is 240 - 80 = 160.
       y=2 is 240 - 160 = 80.
       So at x=1, y=2: point is cx=340, cy=80.
  -->
  <!-- Open circle (hole) at (340, 80) representing puncture in r(x) -->
  <circle cx="340" cy="80" fill="#f8fafc" r="7" stroke="#dc2626" stroke-width="3"/>
  <circle cx="340" cy="80" fill="#ffffff" r="4"/>

  <!-- Hole callout -->
  <line x1="340" y1="73" x2="340" y2="40" stroke="#dc2626" stroke-dasharray="2 2" stroke-width="1.5"/>
  <rect fill="#fef2f2" height="24" rx="4" stroke="#f87171" stroke-width="1" width="130" x="275" y="16"/>
  <text class="alert" text-anchor="middle" x="340" y="32">Hole at (1, 2) in r(x)</text>

  <text class="caption" fill="#1e40af" font-weight="700" x="460" y="105">q(x) = x + 1 (all ℝ)</text>
  <text class="caption" fill="#b91c1c" font-weight="700" x="460" y="125">r(x) is undefined at x=1</text>
</g>
</svg>
