<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" role="img" aria-labelledby="svg-dom-title svg-dom-desc">
  <title id="svg-dom-title">Electron Domain Counting in Formaldehyde (H2C=O) vs BF3 and CH4</title>
  <desc id="svg-dom-desc">Illustration demonstrating that multiple bonds occupy a single spatial direction, giving formaldehyde exactly three electron domains (sp2 trigonal planar).</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1e293b; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #475569; }
      .text-atom { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .bond-line { stroke: #334155; stroke-width: 2.5; stroke-linecap: round; }
      .domain-envelope { fill: #dbeafe; fill-opacity: 0.6; stroke: #2563eb; stroke-width: 1.5; stroke-dasharray: 4,3; }
      .lp-dot { fill: #dc2626; }
    </style>
  </defs>

  <rect width="600" height="360" rx="8" class="bg" />

  <!-- Stage 1: Full Lewis Structure -->
  <g data-g9-stage-id="DOM-STAGE-1">
    <rect x="20" y="20" width="180" height="320" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="35" y="45" class="text-title">Stage 1: Lewis Formula</text>
    <text x="35" y="65" class="text-sub">Four shared electron pairs</text>

    <!-- H2C=O molecule -->
    <circle cx="110" cy="180" r="16" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="110" y="180" class="text-atom">C</text>

    <!-- C-H left-down -->
    <line x1="97" y1="190" x2="65" y2="230" class="bond-line" />
    <circle cx="58" cy="238" r="12" fill="#ffffff" stroke="#cbd5e1" />
    <text x="58" y="238" class="text-atom" font-size="13">H</text>

    <!-- C-H left-up -->
    <line x1="97" y1="170" x2="65" y2="130" class="bond-line" />
    <circle cx="58" cy="122" r="12" fill="#ffffff" stroke="#cbd5e1" />
    <text x="58" y="122" class="text-atom" font-size="13">H</text>

    <!-- C=O double bond (right) -->
    <line x1="126" y1="176" x2="160" y2="176" class="bond-line" />
    <line x1="126" y1="184" x2="160" y2="184" class="bond-line" />
    <circle cx="172" cy="180" r="14" fill="#fee2e2" stroke="#f87171" />
    <text x="172" y="180" class="text-atom" fill="#b91c1c" font-size="14">O</text>

    <!-- O lone pairs -->
    <circle cx="188" cy="170" r="2.5" class="lp-dot" />
    <circle cx="194" cy="174" r="2.5" class="lp-dot" />
    <circle cx="188" cy="190" r="2.5" class="lp-dot" />
    <circle cx="194" cy="186" r="2.5" class="lp-dot" />

    <text x="110" y="295" class="text-sub" text-anchor="middle">Student trap: counts 4 bonds</text>
    <text x="110" y="315" class="text-sub" text-anchor="middle" fill="#dc2626">as 4 separate directions</text>
  </g>

  <!-- Stage 2: Steric Domain Envelopes -->
  <g data-g9-stage-id="DOM-STAGE-2">
    <rect x="210" y="20" width="180" height="320" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="225" y="45" class="text-title">Stage 2: Domain Bounds</text>
    <text x="225" y="65" class="text-sub">Spatial direction envelopes</text>

    <!-- Envelopes -->
    <!-- Domain 1: C-H up -->
    <ellipse cx="270" cy="145" rx="16" ry="32" transform="rotate(-30 270 145)" class="domain-envelope" />
    <text x="245" y="110" class="text-sub" font-weight="bold" fill="#2563eb">Domain 1</text>

    <!-- Domain 2: C-H down -->
    <ellipse cx="270" cy="215" rx="16" ry="32" transform="rotate(30 270 215)" class="domain-envelope" />
    <text x="245" y="260" class="text-sub" font-weight="bold" fill="#2563eb">Domain 2</text>

    <!-- Domain 3: C=O right (single envelope covering both pairs) -->
    <ellipse cx="340" cy="180" rx="36" ry="22" class="domain-envelope" fill="#fef3c7" stroke="#d97706" />
    <text x="340" y="145" class="text-sub" font-weight="bold" fill="#d97706" text-anchor="middle">Domain 3 (1 double bond)</text>

    <!-- Molecule centers -->
    <circle cx="300" cy="180" r="14" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="300" y="180" class="text-atom" font-size="14">C</text>

    <text x="300" y="295" class="text-body" text-anchor="middle" font-weight="bold" fill="#059669">Total = 3 Domains</text>
    <text x="300" y="315" class="text-sub" text-anchor="middle">Double bond = 1 direction</text>
  </g>

  <!-- Stage 3: Trigonal Planar Outcome & Comparison -->
  <g data-g9-stage-id="DOM-STAGE-3">
    <rect x="400" y="20" width="180" height="320" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="415" y="45" class="text-title">Stage 3: Geometry &amp; sp2</text>
    <text x="415" y="65" class="text-sub">120° Trigonal Planar</text>

    <!-- Trigonal planar axes -->
    <line x1="490" y1="175" x2="490" y2="115" stroke="#2563eb" stroke-width="2" />
    <line x1="490" y1="175" x2="440" y2="210" stroke="#2563eb" stroke-width="2" />
    <line x1="490" y1="175" x2="540" y2="210" stroke="#2563eb" stroke-width="2" />
    <circle cx="490" cy="175" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="490" y="175" class="text-atom" font-size="13">C</text>

    <text x="515" y="145" class="text-sub" font-weight="bold" fill="#ea580c">~120°</text>

    <!-- Summary Box -->
    <rect x="410" y="240" width="160" height="85" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="420" y="258" class="text-sub" font-weight="bold">Model Summary:</text>
    <text x="420" y="275" class="text-sub">• H2C=O: 3 dom → sp²</text>
    <text x="420" y="292" class="text-sub">• BF3: 3 dom → sp²</text>
    <text x="420" y="309" class="text-sub">• CH4: 4 dom → sp³</text>
  </g>
</svg>
