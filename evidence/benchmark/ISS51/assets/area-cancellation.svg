<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-label="Area subtraction and leading-term cancellation" font-family="system-ui, sans-serif" font-size="23">
<title>Area subtraction and cancellation</title><desc>A changed rectangular-frame case builds the component areas, writes whole minus removed, then isolates leading-term cancellation without using the supplied dimensions.</desc>
<g data-g9-stage-id="POLY-AREA-1"><rect x="90" y="70" width="560" height="300" fill="none" stroke="currentColor" stroke-width="5"/><rect x="250" y="145" width="210" height="210" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="10 8"/><text x="285" y="255">x by x cut-out</text><text x="180" y="55">outer dimensions: (x+a) by (x+b)</text></g>
<g data-g9-stage-id="POLY-AREA-2"><text x="85" y="405">Write remaining area = (x+a)(x+b) - x^2.</text></g>
<g data-g9-stage-id="POLY-AREA-3"><text x="85" y="445">Only after simplifying decide whether the leading x^2 terms cancel.</text></g></svg>