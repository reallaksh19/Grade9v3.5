<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="Linear sigma axis with two remaining perpendicular p directions" font-family="system-ui, sans-serif" font-size="23">
<title>Linear sigma axis and two p directions</title>
<desc>A generic staged local-centre scaffold for a two-domain linear sigma frame. Two independent p directions are added without naming a molecule or final hybrid label.</desc>
<g data-g9-stage-id="HYB-LINEAR-1">
  <text x="55" y="42">Stage 1 — two opposite domain / sigma directions</text>
  <circle cx="410" cy="240" r="26" fill="none" stroke="currentColor" stroke-width="4"/>
  <line x1="120" y1="240" x2="384" y2="240" stroke="currentColor" stroke-width="6"/>
  <line x1="436" y1="240" x2="700" y2="240" stroke="currentColor" stroke-width="6"/>
  <text x="300" y="290">linear molecular axis</text>
</g>
<g data-g9-stage-id="HYB-LINEAR-2">
  <ellipse cx="410" cy="125" rx="32" ry="76" fill="none" stroke="currentColor" stroke-width="4"/>
  <ellipse cx="410" cy="355" rx="32" ry="76" fill="none" stroke="currentColor" stroke-width="4"/>
  <text x="500" y="125">p direction A ⟂ axis</text>
</g>
<g data-g9-stage-id="HYB-LINEAR-3">
  <ellipse cx="330" cy="240" rx="72" ry="28" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="11 7"/>
  <ellipse cx="490" cy="240" rx="72" ry="28" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="11 7"/>
  <text x="500" y="165">p direction B ⟂ axis</text>
  <text x="500" y="195">and ⟂ direction A</text>
</g>
<g data-g9-stage-id="HYB-LINEAR-4">
  <text x="55" y="455">Keep ledgers separate: domain directions describe geometry; sigma/pi components describe bonding.</text>
</g>
</svg>