<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-label="Four-domain occupancy projected to molecular shape" font-family="system-ui, sans-serif" font-size="22">
<title>Four-domain occupancy and molecular shape</title>
<desc>A staged four-domain scaffold showing zero, one and two lone-pair occupancies so the learner can distinguish electron-domain geometry from bonded-atom shape.</desc>
<g data-g9-stage-id="HYB-SHAPE-1">
  <text x="50" y="42">Same four-domain scaffold</text>
  <g transform="translate(150,170)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
    <line x1="0" y1="-22" x2="0" y2="-105" stroke="currentColor" stroke-width="5"/>
    <line x1="-18" y1="12" x2="-90" y2="65" stroke="currentColor" stroke-width="5"/>
    <line x1="18" y1="12" x2="90" y2="65" stroke="currentColor" stroke-width="5"/>
    <line x1="18" y1="-8" x2="92" y2="-48" stroke="currentColor" stroke-width="5" stroke-dasharray="11 7"/>
  </g>
  <text x="70" y="330">4 bond positions</text>
  <g transform="translate(410,170)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
    <line x1="0" y1="-22" x2="0" y2="-105" stroke="currentColor" stroke-width="5"/>
    <line x1="-18" y1="12" x2="-90" y2="65" stroke="currentColor" stroke-width="5"/>
    <line x1="18" y1="12" x2="90" y2="65" stroke="currentColor" stroke-width="5"/>
    <circle cx="82" cy="-46" r="8" fill="currentColor"/><circle cx="105" cy="-58" r="8" fill="currentColor"/>
  </g>
  <text x="325" y="330">3 bonds + 1 lone pair</text>
  <g transform="translate(670,170)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="currentColor" stroke-width="4"/>
    <line x1="-18" y1="12" x2="-90" y2="65" stroke="currentColor" stroke-width="5"/>
    <line x1="18" y1="12" x2="90" y2="65" stroke="currentColor" stroke-width="5"/>
    <circle cx="0" cy="-92" r="8" fill="currentColor"/><circle cx="23" cy="-104" r="8" fill="currentColor"/>
    <circle cx="78" cy="-43" r="8" fill="currentColor"/><circle cx="101" cy="-55" r="8" fill="currentColor"/>
  </g>
  <text x="585" y="330">2 bonds + 2 lone pairs</text>
</g>
<g data-g9-stage-id="HYB-SHAPE-2">
  <text x="50" y="385">Electron-domain geometry still counts all four positions.</text>
</g>
<g data-g9-stage-id="HYB-SHAPE-3">
  <text x="50" y="430">Molecular shape follows only the positions occupied by bonded atoms.</text>
</g>
</svg>