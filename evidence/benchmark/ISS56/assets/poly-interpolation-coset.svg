<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Polynomial interpolation uniqueness and unbounded cosets" font-family="system-ui, sans-serif" font-size="20">
<title>Polynomial interpolation uniqueness and unbounded cosets</title>
<desc>Staged mathematical graph showing four sample points, unique degree-2 interpolant x^2+1, degree-4 vanishing polynomial, and higher-degree coset family.</desc>
<rect width="900" height="520" fill="#f8fafc" rx="12"/>
<g data-g9-stage-id="INTERP-1">
  <text x="40" y="45" font-weight="700" fill="#0f172a" font-size="22">1 · Discrete sample data: four exact observation points</text>
  <line x1="80" y1="440" x2="820" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <line x1="160" y1="80" x2="160" y2="460" stroke="#94a3b8" stroke-width="2"/>
  <text x="830" y="445" fill="#64748b">x</text>
  <text x="150" y="70" fill="#64748b">y</text>
  <text x="150" y="470" fill="#64748b">0</text>
  <text x="340" y="470" fill="#64748b">1</text>
  <text x="520" y="470" fill="#64748b">2</text>
  <text x="700" y="470" fill="#64748b">3</text>
  <circle cx="160" cy="406" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="180" y="410" font-weight="600" fill="#1e40af">(0, 1)</text>
  <circle cx="340" cy="372" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="360" y="375" font-weight="600" fill="#1e40af">(1, 2)</text>
  <circle cx="520" cy="270" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="540" y="275" font-weight="600" fill="#1e40af">(2, 5)</text>
  <circle cx="700" cy="100" r="8" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="720" y="105" font-weight="600" fill="#1e40af">(3, 10)</text>
</g>
<g data-g9-stage-id="INTERP-2">
  <text x="40" y="140" font-weight="700" fill="#16a34a" font-size="20">2 · Unique degree ≤ 3 interpolant: p(x) = x² + 1</text>
  <path d="M 100 428 Q 160 406 250 393 T 340 372 T 430 331 T 520 270 T 610 195 T 700 100 T 750 32" fill="none" stroke="#16a34a" stroke-width="4"/>
  <text x="480" y="220" fill="#15803d" font-weight="600">p(x) = x² + 1 (unique under deg ≤ 3)</text>
</g>
<g data-g9-stage-id="INTERP-3">
  <text x="40" y="495" font-weight="700" fill="#d97706" font-size="18">3 · Vanishing product: V(x) = x(x-1)(x-2)(x-3) vanishes at all 4 sample inputs</text>
</g>
<g data-g9-stage-id="INTERP-4">
  <path d="M 160 406 C 220 300 280 430 340 372 C 400 320 460 210 520 270 C 580 340 640 50 700 100" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="550" y="370" fill="#b91c1c" font-weight="600">Higher degree: x² + 1 + x(x-1)(x-2)(x-3)q(x)</text>
</g>
</svg>