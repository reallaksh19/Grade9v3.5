<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="Root multiplicity parity and sign variation" font-family="system-ui, sans-serif" font-size="20">
<title>Root multiplicity parity and sign variation</title>
<desc>Staged diagram illustrating sign change across simple odd-multiplicity roots versus sign preservation at even-multiplicity roots.</desc>
<rect width="900" height="520" fill="#f8fafc" rx="12"/>
<g data-g9-stage-id="PARITY-1">
  <text x="40" y="45" font-weight="700" fill="#0f172a" font-size="22">1 · Odd multiplicity: curve crosses axis with sign change</text>
  <line x1="60" y1="140" x2="420" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 100 200 L 240 140 L 380 80" fill="none" stroke="#2563eb" stroke-width="4"/>
  <circle cx="240" cy="140" r="7" fill="#2563eb"/>
  <text x="225" y="170" font-weight="600" fill="#1e40af">x = r (mult 1, 3, ...)</text>
  <text x="100" y="130" fill="#dc2626" font-weight="700">–</text>
  <text x="360" y="130" fill="#16a34a" font-weight="700">+</text>
</g>
<g data-g9-stage-id="PARITY-2">
  <text x="480" y="45" font-weight="700" fill="#0f172a" font-size="22">2 · Even multiplicity: tangent with sign preservation</text>
  <line x1="480" y1="140" x2="840" y2="140" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 540 80 Q 660 140 780 80" fill="none" stroke="#16a34a" stroke-width="4"/>
  <circle cx="660" cy="140" r="7" fill="#16a34a"/>
  <text x="645" y="170" font-weight="600" fill="#15803d">x = r (mult 2, 4, ...)</text>
  <text x="540" y="130" fill="#16a34a" font-weight="700">+</text>
  <text x="760" y="130" fill="#16a34a" font-weight="700">+</text>
</g>
<g data-g9-stage-id="PARITY-3">
  <text x="40" y="240" font-weight="700" fill="#0f172a" font-size="22">3 · Benchmark Q2: p(x) = x²(x² - 4) with zeros at -2, 0, 2</text>
  <line x1="60" y1="380" x2="840" y2="380" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 100 240 Q 200 480 300 440 T 450 380 T 600 440 T 800 240" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="250" cy="380" r="7" fill="#7c3aed"/>
  <circle cx="450" cy="380" r="7" fill="#7c3aed"/>
  <circle cx="650" cy="380" r="7" fill="#7c3aed"/>
  <text x="235" y="410" font-weight="600" fill="#6d28d9">x = -2 (odd)</text>
  <text x="430" y="360" font-weight="600" fill="#6d28d9">x = 0 (even)</text>
  <text x="635" y="410" font-weight="600" fill="#6d28d9">x = 2 (odd)</text>
</g>
<g data-g9-stage-id="PARITY-4">
  <text x="40" y="490" font-weight="600" fill="#334155" font-size="18">4 · Parity synthesis: mult(-2)=1, mult(2)=1, mult(0)=2 saturates degree bound 4; uniquely c·x²(x²-4)</text>
</g>
</svg>