<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
<title id="title">Sphere recasting conservation</title>
<desc id="desc">A staged model of one large sphere being recast into many smaller spheres.</desc>
<rect x="1" y="1" width="438" height="278" rx="12" fill="none" stroke="currentColor"/>
<g data-g9-stage-id="VIS-I11-REC-1"><circle cx="130" cy="145" r="70" fill="none" stroke="currentColor" stroke-width="3"/><text x="80" y="235" font-size="18">R = 6 cm</text>
<circle cx="315" cy="105" r="28" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="365" cy="155" r="28" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="305" cy="205" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
<text x="286" y="252" font-size="18">r = 2 cm</text><text x="185" y="42" font-size="18">no metal lost</text></g>
<g data-g9-stage-id="VIS-I11-REC-2"><text x="175" y="125" font-size="18">V_before = V_after</text></g>
<g data-g9-stage-id="VIS-I11-REC-3"><text x="155" y="158" font-size="18">V_large = n·V_small</text></g>
<g data-g9-stage-id="VIS-I11-REC-4"><text x="145" y="190" font-size="18">compare 4πR² with n·4πr²</text></g>
</svg>
