<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-math-nl-title rep-math-nl-desc">
  <title id="rep-math-nl-title">Exact solution x = 7/3 on a number line over the rationals</title>
  <desc id="rep-math-nl-desc">Stage 1: the declared domain, the rationals, drawn as one axis x (dimensionless) with integer ticks 0, 1, 2, 3 and 4. Stage 2: the integers 2 and 3 that bracket the solution are ringed, with the statement 2 &lt; x &lt; 3; neither integer is the solution. Stage 3: the solution is marked with a closed (included) dot at exactly 7/3, one third of the way from 2 to 3, labelled x = 7/3. A magnified window, not to scale, separates it from the twelve-digit truncation 2.333333333333, which is drawn as an open (excluded) circle just to the left of 7/3 and labelled not a solution.</desc>
  <g data-g9-stage-id="VIS-MATH-NL-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="16">
    <text x="40" y="26" stroke="none">Domain: the rationals · x (dimensionless)</text>
    <line x1="30" y1="80" x2="500" y2="80" stroke-width="2"/>
    <path d="M500 74 L512 80 L500 86 Z" stroke="none"/>
    <line x1="40" y1="72" x2="40" y2="88"/><text x="40" y="110" text-anchor="middle" stroke="none">0</text>
    <line x1="150" y1="72" x2="150" y2="88"/><text x="150" y="110" text-anchor="middle" stroke="none">1</text>
    <line x1="260" y1="72" x2="260" y2="88"/><text x="260" y="110" text-anchor="middle" stroke="none">2</text>
    <line x1="370" y1="72" x2="370" y2="88"/><text x="370" y="110" text-anchor="middle" stroke="none">3</text>
    <line x1="480" y1="72" x2="480" y2="88"/><text x="480" y="110" text-anchor="middle" stroke="none">4</text>
    <text x="530" y="85" stroke="none" font-style="italic">x</text>
  </g>
  <g data-g9-stage-id="VIS-MATH-NL-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="15">
    <rect x="248" y="68" width="24" height="24" rx="4" stroke-width="2"/>
    <rect x="358" y="68" width="24" height="24" rx="4" stroke-width="2"/>
    <path d="M260 56 V48 H370 V56" stroke-width="1.5"/>
    <text x="315" y="42" text-anchor="middle" fill="currentColor" stroke="none">bracketing integers: 2 &lt; x &lt; 3</text>
  </g>
  <g data-g9-stage-id="VIS-MATH-NL-3" font-family="system-ui,sans-serif" font-size="15">
    <circle cx="296.67" cy="80" r="6" fill="#1f6fb2"/>
    <text x="296.67" y="132" text-anchor="middle" fill="#1f6fb2" font-weight="600">x = 7/3 (closed dot: the solution)</text>
    <rect x="286" y="72" width="22" height="16" fill="none" stroke="currentColor" stroke-dasharray="3 2"/>
    <path d="M286 142 L110 172 M308 142 L470 172" fill="none" stroke="currentColor" stroke-dasharray="3 2"/>
    <rect x="110" y="172" width="360" height="140" fill="none" stroke="currentColor" stroke-dasharray="3 2"/>
    <text x="120" y="192" fill="currentColor">magnified window (not to scale)</text>
    <line x1="130" y1="226" x2="450" y2="226" stroke="currentColor" stroke-width="2"/>
    <circle cx="195" cy="226" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <text x="195" y="258" text-anchor="middle" fill="currentColor">2.333333333333</text>
    <text x="195" y="280" text-anchor="middle" fill="currentColor">open: not a solution</text>
    <circle cx="385" cy="226" r="7" fill="#1f6fb2"/>
    <text x="385" y="258" text-anchor="middle" fill="#1f6fb2" font-weight="600">7/3</text>
    <text x="385" y="280" text-anchor="middle" fill="#1f6fb2">closed: the solution</text>
  </g>
</svg>
