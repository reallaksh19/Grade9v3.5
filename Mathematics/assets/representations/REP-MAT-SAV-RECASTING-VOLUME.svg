<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-mat-sav-rec-title rep-mat-sav-rec-desc">
  <title id="rep-mat-sav-rec-title">Conservation of volume during solid sphere recasting</title>
  <desc id="rep-mat-sav-rec-desc">Stage 1: Original solid metallic sphere of radius R = 6 cm. Stage 2: Melting transition showing volume invariance where initial volume equals total volume of recast small spheres. Stage 3: 27 small solid spheres of radius r = 2 cm illustrating volume conservation (288π cm³) and surface area tripling from 144π cm² to 432π cm².</desc>
  <g data-g9-stage-id="VIS-MAT-SAV-REC-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="14">
    <text x="30" y="30" stroke="none" font-weight="bold">Stage 1: Initial Solid Metallic Sphere</text>
    <circle cx="120" cy="140" r="70" fill="rgba(31,111,178,0.15)" stroke="currentColor" stroke-width="2"/>
    <ellipse cx="120" cy="140" rx="70" ry="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="120" y1="140" x2="190" y2="140" stroke="currentColor" stroke-width="2"/>
    <circle cx="120" cy="140" r="3" fill="currentColor"/>
    <text x="155" y="132" text-anchor="middle" stroke="none" font-weight="600">R = 6 cm</text>
    <text x="120" y="235" text-anchor="middle" stroke="none">V = (4/3)&pi;R&sup3; = 288&pi; cm&sup3;</text>
    <text x="120" y="255" text-anchor="middle" stroke="none" fill="#1f6fb2">TSA = 4&pi;R&sup2; = 144&pi; cm&sup2;</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-REC-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="13">
    <text x="250" y="30" stroke="none" fill="currentColor" font-weight="bold">Stage 2: Volume Invariance (Melting)</text>
    <path d="M 215 140 L 265 140" stroke="#d9381e" stroke-width="3"/>
    <polygon points="265,135 275,140 265,145" fill="#d9381e" stroke="none"/>
    <text x="245" y="125" text-anchor="middle" stroke="none" fill="#d9381e" font-weight="bold">Melting &amp; Recasting</text>
    <rect x="200" y="160" width="95" height="50" rx="4" fill="rgba(217,56,30,0.08)" stroke="#d9381e" stroke-width="1"/>
    <text x="247" y="180" text-anchor="middle" stroke="none" fill="#d9381e" font-size="11">V_initial = n &times; V_small</text>
    <text x="247" y="198" text-anchor="middle" stroke="none" fill="#d9381e" font-size="11">288&pi; = n &times; (32/3)&pi;</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-REC-3" font-family="system-ui,sans-serif" font-size="13">
    <text x="320" y="30" fill="currentColor" font-weight="bold">Stage 3: 27 Recast Small Spheres (r = 2 cm)</text>
    <!-- Group of 3x3 small spheres visualization -->
    <g fill="rgba(46,139,87,0.2)" stroke="currentColor" stroke-width="1.5">
      <circle cx="340" cy="80" r="18"/>
      <circle cx="390" cy="80" r="18"/>
      <circle cx="440" cy="80" r="18"/>
      <circle cx="340" cy="130" r="18"/>
      <circle cx="390" cy="130" r="18"/>
      <circle cx="440" cy="130" r="18"/>
      <circle cx="340" cy="180" r="18"/>
      <circle cx="390" cy="180" r="18"/>
      <circle cx="440" cy="180" r="18"/>
    </g>
    <text x="490" y="135" fill="currentColor" font-weight="bold">&times; 3 layers = 27 spheres</text>
    <rect x="310" y="220" width="230" height="70" rx="5" fill="rgba(46,139,87,0.12)" stroke="#2e8b57" stroke-width="1.5"/>
    <text x="425" y="242" text-anchor="middle" fill="#2e8b57" font-weight="bold">n = (6/2)&sup3; = 3&sup3; = 27 small spheres</text>
    <text x="425" y="262" text-anchor="middle" fill="currentColor">V_total = 27 &times; (32/3)&pi; = 288&pi; cm&sup3; (Conserved)</text>
    <text x="425" y="280" text-anchor="middle" fill="#d9381e" font-weight="bold">TSA_total = 27 &times; 16&pi; = 432&pi; cm&sup2; (Tripled: 3&times;)</text>
  </g>
</svg>
