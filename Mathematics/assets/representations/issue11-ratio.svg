<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
<title id="title">Cone and cylinder volume ratio</title>
<desc id="desc">A staged same-base same-height model comparing cone and cylinder volumes.</desc>
<rect x="1" y="1" width="438" height="278" rx="12" fill="none" stroke="currentColor"/>
<g data-g9-stage-id="VIS-I11-RAT-1"><path d="M75 225 L145 75 L215 225 Z" fill="none" stroke="currentColor" stroke-width="3"/>
<ellipse cx="145" cy="225" rx="70" ry="22" fill="none" stroke="currentColor" stroke-width="3"/>
<ellipse cx="325" cy="75" rx="60" ry="20" fill="none" stroke="currentColor" stroke-width="3"/><path d="M265 75 V225 M385 75 V225" stroke="currentColor" stroke-width="3"/><ellipse cx="325" cy="225" rx="60" ry="20" fill="none" stroke="currentColor" stroke-width="3"/>
<text x="42" y="46" font-size="18">same r and h</text><text x="270" y="255" font-size="18">V = 924 cm³</text></g>
<g data-g9-stage-id="VIS-I11-RAT-2"><text x="55" y="135" font-size="18">cone: (1/3)πr²h</text><text x="250" y="135" font-size="18">cylinder: πr²h</text></g>
<g data-g9-stage-id="VIS-I11-RAT-3"><text x="135" y="180" font-size="18">V_cone : V_cylinder = 1 : 3</text></g>
</svg>
