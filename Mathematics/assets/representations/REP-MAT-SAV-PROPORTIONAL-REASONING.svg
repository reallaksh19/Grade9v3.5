<svg font-size="17" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-mat-sav-prop-title rep-mat-sav-prop-desc">
  <title id="rep-mat-sav-prop-title">Cone and cylinder proportional volume ratio invariant</title>
  <desc id="rep-mat-sav-prop-desc">Stage 1: A cone and a cylinder sharing identical base radius r and vertical height h. Stage 2: Invariant volume relation showing cylinder volume V = πr²h and cone volume (1/3)πr²h. Stage 3: Three conical volumes exactly equal one cylinder volume of equal base and height.</desc>
  <g data-g9-stage-id="VIS-MAT-SAV-PROP-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="17">
    <text x="30" y="30" stroke="none" font-weight="bold">Stage 1: Shared Base and Altitude</text>
    <!-- Cylinder -->
    <ellipse cx="100" cy="70" rx="45" ry="15" fill="rgba(31,111,178,0.12)" stroke="currentColor" stroke-width="2"/>
    <line x1="55" y1="70" x2="55" y2="210" stroke="currentColor" stroke-width="2"/>
    <line x1="145" y1="70" x2="145" y2="210" stroke="currentColor" stroke-width="2"/>
    <path d="M 55 210 A 45 15 0 0 0 145 210" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="100" y="235" text-anchor="middle" stroke="none" font-weight="600">Cylinder (r, h)</text>
    <!-- Cone -->
    <path d="M 210 70 L 165 210 A 45 15 0 0 0 255 210 Z" fill="rgba(46,139,87,0.12)" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="235" text-anchor="middle" stroke="none" font-weight="600">Cone (r, h)</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-PROP-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="17">
    <text x="400" y="30" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Stage 2: Compare volumes</text>
    <rect x="280" y="60" width="240" height="140" rx="5" stroke-width="1.5" fill="rgba(31,111,178,0.08)"/>
    <text x="400" y="90" text-anchor="middle" stroke="none" fill="currentColor" font-weight="600">Cylinder Volume = &pi;r&sup2;h</text>
    <text x="400" y="125" text-anchor="middle" stroke="none" fill="#d9381e" font-weight="bold">Cone Volume = (1/3)&pi;r&sup2;h</text>
    <text x="400" y="160" text-anchor="middle" stroke="none" fill="#1f6fb2" font-weight="bold">Compare the shared factor &pi;r&sup2;h</text>
    <text x="400" y="185" text-anchor="middle" stroke="none" fill="#2e8b57">Same r, h → same &pi;r&sup2;h factor</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-PROP-3" font-family="system-ui,sans-serif" font-size="17">
    <rect x="40" y="255" width="480" height="50" rx="6" fill="rgba(31,111,178,0.12)" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="280" y="285" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Compare symbolically before substituting values</text>
  </g>
</svg>
