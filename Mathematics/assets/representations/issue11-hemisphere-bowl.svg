<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
<title id="title">Hemispherical bowl boundary</title>
<desc id="desc">A staged bowl model distinguishing curved inner surface from the open circular mouth.</desc>
<rect x="1" y="1" width="438" height="278" rx="12" fill="none" stroke="currentColor"/>
<g data-g9-stage-id="VIS-I11-HEMI-1"><path d="M95 90 C100 250 340 250 345 90" fill="none" stroke="currentColor" stroke-width="4"/>
<line x1="95" y1="90" x2="345" y2="90" stroke="currentColor" stroke-width="2" stroke-dasharray="8 8"/>
<line x1="220" y1="90" x2="345" y2="90" stroke="currentColor" stroke-width="2"/>
<text x="248" y="78" font-size="18">r = 10.5 cm</text><text x="155" y="48" font-size="18">open mouth</text></g>
<g data-g9-stage-id="VIS-I11-HEMI-2"><text x="115" y="235" font-size="18">inner curved surface</text></g>
<g data-g9-stage-id="VIS-I11-HEMI-3"><text x="40" y="145" font-size="18">curved hemisphere = 2πr²</text><text x="40" y="172" font-size="18">opening ≠ circular base</text></g>
