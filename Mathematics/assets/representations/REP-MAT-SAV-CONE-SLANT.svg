<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-mat-sav-cone-title rep-mat-sav-cone-desc">
  <title id="rep-mat-sav-cone-title">Right circular cone slant height derivation and curved surface area</title>
  <desc id="rep-mat-sav-cone-desc">Stage 1: Right circular cone showing vertical height h = 24 m and base radius r = 7 m. Stage 2: Pythagorean derivation of slant height hypotenuse l = √(r² + h²) = √(49 + 576) = 25 m. Stage 3: Curved surface area evaluation πrl = (22/7) × 7 × 25 = 550 m².</desc>
  <g data-g9-stage-id="VIS-MAT-SAV-CONE-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="14">
    <text x="30" y="30" stroke="none" font-weight="bold">Stage 1: Vertical Cone &amp; Base</text>
    <!-- Cone body -->
    <path d="M 140 60 L 60 210 A 80 22 0 0 0 220 210 Z" fill="rgba(31,111,178,0.12)" stroke="currentColor" stroke-width="2"/>
    <path d="M 60 210 A 80 22 0 0 1 220 210" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <!-- Vertical axis -->
    <line x1="140" y1="60" x2="140" y2="210" stroke="#d9381e" stroke-width="2"/>
    <text x="125" y="140" text-anchor="end" stroke="none" fill="#d9381e" font-weight="600">h = 24 m</text>
    <!-- Base radius -->
    <line x1="140" y1="210" x2="220" y2="210" stroke="#2e8b57" stroke-width="2"/>
    <text x="180" y="230" text-anchor="middle" stroke="none" fill="#2e8b57" font-weight="600">r = 7 m</text>
    <!-- Right angle indicator -->
    <rect x="140" y="195" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-CONE-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="13">
    <text x="270" y="30" stroke="none" fill="currentColor" font-weight="bold">Stage 2: Pythagoras Slant Height</text>
    <!-- Right Triangle isolated -->
    <polygon points="320,60 320,210 440,210" fill="rgba(46,139,87,0.1)" stroke="currentColor" stroke-width="2"/>
    <text x="305" y="140" text-anchor="end" stroke="none" fill="#d9381e">h = 24</text>
    <text x="380" y="230" text-anchor="middle" stroke="none" fill="#2e8b57">r = 7</text>
    <text x="395" y="125" stroke="none" fill="#1f6fb2" font-weight="bold">l = &radic;(7&sup2; + 24&sup2;)</text>
    <text x="395" y="145" stroke="none" fill="#1f6fb2" font-weight="bold">= &radic;(49 + 576)</text>
    <text x="395" y="165" stroke="none" fill="#1f6fb2" font-weight="bold">= &radic;625 = 25 m</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-CONE-3" font-family="system-ui,sans-serif" font-size="14">
    <rect x="40" y="255" width="480" height="50" rx="6" fill="rgba(31,111,178,0.12)" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="280" y="285" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Canvas Area CSA = &pi; &times; r &times; l = (22/7) &times; 7 &times; 25 = 550 m&sup2;</text>
  </g>
</svg>
