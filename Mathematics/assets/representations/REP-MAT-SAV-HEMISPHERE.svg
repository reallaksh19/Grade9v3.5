<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-mat-sav-hemi-title rep-mat-sav-hemi-desc">
  <title id="rep-mat-sav-hemi-title">Hemispherical bowl internal volume and capacity calculation</title>
  <desc id="rep-mat-sav-hemi-desc">Stage 1: An open hemispherical bowl showing inner radius r and its curved material boundary. Stage 2: Relate the curved hemisphere to half of a sphere's surface, giving 2πr², while the circular mouth remains an opening. Stage 3: Keep the boundary model symbolic without evaluating a question-specific result.</desc>
  <g data-g9-stage-id="VIS-MAT-SAV-HEMI-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="14">
    <text x="30" y="30" stroke="none" font-weight="bold">Stage 1: Hemispherical Bowl</text>
    <ellipse cx="140" cy="110" rx="80" ry="25" fill="rgba(31,111,178,0.1)" stroke="currentColor" stroke-width="2"/>
    <path d="M 60 110 A 80 80 0 0 0 220 110" fill="rgba(31,111,178,0.2)" stroke="currentColor" stroke-width="2"/>
    <line x1="140" y1="110" x2="220" y2="110" stroke="#2e8b57" stroke-width="2"/>
    <circle cx="140" cy="110" r="3" fill="currentColor"/>
    <text x="180" y="100" text-anchor="middle" stroke="none" fill="#2e8b57" font-weight="600">radius = r</text>
    <text x="140" y="160" text-anchor="middle" stroke="none" fill="currentColor">Curved inner material surface</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-HEMI-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="13">
    <text x="270" y="30" stroke="none" fill="currentColor" font-weight="bold">Stage 2: Curved Surface vs Opening</text>
    <rect x="270" y="70" width="250" height="140" rx="5" stroke-width="1.5" fill="rgba(46,139,87,0.08)"/>
    <text x="395" y="105" text-anchor="middle" stroke="none" fill="currentColor" font-weight="600">Full sphere surface = 4&pi;r&sup2;</text>
    <text x="395" y="135" text-anchor="middle" stroke="none" fill="#d9381e" font-weight="bold">Curved hemisphere surface = half of the sphere surface</text>
    <text x="395" y="165" text-anchor="middle" stroke="none" fill="currentColor">Circular mouth = OPEN</text>
    <text x="395" y="190" text-anchor="middle" stroke="none" fill="#2e8b57" font-weight="bold">No flat material disk spans the mouth</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-HEMI-3" font-family="system-ui,sans-serif" font-size="14">
    <rect x="40" y="255" width="480" height="50" rx="6" fill="rgba(31,111,178,0.12)" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="280" y="285" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Use only the curved inner material surface for an open bowl</text>
  </g>
</svg>
