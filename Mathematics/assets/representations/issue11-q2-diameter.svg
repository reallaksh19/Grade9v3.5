<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
<title id="title">Cylinder diameter and height</title>
<desc id="desc">A staged cylinder model that distinguishes diameter from radius.</desc>
<rect x="1" y="1" width="438" height="278" rx="12" fill="none" stroke="currentColor"/>
<g data-g9-stage-id="VIS-I11-Q2-1"><ellipse cx="220" cy="55" rx="100" ry="30" fill="none" stroke="currentColor" stroke-width="3"/>
<path d="M120 55 V220 M320 55 V220" stroke="currentColor" stroke-width="3"/>
<ellipse cx="220" cy="220" rx="100" ry="30" fill="none" stroke="currentColor" stroke-width="3"/>
<line x1="120" y1="55" x2="320" y2="55" stroke="currentColor" stroke-width="2"/>
<text x="185" y="42" font-size="18">d = 14 cm</text><text x="330" y="145" font-size="18">h = 20 cm</text></g>
<g data-g9-stage-id="VIS-I11-Q2-2"><circle cx="220" cy="55" r="5" fill="currentColor"/><line x1="220" y1="55" x2="320" y2="55" stroke="currentColor" stroke-width="3"/>
<text x="245" y="82" font-size="18">r = d/2</text></g>
<g data-g9-stage-id="VIS-I11-Q2-3"><text x="92" y="266" font-size="18">curved area = circumference × height = 2πrh</text></g>
</svg>
