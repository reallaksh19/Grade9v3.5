<svg font-size="17" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-mat-sav-cyl-basic-title rep-mat-sav-cyl-basic-desc">
  <title id="rep-mat-sav-cyl-basic-title">Cylinder curved surface area and diameter to radius conversion</title>
  <desc id="rep-mat-sav-cyl-basic-desc">Stage 1: A cylinder showing diameter d, radius r = d/2, and height h. Stage 2: Unroll the curved lateral surface into a rectangle of width 2πr and height h. Stage 3: Keep the curved-surface relation symbolic as CSA = 2πrh = πdh.</desc>
  <g data-g9-stage-id="VIS-MAT-SAV-CYL-B-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="17">
    <text x="30" y="30" stroke="none" font-weight="bold">Stage 1: Base Diameter Trap</text>
    <ellipse cx="130" cy="70" rx="55" ry="18" fill="rgba(31,111,178,0.1)" stroke="currentColor" stroke-width="2"/>
    <line x1="75" y1="70" x2="75" y2="210" stroke="currentColor" stroke-width="2"/>
    <line x1="185" y1="70" x2="185" y2="210" stroke="currentColor" stroke-width="2"/>
    <path d="M 75 210 A 55 18 0 0 0 185 210" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M 75 210 A 55 18 0 0 1 185 210" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="75" y1="70" x2="185" y2="70" stroke="#d9381e" stroke-width="1.5"/>
    <text x="130" y="62" text-anchor="middle" stroke="none" fill="#d9381e" font-weight="600">diameter = d</text>
    <line x1="130" y1="70" x2="185" y2="70" stroke="#2e8b57" stroke-width="2"/>
    <text x="130" y="98" text-anchor="middle" stroke="none" fill="#2e8b57" font-weight="bold">radius r = d / 2</text>
    <line x1="200" y1="70" x2="200" y2="210" stroke="currentColor" stroke-width="1.5"/>
    <text x="210" y="145" stroke="none">height = h</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-CYL-B-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="17">
    <text x="400" y="30" text-anchor="middle" stroke="none" fill="currentColor" font-weight="bold">Stage 2: Unroll curved wall</text>
    <rect x="280" y="70" width="240" height="140" rx="4" stroke-width="2" fill="rgba(31,111,178,0.12)"/>
    <text x="400" y="125" text-anchor="middle" stroke="none" fill="currentColor" font-weight="600">Width = base circumference</text>
    <text x="400" y="155" text-anchor="middle" stroke="none" fill="currentColor">Height = height = h</text>
    <text x="400" y="185" text-anchor="middle" stroke="none" fill="#1f6fb2" font-weight="bold">Area = circumference × height</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-CYL-B-3" font-family="system-ui,sans-serif" font-size="17">
    <rect x="40" y="255" width="480" height="50" rx="6" fill="rgba(31,111,178,0.12)" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="280" y="285" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Curved surface relation: CSA = 2&pi;rh = &pi;dh</text>
  </g>
</svg>
