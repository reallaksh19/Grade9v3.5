<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
<title id="title">Surface boundary selection</title>
<desc id="desc">A staged cylinder boundary model distinguishing material surfaces from openings.</desc>
<rect x="1" y="1" width="438" height="278" rx="12" fill="none" stroke="currentColor"/>
<g data-g9-stage-id="VIS-I11-SA-1"><ellipse cx="220" cy="60" rx="105" ry="35" fill="none" stroke="currentColor" stroke-width="3"/>
<path d="M115 60 V210 M325 60 V210" fill="none" stroke="currentColor" stroke-width="3"/>
<ellipse cx="220" cy="210" rx="105" ry="35" fill="none" stroke="currentColor" stroke-width="3"/>
<text x="22" y="34" font-size="18">Ask: which surfaces physically exist?</text></g>
<g data-g9-stage-id="VIS-I11-SA-2"><path d="M115 85 V195 M325 85 V195" fill="none" stroke="currentColor" stroke-width="7"/>
<text x="142" y="135" font-size="18">curved wall: 2πrh</text>
<text x="138" y="238" font-size="18">each circle: πr²</text></g>
<g data-g9-stage-id="VIS-I11-SA-3"><text x="30" y="160" font-size="18">open top → omit that circle</text>
<text x="30" y="188" font-size="18">closed / present base → include πr²</text>
<text x="30" y="216" font-size="18">total area = sum of included pieces only</text></g>
</svg>
