<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" role="img" aria-labelledby="rep-mat-sav-cube-title rep-mat-sav-cube-desc">
  <title id="rep-mat-sav-cube-title">Cube total surface area decomposition into six square faces</title>
  <desc id="rep-mat-sav-cube-desc">Stage 1: A 3D isometric regular cube of edge length a = 7 cm. Stage 2: Decomposition into 6 disjoint congruent square faces each of area a² = 49 cm². Stage 3: Summation of all six square faces yielding total surface area TSA = 6 × 49 = 294 cm².</desc>
  <g data-g9-stage-id="VIS-MAT-SAV-CUBE-1" stroke="currentColor" fill="currentColor" font-family="system-ui,sans-serif" font-size="14">
    <text x="30" y="30" stroke="none" font-weight="bold">Stage 1: Regular Hexahedron (Cube)</text>
    <!-- Isometric Cube Front Face -->
    <rect x="70" y="110" width="100" height="100" fill="rgba(31,111,178,0.15)" stroke="currentColor" stroke-width="2"/>
    <!-- Top Face -->
    <polygon points="70,110 120,60 220,60 170,110" fill="rgba(31,111,178,0.25)" stroke="currentColor" stroke-width="2"/>
    <!-- Right Face -->
    <polygon points="170,110 220,60 220,160 170,210" fill="rgba(31,111,178,0.35)" stroke="currentColor" stroke-width="2"/>
    <text x="120" y="235" text-anchor="middle" stroke="none" font-weight="600">Edge a = 7 cm</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-CUBE-2" stroke="currentColor" fill="none" font-family="system-ui,sans-serif" font-size="13">
    <text x="270" y="30" stroke="none" fill="currentColor" font-weight="bold">Stage 2: 6 Congruent Square Faces</text>
    <!-- 6 Face Grid -->
    <g fill="rgba(46,139,87,0.12)" stroke="currentColor" stroke-width="1.5">
      <rect x="270" y="60" width="60" height="60" rx="3"/>
      <rect x="350" y="60" width="60" height="60" rx="3"/>
      <rect x="430" y="60" width="60" height="60" rx="3"/>
      <rect x="270" y="140" width="60" height="60" rx="3"/>
      <rect x="350" y="140" width="60" height="60" rx="3"/>
      <rect x="430" y="140" width="60" height="60" rx="3"/>
    </g>
    <text x="300" y="95" text-anchor="middle" stroke="none" fill="currentColor">49 cm&sup2;</text>
    <text x="380" y="95" text-anchor="middle" stroke="none" fill="currentColor">49 cm&sup2;</text>
    <text x="460" y="95" text-anchor="middle" stroke="none" fill="currentColor">49 cm&sup2;</text>
    <text x="300" y="175" text-anchor="middle" stroke="none" fill="currentColor">49 cm&sup2;</text>
    <text x="380" y="175" text-anchor="middle" stroke="none" fill="currentColor">49 cm&sup2;</text>
    <text x="460" y="175" text-anchor="middle" stroke="none" fill="currentColor">49 cm&sup2;</text>
    <text x="380" y="225" text-anchor="middle" stroke="none" fill="#2e8b57" font-weight="600">6 faces &times; (7 &times; 7 cm&sup2;)</text>
  </g>
  <g data-g9-stage-id="VIS-MAT-SAV-CUBE-3" font-family="system-ui,sans-serif" font-size="14">
    <rect x="40" y="255" width="480" height="50" rx="6" fill="rgba(31,111,178,0.12)" stroke="#1f6fb2" stroke-width="1.5"/>
    <text x="280" y="285" text-anchor="middle" fill="#1f6fb2" font-weight="bold">Total Surface Area TSA = 6 &times; a&sup2; = 6 &times; 49 = 294 cm&sup2;</text>
  </g>
</svg>
