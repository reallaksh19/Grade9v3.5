<g data-g9-stage-id="VIS-I11-CAP-1"><path d="M95 75 L290 75 L345 115 L150 115 Z M95 75 V215 L150 250 V115 M150 250 L345 250 V115 M290 75 V215 L95 215" fill="none" stroke="currentColor" stroke-width="3"/>
<text x="165" y="64" font-size="18">2 m</text><text x="300" y="92" font-size="18">1.5 m</text><text x="355" y="180" font-size="18">1.2 m</text><text x="28" y="38" font-size="18">75% full</text></g>
<g data-g9-stage-id="VIS-I11-CAP-2"><text x="35" y="145" font-size="18">V_full = lwh</text><text x="35" y="175" font-size="18">V_water = 0.75 V_full</text></g>
