<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img" aria-labelledby="ja14q19-title ja14q19-desc">
<title id="ja14q19-title">Two touching blocks with only the lower block on rough support</title><desc id="ja14q19-desc">Block m1 is immediately uphill of m2. The plane is smooth under m1 and rough under m2 with coefficient 0.3. Source angles 5, 10, 15 and 20 degrees are listed; no threshold is shown.</desc>
<defs><marker id="ja14q19-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">m₁ = 1 kg above m₂ = 2 kg</text><line x1="24" y1="206" x2="416" y2="82" stroke-width="2" /><rect x="146" y="145" width="58" height="42" fill="none" stroke-width="2" transform="rotate(-18 175 166)"/><rect x="208" y="126" width="66" height="46" fill="none" stroke-width="2" transform="rotate(-18 241 149)"/><text x="126" y="120" stroke="none" >m₁ · smooth</text><text x="270" y="116" stroke="none" >m₂ · rough</text><text x="22" y="226" stroke="none" >θ</text><text x="16" y="250" stroke="none" >μ = 0.3 only under m₂ · θ = 5°, 10°, 15°, 20°</text></g></svg>
