<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img" aria-labelledby="i18q12-title i18q12-desc">
<title id="i18q12-title">Three push trials on the same 100 kilogram block</title><desc id="i18q12-desc">The same 100 kilogram rough-surface block is shown with one push F that cannot start it, three pushes 3F giving acceleration 0.5 metres per second squared, and two pushes 2F while the moving block has uniform speed. Mu is unknown.</desc>
<defs><marker id="i18q12-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">same 100 kg block · level rough surface</text><text x="16" y="44" stroke="none">μ unknown</text><text x="22" y="58" stroke="none" >1 person</text><line x1="18" y1="116" x2="132" y2="116" stroke-width="2" /><rect x="48" y="80" width="54" height="36" fill="none" stroke-width="2" /><line x1="20" y1="98" x2="46" y2="98" stroke-width="2" marker-end="url(#i18q12-a)"/><text x="20" y="78" stroke="none" >F</text><text x="18" y="144" stroke="none" >cannot start</text><text x="164" y="58" stroke="none" >3 people</text><line x1="154" y1="116" x2="276" y2="116" stroke-width="2" /><rect x="188" y="80" width="54" height="36" fill="none" stroke-width="2" /><line x1="154" y1="98" x2="186" y2="98" stroke-width="2" marker-end="url(#i18q12-a)"/><text x="154" y="78" stroke="none" >3F</text><text x="154" y="144" stroke="none" >a = 0.5 m/s²</text><text x="316" y="58" stroke="none" >2 people</text><line x1="300" y1="116" x2="422" y2="116" stroke-width="2" /><rect x="334" y="80" width="54" height="36" fill="none" stroke-width="2" /><line x1="300" y1="98" x2="332" y2="98" stroke-width="2" marker-end="url(#i18q12-a)"/><text x="300" y="78" stroke="none" >2F</text><text x="298" y="144" stroke="none" >uniform speed</text><text x="16" y="198" stroke="none" >Last two trials occur while the block is moving.</text><text x="16" y="224" stroke="none" >Find F and the kinetic-friction coefficient.</text></g></svg>
