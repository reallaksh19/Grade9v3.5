<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" role="img" aria-labelledby="rep-nlm-wedge-title rep-nlm-wedge-desc">
  <title id="rep-nlm-wedge-title">Wedge under a sliding block: only forces that act on the wedge</title>
  <desc id="rep-nlm-wedge-desc">Stage 1: A 2 kg block slides down the smooth face of a 5 kg wedge inclined at 30°; the wedge stays at rest on a rough floor; the slope rises to the right, so the block slides down to the left. Stage 2: On the wedge: its 50 N weight, the block's normal push of 17.3 N into the slope (8.66 N right and 15 N down), the floor's normal force and the floor's friction. Stage 3: The floor's normal force is 65 N and its friction about 8.7 N to the left; the block's 20 N weight is not on the wedge's diagram.</desc>
  <defs>
    <marker id="rep-nlm-wedge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-wedge-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-WEDGE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2 kg block slides down the smooth face of a 5 kg wedge</text>
    <line x1="40" y1="250" x2="420" y2="250" stroke="currentColor" stroke-width="2"/>
    <line x1="50" y1="250" x2="42" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="68" y1="250" x2="60" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="86" y1="250" x2="78" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="104" y1="250" x2="96" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="122" y1="250" x2="114" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="140" y1="250" x2="132" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="158" y1="250" x2="150" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="176" y1="250" x2="168" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="194" y1="250" x2="186" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="212" y1="250" x2="204" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="230" y1="250" x2="222" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="248" y1="250" x2="240" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="266" y1="250" x2="258" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="284" y1="250" x2="276" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="302" y1="250" x2="294" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="320" y1="250" x2="312" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="338" y1="250" x2="330" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="356" y1="250" x2="348" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="374" y1="250" x2="366" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="392" y1="250" x2="384" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="410" y1="250" x2="402" y2="258" stroke="currentColor" stroke-width="1"/>
    <polygon points="80,250 360,250 360,88.3" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="124" y="242" text-anchor="middle" font-size="14">30°</text>
    <path d="M110 250 A30 30 0 0 0 106 235" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 202.4 162)"><rect x="178.4 " y="147" width="48" height="30" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="202.4" y="167" text-anchor="middle" font-size="14">2 kg</text>
    <text x="306" y="245" text-anchor="middle">5 kg</text>
    <line x1="161.4" y1="151" x2="123.3" y2="173" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-wedge-arrow)"/>
    <text x="115.3" y="189" text-anchor="end">slides</text>
    <text x="20" y="290">wedge at rest on a rough floor; slope rises right; +x right, +y up; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-WEDGE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="210.4" y1="175.9" x2="235.4" y2="219.2" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-wedge-arrow-acc)"/>
    <text x="243" y="206" fill="#1f6fb2">block on</text>
    <text x="243" y="226" fill="#1f6fb2">wedge: 17.3 N</text>
    <text x="470" y="60" font-weight="600">wedge's diagram only:</text>
    <text x="470" y="82">weight 50 N down</text>
    <text x="470" y="104">block's normal push 17.3 N into the slope</text>
    <text x="470" y="126">(8.66 N right, 15 N down)</text>
    <text x="470" y="148">floor normal N_f, floor friction f</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-WEDGE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="180" font-weight="600" fill="#1f6fb2">y: N_f = 50 + 15 = 65 N</text>
    <text x="470" y="202" font-weight="600" fill="#1f6fb2">x: f ≈ 8.7 N to the left</text>
    <text x="470" y="224">the block's 20 N weight is not</text>
    <text x="470" y="246">on the wedge's diagram</text>
  </g>
</svg>
