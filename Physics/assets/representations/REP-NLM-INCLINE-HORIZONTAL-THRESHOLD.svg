<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="rep-nlm-hthresh-title rep-nlm-hthresh-desc">
  <title id="rep-nlm-hthresh-title">Horizontal push on a rough incline: signed friction need against μ_s N</title>
  <desc id="rep-nlm-hthresh-desc">Stage 1: A block of mass m is held at rest on a rough fixed plane that rises to the right at θ, with μ_s; a horizontal force P pushes to the right. Stage 2: With uphill positive, N = mg cos θ + P sin θ and f_required = mg sin θ − P cos θ. Stage 3: The sign of f_required gives friction's direction, and rest is possible exactly when |mg sin θ − P cos θ| ≤ μ_s (mg cos θ + P sin θ).</desc>
  <defs>
    <marker id="rep-nlm-hthresh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-hthresh-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-HTHRESH-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Block held at rest on a rough incline by a horizontal push P</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">θ</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 178.7 160.3)"><rect x="150.7 " y="143.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="276.5" y="169.6" text-anchor="middle" font-size="14">rough: μ_s</text>
    <line x1="68.7" y1="160.3" x2="148.7" y2="160.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-hthresh-arrow)"/>
    <text x="68.7" y="152.3">P</text>
    <text x="20" y="300">plane rises to the right; friction direction not assumed</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HTHRESH-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="60" font-weight="600">uphill positive:</text>
    <text x="460" y="82">N = mg cos θ + P sin θ</text>
    <text x="460" y="104">f_required = mg sin θ − P cos θ</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HTHRESH-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="140" font-weight="600" fill="#1f6fb2">sign of f_required gives the direction:</text>
    <text x="460" y="162" fill="#1f6fb2">&gt; 0 up the slope, &lt; 0 down the slope</text>
    <text x="460" y="184" fill="#1f6fb2">rest possible exactly when</text>
    <text x="460" y="206" font-weight="600" fill="#1f6fb2">|mg sin θ − P cos θ| ≤ μ_s (mg cos θ + P sin θ)</text>
  </g>
</svg>
