<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="rep-nlm-tray-title rep-nlm-tray-desc">
  <title id="rep-nlm-tray-title">Book on a tray: friction zero at steady speed, forward while speeding up</title>
  <desc id="rep-nlm-tray-desc">Stage 1: A book rests on a horizontal tray that a waiter carries first at steady speed in a straight line, then speeds up forward; the book never slips. Stage 2: With the tray top imagined slippery: at steady speed the book keeps pace and has no tendency to slip; while speeding up the tray moves ahead and the book would slip backward relative to it. Stage 3: The friction of the tray on the book is zero during the steady carry and is static friction pointing forward while the tray speeds up.</desc>
  <defs>
    <marker id="rep-nlm-tray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-tray-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TRAY-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A book on a waiter's tray; the book never slips</text>
    <line x1="40" y1="150" x2="190" y2="150" stroke="currentColor" stroke-width="3"/>
    <rect x="90" y="122" width="50" height="28" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="115" y="141" text-anchor="middle">book</text>
    <line x1="190" y1="150" x2="215" y2="170" stroke="currentColor" stroke-width="2"/>
    <text x="115" y="190" text-anchor="middle" font-size="14">tray</text>
    <line x1="250" y1="150" x2="400" y2="150" stroke="currentColor" stroke-width="3"/>
    <rect x="300" y="122" width="50" height="28" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="325" y="141" text-anchor="middle">book</text>
    <line x1="400" y1="150" x2="425" y2="170" stroke="currentColor" stroke-width="2"/>
    <text x="325" y="190" text-anchor="middle" font-size="14">tray</text>
    <text x="115" y="56" text-anchor="middle">stage 1: steady speed</text>
    <text x="325" y="56" text-anchor="middle">stage 2: speeding up</text>
    <line x1="60" y1="100" x2="120" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-tray-arrow)"/>
    <text x="60" y="86" text-anchor="start">v constant</text>
    <line x1="270" y1="100" x2="330" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-tray-arrow)"/>
    <text x="270" y="86" text-anchor="start">a forward</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRAY-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="60" font-weight="600">imagine the tray top slippery:</text>
    <text x="460" y="82">stage 1: book keeps pace, no slip tendency</text>
    <text x="460" y="104">stage 2: tray moves ahead, book would</text>
    <text x="460" y="126">slip backward relative to the tray</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRAY-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="115" y="216" text-anchor="middle" font-weight="600" fill="#1f6fb2">f = 0</text>
    <line x1="296" y1="116" x2="340" y2="116" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-tray-arrow-acc)"/>
    <text x="325" y="216" text-anchor="middle" font-weight="600" fill="#1f6fb2">static f forward</text>
    <text x="460" y="170" font-weight="600" fill="#1f6fb2">friction of tray on book:</text>
    <text x="460" y="192" fill="#1f6fb2">stage 1: zero</text>
    <text x="460" y="214" fill="#1f6fb2">stage 2: static, forward</text>
    <text x="460" y="236">opposes the slip tendency, and is</text>
    <text x="460" y="258">zero when no sideways force is needed</text>
  </g>
</svg>
