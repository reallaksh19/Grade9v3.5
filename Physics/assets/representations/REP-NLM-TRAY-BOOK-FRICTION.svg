<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img" aria-labelledby="tray-title tray-desc">
<title id="tray-title">Book on a tray: friction follows relative slip tendency</title><desc id="tray-desc">Three stages compare steady-speed motion and forward acceleration of a tray carrying a book without slip, then reveal slip tendency and friction.</desc>
<defs><marker id="tray-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g data-g9-stage-id="VIS-NLM-TRAY-V0" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">Book never slips on the tray</text><text x="26" y="54" stroke="none" >steady speed</text><line x1="20" y1="138" x2="185" y2="138" stroke-width="2" /><rect x="72" y="98" width="60" height="40" fill="none" stroke-width="2" /><line x1="42" y1="78" x2="116" y2="78" stroke-width="2" marker-end="url(#tray-a)"/><text x="48" y="67" stroke="none" >v constant</text><text x="250" y="54" stroke="none" >speeding up</text><line x1="232" y1="138" x2="415" y2="138" stroke-width="2" /><rect x="292" y="98" width="60" height="40" fill="none" stroke-width="2" /><line x1="254" y1="78" x2="340" y2="78" stroke-width="2" marker-end="url(#tray-a)"/><text x="260" y="67" stroke="none" >a forward</text></g>
<g data-g9-stage-id="VIS-NLM-TRAY-V1" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="178" stroke="none" font-weight="700">Imagine the tray top frictionless:</text><text x="16" y="202" stroke="none" >steady speed → no relative slip tendency</text><text x="16" y="226" stroke="none">speeding up → book tends to slip backward</text><text x="16" y="246" stroke="none">relative to the tray</text></g>
<g data-g9-stage-id="VIS-NLM-TRAY-V2" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="178" stroke="none" font-weight="700">Friction of tray on book:</text><text x="16" y="202" stroke="none" >steady speed → f = 0</text><text x="16" y="226" stroke="none" >speeding up → static friction points forward</text><line x1="292" y1="92" x2="360" y2="92" stroke-width="2" marker-end="url(#tray-a)"/></g></svg>
