<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img" aria-labelledby="i11q22-title i11q22-desc">
<title id="i11q22-title">Five kilogram block pulled by 20 newtons on a rough level surface</title><desc id="i11q22-desc">The source-given block has mass 5 kilograms, static coefficient 0.5, kinetic coefficient 0.3 and a horizontal 20 newton applied force. No friction value, acceleration or limit is shown.</desc>
<defs><marker id="i11q22-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">m = 5 kg · μ_s = 0.5 · μ_k = 0.3</text><line x1="32" y1="170" x2="408" y2="170" stroke-width="2" /><rect x="156" y="112" width="86" height="58" fill="none" stroke-width="2" /><text x="177" y="145" stroke="none" >5 kg</text><line x1="242" y1="136" x2="344" y2="136" stroke-width="2" marker-end="url(#i11q22-a)"/><text x="280" y="122" stroke="none" >20 N</text><line x1="199" y1="112" x2="199" y2="66" stroke-width="2" marker-end="url(#i11q22-a)"/><text x="207" y="75" stroke="none" >N</text><line x1="199" y1="142" x2="199" y2="218" stroke-width="2" marker-end="url(#i11q22-a)"/><text x="207" y="214" stroke="none" >mg</text><text x="16" y="248" stroke="none" >initially no slip; decide the contact state first</text></g></svg>
