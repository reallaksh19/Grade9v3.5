<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 345" role="img" aria-labelledby="rep-nlm-liftcrate-title rep-nlm-liftcrate-desc">
  <title id="rep-nlm-liftcrate-title">Crate in a lift accelerating up: N = 600 N, friction zero</title>
  <desc id="rep-nlm-liftcrate-desc">Stage 1: A 50 kg crate stands on the rough floor of a lift (μ_s = 0.4) while the lift accelerates upward at 2 m/s²; nothing pushes the crate sideways; g = 10 m/s². Stage 2: Vertically N − 500 = 50 × 2, so N = 600 N; μ_s N = 240 N is only a limit. Stage 3: The friction force is zero: the acceleration is vertical, so nothing is needed along the floor, even though the floor is rough and N is larger.</desc>
  <defs>
    <marker id="rep-nlm-liftcrate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-liftcrate-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-LIFTCRATE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 50 kg crate on the rough floor of a lift accelerating up</text>
    <line x1="200" y1="40" x2="200" y2="70" stroke="currentColor" stroke-width="2"/>
    <rect x="90" y="70" width="220" height="190" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="160" y="200" width="80" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="200" y="235" text-anchor="middle">50 kg</text>
    <line x1="340" y1="200" x2="340" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftcrate-arrow)"/>
    <text x="348" y="150">a = 2 m/s² up</text>
    <text x="20" y="335">μ_s = 0.4; g = 10 m/s²; nothing pushes the crate sideways</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTCRATE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="188" y1="200" x2="188" y2="156" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftcrate-arrow)"/>
    <text x="196" y="170">N</text>
    <line x1="212" y1="260" x2="212" y2="304" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftcrate-arrow)"/>
    <text x="220" y="300">500 N</text>
    <text x="480" y="60" font-weight="600">vertical: N − 500 = 50 × 2</text>
    <text x="480" y="82" font-weight="600" fill="#1f6fb2">N = 600 N</text>
    <text x="480" y="104">μ_s N = 240 N (only a limit)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTCRATE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="150" font-weight="600" fill="#1f6fb2">friction = 0</text>
    <text x="480" y="172" fill="#1f6fb2">a is vertical: nothing is needed</text>
    <text x="480" y="194" fill="#1f6fb2">along the floor, no slip tendency</text>
    <text x="480" y="216">rough floor and larger N do not create it</text>
  </g>
</svg>
