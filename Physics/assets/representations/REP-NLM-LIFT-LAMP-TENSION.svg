<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="rep-nlm-liftlamp-title rep-nlm-liftlamp-desc">
  <title id="rep-nlm-liftlamp-title">Lamp on a cord in a lift: tension from T − mg = m a_y in three cases</title>
  <desc id="rep-nlm-liftlamp-desc">Stage 1: A 2 kg lamp hangs from a light cord inside a lift that (a) moves up at steady speed, (b) accelerates upward at 2 m/s², (c) accelerates downward at 3 m/s²; up positive, g = 10 m/s². Stage 2: Two forces act on the lamp, the cord's T up and its 20 N weight down, so T − mg = m a_y and T = 2(10 + a_y). Stage 3: T = 20 N at steady speed, 24 N when accelerating up at 2 m/s² and 14 N when accelerating down at 3 m/s².</desc>
  <defs>
    <marker id="rep-nlm-liftlamp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-liftlamp-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-LIFTLAMP-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2 kg lamp on a light cord inside a lift</text>
    <line x1="80" y1="40" x2="80" y2="70" stroke="currentColor" stroke-width="2"/>
    <rect x="20" y="70" width="120" height="170" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="80" y1="70" x2="80" y2="130" stroke="currentColor" stroke-width="1.8"/>
    <path d="M64 156 L72 130 H88 L96 156 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="80" y="262" text-anchor="middle" font-size="14">(a) up, steady</text>
    <line x1="220" y1="40" x2="220" y2="70" stroke="currentColor" stroke-width="2"/>
    <rect x="160" y="70" width="120" height="170" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="70" x2="220" y2="130" stroke="currentColor" stroke-width="1.8"/>
    <path d="M204 156 L212 130 H228 L236 156 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="262" text-anchor="middle" font-size="14">(b) a = +2 m/s²</text>
    <line x1="360" y1="40" x2="360" y2="70" stroke="currentColor" stroke-width="2"/>
    <rect x="300" y="70" width="120" height="170" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="360" y1="70" x2="360" y2="130" stroke="currentColor" stroke-width="1.8"/>
    <path d="M344 156 L352 130 H368 L376 156 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="360" y="262" text-anchor="middle" font-size="14">(c) a = −3 m/s²</text>
    <line x1="150" y1="150" x2="150" y2="110" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftlamp-arrow)"/>
    <text x="146" y="170" text-anchor="end">v</text>
    <line x1="290" y1="170" x2="290" y2="120" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-liftlamp-arrow-acc)"/>
    <text x="286" y="186" text-anchor="end" fill="#1f6fb2">a</text>
    <line x1="430" y1="120" x2="430" y2="170" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-liftlamp-arrow-acc)"/>
    <text x="434" y="112" fill="#1f6fb2">a</text>
    <text x="20" y="290">up positive; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTLAMP-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="80" y1="128" x2="80" y2="92" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftlamp-arrow)"/>
    <text x="88" y="104">T</text>
    <line x1="80" y1="158" x2="80" y2="198" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftlamp-arrow)"/>
    <text x="88" y="192">20 N</text>
    <text x="470" y="60" font-weight="600">lamp, +y up:</text>
    <text x="470" y="82">T − mg = m a_y</text>
    <text x="470" y="104">T = 2(10 + a_y)</text>
    <text x="470" y="126">T comes from the equation, not mg</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTLAMP-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="80" y="230" text-anchor="middle" font-weight="600" fill="#1f6fb2">T = 20 N</text>
    <text x="220" y="230" text-anchor="middle" font-weight="600" fill="#1f6fb2">T = 24 N</text>
    <text x="360" y="230" text-anchor="middle" font-weight="600" fill="#1f6fb2">T = 14 N</text>
    <text x="470" y="170" fill="#1f6fb2">(a) a_y = 0: T = 20 N = mg</text>
    <text x="470" y="192" fill="#1f6fb2">(b) a_y = +2: T = 24 N &gt; mg</text>
    <text x="470" y="214" fill="#1f6fb2">(c) a_y = −3: T = 14 N &lt; mg</text>
  </g>
</svg>
