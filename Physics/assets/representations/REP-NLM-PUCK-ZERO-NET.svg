<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="rep-nlm-puck-title rep-nlm-puck-desc">
  <title id="rep-nlm-puck-title">Puck sliding on smooth ice: zero net force, unchanged velocity</title>
  <desc id="rep-nlm-puck-desc">Stage 1: A 0.2 kg puck slides across smooth horizontal ice at 4 m/s after the stick loses contact; friction and air resistance are negligible. Stage 2: No horizontal force acts, so the net horizontal force is zero; snapshots at 0, 1, 2 and 3 s are equally spaced. Stage 3: The velocity does not change: still 4 m/s at 3 s, having covered 12 m; a puck at rest stays at rest. Zero net force goes with no change of velocity, not with no motion.</desc>
  <defs>
    <marker id="rep-nlm-puck-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-puck-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-PUCK-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 0.2 kg puck slides on smooth ice at 4 m/s</text>
    <line x1="30" y1="160" x2="430" y2="160" stroke="currentColor" stroke-width="2"/>
    <line x1="40" y1="160" x2="32" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="58" y1="160" x2="50" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="76" y1="160" x2="68" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="94" y1="160" x2="86" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="112" y1="160" x2="104" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="130" y1="160" x2="122" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="160" x2="140" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="160" x2="158" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="160" x2="176" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="160" x2="194" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="160" x2="212" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="160" x2="230" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="256" y1="160" x2="248" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="274" y1="160" x2="266" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="292" y1="160" x2="284" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="310" y1="160" x2="302" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="328" y1="160" x2="320" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="346" y1="160" x2="338" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="364" y1="160" x2="356" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="382" y1="160" x2="374" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="400" y1="160" x2="392" y2="168" stroke="currentColor" stroke-width="1"/>
    <line x1="418" y1="160" x2="410" y2="168" stroke="currentColor" stroke-width="1"/>
    <ellipse cx="60" cy="150" rx="22" ry="9" fill="currentColor"/>
    <line x1="86" y1="150" x2="136" y2="150" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-puck-arrow)"/>
    <text x="88" y="138">4 m/s</text>
    <text x="20" y="200">stick has lost contact; friction and air resistance negligible</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PUCK-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <ellipse cx="170" cy="150" rx="22" ry="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse cx="280" cy="150" rx="22" ry="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse cx="390" cy="150" rx="22" ry="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="60" y="130" text-anchor="middle" font-size="14">0 s</text>
    <text x="170" y="130" text-anchor="middle" font-size="14">1 s</text>
    <text x="280" y="130" text-anchor="middle" font-size="14">2 s</text>
    <text x="390" y="130" text-anchor="middle" font-size="14">3 s</text>
    <text x="450" y="60" font-weight="600">horizontal forces on the puck:</text>
    <text x="450" y="82">none</text>
    <text x="450" y="104">net horizontal force = 0</text>
    <text x="450" y="126">equal-time snapshots, equal gaps</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PUCK-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="450" y="170" font-weight="600" fill="#1f6fb2">velocity does not change:</text>
    <text x="450" y="192" fill="#1f6fb2">still 4 m/s at 3 s, 12 m covered</text>
    <text x="450" y="214">a puck at rest stays at rest</text>
    <text x="450" y="236">zero net force ↔ no velocity change,</text>
    <text x="450" y="258">not ↔ no motion</text>
  </g>
</svg>
