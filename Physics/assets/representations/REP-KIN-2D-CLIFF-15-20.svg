<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="rep-kin-cliff-title rep-kin-cliff-desc">
  <title id="rep-kin-cliff-title">A stone launched horizontally at 15 m/s from a cliff 20 m above level ground</title>
  <desc id="rep-kin-cliff-desc">Stage 1: a stone is launched horizontally at 15 m/s (u_y = 0) from a cliff 20 m above level ground; +y is upward, g = 10 m/s² and air resistance is neglected. Stage 2: the x column has u_x = 15 m/s and a_x = 0; the y column has u_y = 0, a_y = −10 m/s² and the landing at Δy = −20 m; both share one clock. Stage 3: −20 = 0·t − ½(10)t² gives t = 2 s. Stage 4: the path lands Δx = 15 × 2 = 30 m out, with v = (15 i − 20 j) m/s at impact.</desc>
  <defs>
    <marker id="rep-kin-cliff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-cliff-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-CLIFF-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A stone launched horizontally from a cliff</text>
    <rect x="20" y="100" width="100" height="160" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="120" y1="260" x2="480" y2="260" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="260" x2="122" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="260" x2="140" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="260" x2="158" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="260" x2="176" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="260" x2="194" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="260" x2="212" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="260" x2="230" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="256" y1="260" x2="248" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="274" y1="260" x2="266" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="292" y1="260" x2="284" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="310" y1="260" x2="302" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="328" y1="260" x2="320" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="346" y1="260" x2="338" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="364" y1="260" x2="356" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="382" y1="260" x2="374" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="400" y1="260" x2="392" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="418" y1="260" x2="410" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="436" y1="260" x2="428" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="454" y1="260" x2="446" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="472" y1="260" x2="464" y2="268" stroke="currentColor" stroke-width="1"/>
    <circle cx="120" cy="100" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="126" y1="100" x2="196" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-cliff-arrow)"/>
    <text x="150" y="88">u_x = 15 m/s, u_y = 0</text>
    <line x1="28" y1="100" x2="28" y2="260" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="34" y="185">20 m</text>
    <text x="520" y="60">+y upward; g = 10 m/s²</text>
    <text x="520" y="82">air resistance neglected</text>
    <text x="520" y="104">Find the flight time, range</text>
    <text x="520" y="126">and impact velocity.</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-CLIFF-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="520" y="160" font-weight="600">Two columns, one clock</text>
    <text x="520" y="182">x: u_x = 15 m/s, a_x = 0</text>
    <text x="520" y="204">y: u_y = 0, a_y = −10 m/s²,</text>
    <text x="520" y="226">   landing at Δy = −20 m</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-CLIFF-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="520" y="262" fill="#1f6fb2">−20 = 0·t − ½(10)t², so t = 2 s</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-CLIFF-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M120 100 L150 102.5 L180 110 L210 122.5 L240 140 L270 162.5 L300 190 L330 222.5 L360 260" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="360" cy="260" r="6" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="2"/>
    <text x="250" y="290" fill="#1f6fb2">Δx = 15 × 2 = 30 m</text>
    <text x="250" y="312" fill="#1f6fb2">v = (15 i − 20 j) m/s at impact</text>
  </g>
</svg>
