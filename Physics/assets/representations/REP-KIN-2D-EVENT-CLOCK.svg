<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="rep-kin-ec-title rep-kin-ec-desc">
  <title id="rep-kin-ec-title">Event clock: one component condition fixes the event time, which is reused on every component</title>
  <desc id="rep-kin-ec-desc">Drawn qualitatively, without numerical values. Stage 1: the physical event: a stone leaves the top of a cliff moving horizontally with u_x and follows a curved path to level ground; the requested event is the moment it reaches the ground. Stage 2: with +x horizontal and +y upward, the event condition is stated on the y-component: the vertical displacement equals minus the cliff height, Δy = −h. A single shared event timeline starts at t = 0 at release and carries an open marker for the event time t_event, not yet solved. Stage 3: the event-time marker is filled in: t_event is solved from the y condition u_y t − ½ g t² = −h. Stage 4: that same t_event is reused unchanged on both components: the x-component evaluation Δx = u_x t_event is drawn as the horizontal distance along the ground, the y-component evaluation is Δy = −h at t_event, and the reconstructed event state is the impact point with components (Δx, Δy), both taken at t_event.</desc>
  <defs>
    <marker id="rep-kin-ec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-EVENT-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Requested event: the stone reaches the ground</text>
    <path d="M50 300 V80 H120 V300" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="20" y1="300" x2="620" y2="300" stroke="currentColor" stroke-width="2"/>
    <path d="M120 80 Q280 80 440 300" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="120" cy="80" r="8" fill="currentColor"/>
    <line x1="130" y1="80" x2="182" y2="80" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-ec-arrow)"/>
    <text x="140" y="104">u_x</text>
    <text x="64" y="200">cliff</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-EVENT-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="545" y1="160" x2="605" y2="160" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-ec-arrow)"/>
    <line x1="545" y1="160" x2="545" y2="100" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-ec-arrow)"/>
    <text x="580" y="182">+x</text>
    <text x="553" y="104">+y (up)</text>
    <path d="M34 80 H26 V300 H34" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="8" y="196">h</text>
    <text x="200" y="58" font-weight="600">event condition (y): Δy = −h</text>
    <text x="40" y="372" font-weight="600">one shared event timeline</text>
    <line x1="60" y1="392" x2="610" y2="392" stroke="currentColor" stroke-width="2" marker-end="url(#rep-kin-ec-arrow)"/>
    <text x="620" y="397">t</text>
    <line x1="60" y1="384" x2="60" y2="400" stroke="currentColor" stroke-width="2"/>
    <text x="60" y="418" text-anchor="middle">t = 0 (release)</text>
    <circle cx="420" cy="392" r="8" fill="Canvas" stroke="currentColor" stroke-width="2"/>
    <text x="420" y="372" text-anchor="middle">event time t_event</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-EVENT-V2" font-family="system-ui,sans-serif" font-size="15">
    <circle cx="420" cy="392" r="8" fill="#1f6fb2"/>
    <text x="420" y="418" text-anchor="middle" fill="#1f6fb2" font-weight="600">t_event, solved from the y condition:</text>
    <text x="420" y="438" text-anchor="middle" fill="#1f6fb2">u_y t − ½ g t² = −h</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-EVENT-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M120 312 V320 H440 V312" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="280" y="340" text-anchor="middle">x: Δx = u_x · t_event</text>
    <circle cx="440" cy="300" r="7" fill="#1f6fb2"/>
    <text x="452" y="286" fill="#1f6fb2" font-weight="600">(Δx, Δy) at t_event</text>
    <text x="20" y="466">y: Δy = −h at the same t_event</text>
    <text x="20" y="488" font-weight="600">The one t_event is reused unchanged on x and on y.</text>
  </g>
</svg>
