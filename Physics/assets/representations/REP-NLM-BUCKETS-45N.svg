<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" role="img" aria-labelledby="rep-nlm-buckets-title rep-nlm-buckets-desc">
  <title id="rep-nlm-buckets-title">Two buckets lifted by 45 N: one system for a, another for the tension</title>
  <desc id="rep-nlm-buckets-desc">Stage 1: A 2 kg bucket hangs from a light rope tied under a 1 kg bucket, and a second rope lifts the top bucket with 45 N; g = 10 m/s², up positive. Stage 2: With both buckets as one 3 kg system the rope between them is internal: 45 − 30 = 3a, so a = 5 m/s² upward. Stage 3: Isolating the lower bucket makes the rope force external: T − 20 = 2 × 5, so T = 30 N.</desc>
  <defs>
    <marker id="rep-nlm-buckets-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-buckets-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BUCKETS-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Two buckets on ropes, lifted by 45 N</text>
    <line x1="170" y1="40" x2="170" y2="90" stroke="currentColor" stroke-width="2"/>
    <path d="M135 90 L143 140 H197 L205 90 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="170" y="120" text-anchor="middle" font-size="14">1 kg</text>
    <line x1="170" y1="140" x2="170" y2="190" stroke="currentColor" stroke-width="2"/>
    <path d="M125 190 L133 250 H207 L215 190 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="170" y="225" text-anchor="middle" font-size="14">2 kg</text>
    <line x1="170" y1="88" x2="170" y2="44" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-buckets-arrow)"/>
    <text x="180" y="58">45 N</text>
    <text x="185" y="170">rope between</text>
    <text x="20" y="290">g = 10 m/s², up positive</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BUCKETS-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="115" y="80" width="110" height="180" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="40" y="120">system 1:</text>
    <text x="40" y="142">both buckets</text>
    <text x="450" y="60" font-weight="600">system 1 (both, 3 kg): tension inside</text>
    <text x="450" y="82">45 − 30 = 3a</text>
    <text x="450" y="104" font-weight="600" fill="#1f6fb2">a = 5 m/s² up</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BUCKETS-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="118" y="182" width="104" height="76" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="150" y1="192" x2="150" y2="156" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-buckets-arrow-acc)"/>
    <text x="140" y="172" text-anchor="end" fill="#1f6fb2">T</text>
    <text x="450" y="150" font-weight="600">system 2 (lower bucket): T is external</text>
    <text x="450" y="172">T − 20 = 2 × 5</text>
    <text x="450" y="194" font-weight="600" fill="#1f6fb2">T = 30 N</text>
  </g>
</svg>
