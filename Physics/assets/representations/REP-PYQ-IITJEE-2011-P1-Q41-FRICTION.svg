<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 255" role="img" aria-labelledby="j11q41-title j11q41-desc">
<title id="j11q41-title">Two limiting cases on a 45 degree rough incline</title><desc id="j11q41-desc">The same block is shown in two source-given limiting cases on a 45 degree incline: a parallel force just pushes it upward, or just prevents downward sliding. No friction direction or coefficient is solved.</desc>
<defs><marker id="j11q41-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">45° rough incline</text><text x="16" y="44" stroke="none">applied force parallel to plane</text><text x="26" y="55" stroke="none" >case A: just pushes upward</text><line x1="20" y1="178" x2="205" y2="73" stroke-width="2" /><rect x="82" y="120" width="55" height="40" fill="none" stroke-width="2" transform="rotate(-30 109 140)"/><line x1="132" y1="121" x2="181" y2="93" stroke-width="2" marker-end="url(#j11q41-a)"/><text x="183" y="88" stroke="none" >P_up</text><text x="26" y="194" stroke="none" >45°</text><text x="238" y="62" stroke="none">case B: prevents</text><text x="238" y="80" stroke="none">downward sliding</text><line x1="228" y1="178" x2="420" y2="69" stroke-width="2" /><rect x="292" y="120" width="55" height="40" fill="none" stroke-width="2" transform="rotate(-30 319 140)"/><line x1="339" y1="121" x2="388" y2="93" stroke-width="2" marker-end="url(#j11q41-a)"/><text x="390" y="88" stroke="none" >P_hold</text><text x="234" y="194" stroke="none" >45°</text><text x="16" y="230" stroke="none">coefficient = μ</text><text x="16" y="250" stroke="none">both cases at limiting equilibrium</text></g></svg>
