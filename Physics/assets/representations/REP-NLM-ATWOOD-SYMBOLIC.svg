<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="rep-nlm-atwoodsym-title rep-nlm-atwoodsym-desc">
  <title id="rep-nlm-atwoodsym-title">Atwood machine, m_B &gt; m_A: T lies between the two weights</title>
  <desc id="rep-nlm-atwoodsym-desc">Stage 1: Masses m_A and m_B, with m_B &gt; m_A, hang from the ends of one taut massless inextensible string over a fixed frictionless massless pulley; A accelerates up and B down with one magnitude a. Stage 2: Each mass has the same T up and its own weight down; A: T − m_A g = m_A a (up positive), B: m_B g − T = m_B a (down positive). Stage 3: a = (m_B − m_A) g/(m_A + m_B) and T = 2 m_A m_B g/(m_A + m_B); during the motion m_A g &lt; T &lt; m_B g, so T equals neither weight.</desc>
  <defs>
    <marker id="rep-nlm-atwoodsym-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-atwoodsym-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ATWOODSYM-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Atwood machine with m_B &gt; m_A</text>
    <line x1="120" y1="40" x2="240" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="40" x2="122" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="40" x2="140" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="40" x2="158" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="40" x2="176" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="40" x2="194" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="40" x2="212" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="40" x2="230" y2="32" stroke="currentColor" stroke-width="1"/>
    <circle cx="180" cy="70" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="180" cy="70" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="180" y1="70" x2="180" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="170" stroke="currentColor" stroke-width="1.8"/>
    <line x1="200" y1="70" x2="200" y2="220" stroke="currentColor" stroke-width="1.8"/>
    <rect x="136" y="170" width="48" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="160" y="195" text-anchor="middle">m_A</text>
    <rect x="174" y="220" width="56" height="48" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="202" y="249" text-anchor="middle">m_B</text>
    <text x="20" y="336">massless inextensible string; fixed frictionless massless pulley</text>
    <text x="20" y="358">A accelerates up, B down, with one magnitude a</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ATWOODSYM-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="150" y1="168" x2="150" y2="128" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwoodsym-arrow)"/>
    <text x="142" y="146" text-anchor="end">T</text>
    <line x1="160" y1="212" x2="160" y2="248" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwoodsym-arrow)"/>
    <text x="152" y="246" text-anchor="end">m_A g</text>
    <line x1="222" y1="218" x2="222" y2="178" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwoodsym-arrow)"/>
    <text x="230" y="196">T</text>
    <line x1="202" y1="270" x2="202" y2="306" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwoodsym-arrow)"/>
    <text x="210" y="300">m_B g</text>
    <text x="470" y="60" font-weight="600">one T on both ends (ideal string, pulley)</text>
    <text x="470" y="82">A (up +): T − m_A g = m_A a</text>
    <text x="470" y="104">B (down +): m_B g − T = m_B a</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ATWOODSYM-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="150" font-weight="600" fill="#1f6fb2">a = (m_B − m_A) g/(m_A + m_B)</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">T = 2 m_A m_B g/(m_A + m_B)</text>
    <text x="470" y="194">m_A g &lt; T &lt; m_B g while accelerating:</text>
    <text x="470" y="216">T equals neither weight</text>
  </g>
</svg>
