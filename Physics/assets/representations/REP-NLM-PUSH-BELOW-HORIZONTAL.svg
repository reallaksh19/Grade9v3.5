<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 305" role="img" aria-labelledby="rep-nlm-pushdown-title rep-nlm-pushdown-desc">
  <title id="rep-nlm-pushdown-title">A block on a rough floor pushed at an angle below the horizontal</title>
  <desc id="rep-nlm-pushdown-desc">Stage 1: A block of mass m on a rough horizontal floor (coefficient μ_s) is pushed by a force P directed at θ below the horizontal; it stays in contact. Stage 2: N = mg + P sin θ and rest needs friction P cos θ, so rest requires P[cos θ − μ_s sin θ] ≤ μ_s m g. Stage 3: If cos θ − μ_s sin θ &gt; 0, P_max = μ_s m g/(cos θ − μ_s sin θ); if it is zero or negative, no P can start the block, which needs tan θ ≥ 1/μ_s: for μ_s = 0.5, tan θ ≥ 2 and θ ≥ 63.4°.</desc>
  <defs>
    <marker id="rep-nlm-pushdown-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-pushdown-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-PUSHDOWN-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Push P at angle θ below the horizontal on a rough floor</text>
    <line x1="20" y1="220" x2="420" y2="220" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="220" x2="22" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="220" x2="40" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="220" x2="58" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="220" x2="76" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="220" x2="94" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="220" x2="112" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="220" x2="130" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="220" x2="148" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="220" x2="166" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="220" x2="184" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="220" x2="202" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="220" x2="220" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="220" x2="238" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="220" x2="256" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="220" x2="274" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="220" x2="292" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="220" x2="310" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="220" x2="328" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="220" x2="346" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="220" x2="364" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="220" x2="382" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="220" x2="400" y2="228" stroke="currentColor" stroke-width="1"/>
    <rect x="200" y="150" width="90" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="245" y="190" text-anchor="middle">m</text>
    <line x1="126.3" y1="118.4" x2="196" y2="166" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-pushdown-arrow)"/>
    <text x="110" y="92">P</text>
    <line x1="110" y1="118" x2="196" y2="118" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="150" y="112" font-size="14">θ</text>
    <text x="20" y="292">μ_s; block stays in contact; 0 &lt; θ &lt; 90°</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PUSHDOWN-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="248" y1="150" x2="248" y2="106" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-pushdown-arrow)"/>
    <text x="256" y="120">N = mg + P sin θ</text>
    <line x1="272" y1="220" x2="272" y2="264" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-pushdown-arrow)"/>
    <text x="280" y="260">mg</text>
    <text x="480" y="60" font-weight="600">rest needs friction P cos θ</text>
    <text x="480" y="82">limit μ_s (mg + P sin θ)</text>
    <text x="480" y="104">P [cos θ − μ_s sin θ] ≤ μ_s m g</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PUSHDOWN-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="150" font-weight="600" fill="#1f6fb2">check the sign of cos θ − μ_s sin θ first:</text>
    <text x="480" y="172" fill="#1f6fb2">&gt; 0: P_max = μ_s m g/(cos θ − μ_s sin θ)</text>
    <text x="480" y="194" fill="#1f6fb2">≤ 0: no P can start the block,</text>
    <text x="480" y="216" font-weight="600" fill="#1f6fb2">i.e. tan θ ≥ 1/μ_s</text>
    <text x="480" y="238" font-weight="600" fill="#1f6fb2">μ_s = 0.5: tan θ ≥ 2, θ ≥ 63.4°</text>
  </g>
</svg>
