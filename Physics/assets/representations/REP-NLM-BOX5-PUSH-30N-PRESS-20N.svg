    <text x="440" y="260">N = 70 N; limit 0.5 × 70 = 35 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOX5-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="220" y1="226" x2="160" y2="226" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-box5-arrow-acc)"/>
    <line x1="640" y1="226" x2="580" y2="226" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-box5-arrow-acc)"/>
    <text x="20" y="284" fill="#1f6fb2">30 N &gt; 25 N: slides; friction 0.4 × 50 = 20 N;</text>
    <text x="20" y="306" fill="#1f6fb2">a = (30 − 20) / 5 = 2 m/s²</text>
    <text x="440" y="284" fill="#1f6fb2">30 N ≤ 35 N: stays at rest;</text>
    <text x="440" y="306" fill="#1f6fb2">static friction 30 N</text>
  </g>
