<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="rep-nlm-box5-title rep-nlm-box5-desc">
  <title id="rep-nlm-box5-title">A 5 kg box on a rough floor pushed with 30 N, without and with a 20 N downward press</title>
  <desc id="rep-nlm-box5-desc">Stage 1: a 5 kg box on a floor with μ_s = 0.5 and μ_k = 0.4 (g = 10 m/s²) is pushed horizontally with 30 N; in a second trial a 20 N downward press is added. Stage 2: trial 1 has N = 50 N and a static limit of 25 N; trial 2 has N = 70 N and a limit of 35 N. Stage 3: in trial 1 the 30 N push exceeds 25 N, so the box slides with friction 0.4 × 50 = 20 N and a = (30 − 20) / 5 = 2 m/s²; in trial 2 the limit 35 N is at least 30 N, so the box stays at rest with 30 N of static friction.</desc>
  <defs>
    <marker id="rep-nlm-box5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-box5-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
