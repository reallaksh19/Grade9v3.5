<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="rep-nlm-practical-title rep-nlm-practical-desc">
  <title id="rep-nlm-practical-title">Trolley–pulley experiment: vary the driving force at fixed total mass</title>
  <desc id="rep-nlm-practical-desc">Stage 1: A trolley carrying masses on a track is pulled by a string over a pulley at the edge to a hanger with a load; a timer or sensor measures the motion; friction is small or measured and accounted for. Stage 2: Masses are moved between the trolley and the hanger, so the total moving mass stays fixed while the driving force changes. Stage 3: The acceleration is measured for each trial; a straight line through the origin of a against the corrected net force supports F_net = m a.</desc>
  <defs>
    <marker id="rep-nlm-practical-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-practical-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-PRACTICAL-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Trolley–pulley–hanging-mass experiment</text>
    <line x1="20" y1="150" x2="330" y2="150" stroke="currentColor" stroke-width="2"/>
    <line x1="330" y1="150" x2="330" y2="300" stroke="currentColor" stroke-width="2"/>
    <rect x="90" y="88" width="110" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="112" cy="141" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="178" cy="141" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="145" y="172" text-anchor="middle" font-size="14">trolley + masses</text>
    <circle cx="340" cy="140" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="340" cy="140" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="200" y1="110" x2="340" y2="126" stroke="currentColor" stroke-width="1.8"/>
    <line x1="354" y1="140" x2="354" y2="220" stroke="currentColor" stroke-width="1.8"/>
    <rect x="336" y="220" width="36" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="380" y="240">hanger + load</text>
    <rect x="60" y="60" width="30" height="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="96" y="76" font-size="14">timer / sensor</text>
    <text x="20" y="330">friction small, or measured and accounted for consistently</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PRACTICAL-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M160 112 C 200 60, 320 60, 350 212" fill="none" stroke="#1f6fb2" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="250" y="60" text-anchor="middle" fill="#1f6fb2">move a mass: trolley ↔ hanger</text>
    <text x="510" y="60" font-weight="600">controlled variation:</text>
    <text x="510" y="82">move masses between trolley and hanger</text>
    <text x="510" y="104">total moving mass stays fixed</text>
    <text x="510" y="126">driving force (hanger weight) changes</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PRACTICAL-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="510" y="170" font-weight="600" fill="#1f6fb2">measure a for each trial</text>
    <text x="510" y="192" fill="#1f6fb2">plot a against corrected F_net</text>
    <text x="510" y="214" fill="#1f6fb2">straight line through origin</text>
    <text x="510" y="236" font-weight="600" fill="#1f6fb2">supports F_net = m a (slope 1/m)</text>
  </g>
</svg>
