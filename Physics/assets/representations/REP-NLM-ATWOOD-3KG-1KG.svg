<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="rep-nlm-atwood31-title rep-nlm-atwood31-desc">
  <title id="rep-nlm-atwood31-title">Atwood machine 3 kg and 1 kg: length gives a_A + a_B = 0, the ideal pulley gives one T</title>
  <desc id="rep-nlm-atwood31-desc">Stage 1: Masses A (3 kg) and B (1 kg) hang from one light inextensible string over a fixed, frictionless, light pulley, with y_A and y_B measured downward from the pulley; g = 10 m/s². Stage 2: The fixed string length gives a_A + a_B = 0 and the ideal pulley and string give one T; A: 30 − T = 3a_A and B: 10 − T = 1a_B, down positive. Stage 3: a_A = +5 m/s² (down), a_B = −5 m/s² (up) and T = 15 N; the two relations rest on two separate assumptions.</desc>
  <defs>
    <marker id="rep-nlm-atwood31-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-atwood31-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ATWOOD31-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Atwood machine: A 3 kg and B 1 kg</text>
    <line x1="120" y1="40" x2="240" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="40" x2="122" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="40" x2="140" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="40" x2="158" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="40" x2="176" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="40" x2="194" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="40" x2="212" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="40" x2="230" y2="32" stroke="currentColor" stroke-width="1"/>
    <circle cx="180" cy="70" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="180" cy="70" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="180" y1="70" x2="180" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="220" stroke="currentColor" stroke-width="1.8"/>
    <line x1="200" y1="70" x2="200" y2="160" stroke="currentColor" stroke-width="1.8"/>
    <rect x="128" y="220" width="64" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="160" y="247" text-anchor="middle">A 3 kg</text>
    <rect x="172" y="160" width="56" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="200" y="183" text-anchor="middle">B 1 kg</text>
    <text x="20" y="336">light string, fixed frictionless light pulley</text>
    <text x="20" y="358">y_A, y_B measured down from the pulley; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ATWOOD31-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="140" y1="218" x2="140" y2="178" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwood31-arrow)"/>
    <text x="132" y="196" text-anchor="end">T</text>
    <line x1="160" y1="266" x2="160" y2="302" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwood31-arrow)"/>
    <text x="150" y="300" text-anchor="end">30 N</text>
    <line x1="220" y1="158" x2="220" y2="122" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwood31-arrow)"/>
    <text x="228" y="136">T</text>
    <line x1="200" y1="198" x2="200" y2="228" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-atwood31-arrow)"/>
    <text x="208" y="226">10 N</text>
    <text x="470" y="60" font-weight="600">fixed length → a_A + a_B = 0</text>
    <text x="470" y="82" font-weight="600">ideal pulley and string → one T</text>
    <text x="470" y="104">A (down +): 30 − T = 3a_A</text>
    <text x="470" y="126">B (down +): 10 − T = 1a_B</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ATWOOD31-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="170" font-weight="600" fill="#1f6fb2">a_A = +5 m/s² (down)</text>
    <text x="470" y="192" font-weight="600" fill="#1f6fb2">a_B = −5 m/s² (up)</text>
    <text x="470" y="214" font-weight="600" fill="#1f6fb2">T = 15 N</text>
    <text x="470" y="236">two relations, two separate reasons</text>
  </g>
</svg>
