<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 275" role="img" aria-labelledby="i23q24-title i23q24-desc">
<title id="i23q24-title">Rider and cycle with front-only or rear-only braking</title><desc id="i23q24-desc">A rider and the whole cycle are enclosed by one dashed system boundary on a level road. Front and rear tyre contacts are labelled. Front-brake-only and rear-brake-only cases are named. No answer option is selected.</desc>
<defs><marker id="i23q24-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">system boundary: rider + whole cycle</text><rect x="28" y="50" width="384" height="150" rx="18" fill="none" stroke-dasharray="7 5" stroke-width="2"/><line x1="20" y1="210" x2="420" y2="210" stroke-width="2" /><circle cx="128" cy="164" r="32" fill="none" stroke-width="2"/><circle cx="310" cy="164" r="32" fill="none" stroke-width="2"/><line x1="128" y1="164" x2="190" y2="104" stroke-width="2" /><line x1="190" y1="104" x2="252" y2="164" stroke-width="2" /><line x1="252" y1="164" x2="128" y2="164" stroke-width="2" /><line x1="190" y1="104" x2="222" y2="80" stroke-width="2" /><circle cx="223" cy="66" r="14" fill="none" stroke-width="2"/><text x="76" y="232" stroke="none" >rear contact</text><text x="284" y="232" stroke="none" >front contact</text><text x="52" y="86" stroke="none" >rear-brake-only</text><text x="270" y="86" stroke="none" >front-brake-only</text><text x="16" y="256" stroke="none" >road lies outside the dashed rider+cycle system</text></g></svg>
