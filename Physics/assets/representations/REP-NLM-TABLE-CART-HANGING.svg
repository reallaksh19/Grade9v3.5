<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="rep-nlm-table-title rep-nlm-table-desc">
  <title id="rep-nlm-table-title">Cart on a table and a hanging mass: one ideal string, one T on each body</title>
  <desc id="rep-nlm-table-desc">Stage 1: A light, taut, inextensible string runs from a 2 kg cart on a smooth table over a light frictionless pulley at the edge down to a 1 kg hanging mass; g = 10 m/s². Stage 2: The ideal string and pulley allow one tension T: it pulls the cart toward the pulley and pulls the mass up, while the mass's 10 N weight pulls down; cart: T = 2a, mass: 10 − T = 1a. Stage 3: Adding gives 10 = 3a, so a = 10/3 ≈ 3.33 m/s² and T = 20/3 ≈ 6.67 N, less than the 10 N weight.</desc>
  <defs>
    <marker id="rep-nlm-table-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-table-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TABLE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">2 kg cart on a smooth table, 1 kg hanging mass</text>
    <line x1="20" y1="150" x2="300" y2="150" stroke="currentColor" stroke-width="2"/>
    <line x1="300" y1="150" x2="300" y2="300" stroke="currentColor" stroke-width="2"/>
    <rect x="80" y="88" width="90" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="125" y="115" text-anchor="middle">2 kg</text>
    <circle cx="98" cy="141" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="152" cy="141" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="310" cy="140" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="310" cy="140" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="170" y1="110" x2="310" y2="126" stroke="currentColor" stroke-width="1.8"/>
    <line x1="324" y1="140" x2="324" y2="220" stroke="currentColor" stroke-width="1.8"/>
    <rect x="302" y="220" width="44" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="324" y="245" text-anchor="middle">1 kg</text>
    <text x="20" y="190">light, taut, inextensible string</text>
    <text x="20" y="212">light frictionless pulley; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TABLE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="172" y1="118" x2="232" y2="118" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-table-arrow)"/>
    <text x="150" y="100">T (string on cart)</text>
    <line x1="324" y1="222" x2="324" y2="182" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-table-arrow)"/>
    <text x="356" y="214">T (string on mass)</text>
    <line x1="324" y1="262" x2="324" y2="302" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-table-arrow)"/>
    <text x="334" y="300">10 N</text>
    <text x="500" y="60" font-weight="600">ideal string + ideal pulley:</text>
    <text x="500" y="82">one tension T on both bodies,</text>
    <text x="500" y="104">each pulling away along its segment</text>
    <text x="500" y="126">cart: T = 2a</text>
    <text x="500" y="148">mass (down +): 10 − T = 1a</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TABLE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="500" y="190" font-weight="600" fill="#1f6fb2">add: 10 = 3a, a = 10/3 ≈ 3.33 m/s²</text>
    <text x="500" y="212" font-weight="600" fill="#1f6fb2">T = 2a = 20/3 ≈ 6.67 N</text>
    <text x="500" y="234">T &lt; 10 N: the mass accelerates</text>
  </g>
</svg>
