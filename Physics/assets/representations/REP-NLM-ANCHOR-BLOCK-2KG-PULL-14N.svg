<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="rep-nlm-anc-block2pull14-title rep-nlm-anc-block2pull14-desc">
  <title id="rep-nlm-anc-block2pull14-title">A 2 kg block on a floor pulled horizontally with 14 N</title>
  <desc id="rep-nlm-anc-block2pull14-desc">Stage 1: a 2 kg block on a floor with μ_s = 0.5 and μ_k = 0.3 is pulled horizontally with 14 N; g = 10 m/s². Stage 2: N = 20 N, so static friction can give at most 10 N; 14 N is more than 10 N, so the block slides. Stage 3: kinetic friction f_k = 0.3 × 20 = 6 N acts against the motion, and a = (14 − 6)/2 = 4 m/s².</desc>
  <defs>
    <marker id="rep-nlm-anc-block2pull14-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
