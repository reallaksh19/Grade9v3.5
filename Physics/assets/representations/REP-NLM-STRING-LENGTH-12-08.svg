<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="rep-nlm-ylen-title rep-nlm-ylen-desc">
  <title id="rep-nlm-ylen-title">One string over a fixed pulley: y_A + y_B stays 2.0 m</title>
  <desc id="rep-nlm-ylen-desc">Stage 1: One taut inextensible string over a fixed pulley holds A and B; measured downward from the pulley, y_A = 1.2 m and y_B = 0.8 m. Stage 2: The string length fixes y_A + y_B = 2.0 m, so v_A + v_B = 0 and a_A + a_B = 0. Stage 3: When A moves down 0.3 m to y_A = 1.5 m, y_B = 0.5 m, so B rises; when A moves down at 0.5 m/s, v_B = −0.5 m/s, 0.5 m/s upward.</desc>
  <defs>
    <marker id="rep-nlm-ylen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-ylen-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-YLEN-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">One string over a fixed pulley holds A and B</text>
    <line x1="120" y1="40" x2="240" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="40" x2="122" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="40" x2="140" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="40" x2="158" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="40" x2="176" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="40" x2="194" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="40" x2="212" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="40" x2="230" y2="32" stroke="currentColor" stroke-width="1"/>
    <circle cx="180" cy="70" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="180" cy="70" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="180" y1="70" x2="180" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="250" stroke="currentColor" stroke-width="1.8"/>
    <line x1="200" y1="70" x2="200" y2="190" stroke="currentColor" stroke-width="1.8"/>
    <rect x="140" y="250" width="40" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="160" y="270" text-anchor="middle">A</text>
    <rect x="180" y="190" width="40" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="200" y="210" text-anchor="middle">B</text>
    <line x1="110" y1="70" x2="110" y2="250" stroke="currentColor" stroke-width="1"/>
    <text x="104" y="205" text-anchor="end">y_A = 1.2 m</text>
    <line x1="250" y1="70" x2="250" y2="190" stroke="currentColor" stroke-width="1"/>
    <text x="256" y="130">y_B = 0.8 m</text>
    <text x="20" y="350">y_A and y_B measured downward from the pulley</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-YLEN-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="60" font-weight="600">fixed length:</text>
    <text x="470" y="82">y_A + y_B = 2.0 m (constant)</text>
    <text x="470" y="104">so v_A + v_B = 0, a_A + a_B = 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-YLEN-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="140" y="295" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="180" y="145" width="40" height="30" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="128" y="315" text-anchor="end" fill="#1f6fb2">A +0.3 m</text>
    <text x="262" y="167" fill="#1f6fb2">B: y_B = 0.5 m</text>
    <text x="470" y="150" fill="#1f6fb2">A down 0.3 m: y_A = 1.5 m</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">y_B = 2.0 − 1.5 = 0.5 m (B rises)</text>
    <text x="470" y="194" font-weight="600" fill="#1f6fb2">v_A = +0.5 m/s → v_B = −0.5 m/s</text>
    <text x="470" y="216">B moves up at 0.5 m/s</text>
  </g>
</svg>
