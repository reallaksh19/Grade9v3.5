<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="rep-nlm-abF-title rep-nlm-abF-desc">
  <title id="rep-nlm-abF-title">Blocks A and B pushed by F: isolate B for the contact force</title>
  <desc id="rep-nlm-abF-desc">Stage 1: Two blocks of masses m_A and m_B stay in contact on a smooth horizontal floor; a horizontal force F pushes A toward B; the direction of F is positive. Stage 2: The fixed contact gives one acceleration; for the pair F = (m_A + m_B) a, and B alone has only the contact force N_AB along x. Stage 3: a = F/(m_A + m_B) and N_AB = m_B a = m_B F/(m_A + m_B).</desc>
  <defs>
    <marker id="rep-nlm-abF-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-abF-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ABF-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Blocks A and B in contact, F pushes A</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="150" y="130" width="80" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="190" y="170" text-anchor="middle">m_A</text>
    <rect x="230" y="145" width="70" height="55" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="265" y="177.5" text-anchor="middle">m_B</text>
    <line x1="70" y1="165" x2="146" y2="165" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-abF-arrow)"/>
    <text x="70" y="155">F</text>
    <text x="20" y="240">smooth floor; contact maintained; direction of F positive</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ABF-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="222" y="136" width="86" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="234" y1="156" x2="278" y2="156" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-abF-arrow-acc)"/>
    <text x="236" y="138" fill="#1f6fb2">N_AB</text>
    <text x="470" y="60" font-weight="600">fixed contact → one a</text>
    <text x="470" y="82">whole pair: F = (m_A + m_B) a</text>
    <text x="470" y="104">B alone: only N_AB acts along x</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ABF-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="150" font-weight="600" fill="#1f6fb2">a = F/(m_A + m_B)</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">N_AB = m_B a = m_B F/(m_A + m_B)</text>
    <text x="470" y="194">less than F unless m_A = 0</text>
  </g>
</svg>
