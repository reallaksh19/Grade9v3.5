<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 345" role="img" aria-labelledby="rep-nlm-ysym-title rep-nlm-ysym-desc">
  <title id="rep-nlm-ysym-title">Fixed pulley with y_A and y_B measured away from it: y_A + y_B = constant</title>
  <desc id="rep-nlm-ysym-desc">Stage 1: One taut inextensible string passes over one fixed pulley; y_A and y_B are the two straight segment lengths, positive away from the pulley. Stage 2: The changing length is y_A + y_B = constant, so v_A + v_B = 0 and a_A + a_B = 0. Stage 3: If A accelerates away from the pulley with a_A = +a, then a_B = −a, toward the pulley.</desc>
  <defs>
    <marker id="rep-nlm-ysym-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-ysym-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-YSYM-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">One string over one fixed pulley</text>
    <line x1="120" y1="40" x2="240" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="40" x2="122" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="40" x2="140" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="40" x2="158" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="40" x2="176" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="40" x2="194" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="40" x2="212" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="40" x2="230" y2="32" stroke="currentColor" stroke-width="1"/>
    <circle cx="180" cy="70" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="180" cy="70" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="180" y1="70" x2="180" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="70" x2="160" y2="230" stroke="currentColor" stroke-width="1.8"/>
    <line x1="200" y1="70" x2="200" y2="180" stroke="currentColor" stroke-width="1.8"/>
    <rect x="140" y="230" width="40" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="160" y="250" text-anchor="middle">A</text>
    <rect x="180" y="180" width="40" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="200" y="200" text-anchor="middle">B</text>
    <line x1="110" y1="70" x2="110" y2="230" stroke="currentColor" stroke-width="1"/>
    <text x="104" y="160" text-anchor="end">y_A</text>
    <line x1="250" y1="70" x2="250" y2="180" stroke="currentColor" stroke-width="1"/>
    <text x="256" y="130">y_B</text>
    <text x="20" y="330">y_A, y_B: straight segment lengths, positive away from the pulley</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-YSYM-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="60" font-weight="600">length of the changing segments:</text>
    <text x="470" y="82">y_A + y_B = constant</text>
    <text x="470" y="104">v_A + v_B = 0</text>
    <text x="470" y="126">a_A + a_B = 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-YSYM-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="145" y1="262" x2="145" y2="292" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-ysym-arrow-acc)"/>
    <text x="137" y="290" text-anchor="end" fill="#1f6fb2">a_A = +a</text>
    <line x1="215" y1="178" x2="215" y2="148" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-ysym-arrow-acc)"/>
    <text x="223" y="156" fill="#1f6fb2">a_B = −a</text>
    <text x="470" y="170" fill="#1f6fb2">a_A = +a (away from the pulley)</text>
    <text x="470" y="192" font-weight="600" fill="#1f6fb2">→ a_B = −a (toward the pulley)</text>
  </g>
</svg>
