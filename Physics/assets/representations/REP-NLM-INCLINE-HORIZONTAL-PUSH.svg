<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="rep-nlm-hpush-title rep-nlm-hpush-desc">
  <title id="rep-nlm-hpush-title">Horizontal push on a smooth incline: P adds to N and pushes up the plane</title>
  <desc id="rep-nlm-hpush-desc">Stage 1: A block of mass m is on a smooth fixed plane that rises to the right at θ; a horizontal force P pushes it to the right. Stage 2: In plane axes P has P cos θ up the plane and P sin θ into the plane; mg has mg sin θ down the plane and mg cos θ into it. Stage 3: N = mg cos θ + P sin θ and a_∥ = [P cos θ − mg sin θ]/m with uphill positive.</desc>
  <defs>
    <marker id="rep-nlm-hpush-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-hpush-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-HPUSH-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A horizontal push P on a block on a smooth incline</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">θ</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 161.4 170.3)"><rect x="133.4 " y="153.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="20" y="300">plane rises to the right; P horizontal and rightward; contact kept</text>
    <line x1="51.4" y1="170.3" x2="131.4" y2="170.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-hpush-arrow)"/>
    <text x="51.4" y="162.3">P</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HPUSH-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="161.4" y1="170.3" x2="161.4" y2="240.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-hpush-arrow)"/>
    <text x="169.4" y="246.3">mg</text>
    <line x1="152.4" y1="154.7" x2="124.4" y2="106.2" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-hpush-arrow)"/>
    <text x="116.4" y="100.2" text-anchor="end">N</text>
    <text x="440" y="60" font-weight="600">P in plane axes:</text>
    <text x="440" y="82">P cos θ up the plane</text>
    <text x="440" y="104">P sin θ into the plane</text>
    <text x="440" y="126">mg: sin θ down, cos θ into</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HPUSH-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="440" y="160" font-weight="600" fill="#1f6fb2">N = mg cos θ + P sin θ</text>
    <text x="440" y="182" font-weight="600" fill="#1f6fb2">a_∥ = [P cos θ − mg sin θ]/m</text>
    <text x="440" y="204">(uphill positive)</text>
  </g>
</svg>
