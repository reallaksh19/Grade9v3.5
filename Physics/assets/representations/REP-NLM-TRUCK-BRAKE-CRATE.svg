<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="rep-nlm-truckcrate-title rep-nlm-truckcrate-desc">
  <title id="rep-nlm-truckcrate-title">A crate on the floor of a braking truck</title>
  <desc id="rep-nlm-truckcrate-desc">Stage 1: A 20 kg crate rides on the flat bed of a truck that moves forward while braking at 3 m/s²; the crate does not slip. Stage 2: The crate slows with the truck, so its acceleration is 3 m/s² backward, and only the bed's friction acts along it. Stage 3: Friction on the crate points backward, against its motion, with size 20 × 3 = 60 N.</desc>
  <defs>
    <marker id="rep-nlm-truckcrate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-truckcrate-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TRUCKCRATE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 20 kg crate on a braking truck's flat bed</text>
    <line x1="20" y1="220" x2="430" y2="220" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="220" x2="22" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="220" x2="40" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="220" x2="58" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="220" x2="76" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="220" x2="94" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="220" x2="112" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="220" x2="130" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="220" x2="148" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="220" x2="166" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="220" x2="184" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="220" x2="202" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="220" x2="220" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="220" x2="238" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="220" x2="256" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="220" x2="274" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="220" x2="292" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="220" x2="310" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="220" x2="328" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="220" x2="346" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="220" x2="364" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="220" x2="382" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="220" x2="400" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="220" x2="418" y2="228" stroke="currentColor" stroke-width="1"/>
    <rect x="60" y="150" width="260" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="320" y="110" width="70" height="80" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="126" cy="205" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="324" cy="205" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="130" y="110" width="60" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="160" y="135" text-anchor="middle">20 kg</text>
    <line x1="150" y1="80" x2="220" y2="80" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-truckcrate-arrow)"/>
    <text x="150" y="72">v forward</text>
    <line x1="340" y1="80" x2="280" y2="80" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-truckcrate-arrow)"/>
    <text x="280" y="100" text-anchor="start">a = 3 m/s² (slowing)</text>
    <text x="20" y="260">the crate does not slip on the bed</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRUCKCRATE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="60" font-weight="600">the crate slows with the truck:</text>
    <text x="470" y="82">its a = 3 m/s² backward</text>
    <text x="470" y="104">only the bed's friction acts along it</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRUCKCRATE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="128" y1="145" x2="78" y2="145" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-truckcrate-arrow-acc)"/>
    <text x="70" y="138" font-weight="600" fill="#1f6fb2">f</text>
    <text x="470" y="150" font-weight="600" fill="#1f6fb2">friction on the crate: backward</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">f = 20 × 3 = 60 N</text>
    <text x="470" y="194">against its motion, set by its deceleration</text>
  </g>
</svg>
