<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="rep-nlm-carbob-title rep-nlm-carbob-desc">
  <title id="rep-nlm-carbob-title">A bob hanging in a car accelerating at 7.5 m/s²</title>
  <desc id="rep-nlm-carbob-desc">Stage 1: A 0.2 kg bob hangs from a string tied to the roof of a car that accelerates horizontally to the right at 7.5 m/s²; the bob hangs steady relative to the car at an angle θ to be found; g = 10 m/s². Stage 2: In the car frame the bob is at rest once a pseudo-force −m a_car = 1.5 N to the left is added to the 2 N weight and the tension; the roadside frame adds nothing and gives the bob a = 7.5 m/s². Stage 3: tan θ = 1.5/2 = 0.75, so θ ≈ 37° with the bob hanging back, and T = √(1.5² + 2²) = 2.5 N; the roadside frame gives T sin θ = 1.5 N and T cos θ = 2 N, the same result.</desc>
  <defs>
    <marker id="rep-nlm-carbob-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-carbob-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CARBOB-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 0.2 kg bob hangs steady in a car accelerating at 7.5 m/s²</text>
    <line x1="20" y1="250" x2="430" y2="250" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="250" x2="22" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="250" x2="40" y2="258" stroke="currentColor" stroke-width="1"/>
