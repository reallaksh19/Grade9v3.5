    <line x1="120" y1="250" x2="112" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="250" x2="130" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="250" x2="148" y2="258" stroke="currentColor" stroke-width="1"/>
