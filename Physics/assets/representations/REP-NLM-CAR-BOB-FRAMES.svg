    <line x1="300" y1="250" x2="292" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="250" x2="310" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="250" x2="328" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="250" x2="346" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="250" x2="364" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="250" x2="382" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="250" x2="400" y2="258" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="250" x2="418" y2="258" stroke="currentColor" stroke-width="1"/>
    <rect x="60" y="80" width="320" height="150" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="124" cy="240" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="316" cy="240" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="80" x2="154" y2="178" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="154" cy="178" r="10" fill="currentColor" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="80" x2="220" y2="200" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="206" y="150" text-anchor="end">θ ?</text>
    <line x1="300" y1="60" x2="370" y2="60" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-carbob-arrow)"/>
    <text x="250" y="52">a_car = 7.5 m/s²</text>
    <text x="20" y="285">horizontal road; g = 10 m/s²; air resistance neglected</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARBOB-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="154" y1="188" x2="154" y2="224" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-carbob-arrow)"/>
    <text x="162" y="222">2 N</text>
    <line x1="154" y1="178" x2="183.7" y2="133.9" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-carbob-arrow)"/>
    <text x="146" y="148" text-anchor="end">T</text>
    <line x1="142" y1="178" x2="97" y2="178" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-carbob-arrow-acc)" stroke-dasharray="7 4"/>
    <text x="94" y="204" text-anchor="middle" fill="#1f6fb2">1.5 N pseudo</text>
    <text x="480" y="60" font-weight="600" fill="#1f6fb2">car frame: bob at rest</text>
    <text x="480" y="82" fill="#1f6fb2">add −m a_car = 1.5 N to the left</text>
    <text x="480" y="104">roadside frame: no extra term,</text>
    <text x="480" y="126">bob has a = 7.5 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARBOB-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="160" font-weight="600" fill="#1f6fb2">tan θ = 1.5/2 = 0.75, θ ≈ 37°</text>
    <text x="480" y="182" fill="#1f6fb2">bob hangs back (to the left)</text>
    <text x="480" y="204" font-weight="600" fill="#1f6fb2">T = √(1.5² + 2²) = 2.5 N</text>
    <text x="480" y="226">roadside: T sin θ = 1.5 N, T cos θ = 2 N ✓</text>
  </g>
</svg>
