<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="rep-nlm-heavypulley-title rep-nlm-heavypulley-desc">
  <title id="rep-nlm-heavypulley-title">3 kg and 1 kg masses on a string over a heavy pulley</title>
  <desc id="rep-nlm-heavypulley-desc">Stage 1: Masses A (3 kg) and B (1 kg) hang from one light inextensible string that does not slip on a fixed pulley with appreciable rotational inertia; A is measured to accelerate downward at 4 m/s²; g = 10 m/s². Stage 2: The fixed string length still gives a_A + a_B = 0, so a_B = −4 m/s²; equal tension is not guaranteed because the heavy pulley needs a net torque. Stage 3: From A: 30 − T_A = 3 × 4, so T_A = 18 N; from B: T_B − 10 = 1 × 4, so T_B = 14 N; an ideal pulley would have given 5 m/s² and 15 N.</desc>
  <defs>
    <marker id="rep-nlm-heavypulley-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-heavypulley-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-HEAVYPULLEY-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A (3 kg) and B (1 kg) over a heavy pulley</text>
    <line x1="120" y1="40" x2="250" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="40" x2="122" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="148" y1="40" x2="140" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="166" y1="40" x2="158" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="184" y1="40" x2="176" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="202" y1="40" x2="194" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="220" y1="40" x2="212" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="238" y1="40" x2="230" y2="32" stroke="currentColor" stroke-width="1"/>
    <circle cx="185" cy="80" r="28" fill="none" stroke="currentColor" stroke-width="4"/>
    <circle cx="185" cy="80" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="185" y1="40" x2="185" y2="80" stroke="currentColor" stroke-width="2"/>
    <text x="222" y="60" font-size="14">pulley with rotational inertia</text>
    <line x1="157" y1="80" x2="157" y2="220" stroke="currentColor" stroke-width="1.8"/>
    <line x1="213" y1="80" x2="213" y2="170" stroke="currentColor" stroke-width="1.8"/>
    <rect x="127" y="220" width="60" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="157" y="247" text-anchor="middle">A 3 kg</text>
    <rect x="188" y="170" width="50" height="36" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="213" y="193" text-anchor="middle">B 1 kg</text>
    <line x1="110" y1="222" x2="110" y2="262" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-heavypulley-arrow)"/>
    <text x="20" y="290" text-anchor="start">a_A = 4 m/s² down (measured)</text>
    <text x="20" y="314">string light, inextensible, not slipping; y down from pulley; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HEAVYPULLEY-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="60" font-weight="600">fixed length still holds:</text>
    <text x="480" y="82">a_A + a_B = 0 → a_B = −4 m/s² (up)</text>
    <text x="480" y="104" font-weight="600">equal tension no longer guaranteed:</text>
    <text x="480" y="126">the heavy pulley needs a net torque</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HEAVYPULLEY-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="150" y1="218" x2="150" y2="178" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-heavypulley-arrow-acc)"/>
    <text x="142" y="196" text-anchor="end" fill="#1f6fb2">T_A</text>
    <line x1="226" y1="168" x2="226" y2="128" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-heavypulley-arrow-acc)"/>
    <text x="234" y="146" fill="#1f6fb2">T_B</text>
    <text x="480" y="160" font-weight="600" fill="#1f6fb2">A: 30 − T_A = 3 × 4 → T_A = 18 N</text>
    <text x="480" y="182" font-weight="600" fill="#1f6fb2">B: T_B − 10 = 1 × 4 → T_B = 14 N</text>
    <text x="480" y="204">(an ideal pulley would give 5 m/s², 15 N)</text>
  </g>
</svg>
