<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-label="2D coordinate axes for vector components"><title>Coordinate axes</title><desc>Declared +x and +y coordinate axes with an example vector shown in component and i-hat/j-hat notation.</desc><line x1="10" y1="60" x2="110" y2="60" stroke="#333" stroke-width="1.5"/><text x="112" y="64" font-size="8">+x</text><line x1="60" y1="110" x2="60" y2="10" stroke="#333" stroke-width="1.5"/><text x="62" y="8" font-size="8">+y</text><text x="55" y="58" font-size="7">O</text><line x1="60" y1="60" x2="95" y2="80" stroke="#2244aa" stroke-width="2"/><text x="97" y="84" font-size="7" fill="#2244aa">v</text><line x1="60" y1="80" x2="95" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="3"/><text x="76" y="92" font-size="6" fill="#888">v_x</text><line x1="95" y1="60" x2="95" y2="80" stroke="#888" stroke-width="1" stroke-dasharray="3"/><text x="98" y="70" font-size="6" fill="#888">v_y</text></svg>