<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="rep-kin-anc23-title rep-kin-anc23-desc">
  <title id="rep-kin-anc23-title">A particle leaving the origin with u = (2, 0) m/s and constant a = (0, 6) m/s²</title>
  <desc id="rep-kin-anc23-desc">Stage 1: a particle leaves the origin with velocity u = (2, 0) m/s and constant acceleration a = (0, 6) m/s². Stage 2: each axis is worked on its own at the one time t = 1 s: Δx = 2 × 1 = 2 m and Δy = 0.5 × 6 × 1² = 3 m. Stage 3: both values, read at the same t = 1 s, place the particle at (2, 3) m.</desc>
  <defs>
    <marker id="rep-kin-anc23-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-anc23-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-ANC23-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A particle leaving the origin with u = (2, 0) m/s and a = (0, 6) m/s²</text>
    <line x1="80" y1="280" x2="360" y2="280" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-anc23-arrow)"/>
    <line x1="80" y1="280" x2="80" y2="50" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-anc23-arrow)"/>
    <text x="366" y="285">+x</text>
    <text x="88" y="54">+y</text>
    <circle cx="80" cy="280" r="6" fill="currentColor" stroke="currentColor" stroke-width="2"/>
    <line x1="80" y1="280" x2="140" y2="280" stroke="currentColor" stroke-width="3" marker-end="url(#rep-kin-anc23-arrow)"/>
    <text x="90" y="302">u = (2, 0) m/s</text>
    <line x1="300" y1="240" x2="300" y2="180" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-anc23-arrow)"/>
    <text x="310" y="205">a = (0, 6) m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-ANC23-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="420" y="70" font-weight="600">Each axis, one t = 1 s</text>
    <text x="420" y="92">Δx = 2 × 1 = 2 m</text>
    <text x="420" y="114">Δy = 0.5 × 6 × 1² = 3 m</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-ANC23-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="80" y1="280" x2="200" y2="280" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="200" y1="280" x2="200" y2="100" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <path d="M80 280 L104 272.8 L128 251.2 L152 215.2 L176 164.8 L200 100" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="200" cy="100" r="6" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="2"/>
    <text x="212" y="100" fill="#1f6fb2">(2, 3) m at t = 1 s</text>
    <text x="420" y="170" font-weight="600" fill="#1f6fb2">both read at the same t = 1 s</text>
  </g>
</svg>
