<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="rep-nlm-bus-title rep-nlm-bus-desc">
  <title id="rep-nlm-bus-title">Bus accelerating right with a loose object: roadside and passenger descriptions</title>
  <desc id="rep-nlm-bus-desc">Stage 1: A bus accelerates to the right on a straight road; a loose object sits on a smooth horizontal shelf; a roadside observer and a passenger describe it. Stage 2: The roadside observer, an inertial frame, uses only physical forces, the weight and the shelf's normal force; with no horizontal force the object keeps its velocity while the bus speeds up under it. Stage 3: To the passenger the object seems to slide backward; in the accelerating bus frame a backward pseudo-force −m a_bus is added as a frame term with no agent and no third-law partner.</desc>
  <defs>
    <marker id="rep-nlm-bus-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-bus-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
