  <g data-g9-stage-id="VIS-NLM-BUS-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="60" font-weight="600">roadside (inertial):</text>
    <text x="480" y="82">only physical forces: weight, shelf's normal</text>
    <text x="480" y="104">no horizontal force: the object keeps its</text>
    <text x="480" y="126">velocity while the bus speeds up under it</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BUS-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="148" y1="146" x2="98" y2="146" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-bus-arrow-acc)" stroke-dasharray="7 4"/>
    <text x="66" y="128" fill="#1f6fb2">pseudo-force −m a_bus</text>
    <text x="480" y="160" font-weight="600" fill="#1f6fb2">passenger (accelerating frame):</text>
    <text x="480" y="182" fill="#1f6fb2">object seems to slide backward</text>
    <text x="480" y="204" fill="#1f6fb2">add −m a_bus as a frame term,</text>
    <text x="480" y="226" fill="#1f6fb2">no agent, no third-law partner</text>
  </g>
