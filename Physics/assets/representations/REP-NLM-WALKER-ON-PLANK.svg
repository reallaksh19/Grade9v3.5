<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-labelledby="rep-nlm-plank-title rep-nlm-plank-desc">
  <title id="rep-nlm-plank-title">Walker on a plank on ice: friction forward on the shoes, backward on the plank</title>
  <desc id="rep-nlm-plank-desc">Stage 1: A 60 kg person stands on a 20 kg plank on frictionless ice and starts to walk forward, accelerating at 0.5 m/s² relative to the ice; the shoes do not slip. Stage 2: Only the plank's friction pushes the person forward, so it is 60 × 0.5 = 30 N forward on the shoes. Stage 3: Its partner, 30 N backward, acts on the plank, which has no other horizontal force, so the plank accelerates backward at 30/20 = 1.5 m/s².</desc>
  <defs>
    <marker id="rep-nlm-plank-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-plank-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-PLANK-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 60 kg person starts walking on a 20 kg plank on ice</text>
    <line x1="20" y1="230" x2="430" y2="230" stroke="currentColor" stroke-width="2"/>
    <text x="360" y="250">frictionless ice</text>
    <rect x="80" y="214" width="300" height="16" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="90" y="248" font-size="14">plank 20 kg</text>
    <circle cx="220" cy="134.8" r="10.8" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="145.6" x2="220" y2="178" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="178" x2="206.5" y2="214" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="178" x2="233.5" y2="214" stroke="currentColor" stroke-width="2"/>
    <line x1="202" y1="158.2" x2="238" y2="158.2" stroke="currentColor" stroke-width="2"/>
    <text x="240" y="150">60 kg</text>
    <line x1="250" y1="110" x2="310" y2="110" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-plank-arrow)"/>
    <text x="250" y="100">a = 0.5 m/s² (rel. ice)</text>
    <text x="20" y="305">shoes do not slip on the plank; ice gives no horizontal force</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PLANK-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="226" y1="206" x2="276" y2="206" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-plank-arrow-acc)"/>
    <text x="280" y="196" fill="#1f6fb2">f on shoes: 30 N</text>
    <text x="480" y="60" font-weight="600">person: only the plank's friction pushes</text>
    <text x="480" y="82">them forward: f = 60 × 0.5 = 30 N forward</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PLANK-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="214" y1="226" x2="164" y2="226" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-plank-arrow-acc)"/>
    <text x="150" y="276" text-anchor="middle" fill="#1f6fb2">30 N on plank</text>
    <text x="480" y="130" font-weight="600" fill="#1f6fb2">partner: 30 N backward on the plank</text>
    <text x="480" y="152" font-weight="600" fill="#1f6fb2">plank: a = 30/20 = 1.5 m/s² backward</text>
    <text x="480" y="174">the plank moves under the force it</text>
    <text x="480" y="196">receives, not the walker's way</text>
  </g>
</svg>
