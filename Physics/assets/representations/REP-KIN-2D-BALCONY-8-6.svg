<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="rep-kin-balcony-title rep-kin-balcony-desc">
  <title id="rep-kin-balcony-title">A ball thrown from a balcony with u_x = 8 m/s and u_y = 6 m/s</title>
  <desc id="rep-kin-balcony-desc">Stage 1: a ball is thrown from a balcony with u_x = 8 m/s and u_y = 6 m/s; +y is upward and g = 10 m/s². Stage 2: after release only gravity acts and air resistance is negligible, so the ideal model applies with a = (0, −10) m/s². Stage 3: the component relations are v_x = 8, v_y = 6 − 10t, Δx = 8t and Δy = 6t − 5t². Stage 4: at t = 1 s the displacement is (8 i + 1 j) m and the velocity is (8 i − 4 j) m/s.</desc>
  <defs>
    <marker id="rep-kin-balcony-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-balcony-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-BALCONY-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A ball thrown from a balcony</text>
    <rect x="30" y="200" width="100" height="170" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="100" y1="200" x2="140" y2="200" stroke="currentColor" stroke-width="3"/>
    <circle cx="140" cy="200" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="147" y1="200" x2="207" y2="200" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-balcony-arrow)"/>
    <text x="212" y="205">u_x = 8 m/s</text>
    <line x1="140" y1="193" x2="140" y2="133" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-balcony-arrow)"/>
    <text x="148" y="140">u_y = 6 m/s</text>
    <text x="470" y="60">+y upward; g = 10 m/s²</text>
    <text x="470" y="82">Find the displacement and velocity</text>
    <text x="470" y="104">1 s after release.</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-BALCONY-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="140" y1="215" x2="140" y2="265" stroke="currentColor" stroke-width="2" marker-end="url(#rep-kin-balcony-arrow)"/>
    <text x="148" y="262">gravity only</text>
    <text x="470" y="140" font-weight="600">Model gate</text>
    <text x="470" y="162">after release only gravity acts;</text>
    <text x="470" y="184">air resistance negligible:</text>
    <text x="470" y="206">a = (0, −10) m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-BALCONY-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="240" font-weight="600">Component relations</text>
    <text x="470" y="262">v_x = 8, v_y = 6 − 10t</text>
    <text x="470" y="284">Δx = 8t, Δy = 6t − 5t²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-BALCONY-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M140 200 L164 183.5 L188 170 L212 159.5 L236 152 L260 147.5 L284 146 L308 147.5 L332 152 L356 159.5 L380 170" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="380" cy="170" r="7" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="2"/>
    <line x1="380" y1="170" x2="440" y2="200" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-balcony-arrow-acc)"/>
    <text x="160" y="320" fill="#1f6fb2">at t = 1 s: Δr = (8 i + 1 j) m</text>
    <text x="160" y="342" fill="#1f6fb2">v = (8 i − 4 j) m/s</text>
  </g>
</svg>
