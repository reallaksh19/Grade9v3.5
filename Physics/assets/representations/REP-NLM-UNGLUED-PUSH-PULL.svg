<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="rep-nlm-pushpull-title rep-nlm-pushpull-desc">
  <title id="rep-nlm-pushpull-title">Unglued blocks: a common acceleration while pushed, not while pulled apart</title>
  <desc id="rep-nlm-pushpull-desc">Stage 1: Blocks A and B sit side by side on a smooth floor with no adhesive; in case 1 a horizontal force pushes A to the right into B; in case 2 the same force pulls A to the left, away from B. Stage 2: In case 1 A presses on B, so N &gt; 0 and the maintained contact fixes the separation: one common acceleration is justified. Stage 3: In case 2 B could follow only if A pulled it, which a normal contact cannot do, so the contact is lost and no common acceleration applies.</desc>
  <defs>
    <marker id="rep-nlm-pushpull-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-pushpull-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-PUSHPULL-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Unglued blocks A and B: push A into B, or pull A away</text>
    <text x="20" y="70">case 1</text>
    <text x="20" y="190">case 2</text>
    <line x1="90" y1="120" x2="420" y2="120" stroke="currentColor" stroke-width="2"/>
    <line x1="100" y1="120" x2="92" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="118" y1="120" x2="110" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="136" y1="120" x2="128" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="154" y1="120" x2="146" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="172" y1="120" x2="164" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="190" y1="120" x2="182" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="208" y1="120" x2="200" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="226" y1="120" x2="218" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="244" y1="120" x2="236" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="262" y1="120" x2="254" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="280" y1="120" x2="272" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="298" y1="120" x2="290" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="316" y1="120" x2="308" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="334" y1="120" x2="326" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="352" y1="120" x2="344" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="370" y1="120" x2="362" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="388" y1="120" x2="380" y2="128" stroke="currentColor" stroke-width="1"/>
    <line x1="406" y1="120" x2="398" y2="128" stroke="currentColor" stroke-width="1"/>
    <rect x="190" y="70" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="100" text-anchor="middle">A</text>
    <rect x="250" y="70" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="280" y="100" text-anchor="middle">B</text>
    <line x1="110" y1="95" x2="186" y2="95" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-pushpull-arrow)"/>
    <text x="110" y="86">F</text>
    <line x1="90" y1="240" x2="420" y2="240" stroke="currentColor" stroke-width="2"/>
    <line x1="100" y1="240" x2="92" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="118" y1="240" x2="110" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="136" y1="240" x2="128" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="154" y1="240" x2="146" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="172" y1="240" x2="164" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="190" y1="240" x2="182" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="208" y1="240" x2="200" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="226" y1="240" x2="218" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="244" y1="240" x2="236" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="262" y1="240" x2="254" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="280" y1="240" x2="272" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="298" y1="240" x2="290" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="316" y1="240" x2="308" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="334" y1="240" x2="326" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="352" y1="240" x2="344" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="370" y1="240" x2="362" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="388" y1="240" x2="380" y2="248" stroke="currentColor" stroke-width="1"/>
    <line x1="406" y1="240" x2="398" y2="248" stroke="currentColor" stroke-width="1"/>
    <rect x="190" y="190" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="220" text-anchor="middle">A</text>
    <rect x="250" y="190" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="280" y="220" text-anchor="middle">B</text>
    <line x1="186" y1="215" x2="110" y2="215" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-pushpull-arrow)"/>
    <text x="110" y="206" text-anchor="start">F</text>
    <text x="20" y="280">smooth floor; contact force is a normal push, it cannot pull</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PUSHPULL-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="60" font-weight="600">case 1:</text>
    <text x="470" y="82">A presses on B: N &gt; 0</text>
    <text x="470" y="104">maintained contact fixes the gap</text>
    <text x="470" y="126" font-weight="600" fill="#1f6fb2">→ one common a allowed</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PUSHPULL-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="250" y="190" width="60" height="50" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="5 4" transform="translate(30 0)"/>
    <text x="470" y="160" font-weight="600">case 2:</text>
    <text x="470" y="182">B would have to be pulled by A</text>
    <text x="470" y="204">a normal contact cannot pull</text>
    <text x="470" y="226" font-weight="600" fill="#1f6fb2">→ contact lost, no common a</text>
  </g>
</svg>
