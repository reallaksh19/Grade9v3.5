<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="rep-nlm-blockwall-title rep-nlm-blockwall-desc">
  <title id="rep-nlm-blockwall-title">A 2 kg block pressed against a vertical wall by a horizontal push</title>
  <desc id="rep-nlm-blockwall-desc">Stage 1: a 2 kg block is pressed against a vertical wall by a 50 N horizontal push, later 80 N; μ_s = 0.6, g = 10 m/s², and the block does not slide. Stage 2: the block's weight is 20 N down and the wall pushes back with 50 N; without friction the block would slide down, and the static limit is 0.6 × 50 = 30 N. Stage 3: friction is 20 N up, balancing the weight; with an 80 N push the limit rises to 48 N but the friction stays 20 N up.</desc>
  <defs>
    <marker id="rep-nlm-blockwall-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-blockwall-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BLOCKWALL-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A block pressed against a vertical wall</text>
    <line x1="300" y1="50" x2="300" y2="320" stroke="currentColor" stroke-width="2"/>
    <line x1="300" y1="60" x2="308" y2="52" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="78" x2="308" y2="70" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="96" x2="308" y2="88" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="114" x2="308" y2="106" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="132" x2="308" y2="124" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="150" x2="308" y2="142" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="168" x2="308" y2="160" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="186" x2="308" y2="178" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="204" x2="308" y2="196" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="222" x2="308" y2="214" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="240" x2="308" y2="232" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="258" x2="308" y2="250" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="276" x2="308" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="294" x2="308" y2="286" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="312" x2="308" y2="304" stroke="currentColor" stroke-width="1"/>
    <rect x="220" y="150" width="80" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="260" y="190" text-anchor="middle">2 kg</text>
    <line x1="100" y1="205" x2="218" y2="205" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-blockwall-arrow)"/>
    <text x="20" y="240">push 50 N, then 80 N</text>
    <text x="360" y="70">μ_s = 0.6 between block and wall</text>
    <text x="360" y="92">g = 10 m/s²</text>
    <text x="360" y="114">the block does not slide</text>
    <text x="330" y="320">Find the friction's direction and size, then at 80 N.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BLOCKWALL-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="250" y1="220" x2="250" y2="290" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-blockwall-arrow)"/>
    <text x="130" y="290">weight 20 N</text>
    <line x1="220" y1="165" x2="150" y2="165" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-blockwall-arrow)"/>
    <text x="80" y="150">wall's push 50 N</text>
    <text x="360" y="160">without friction the block would slide down</text>
    <text x="360" y="182">static limit = 0.6 × 50 = 30 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BLOCKWALL-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="285" y1="150" x2="285" y2="90" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-blockwall-arrow-acc)"/>
    <text x="277" y="80" fill="#1f6fb2" text-anchor="end">friction 20 N up</text>
    <text x="360" y="230">friction 20 N up balances the 20 N weight</text>
    <text x="360" y="252">push 80 N: limit rises to 48 N,</text>
    <text x="360" y="274" font-weight="600" fill="#1f6fb2">friction stays 20 N up</text>
  </g>
</svg>
