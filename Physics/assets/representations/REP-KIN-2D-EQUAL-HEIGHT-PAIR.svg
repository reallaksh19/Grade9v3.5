<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="rep-kin-pair-title rep-kin-pair-desc">
  <title id="rep-kin-pair-title">Two equal-height points on one projectile path: compare v_x, v_y, speed and acceleration</title>
  <desc id="rep-kin-pair-desc">Stage 1: one gravity-only trajectory with two marked points at the same height: P₁ on the way up and P₂ on the way down; a dotted line joins them. Stage 2: the horizontal components: with a_x = 0, the v_x arrows at P₁ and P₂ are equal. Stage 3: the vertical components: v_y points up at P₁ and down at P₂, with equal size and opposite sign. Stage 4: the combined velocity arrows have the same length but different directions, so the speed is the same and the velocity differs; the acceleration is (0, −g) at both points. The path is drawn without numerical values.</desc>
  <defs>
    <marker id="rep-kin-pair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-pair-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-PAIR-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">One trajectory, two points at the same height</text>
    <line x1="40" y1="330" x2="480" y2="330" stroke="currentColor" stroke-width="2"/>
    <path d="M80 330 Q240 -70 400 330" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="40" y1="228" x2="480" y2="228" stroke="currentColor" stroke-width="1" stroke-dasharray="2 5"/>
    <text x="480" y="248" text-anchor="end">same height</text>
    <circle cx="128" cy="228" r="7" fill="currentColor"/>
    <text x="116" y="214" text-anchor="end">P₁ (way up)</text>
    <circle cx="352" cy="228" r="7" fill="currentColor"/>
    <text x="366" y="214">P₂ (way down)</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-PAIR-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="128" y1="228" x2="168" y2="228" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-pair-arrow)"/>
    <line x1="352" y1="228" x2="392" y2="228" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-pair-arrow)"/>
    <text x="142" y="250">v_x</text>
    <text x="366" y="250">v_x</text>
    <text x="520" y="60">a_x = 0: v_x is the same at P₁ and P₂</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-PAIR-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="128" y1="228" x2="128" y2="158" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-pair-arrow)" stroke-dasharray="7 4"/>
    <line x1="352" y1="228" x2="352" y2="298" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-pair-arrow)" stroke-dasharray="7 4"/>
    <text x="120" y="172" text-anchor="end">v_y up</text>
    <text x="344" y="298" text-anchor="end">v_y down</text>
    <text x="520" y="92">v_y: equal size, opposite sign</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-PAIR-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="128" y1="228" x2="168" y2="158" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-pair-arrow-acc)"/>
    <line x1="352" y1="228" x2="392" y2="298" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-pair-arrow-acc)"/>
    <text x="520" y="136" font-weight="600" fill="#1f6fb2">speed: the same at both</text>
    <text x="520" y="158" font-weight="600" fill="#1f6fb2">velocity: different directions</text>
    <text x="520" y="180" font-weight="600" fill="#1f6fb2">acceleration: (0, −g) at both</text>
  </g>
</svg>
