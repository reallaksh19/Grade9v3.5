<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="rep-nlm-smooth-title rep-nlm-smooth-desc">
  <title id="rep-nlm-smooth-title">A block released on a smooth incline at angle θ</title>
  <desc id="rep-nlm-smooth-desc">Stage 1: A block of mass m is released from rest on a smooth fixed plane inclined at θ above the horizontal and stays in contact. Stage 2: Two forces act, the weight mg and the normal force N; with axes along and across the plane, mg sin θ = m a along it and N − mg cos θ = 0 across it. Stage 3: N = mg cos θ and a = g sin θ down the plane; mg is represented by its components, not added again.</desc>
  <defs>
    <marker id="rep-nlm-smooth-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-smooth-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-SMOOTH-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A block released from rest on a smooth fixed incline</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">θ</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 161.4 170.3)"><rect x="133.4 " y="153.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="121.4" y="140.3" text-anchor="end">m</text>
    <text x="20" y="300">the block stays in contact with the plane</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-SMOOTH-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="161.4" y1="170.3" x2="161.4" y2="240.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-smooth-arrow)"/>
    <text x="169.4" y="246.3">mg</text>
    <line x1="152.4" y1="154.7" x2="124.4" y2="106.2" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-smooth-arrow)"/>
    <text x="116.4" y="100.2" text-anchor="end">N</text>
    <line x1="161.4" y1="170.3" x2="83.5" y2="215.3" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="161.4" y1="170.3" x2="191.4" y2="222.2" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="440" y="60" font-weight="600">axes along / across the plane</text>
    <text x="440" y="82">along (down +): mg sin θ = m a</text>
    <text x="440" y="104">across: N − mg cos θ = 0 (contact kept)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-SMOOTH-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="440" y="150" font-weight="600" fill="#1f6fb2">N = mg cos θ</text>
    <text x="440" y="172" font-weight="600" fill="#1f6fb2">a = g sin θ down the plane</text>
    <text x="440" y="194">mg is represented by its components,</text>
    <text x="440" y="216">not added again</text>
  </g>
</svg>
