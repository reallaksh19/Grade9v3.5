<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="rep-kin-gate105-title rep-kin-gate105-desc">
  <title id="rep-kin-gate105-title">An ideal projectile launched with u_x = 10 m/s and u_y = 5 m/s under gravity alone</title>
  <desc id="rep-kin-gate105-desc">Stage 1: after release only gravity acts (no thrust, no significant drag, no contact), so the ideal model applies with a_x = 0 and a_y = −g for +y upward. Stage 2: the launch has u_x = 10 m/s and u_y = 5 m/s, with g = 10 m/s². Stage 3: after 1 s, Δx = 10 m and Δy = 5 × 1 − 5 × 1² = 0 m, so it is back at launch height, moving with v = (10, −5) m/s.</desc>
  <defs>
    <marker id="rep-kin-gate105-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-gate105-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-GATE105-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">The ideal projectile model: after release only gravity acts</text>
    <circle cx="80" cy="260" r="7" fill="currentColor" stroke="currentColor" stroke-width="2"/>
    <line x1="80" y1="268" x2="80" y2="318" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-gate105-arrow)"/>
    <text x="90" y="312">g only</text>
    <text x="470" y="60">no thrust, no significant drag,</text>
    <text x="470" y="82">no contact after release</text>
    <text x="470" y="104">so a_x = 0 and a_y = −g (+y up)</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-GATE105-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="40" y1="260" x2="440" y2="260" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="170" y="285">launch height</text>
    <line x1="80" y1="260" x2="160" y2="220" stroke="currentColor" stroke-width="3" marker-end="url(#rep-kin-gate105-arrow)"/>
    <text x="120" y="205">u = (10, 5) m/s</text>
    <text x="470" y="150">u_x = 10 m/s, u_y = 5 m/s; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-GATE105-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M80 260 L110 246.5 L140 236 L170 228.5 L200 224 L230 222.5 L260 224 L290 228.5 L320 236 L350 246.5 L380 260" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="380" cy="260" r="7" fill="#1f6fb2" stroke="#1f6fb2" stroke-width="2"/>
    <line x1="380" y1="260" x2="440" y2="290" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-gate105-arrow-acc)"/>
    <text x="380" y="312" fill="#1f6fb2">v = (10, −5) m/s</text>
    <text x="470" y="210" font-weight="600" fill="#1f6fb2">After 1 s:</text>
    <text x="470" y="232" fill="#1f6fb2">Δx = 10 m, Δy = 5 × 1 − 5 × 1² = 0 m</text>
    <text x="470" y="254" fill="#1f6fb2">back at launch height</text>
  </g>
</svg>
