<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" aria-label="Five-checkpoint oscillation cycle"><title>Oscillation energy cycle</title><desc>Five ordered checkpoints for one displacement cycle: +Turn, Centre, -Turn, Centre, +Turn with KE and PE labels.</desc><text x="20" y="15" font-size="7" text-anchor="middle">+Turn</text><text x="20" y="25" font-size="6" text-anchor="middle" fill="#888">KE:LOW</text><text x="20" y="35" font-size="6" text-anchor="middle" fill="#444">PE:HIGH</text><text x="70" y="15" font-size="7" text-anchor="middle">Centre</text><text x="70" y="25" font-size="6" text-anchor="middle" fill="#444">KE:HIGH</text><text x="70" y="35" font-size="6" text-anchor="middle" fill="#888">PE:LOW</text><text x="120" y="15" font-size="7" text-anchor="middle">-Turn</text><text x="120" y="25" font-size="6" text-anchor="middle" fill="#888">KE:LOW</text><text x="120" y="35" font-size="6" text-anchor="middle" fill="#444">PE:HIGH</text><text x="170" y="15" font-size="7" text-anchor="middle">Centre</text><text x="170" y="25" font-size="6" text-anchor="middle" fill="#444">KE:HIGH</text><text x="170" y="35" font-size="6" text-anchor="middle" fill="#888">PE:LOW</text><text x="220" y="15" font-size="7" text-anchor="middle">+Turn</text><text x="220" y="25" font-size="6" text-anchor="middle" fill="#888">KE:LOW</text><text x="220" y="35" font-size="6" text-anchor="middle" fill="#444">PE:HIGH</text><line x1="30" y1="50" x2="210" y2="50" stroke="#333" stroke-width="1"/><text x="120" y="65" font-size="6" text-anchor="middle">E_total = constant (ideal)</text></svg>