<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 345" role="img" aria-labelledby="rep-nlm-xup-title rep-nlm-xup-desc">
  <title id="rep-nlm-xup-title">Fixed pulley with x_A and x_B measured upward: build the length from the segments</title>
  <desc id="rep-nlm-xup-desc">Stage 1: One taut inextensible string passes over one fixed pulley with mass A on the left end and B on the right end; x_A and x_B are both positive upward, toward the pulley. Stage 2: The changing segments have lengths h_P − x_A and h_P − x_B, so (h_P − x_A) + (h_P − x_B) = L and x_A + x_B = constant. Stage 3: v_A + v_B = 0 and a_A + a_B = 0, so with a_A = +2 m/s², a_B = −2 m/s²: B accelerates downward at 2 m/s².</desc>
  <defs>
    <marker id="rep-nlm-xup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-xup-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-XUP-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">One string over a fixed pulley; x_A and x_B measured upward</text>
    <line x1="130" y1="50" x2="250" y2="50" stroke="currentColor" stroke-width="2"/>
    <line x1="140" y1="50" x2="132" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="158" y1="50" x2="150" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="176" y1="50" x2="168" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="194" y1="50" x2="186" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="212" y1="50" x2="204" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="230" y1="50" x2="222" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="248" y1="50" x2="240" y2="42" stroke="currentColor" stroke-width="1"/>
    <circle cx="190" cy="80" r="20" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="190" cy="80" r="3" fill="currentColor" stroke="currentColor" stroke-width="1"/>
    <line x1="190" y1="80" x2="190" y2="50" stroke="currentColor" stroke-width="2"/>
    <line x1="170" y1="80" x2="170" y2="200" stroke="currentColor" stroke-width="1.8"/>
    <line x1="210" y1="80" x2="210" y2="160" stroke="currentColor" stroke-width="1.8"/>
    <rect x="150" y="200" width="40" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="170" y="220" text-anchor="middle">A</text>
    <rect x="190" y="160" width="40" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="180" text-anchor="middle">B</text>
    <line x1="60" y1="300" x2="330" y2="300" stroke="currentColor" stroke-width="2"/>
    <line x1="100" y1="300" x2="100" y2="215" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-xup-arrow)"/>
    <text x="90" y="250" text-anchor="end">x_A</text>
    <line x1="290" y1="300" x2="290" y2="175" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-xup-arrow)"/>
    <text x="298" y="240">x_B</text>
    <text x="20" y="330">both coordinates positive upward, toward the pulley; pulley fixed</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-XUP-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="120" y1="80" x2="120" y2="200" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="114" y="150" text-anchor="end" fill="#1f6fb2">h_P − x_A</text>
    <line x1="260" y1="80" x2="260" y2="160" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="266" y="124" fill="#1f6fb2">h_P − x_B</text>
    <text x="480" y="60" font-weight="600" fill="#1f6fb2">segment lengths (pulley at h_P):</text>
    <text x="480" y="82" fill="#1f6fb2">(h_P − x_A) + (h_P − x_B) = L</text>
    <text x="480" y="104">so x_A + x_B = constant</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-XUP-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="150" font-weight="600">v_A + v_B = 0, a_A + a_B = 0</text>
    <text x="480" y="172" font-weight="600" fill="#1f6fb2">a_A = +2 m/s² → a_B = −2 m/s²</text>
    <text x="480" y="194">B accelerates downward at 2 m/s²</text>
  </g>
</svg>
