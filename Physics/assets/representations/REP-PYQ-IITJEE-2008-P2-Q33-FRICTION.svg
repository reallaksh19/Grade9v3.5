<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img" aria-labelledby="j08q33-title j08q33-desc">
<title id="j08q33-title">Oblique pull compared with oblique push</title><desc id="j08q33-desc">The same body is on the same level rough surface. A force is angled upward while pulling and downward while pushing. Weight and normal force are labelled without evaluating them.</desc>
