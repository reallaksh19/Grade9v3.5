<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="rep-nlm-boat-title rep-nlm-boat-desc">
  <title id="rep-nlm-boat-title">A 70 kg man standing in a 130 kg boat at rest on a lake</title>
  <desc id="rep-nlm-boat-desc">Stage 1: a 70 kg man stands in a 130 kg boat floating at rest on a lake; g = 10 m/s². Stage 2: the boat is chosen as the body; the agents acting on it are Earth, the man (by contact) and the water (by contact). Stage 3: the boat's diagram carries its weight 1300 N down (Earth), the man's push 700 N down (man) and the water's push 2000 N up (water); the man's own weight acts on the man, not on the boat.</desc>
  <defs>
    <marker id="rep-nlm-boat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-boat-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BOAT-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A man standing in a boat on a lake</text>
    <path d="M20 210 Q45 200 70 210 T120 210 T170 210 T220 210 T270 210 T320 210 T370 210 T420 210" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M110 170 L370 170 L330 225 L150 225 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="240" cy="99" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="240" y1="108" x2="240" y2="142" stroke="currentColor" stroke-width="2"/>
    <line x1="240" y1="142" x2="230" y2="170" stroke="currentColor" stroke-width="2"/>
    <line x1="240" y1="142" x2="250" y2="170" stroke="currentColor" stroke-width="2"/>
    <line x1="226" y1="122" x2="254" y2="122" stroke="currentColor" stroke-width="2"/>
    <text x="265" y="110">man 70 kg</text>
    <text x="240" y="200" text-anchor="middle">boat 130 kg</text>
    <text x="20" y="270">Everything is at rest; g = 10 m/s².</text>
    <text x="20" y="292">Build the free-body inventory of the boat.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOAT-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M100 162 L380 162 L336 233 L144 233 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="470" y="40" font-weight="600">chosen body: the boat</text>
    <text x="470" y="62">who acts on the boat?</text>
    <text x="470" y="84">agents: Earth, the man (contact),</text>
    <text x="470" y="106">the water (contact)</text>
    <path d="M560 190 L720 190 L690 230 L590 230 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="640" y="216" text-anchor="middle">boat</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOAT-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="600" y1="190" x2="600" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-boat-arrow)"/>
    <text x="592" y="160" text-anchor="end">water on boat 2000 N</text>
    <line x1="690" y1="145" x2="690" y2="188" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-boat-arrow)"/>
    <text x="700" y="160">man on boat</text>
    <text x="700" y="180">700 N</text>
    <line x1="640" y1="230" x2="640" y2="290" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-boat-arrow)"/>
    <text x="650" y="285">Earth on boat 1300 N</text>
    <text x="20" y="324" font-weight="600" fill="#1f6fb2">The man's 700 N weight acts on the man, not on the boat.</text>
  </g>
</svg>
