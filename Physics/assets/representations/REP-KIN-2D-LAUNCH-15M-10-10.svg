<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" role="img" aria-labelledby="rep-kin-h15-title rep-kin-h15-desc">
  <title id="rep-kin-h15-title">Launch 15 m above ground with u = (10, 10) m/s: impact where Δy = −15 m</title>
  <desc id="rep-kin-h15-desc">Stage 1: a projectile starts 15 m above level ground with components u_x = 10 m/s and u_y = 10 m/s upward, rises, then falls past its launch height to the ground. Stage 2: with +y up, the origin at launch and g = 10 m/s², the impact event is Δy = −15 m, not Δy = 0; the point back at launch height is marked as not the ground. Stage 3: −15 = 10t − 5t², so 5t² − 10t − 15 = 0 and the physical root is t = 3 s. Stage 4: the range is Δx = 10(3) = 30 m; t = 3 s gives Δy = −15 m, while the same-height time 2u_y/g = 2 s gives Δy = 0, the wrong event.</desc>
  <defs>
    <marker id="rep-kin-h15-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-h15-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-H15-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Launch 15 m above level ground</text>
    <rect x="110" y="200" width="60" height="150" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="40" y1="350" x2="520" y2="350" stroke="currentColor" stroke-width="2"/>
    <path d="M98 200 H90 V350 H98" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="84" y="280" text-anchor="end">15 m</text>
    <path d="M170 200 Q320 50 470 350" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="170" cy="200" r="7" fill="currentColor"/>
    <line x1="170" y1="200" x2="210" y2="200" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-h15-arrow)"/>
    <text x="174" y="222">u_x = 10 m/s</text>
    <line x1="170" y1="200" x2="170" y2="160" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-h15-arrow)"/>
    <text x="164" y="166" text-anchor="end">u_y = 10 m/s</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-H15-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="170" y1="200" x2="500" y2="200" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <circle cx="370" cy="200" r="6" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="382" y="190">Δy = 0: not the ground</text>
    <text x="650" y="60">+y up, origin at launch, g = 10 m/s²</text>
    <text x="650" y="100" font-weight="600">impact event:</text>
    <text x="650" y="122">Δy = −15 m (not Δy = 0)</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-H15-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="650" y="166" fill="#1f6fb2">−15 = 10t − 5t²</text>
    <text x="650" y="188" fill="#1f6fb2">5t² − 10t − 15 = 0</text>
    <text x="650" y="210" font-weight="600" fill="#1f6fb2">physical root t = 3 s</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-H15-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <circle cx="470" cy="350" r="7" fill="#1f6fb2"/>
    <path d="M170 372 V380 H470 V372" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="320" y="400" text-anchor="middle" font-weight="600" fill="#1f6fb2">Δx = 10(3) = 30 m</text>
    <text x="650" y="250">check: t = 3 s gives Δy = −15 m;</text>
    <text x="650" y="272">2u_y/g = 2 s gives Δy = 0,</text>
    <text x="650" y="294">the wrong event</text>
  </g>
</svg>
