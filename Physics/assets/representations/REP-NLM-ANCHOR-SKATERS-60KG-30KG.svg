<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="rep-nlm-anc-skaters-title rep-nlm-anc-skaters-desc">
  <title id="rep-nlm-anc-skaters-title">On smooth ice, a 60 kg skater pushes a 30 kg skater with 90 N</title>
  <desc id="rep-nlm-anc-skaters-desc">Stage 1: on smooth ice a 60 kg skater pushes a 30 kg skater with 90 N. Stage 2: each skater gets 90 N, on different bodies: forward on the 30 kg skater, backward on the 60 kg skater. Stage 3: the pushed skater has a = 90/30 = 3 m/s² forward and the pusher a = 90/60 = 1.5 m/s² backward; the pair never cancels, because each force is in a different body's net force.</desc>
