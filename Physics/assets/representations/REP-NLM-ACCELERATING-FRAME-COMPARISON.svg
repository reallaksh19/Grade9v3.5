<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 550" role="img" aria-labelledby="rep-nlm-fc-title rep-nlm-fc-desc">
  <title id="rep-nlm-fc-title">One lift event described from the ground frame and from the accelerating lift frame</title>
  <desc id="rep-nlm-fc-desc">Drawn qualitatively, without values, with +y upward. Stage 1: a person stands on a scale in a lift; the same event is drawn twice, once for each description, and the person is the chosen body. Stage 2: observer labels and motion state: on the left the ground observer, an inertial frame with a_frame = 0, sees the person moving downward (v down) while accelerating upward (a up), because the lift is slowing on its way down; on the right the lift observer uses a frame accelerating upward with the lift, in which the person has zero velocity and zero acceleration. Stage 3: the real forces on the person, the same in both columns: N, scale on person, upward, drawn longer than mg, Earth on person, downward. Stage 4: only in the lift-frame column, a dashed pseudo-force F_pseudo = −m a_frame points downward, opposite a_frame; it is a frame term with no agent and is not a third-law partner. The frame equations are N − mg = m a_y in the ground frame and N − mg − m a_frame = 0 in the lift frame. Stage 5: the contact state is N &gt; 0 in both columns, and both descriptions predict the same observable: the scale reads N = m(g + a_y), larger than mg, set by the acceleration and not by the downward velocity.</desc>
  <defs>
    <marker id="rep-nlm-fc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-fc-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-FRAME-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M340 8 V305 M340 340 V470" stroke="currentColor" stroke-dasharray="2 4"/>
    <line x1="160" y1="60" x2="160" y2="90" stroke="currentColor" stroke-width="2"/>
    <rect x="90" y="90" width="140" height="210" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="128" y="285" width="64" height="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="196" y="297" font-size="14">scale</text>
    <circle cx="160" cy="176" r="13" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M160 189 V245 M160 245 L147 285 M160 245 L173 285 M140 225 L160 202 L180 225" fill="none" stroke="currentColor" stroke-width="3"/>
    <line x1="510" y1="60" x2="510" y2="90" stroke="currentColor" stroke-width="2"/>
    <rect x="440" y="90" width="140" height="210" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="478" y="285" width="64" height="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="546" y="297" font-size="14">scale</text>
    <circle cx="510" cy="176" r="13" fill="none" stroke="currentColor" stroke-width="3"/>
    <path d="M510 189 V245 M510 245 L497 285 M510 245 L523 285 M490 225 L510 202 L530 225" fill="none" stroke="currentColor" stroke-width="3"/>
    <text x="20" y="328" font-weight="600">chosen body: the person (same event in both columns)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FRAME-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="12" y="24" font-weight="600">Ground observer (inertial)</text>
    <text x="12" y="46">a_frame = 0</text>
    <line x1="40" y1="140" x2="40" y2="215" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="14" y="236">v: down</text>
    <line x1="70" y1="215" x2="70" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="40" y="130">a: up</text>
    <text x="352" y="24" font-weight="600">Lift observer (accelerating frame)</text>
    <line x1="620" y1="215" x2="620" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="594" y="130">a_frame: up</text>
    <text x="352" y="46">person: v = 0, a = 0 relative to lift</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FRAME-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="200" y1="284" x2="200" y2="172" stroke="currentColor" stroke-width="3" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="206" y="186">N</text>
    <line x1="128" y1="225" x2="128" y2="290" stroke="currentColor" stroke-width="3" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="98" y="284">mg</text>
    <line x1="550" y1="284" x2="550" y2="172" stroke="currentColor" stroke-width="3" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="556" y="186">N</text>
    <line x1="478" y1="225" x2="478" y2="290" stroke="currentColor" stroke-width="3" marker-end="url(#rep-nlm-fc-arrow)"/>
    <text x="448" y="284">mg</text>
    <text x="12" y="356">Real (both): N (scale on person), up;</text>
    <text x="12" y="376">mg (Earth on person), down.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FRAME-V3" font-family="system-ui,sans-serif" font-size="15">
    <line x1="454" y1="185" x2="454" y2="232" stroke="#1f6fb2" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#rep-nlm-fc-arrow-accent)"/>
    <text x="440" y="178" fill="#1f6fb2" font-size="14">F_ps</text>
    <text x="352" y="356" fill="#1f6fb2">Dashed: F_ps = −m a_frame, down;</text>
    <text x="352" y="376" fill="#1f6fb2">a frame term, no agent, no partner.</text>
    <text x="12" y="410" fill="currentColor" font-weight="600">N − mg = m a_y</text>
    <text x="352" y="410" fill="currentColor" font-weight="600">N − mg − m a_frame = 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FRAME-V4" font-family="system-ui,sans-serif" font-size="15">
    <text x="12" y="440" fill="currentColor">contact: N &gt; 0 (on the scale)</text>
    <text x="352" y="440" fill="currentColor">contact: N &gt; 0 (on the scale)</text>
    <rect x="6" y="480" width="678" height="62" rx="6" fill="none" stroke="#1f6fb2" stroke-width="2"/>
    <text x="16" y="504" fill="#1f6fb2" font-weight="600">Same observable in both frames: scale reads N = m(g + a_y) &gt; mg.</text>
    <text x="16" y="528" fill="currentColor">Set by the upward acceleration, not by the downward velocity.</text>
  </g>
</svg>
