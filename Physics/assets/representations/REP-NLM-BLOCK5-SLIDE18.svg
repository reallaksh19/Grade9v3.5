<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="rep-nlm-block18-title rep-nlm-block18-desc">
  <title id="rep-nlm-block18-title">5 kg block sliding with an 18 N pull: kinetic friction 10 N</title>
  <desc id="rep-nlm-block18-desc">Stage 1: A 5 kg block is already sliding to the right on a horizontal floor while a constant 18 N force pulls it right; μ_k = 0.20 and g = 10 m/s². Stage 2: Because it slides, friction is kinetic: N = 50 N and f_k = 0.20 × 50 = 10 N to the left. Stage 3: a = (18 − 10)/5 = 1.6 m/s² to the right.</desc>
  <defs>
    <marker id="rep-nlm-block18-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-block18-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BLOCK18-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 5 kg block already sliding right, pulled with 18 N</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="160" y="140" width="80" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="200" y="175" text-anchor="middle">5 kg</text>
    <line x1="242" y1="170" x2="312" y2="170" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-block18-arrow)"/>
    <text x="318" y="175">18 N</text>
    <line x1="290" y1="100" x2="350" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-block18-arrow)"/>
    <text x="290" y="92">sliding</text>
    <text x="20" y="275">μ_k = 0.20; g = 10 m/s²; force horizontal</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BLOCK18-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="158" y1="186" x2="118" y2="186" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-block18-arrow-acc)"/>
    <text x="110" y="180" fill="#1f6fb2">f_k</text>
    <line x1="188" y1="140" x2="188" y2="96" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-block18-arrow)"/>
    <text x="196" y="110">N = 50 N</text>
    <line x1="212" y1="200" x2="212" y2="244" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-block18-arrow)"/>
    <text x="220" y="240">mg = 50 N</text>
    <text x="470" y="60" font-weight="600">sliding: kinetic friction</text>
    <text x="470" y="82">N = 50 N</text>
    <text x="470" y="104">f_k = 0.20 × 50 = 10 N, to the left</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BLOCK18-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="150" fill="#1f6fb2">a = (18 − 10)/5</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">a = 1.6 m/s² to the right</text>
  </g>
</svg>
