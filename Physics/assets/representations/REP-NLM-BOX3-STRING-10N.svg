<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="rep-nlm-box3-title rep-nlm-box3-desc">
  <title id="rep-nlm-box3-title">A 3 kg box at rest on the floor with a string pulling up with 10 N</title>
  <desc id="rep-nlm-box3-desc">Stage 1: a 3 kg box rests on the floor while a string pulls straight up on it with 10 N; g = 10 m/s². Stage 2: the forces on the box are its weight 30 N down (Earth), the string's 10 N up and the floor's push N up. Stage 3: the floor pushes up with 20 N, not 30 N; the net force is 10 + 20 − 30 = 0 although all three forces are nonzero.</desc>
  <defs>
    <marker id="rep-nlm-box3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-box3-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BOX3-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A box on the floor with a string pulling straight up</text>
    <text x="20" y="50">The box stays at rest on the floor; g = 10 m/s².</text>
    <text x="20" y="72">List every force on the box, then find the net force.</text>
    <line x1="20" y1="280" x2="440" y2="280" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="280" x2="22" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="280" x2="40" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="280" x2="58" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="280" x2="76" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="280" x2="94" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="280" x2="112" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="280" x2="130" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="280" x2="148" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="280" x2="166" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="280" x2="184" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="280" x2="202" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="280" x2="220" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="280" x2="238" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="280" x2="256" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="280" x2="274" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="280" x2="292" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="280" x2="310" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="280" x2="328" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="280" x2="346" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="280" x2="364" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="280" x2="382" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="280" x2="400" y2="288" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="280" x2="418" y2="288" stroke="currentColor" stroke-width="1"/>
    <rect x="170" y="210" width="100" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="250" text-anchor="middle">3 kg box</text>
    <line x1="230" y1="210" x2="230" y2="100" stroke="currentColor" stroke-width="1.5"/>
    <line x1="230" y1="210" x2="230" y2="180" stroke="currentColor" stroke-width="3" marker-end="url(#rep-nlm-box3-arrow)"/>
    <text x="240" y="120">string pulls up with 10 N</text>
    <text x="240" y="195">10 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOX3-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="200" y1="280" x2="200" y2="370" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-box3-arrow)"/>
    <text x="210" y="368">weight 30 N (Earth on box)</text>
    <line x1="185" y1="210" x2="185" y2="150" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-box3-arrow)"/>
    <text x="177" y="165" text-anchor="end">floor's push N (up)</text>
    <text x="500" y="110">forces on the box:</text>
    <text x="500" y="132">Earth: 30 N down</text>
    <text x="500" y="154">string: 10 N up</text>
    <text x="500" y="176">floor: N up</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOX3-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="500" y="220">floor's push N = 20 N up, not 30 N</text>
    <text x="500" y="242">net force = 10 + 20 − 30 = 0</text>
    <text x="500" y="274" font-weight="600" fill="#1f6fb2">three nonzero forces, zero net</text>
  </g>
</svg>
