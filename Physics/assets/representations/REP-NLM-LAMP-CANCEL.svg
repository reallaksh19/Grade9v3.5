<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="rep-nlm-lamp-title rep-nlm-lamp-desc">
  <title id="rep-nlm-lamp-title">Lamp at rest on a cord: two nonzero forces that sum to zero</title>
  <desc id="rep-nlm-lamp-desc">Stage 1: A 1.5 kg lamp hangs at rest from a light vertical ceiling cord; g = 10 m/s², up positive. Stage 2: Two forces act on the lamp: the cord pulls up with 15 N and the Earth pulls down with 15 N. Stage 3: The net force is 15 − 15 = 0, so the lamp stays at rest; if the cord were cut only the −15 N weight remains and a = −10 m/s².</desc>
  <defs>
    <marker id="rep-nlm-lamp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-lamp-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-LAMP-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 1.5 kg lamp hangs at rest from a cord</text>
    <line x1="80" y1="50" x2="240" y2="50" stroke="currentColor" stroke-width="2"/>
    <line x1="90" y1="50" x2="82" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="108" y1="50" x2="100" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="126" y1="50" x2="118" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="144" y1="50" x2="136" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="162" y1="50" x2="154" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="180" y1="50" x2="172" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="198" y1="50" x2="190" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="216" y1="50" x2="208" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="234" y1="50" x2="226" y2="42" stroke="currentColor" stroke-width="1"/>
    <line x1="160" y1="50" x2="160" y2="140" stroke="currentColor" stroke-width="2"/>
    <path d="M130 170 L145 140 H175 L190 170 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="165">lamp</text>
    <text x="20" y="250">g = 10 m/s², up positive</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LAMP-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="160" y1="136" x2="160" y2="76" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-lamp-arrow)"/>
    <text x="170" y="96">cord on lamp: 15 N</text>
    <line x1="160" y1="176" x2="160" y2="236" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-lamp-arrow)"/>
    <text x="170" y="236">Earth on lamp: 15 N</text>
    <text x="420" y="60" font-weight="600">forces on the lamp:</text>
    <text x="420" y="82">+15 N (cord, up)</text>
    <text x="420" y="104">−15 N (Earth, down)</text>
    <text x="420" y="126">two forces act, both nonzero</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LAMP-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="420" y="160" font-weight="600" fill="#1f6fb2">net force = 15 − 15 = 0</text>
    <text x="420" y="182" fill="#1f6fb2">a = 0: the lamp stays at rest</text>
    <text x="420" y="204">cord cut: only −15 N remains,</text>
    <text x="420" y="226">a = −10 m/s² (down)</text>
  </g>
</svg>
