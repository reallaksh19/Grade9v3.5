<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="rep-nlm-roughrest-title rep-nlm-roughrest-desc">
  <title id="rep-nlm-roughrest-title">Block on a rough incline: rest needs mg sin θ ≤ μ_s mg cos θ</title>
  <desc id="rep-nlm-roughrest-desc">Stage 1: A block rests on a rough fixed plane inclined at θ with coefficient of static friction μ_s; no other force acts. Stage 2: Across the plane N = mg cos θ; along it rest needs friction of size mg sin θ, because the block tends to slide down. Stage 3: Static friction acts up the plane with required size mg sin θ; rest is possible when mg sin θ ≤ μ_s mg cos θ, that is tan θ ≤ μ_s.</desc>
  <defs>
    <marker id="rep-nlm-roughrest-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-roughrest-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ROUGHREST-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A block tested for rest on a rough incline</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">θ</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 161.4 170.3)"><rect x="133.4 " y="153.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="20" y="300">coefficient of static friction μ_s; no other force</text>
    <text x="267.5" y="154.1" text-anchor="middle" font-size="14">rough: μ_s</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ROUGHREST-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="161.4" y1="170.3" x2="161.4" y2="240.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-roughrest-arrow)"/>
    <text x="169.4" y="246.3">mg</text>
    <line x1="152.4" y1="154.7" x2="124.4" y2="106.2" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-roughrest-arrow)"/>
    <text x="116.4" y="100.2" text-anchor="end">N</text>
    <text x="440" y="60" font-weight="600">across: N = mg cos θ</text>
    <text x="440" y="82">along: rest needs f = mg sin θ</text>
    <text x="440" y="104">slip tendency: down the plane</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ROUGHREST-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="187.4" y1="155.3" x2="235.9" y2="127.3" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-roughrest-arrow-acc)"/>
    <text x="243.9" y="121.3" text-anchor="start" fill="#1f6fb2">f_s</text>
    <text x="440" y="150" font-weight="600" fill="#1f6fb2">static friction up the plane,</text>
    <text x="440" y="172" fill="#1f6fb2">required size mg sin θ</text>
    <text x="440" y="194" fill="#1f6fb2">rest possible if mg sin θ ≤ μ_s mg cos θ</text>
    <text x="440" y="216" font-weight="600" fill="#1f6fb2">i.e. tan θ ≤ μ_s</text>
    <text x="440" y="238">not assumed to be at the limit</text>
  </g>
</svg>
