<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 255" role="img" aria-labelledby="jm26q46-title jm26q46-desc">
<title id="jm26q46-title">Same 45 degree incline in rough and smooth trials</title><desc id="jm26q46-desc">A block starts from rest and traverses the same distance down the same 45 degree incline. The rough trial takes t and the frictionless trial takes t over 2. No coefficient is evaluated.</desc>
<defs><marker id="jm26q46-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">same 45° incline · same distance</text><text x="16" y="44" stroke="none">starts from rest</text><text x="40" y="54" stroke="none" >rough trial: time t</text><line x1="28" y1="84" x2="202" y2="184" stroke-width="2" /><rect x="96" y="112" width="54" height="40" fill="none" stroke-width="2" transform="rotate(30 123 132)"/><text x="32" y="205" stroke="none" >rough contact</text><text x="254" y="54" stroke="none" >smooth trial: time t/2</text><line x1="238" y1="84" x2="414" y2="184" stroke-width="2" /><rect x="306" y="112" width="54" height="40" fill="none" stroke-width="2" transform="rotate(30 333 132)"/><text x="258" y="205" stroke="none" >frictionless</text><text x="16" y="238" stroke="none" >incline angle = 45°</text></g></svg>
