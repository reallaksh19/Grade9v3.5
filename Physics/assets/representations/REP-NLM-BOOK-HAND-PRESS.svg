<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="rep-nlm-bookhand-title rep-nlm-bookhand-desc">
  <title id="rep-nlm-bookhand-title">Book at rest with a hand pressing down: three forces, zero net</title>
  <desc id="rep-nlm-bookhand-desc">Stage 1: A 2 kg book lies at rest on a table while a hand presses straight down on it with 5 N; g = 10 m/s², up positive. Stage 2: Three forces act on the book: the Earth pulls it down with 20 N, the hand pushes down with 5 N, and the table pushes up with N; at rest N − 20 − 5 = 0. Stage 3: The table's push is 25 N and the net force is zero, so the book's zero velocity does not change although three nonzero forces act.</desc>
  <defs>
    <marker id="rep-nlm-bookhand-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-bookhand-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BOOKHAND-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2 kg book at rest; a hand presses down with 5 N</text>
    <line x1="60" y1="190" x2="360" y2="190" stroke="currentColor" stroke-width="2"/>
    <line x1="80" y1="190" x2="80" y2="260" stroke="currentColor" stroke-width="3"/>
    <line x1="340" y1="190" x2="340" y2="260" stroke="currentColor" stroke-width="3"/>
    <rect x="160" y="160" width="100" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="180" text-anchor="middle">book 2 kg</text>
    <path d="M235 100 q10 -20 30 0 v30 h-30 z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="275" y="110">hand, 5 N down</text>
    <text x="20" y="290">g = 10 m/s²; up positive</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOOKHAND-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="250" y1="132" x2="250" y2="158" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-bookhand-arrow)"/>
    <text x="258" y="152">hand on book: 5 N</text>
    <line x1="210" y1="180" x2="210" y2="240" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-bookhand-arrow)"/>
    <text x="218" y="244">Earth on book: 20 N</text>
    <line x1="175" y1="175" x2="175" y2="115" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-bookhand-arrow)"/>
    <text x="167" y="118" text-anchor="end">table on book: N</text>
    <text x="470" y="60" font-weight="600">forces on the book:</text>
    <text x="470" y="82">−20 N (Earth), −5 N (hand), +N (table)</text>
    <text x="470" y="104">at rest: N − 20 − 5 = 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOOKHAND-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="150" font-weight="600" fill="#1f6fb2">table's push N = 25 N</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">net force = 0</text>
    <text x="470" y="194">velocity (zero) does not change,</text>
    <text x="470" y="216">though three nonzero forces act</text>
  </g>
</svg>
