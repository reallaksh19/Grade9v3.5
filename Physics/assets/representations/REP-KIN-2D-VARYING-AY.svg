<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="rep-kin-vary-title rep-kin-vary-desc">
  <title id="rep-kin-vary-title">a_x = 2 m/s² and a_y = 3t m/s² over 0–4 s: check each axis's acceleration</title>
  <desc id="rep-kin-vary-desc">Stage 1: a particle with a_x = 2 m/s² and a_y = 3t m/s² over 0 ≤ t ≤ 4 s; the question is which axis may use the constant-acceleration equations exactly. Stage 2: two acceleration–time graphs over 0 to 4 s: a_x is a flat line at 2 m/s² and a_y = 3t is a rising straight line. Stage 3: x: a_x is constant, so the equations are exact; y: a_y changes, so they are not exact over 0–4 s. Stage 4: use the constant-acceleration equations on x only; one valid axis does not license the other.</desc>
  <defs>
    <marker id="rep-kin-vary-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-vary-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-VARY-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Over 0 ≤ t ≤ 4 s</text>
    <circle cx="90" cy="150" r="7" fill="currentColor"/>
    <line x1="90" y1="150" x2="170" y2="150" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-vary-arrow)"/>
    <text x="178" y="155">a_x = 2 m/s²</text>
    <line x1="90" y1="150" x2="90" y2="80" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-vary-arrow)" stroke-dasharray="7 4"/>
    <text x="98" y="76">a_y = 3t m/s²</text>
    <text x="20" y="220">Which axis may use the constant-</text>
    <text x="20" y="242">acceleration equations exactly?</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-VARY-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="520" y1="170" x2="710" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-vary-arrow)"/>
    <line x1="520" y1="170" x2="520" y2="50" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-vary-arrow)"/>
    <text x="716" y="175">t</text>
    <text x="514" y="46" text-anchor="end">a_x</text>
    <line x1="680" y1="165" x2="680" y2="175" stroke="currentColor" stroke-width="1.5"/>
    <text x="680" y="192" text-anchor="middle">4 s</text>
    <text x="520" y="192" text-anchor="middle">0</text>
    <line x1="520" y1="130" x2="680" y2="130" stroke="currentColor" stroke-width="3"/>
    <text x="540" y="90">a_x = 2 m/s² for all t</text>
    <line x1="520" y1="400" x2="710" y2="400" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-vary-arrow)"/>
    <line x1="520" y1="400" x2="520" y2="280" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-vary-arrow)"/>
    <text x="716" y="405">t</text>
    <text x="514" y="276" text-anchor="end">a_y</text>
    <line x1="680" y1="395" x2="680" y2="405" stroke="currentColor" stroke-width="1.5"/>
    <text x="680" y="422" text-anchor="middle">4 s</text>
    <text x="520" y="422" text-anchor="middle">0</text>
    <line x1="520" y1="400" x2="680" y2="290" stroke="currentColor" stroke-width="3"/>
    <text x="580" y="380">a_y = 3t grows with t</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-VARY-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="300" font-weight="600" fill="#1f6fb2">x: a_x constant → exact</text>
    <text x="20" y="324" font-weight="600" fill="#1f6fb2">y: a_y changes → not exact over 0–4 s</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-VARY-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="370">Use the constant-a equations on x only;</text>
    <text x="20" y="392">one valid axis does not license the other.</text>
  </g>
</svg>
