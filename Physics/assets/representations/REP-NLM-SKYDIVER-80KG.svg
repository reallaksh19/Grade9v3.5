<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="rep-nlm-skydiver-title rep-nlm-skydiver-desc">
  <title id="rep-nlm-skydiver-title">Skydiver at a steady 50 m/s, then just after the parachute opens</title>
  <desc id="rep-nlm-skydiver-desc">Stage 1: An 80 kg skydiver falls in a straight vertical line at a steady 50 m/s; g = 10 m/s². Stage 2: At steady speed the net force is zero, so the air resistance is 800 N upward, equal to the 800 N weight. Stage 3: Just after the parachute opens the skydiver still moves down but slows, so the net force points upward.</desc>
  <defs>
    <marker id="rep-nlm-skydiver-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-skydiver-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-SKYDIVER-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">An 80 kg skydiver falling at a steady 50 m/s</text>
    <circle cx="160" cy="110.8" r="10.8" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="121.6" x2="160" y2="154" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="154" x2="146.5" y2="190" stroke="currentColor" stroke-width="2"/>
    <line x1="160" y1="154" x2="173.5" y2="190" stroke="currentColor" stroke-width="2"/>
    <line x1="142" y1="134.2" x2="178" y2="134.2" stroke="currentColor" stroke-width="2"/>
    <line x1="220" y1="110" x2="220" y2="170" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-skydiver-arrow)"/>
    <text x="228" y="150">v = 50 m/s (steady)</text>
    <text x="20" y="290">straight vertical fall; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-SKYDIVER-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="150" y1="196" x2="150" y2="236" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-skydiver-arrow)"/>
    <text x="158" y="240">Earth on skydiver: 800 N</text>
    <line x1="170" y1="96" x2="170" y2="56" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-skydiver-arrow)"/>
    <text x="178" y="70">air on skydiver: 800 N</text>
    <text x="470" y="60" font-weight="600">steady fall: velocity constant</text>
    <text x="470" y="82">so F_net = 0</text>
    <text x="470" y="104" font-weight="600" fill="#1f6fb2">air resistance = 800 N up</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-SKYDIVER-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="150" font-weight="600">parachute opens:</text>
    <text x="470" y="172">still moving down, but slowing</text>
    <text x="470" y="194">velocity change is upward</text>
    <text x="470" y="216" font-weight="600" fill="#1f6fb2">net force: upward</text>
  </g>
</svg>
