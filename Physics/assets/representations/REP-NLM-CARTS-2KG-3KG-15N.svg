  </g>
  <g data-g9-stage-id="VIS-NLM-CARTS15-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="392" fill="#1f6fb2">a = 15 / 5 = 3 m/s²; T_1 = 15 N (on the front cart)</text>
    <text x="20" y="416" font-weight="600" fill="#1f6fb2">T_2 = 3 × 3 = 9 N: backward on the front cart, forward on the rear cart</text>
  </g>
