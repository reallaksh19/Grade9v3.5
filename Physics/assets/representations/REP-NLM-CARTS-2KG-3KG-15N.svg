<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="rep-nlm-carts15-title rep-nlm-carts15-desc">
  <title id="rep-nlm-carts15-title">A hand pulling a 2 kg cart with 15 N, with a 3 kg cart tied behind it</title>
  <desc id="rep-nlm-carts15-desc">Stage 1: on a smooth track a hand pulls a light string attached to a 2 kg front cart with 15 N; a second light string ties that cart to a 3 kg rear cart. Stage 2: each light string has one tension along its length: T_1 in the front string pulls the front cart forward, T_2 in the rear string pulls the front cart backward and the rear cart forward. Stage 3: a = 15 / 5 = 3 m/s², T_1 = 15 N and T_2 = 3 × 3 = 9 N, so the two strings have different tensions.</desc>
  <defs>
    <marker id="rep-nlm-carts15-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-carts15-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
