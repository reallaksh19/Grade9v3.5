<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img" aria-labelledby="j07q10-title j07q10-desc">
<title id="j07q10-title">Same block stopping on a level surface and up a 30 degree incline</title><desc id="j07q10-desc">The same block starts with the same speed in two trials. It stops on a rough level surface or after moving up the same rough surface inclined at 30 degrees. No result is shown.</desc>
<defs><marker id="j07q10-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor"><text x="16" y="24" stroke="none" font-weight="700">same block · same initial speed</text><text x="38" y="52" stroke="none" >level trial</text><line x1="20" y1="150" x2="196" y2="150" stroke-width="2" /><rect x="70" y="108" width="58" height="42" fill="none" stroke-width="2" /><line x1="128" y1="128" x2="178" y2="128" stroke-width="2" marker-end="url(#j07q10-a)"/><text x="145" y="116" stroke="none" >v₀</text><text x="250" y="52" stroke="none" >30° incline trial</text><line x1="228" y1="174" x2="414" y2="68" stroke-width="2" /><rect x="300" y="104" width="58" height="42" fill="none" stroke-width="2" transform="rotate(-30 329 125)"/><line x1="290" y1="120" x2="346" y2="88" stroke-width="2" marker-end="url(#j07q10-a)"/><text x="349" y="83" stroke="none" >v₀</text><text x="232" y="188" stroke="none" >30°</text><text x="16" y="222" stroke="none">rough contact in both trials</text><text x="16" y="242" stroke="none">block eventually stops</text></g></svg>
