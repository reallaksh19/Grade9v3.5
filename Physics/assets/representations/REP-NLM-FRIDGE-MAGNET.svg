<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="rep-nlm-magnet-title rep-nlm-magnet-desc">
  <title id="rep-nlm-magnet-title">Magnet on a fridge door: four forces on it, four partners elsewhere</title>
  <desc id="rep-nlm-magnet-desc">Stage 1: A 0.1 kg magnet is stuck at rest on a vertical steel fridge door; the door's magnetic pull on it is 3 N; g = 10 m/s². Stage 2: On the magnet: weight 1 N down from the Earth, magnetic pull 3 N toward the door from the fridge, normal push 3 N away from the door and static friction 1 N up from the door surface. Stage 3: The partners act on other bodies: the magnet pulls the Earth up 1 N, pulls the fridge toward itself 3 N, presses into the door 3 N and drags the door's surface down 1 N; none is on the magnet's diagram.</desc>
  <defs>
    <marker id="rep-nlm-magnet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-magnet-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-MAGNET-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 0.1 kg magnet stuck at rest on a vertical fridge door</text>
    <rect x="60" y="50" width="40" height="230" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="80" y="300" text-anchor="middle">door</text>
    <rect x="100" y="130" width="50" height="60" fill="currentColor"/>
    <text x="158" y="124">magnet</text>
    <text x="20" y="330">door's magnetic pull on it: 3 N; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-MAGNET-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="125" y1="192" x2="125" y2="238" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-magnet-arrow)"/>
    <text x="133" y="236">Earth: 1 N down</text>
    <line x1="220" y1="178" x2="154" y2="178" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-magnet-arrow)"/>
    <text x="226" y="183">fridge (magnetic): 3 N toward door</text>
    <line x1="152" y1="148" x2="212" y2="148" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-magnet-arrow)"/>
    <text x="218" y="153">door (normal): 3 N away</text>
    <line x1="125" y1="128" x2="125" y2="88" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-magnet-arrow)"/>
    <text x="133" y="84">door surface (friction): 1 N up</text>
    <text x="510" y="60" font-weight="600">forces on the magnet:</text>
    <text x="510" y="82">weight 1 N down (Earth)</text>
    <text x="510" y="104">magnetic pull 3 N toward door (fridge)</text>
    <text x="510" y="126">normal push 3 N away from door</text>
    <text x="510" y="148">static friction 1 N up (door surface)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-MAGNET-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="510" y="180" font-weight="600" fill="#1f6fb2">third-law partners, on other bodies:</text>
    <text x="510" y="202" fill="#1f6fb2">magnet pulls Earth up 1 N</text>
    <text x="510" y="224" fill="#1f6fb2">magnet pulls fridge 3 N toward itself</text>
    <text x="510" y="246" fill="#1f6fb2">magnet presses into the door 3 N</text>
    <text x="510" y="268" fill="#1f6fb2">magnet drags door surface down 1 N</text>
    <text x="510" y="290">none of them is on the magnet's diagram</text>
  </g>
</svg>
