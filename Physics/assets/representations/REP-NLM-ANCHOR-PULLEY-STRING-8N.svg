<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="rep-nlm-anc-string8-title rep-nlm-anc-string8-desc">
  <title id="rep-nlm-anc-string8-title">A light string over a frictionless, light pulley joins two bodies</title>
  <desc id="rep-nlm-anc-string8-desc">Stage 1: a light string over a frictionless, light pulley joins two bodies, A and B; the string pulls A with 8 N. Stage 2: under the ideal model T_A = T_B = T. Stage 3: the string pulls B with 8 N too; each pull acts on its own body along its own string segment.</desc>
  <defs>
    <marker id="rep-nlm-anc-string8-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-anc-string8-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ANC-STRING8-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A light string over a frictionless, light pulley joins two bodies</text>
    <line x1="200" y1="50" x2="440" y2="50" stroke="currentColor" stroke-width="3"/>
    <line x1="320" y1="50" x2="320" y2="80" stroke="currentColor" stroke-width="2"/>
    <circle cx="320" cy="120" r="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="280" y1="120" x2="280" y2="230" stroke="currentColor" stroke-width="2"/>
    <line x1="360" y1="120" x2="360" y2="190" stroke="currentColor" stroke-width="2"/>
    <rect x="250" y="230" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="280" y="260" text-anchor="middle" font-weight="600">A</text>
    <rect x="330" y="190" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="360" y="220" text-anchor="middle" font-weight="600">B</text>
    <line x1="280" y1="228" x2="280" y2="176" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-anc-string8-arrow)"/>
    <text x="272" y="196" text-anchor="end">T_A = 8 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ANC-STRING8-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="90" font-weight="600">ideal model:</text>
    <text x="480" y="112">T_A = T_B = T</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ANC-STRING8-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="360" y1="188" x2="360" y2="164" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-anc-string8-arrow-acc)"/>
    <text x="368" y="176" font-weight="600" fill="#1f6fb2">T_B = 8 N</text>
    <text x="40" y="316" fill="#1f6fb2">Each pull acts on its own body, along its own string segment.</text>
  </g>
</svg>
