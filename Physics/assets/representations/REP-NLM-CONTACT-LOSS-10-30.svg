<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="rep-nlm-contactloss-title rep-nlm-contactloss-desc">
  <title id="rep-nlm-contactloss-title">Blocks A (2 kg) and B (3 kg) in contact, A pushed with 10 N while B is pulled with F</title>
  <desc id="rep-nlm-contactloss-desc">Stage 1: Blocks A (2 kg) and B (3 kg) touch on a smooth floor, A behind B; a 10 N force pushes A forward into B while a force F pulls B forward; the blocks are not glued; cases F = 10 N and F = 30 N. Stage 2: Assuming contact, a = (10 + F)/5 and A alone gives 10 − N = 2a, where N is B's backward push on A and must be at least zero. Stage 3: For F = 10 N, a = 4 m/s² and N = 2 N ≥ 0, so both move at 4 m/s²; for F = 30 N, N would be −6 N, a pull, so they separate with a_A = 5 m/s² and a_B = 10 m/s².</desc>
  <defs>
    <marker id="rep-nlm-contactloss-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-contactloss-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CONTACTLOSS-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A (2 kg) behind B (3 kg): 10 N pushes A, F pulls B</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="140" y="140" width="70" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="175" y="175" text-anchor="middle">A 2 kg</text>
    <rect x="210" y="130" width="90" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="255" y="170" text-anchor="middle">B 3 kg</text>
    <line x1="60" y1="170" x2="136" y2="170" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-contactloss-arrow)"/>
    <text x="60" y="160">10 N</text>
    <line x1="302" y1="165" x2="372" y2="165" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-contactloss-arrow)"/>
    <text x="378" y="170">F</text>
    <text x="20" y="240">smooth floor; not glued: contact pushes, never pulls</text>
    <text x="20" y="262">forward positive; cases: F = 10 N and F = 30 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CONTACTLOSS-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="60" font-weight="600">assume contact: a = (10 + F)/5</text>
    <text x="480" y="82">A alone: 10 − N = 2a</text>
    <text x="480" y="104">N = B's push on A, backward; needs N ≥ 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CONTACTLOSS-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="140" fill="#1f6fb2">F = 10 N: a = 4, N = 10 − 8 = 2 N ≥ 0</text>
    <text x="480" y="162" font-weight="600" fill="#1f6fb2">→ together at 4 m/s²</text>
    <text x="480" y="184" fill="#1f6fb2">F = 30 N: a = 8, N = 10 − 16 = −6 N</text>
    <text x="480" y="206" font-weight="600" fill="#1f6fb2">→ a pull, impossible: they separate</text>
    <text x="480" y="228" fill="#1f6fb2">a_A = 5 m/s², a_B = 10 m/s²</text>
  </g>
</svg>
