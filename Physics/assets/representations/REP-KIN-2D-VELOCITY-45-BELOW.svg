<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="rep-kin-45-title rep-kin-45-desc">
  <title id="rep-kin-45-title">A stone thrown from a cliff with u = (10, 20) m/s</title>
  <desc id="rep-kin-45-desc">Stage 1: a stone is thrown from the edge of a high cliff with u_x = 10 m/s and u_y = 20 m/s; beside it, the target direction, 45° below the horizontal. Stage 2: the component histories: v_x = 10, v_y = 20 − 10t, x = 10t, Δy = 20t − 5t². Stage 3: 45° below the horizontal is a condition on the velocity components, v_y/v_x = −1, so v_y = −10 m/s and 20 − 10t = −10 gives t = 3 s. Stage 4: at t = 3 s the stone is at (30, 15) m from the launch point, still above it, moving with v = (10 i − 10 j) m/s, drawn at 45° below the horizontal; its speed is 10√2 ≈ 14.1 m/s, and v² = 500 − 300 = 200 agrees.</desc>
  <defs>
    <marker id="rep-kin-45-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-45-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-45-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Thrown from a high cliff: when does v point 45° below horizontal?</text>
    <path d="M130 190 H40 M130 190 V420" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="50" y="250">high cliff</text>
    <path d="M130 190 Q305 -160 480 365" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="130" cy="190" r="7" fill="currentColor"/>
    <line x1="130" y1="190" x2="160" y2="190" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-45-arrow)"/>
    <text x="134" y="212" font-size="14">u_x = 10 m/s</text>
    <line x1="130" y1="190" x2="130" y2="130" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-45-arrow)"/>
    <text x="124" y="140" text-anchor="end" font-size="14">u_y = 20 m/s</text>
    <line x1="560" y1="90" x2="640" y2="90" stroke="currentColor" stroke-width="1.5"/>
    <line x1="560" y1="90" x2="617" y2="147" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-45-arrow)"/>
    <text x="620" y="158">45° below the horizontal</text>
    <path d="M600 90 A40 40 0 0 1 588.3 118.3" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="606" y="116" font-size="14">45°</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-45-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="560" y="200">v_x = 10,  v_y = 20 − 10t</text>
    <text x="560" y="222">x = 10t,  Δy = 20t − 5t²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-45-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="560" y="262" font-weight="600" fill="#1f6fb2">45° below: v_y / v_x = −1</text>
    <text x="560" y="284" fill="#1f6fb2">v_y = −10 m/s: 20 − 10t = −10</text>
    <text x="560" y="306" font-weight="600" fill="#1f6fb2">t = 3 s</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-45-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <circle cx="340" cy="85" r="7" fill="#1f6fb2"/>
    <line x1="340" y1="85" x2="380" y2="125" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-45-arrow-acc)"/>
    <text x="354" y="75" font-weight="600" fill="#1f6fb2">t = 3 s: (30, 15) m</text>
    <text x="560" y="346">v = (10 i − 10 j) m/s</text>
    <text x="560" y="368">speed = 10√2 ≈ 14.1 m/s</text>
    <text x="560" y="390">check: v² = 500 − 300 = 200</text>
  </g>
</svg>
