<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" role="img" aria-labelledby="rep-nlm-vanapple-title rep-nlm-vanapple-desc">
  <title id="rep-nlm-vanapple-title">A 0.2 kg apple released 1.25 m above the floor of a van accelerating forward at 2 m/s²</title>
  <desc id="rep-nlm-vanapple-desc">Stage 1: a passenger in a van accelerating forward at 2 m/s² releases a 0.2 kg apple from rest relative to the van, 1.25 m above the floor; a mark on the floor lies directly below the release point; g = 10 m/s² and air resistance is ignored. Stage 2: from the roadside only the weight acts, so the apple keeps the van's speed at release; the fall takes 0.5 s and the floor gains 0.25 m on it. Stage 3: in the van a pseudo-force of 0.4 N backward gives the apple 2 m/s² backward, so it drifts 0.25 m back. Stage 4: both descriptions put the landing point 0.25 m behind the mark.</desc>
  <defs>
    <marker id="rep-nlm-vanapple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-vanapple-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
