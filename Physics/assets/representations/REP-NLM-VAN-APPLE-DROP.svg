    <line x1="200" y1="70" x2="300" y2="70" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-vanapple-arrow)"/>
    <text x="200" y="60">van: a = 2 m/s² forward</text>
    <text x="520" y="60">released from rest</text>
    <text x="520" y="82">relative to the van;</text>
    <text x="520" y="104">g = 10 m/s², no air resistance</text>
    <text x="520" y="126">the mark is on the floor</text>
    <text x="520" y="148">directly below the release point</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-VANAPPLE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="520" y="190" font-weight="600">Roadside</text>
    <text x="520" y="212">only the weight acts; the apple</text>
    <text x="520" y="234">keeps the van's speed at release;</text>
    <text x="520" y="256">fall 0.5 s; the floor gains 0.25 m</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-VANAPPLE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="292" y1="150" x2="250" y2="150" stroke="#1f6fb2" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rep-nlm-vanapple-arrow-acc)"/>
    <text x="160" y="175" fill="#1f6fb2">pseudo-force 0.4 N</text>
    <text x="520" y="290" fill="#1f6fb2">Van: pseudo-force 0.4 N backward,</text>
    <text x="520" y="312" fill="#1f6fb2">2 m/s² backward, drifts 0.25 m back</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-VANAPPLE-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
