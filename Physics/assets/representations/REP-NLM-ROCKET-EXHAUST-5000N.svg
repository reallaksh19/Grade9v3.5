<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="rep-nlm-rocket-title rep-nlm-rocket-desc">
  <title id="rep-nlm-rocket-title">A 400 kg rocket far from any planet pushing its exhaust gas backward with 5000 N</title>
  <desc id="rep-nlm-rocket-desc">Stage 1: a 400 kg rocket far from any planet fires its engine, which pushes the exhaust gas backward with 5000 N; no other forces act. Stage 2: the partner force is the gas pushing on the rocket, 5000 N forward; it acts on the rocket, while the engine's push acts on the gas. Stage 3: the rocket's acceleration is 5000 / 400 = 12.5 m/s² forward.</desc>
  <defs>
    <marker id="rep-nlm-rocket-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-rocket-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ROCKET-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A rocket firing its engine far from any planet</text>
    <path d="M260 130 L460 130 L520 160 L460 190 L260 190 Z" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M260 145 L240 138 L240 182 L260 175" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="360" y="166" text-anchor="middle">rocket 400 kg</text>
    <circle cx="200" cy="160" r="18" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="170" cy="148" r="14" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="172" cy="174" r="13" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="140" cy="160" r="12" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <text x="120" y="205">exhaust gas</text>
    <line x1="210" y1="110" x2="90" y2="110" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-rocket-arrow)"/>
    <text x="40" y="90">engine on gas: 5000 N backward</text>
    <text x="20" y="280">No other forces act. Name the partner force and find the rocket's acceleration.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ROCKET-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="300" y1="225" x2="430" y2="225" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-rocket-arrow-acc)"/>
    <text x="300" y="250" fill="#1f6fb2">gas on rocket: 5000 N forward</text>
    <text x="560" y="60">partner pair:</text>
    <text x="560" y="82">engine pushes gas</text>
    <text x="560" y="104">(acts on the gas)</text>
    <text x="560" y="126">gas pushes rocket</text>
    <text x="560" y="148">(acts on the rocket)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ROCKET-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="560" y="190" font-weight="600" fill="#1f6fb2">a = 5000 / 400</text>
    <text x="560" y="212" font-weight="600" fill="#1f6fb2">= 12.5 m/s² forward</text>
  </g>
</svg>
