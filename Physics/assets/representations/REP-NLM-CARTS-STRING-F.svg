<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="rep-nlm-cartsF-title rep-nlm-cartsF-desc">
  <title id="rep-nlm-cartsF-title">Carts A and B on one string, F pulls A: T from B's equation</title>
  <desc id="rep-nlm-cartsF-desc">Stage 1: Two carts A and B of masses m_A and m_B are connected by one taut massless inextensible string on a smooth track; a horizontal force F pulls A away from B; there is no pulley. Stage 2: The string pulls B toward A and A toward B with the same T; one a serves both; the pair gives F = (m_A + m_B) a and B alone gives T = m_B a. Stage 3: a = F/(m_A + m_B) and T = m_B F/(m_A + m_B); one T needs the massless-string model, and a connector with significant mass would break it.</desc>
  <defs>
    <marker id="rep-nlm-cartsF-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-cartsF-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CARTSF-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Carts A and B joined by a string; F pulls A away from B</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="40" y="138" width="90" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="85" y="165" text-anchor="middle">m_B</text>
    <circle cx="58" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="112" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="250" y="138" width="90" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="295" y="165" text-anchor="middle">m_A</text>
    <circle cx="268" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="322" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="130" y1="160" x2="250" y2="160" stroke="currentColor" stroke-width="1.8"/>
    <text x="190" y="150" text-anchor="middle" font-size="14">string</text>
    <line x1="342" y1="160" x2="402" y2="160" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-cartsF-arrow)"/>
    <text x="408" y="165">F</text>
    <text x="20" y="240">massless, taut, inextensible string; no pulley; smooth track</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARTSF-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="132" y1="174" x2="172" y2="174" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-cartsF-arrow-acc)"/>
    <text x="132" y="192" fill="#1f6fb2">T on B</text>
    <line x1="248" y1="174" x2="208" y2="174" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-cartsF-arrow-acc)"/>
    <text x="248" y="192" text-anchor="end" fill="#1f6fb2">T on A</text>
    <text x="470" y="60" font-weight="600">string constraint → one a</text>
    <text x="470" y="82">pair: F = (m_A + m_B) a</text>
    <text x="470" y="104">B alone: T = m_B a</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARTSF-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="150" font-weight="600" fill="#1f6fb2">a = F/(m_A + m_B)</text>
    <text x="470" y="172" font-weight="600" fill="#1f6fb2">T = m_B F/(m_A + m_B)</text>
    <text x="470" y="194">one T needs the massless-string model;</text>
    <text x="470" y="216">a heavy connector breaks it</text>
  </g>
</svg>
