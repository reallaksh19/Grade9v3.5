<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="rep-nlm-crate50-title rep-nlm-crate50-desc">
  <title id="rep-nlm-crate50-title">10 kg crate with a 50 N pull, horizontal and at 37°: each need against its own limit</title>
  <desc id="rep-nlm-crate50-desc">Stage 1: A 10 kg crate on a rough floor with μ_s = 0.55 and μ_k = 0.40 is pulled with 50 N, first horizontally, then at 37° above the horizontal; g = 10 m/s². Stage 2: Trial 1: N = 100 N, limit 55 N, need 50 N. Trial 2: N = 100 − 30 = 70 N, limit 38.5 N, need 40 N. Stage 3: Trial 1 stays at rest with 50 N of static friction; trial 2 slides, kinetic friction is 0.40 × 70 = 28 N and a = 1.2 m/s², so the smaller horizontal part moves the crate.</desc>
  <defs>
    <marker id="rep-nlm-crate50-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-crate50-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CRATE50-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">10 kg crate: a 50 N pull, horizontal and then at 37°</text>
    <text x="115" y="64" text-anchor="middle">trial 1</text>
    <text x="335" y="64" text-anchor="middle">trial 2</text>
    <line x1="20" y1="190" x2="210" y2="190" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="190" x2="22" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="190" x2="40" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="190" x2="58" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="190" x2="76" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="190" x2="94" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="190" x2="112" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="190" x2="130" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="190" x2="148" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="190" x2="166" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="190" x2="184" y2="198" stroke="currentColor" stroke-width="1"/>
    <rect x="60" y="130" width="70" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="95" y="165" text-anchor="middle">10 kg</text>
    <line x1="132" y1="160" x2="192" y2="160" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate50-arrow)"/>
    <text x="136" y="150">50 N</text>
    <line x1="240" y1="190" x2="430" y2="190" stroke="currentColor" stroke-width="2"/>
    <line x1="250" y1="190" x2="242" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="268" y1="190" x2="260" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="286" y1="190" x2="278" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="304" y1="190" x2="296" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="322" y1="190" x2="314" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="340" y1="190" x2="332" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="358" y1="190" x2="350" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="376" y1="190" x2="368" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="394" y1="190" x2="386" y2="198" stroke="currentColor" stroke-width="1"/>
    <line x1="412" y1="190" x2="404" y2="198" stroke="currentColor" stroke-width="1"/>
    <rect x="280" y="130" width="70" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="315" y="165" text-anchor="middle">10 kg</text>
    <line x1="352" y1="150" x2="399.9" y2="113.9" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate50-arrow)"/>
    <text x="352" y="110">50 N at 37°</text>
    <text x="20" y="230">μ_s = 0.55, μ_k = 0.40, g = 10 m/s²</text>
    <text x="20" y="252">sin 37° = 0.6, cos 37° = 0.8; contact kept; slipping not stated</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE50-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="500" y="60" font-weight="600">normal force and need in each trial:</text>
    <text x="500" y="82">1: N = 100 N, limit 55 N, need 50 N</text>
    <text x="500" y="104">2: N = 100 − 30 = 70 N, limit 38.5 N,</text>
    <text x="500" y="126">   need 40 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE50-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="500" y="160" font-weight="600" fill="#1f6fb2">1: 50 ≤ 55 → rest, static f = 50 N</text>
    <text x="500" y="182" font-weight="600" fill="#1f6fb2">2: 40 &gt; 38.5 → slides</text>
    <text x="500" y="204" fill="#1f6fb2">f_k = 0.40 × 70 = 28 N, a = 1.2 m/s²</text>
    <text x="500" y="226">the smaller horizontal part moves it</text>
  </g>
</svg>
