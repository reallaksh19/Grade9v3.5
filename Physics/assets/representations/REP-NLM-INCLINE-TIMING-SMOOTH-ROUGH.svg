<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-labelledby="rep-nlm-timing-title rep-nlm-timing-desc">
  <title id="rep-nlm-timing-title">Same distance down the same incline, smooth and rough: times give μ_k</title>
  <desc id="rep-nlm-timing-desc">Stage 1: A block starts from rest and travels the same distance s down the same incline of angle θ, taking t_0 on a smooth surface and t &gt; t_0 on a rough surface where it slides throughout with constant μ_k; the case to evaluate is θ = 37° with t = 2t_0. Stage 2: a_0 = g sin θ and a = g(sin θ − μ_k cos θ); the same distance from rest gives s = ½ a t² in both trials. Stage 3: a/a_0 = t_0²/t², so μ_k = tan θ (1 − t_0²/t²); for θ = 37° and t = 2t_0, μ_k = 0.75 × (1 − 1/4) = 0.5625 ≈ 0.56.</desc>
  <defs>
    <marker id="rep-nlm-timing-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-timing-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TIMING-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Same incline, same distance s from rest: smooth vs rough</text>
    <polygon points="30,250 220,250 220,106.8" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="74" y="242" text-anchor="middle" font-size="14">θ</text>
    <path d="M60 250 A30 30 0 0 0 54 231.9" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-37 143.2 150.9)"><rect x="126.2 " y="139.9" width="34" height="22" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <line x1="131.7" y1="135.8" x2="43.9" y2="202" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="79.8" y="160.9" text-anchor="end">s</text>
    <text x="125" y="280" text-anchor="middle">smooth</text>
    <text x="125" y="302" text-anchor="middle">time t_0</text>
    <polygon points="240,250 430,250 430,106.8" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="284" y="242" text-anchor="middle" font-size="14">θ</text>
    <path d="M270 250 A30 30 0 0 0 264 231.9" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-37 353.2 150.9)"><rect x="336.2 " y="139.9" width="34" height="22" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <line x1="341.7" y1="135.8" x2="253.9" y2="202" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="289.8" y="160.9" text-anchor="end">s</text>
    <text x="335" y="280" text-anchor="middle">rough (μ_k)</text>
    <text x="335" y="302" text-anchor="middle">time t &gt; t_0</text>
    <text x="20" y="330">rough trial slides throughout with constant μ_k; case θ = 37° (tan 37° = 0.75), t = 2t_0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TIMING-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="60" font-weight="600">accelerations:</text>
    <text x="470" y="82">a_0 = g sin θ</text>
    <text x="470" y="104">a = g (sin θ − μ_k cos θ)</text>
    <text x="470" y="126" font-weight="600">same s from rest: s = ½ a t² in both</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TIMING-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="160" fill="#1f6fb2">a/a_0 = t_0²/t²  (s, m, g cancel)</text>
    <text x="470" y="182" font-weight="600" fill="#1f6fb2">μ_k = tan θ (1 − t_0²/t²)</text>
    <text x="470" y="204" fill="#1f6fb2">θ = 37°, t = 2t_0: μ_k = 0.75 × (1 − 1/4)</text>
    <text x="470" y="226" font-weight="600" fill="#1f6fb2">= 0.5625 ≈ 0.56</text>
  </g>
</svg>
