<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="rep-nlm-carbrake-title rep-nlm-carbrake-desc">
  <title id="rep-nlm-carbrake-title">A 1200 kg car braking from 20 m/s under road friction and air drag</title>
  <desc id="rep-nlm-carbrake-desc">Stage 1: a 1200 kg car moves forward at +20 m/s while road friction 5400 N and air drag 600 N act backward; forward is positive. Stage 2: the net force is −5400 − 600 = −6000 N. Stage 3: the acceleration is −6000 / 1200 = −5 m/s², pointing backward while the velocity points forward, and the car stops after 20 / 5 = 4 s.</desc>
  <defs>
    <marker id="rep-nlm-carbrake-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-carbrake-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CARBRAKE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A car braking on a level road</text>
    <line x1="20" y1="220" x2="520" y2="220" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="220" x2="22" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="220" x2="40" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="220" x2="58" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="220" x2="76" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="220" x2="94" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="220" x2="112" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="220" x2="130" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="220" x2="148" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="220" x2="166" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="220" x2="184" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="220" x2="202" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="220" x2="220" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="220" x2="238" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="220" x2="256" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="220" x2="274" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="220" x2="292" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="220" x2="310" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="220" x2="328" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="220" x2="346" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="220" x2="364" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="220" x2="382" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="220" x2="400" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="220" x2="418" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="444" y1="220" x2="436" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="462" y1="220" x2="454" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="480" y1="220" x2="472" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="498" y1="220" x2="490" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="516" y1="220" x2="508" y2="228" stroke="currentColor" stroke-width="1"/>
    <rect x="240" y="158" width="140" height="44" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M265 158 L285 130 L335 130 L355 158" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="270" cy="208" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="350" cy="208" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="310.0" y="186" text-anchor="middle">1200 kg</text>
    <line x1="250" y1="100" x2="380" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-carbrake-arrow)"/>
    <text x="250" y="88">v = +20 m/s</text>
    <line x1="240" y1="214" x2="60" y2="214" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-carbrake-arrow)"/>
    <text x="40" y="206">road friction 5400 N</text>
    <line x1="240" y1="150" x2="220" y2="150" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-carbrake-arrow)"/>
    <text x="150" y="140">air drag 600 N</text>
    <line x1="420" y1="60" x2="500" y2="60" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-carbrake-arrow)"/>
    <text x="420" y="50">forward = +</text>
    <text x="20" y="262">Find the net force, the acceleration and the time to stop.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARBRAKE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="560" y="80" font-weight="600">Net force</text>
    <text x="560" y="102">F_net = −5400 − 600 = −6000 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARBRAKE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="480" y1="118" x2="410" y2="118" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-carbrake-arrow-acc)"/>
    <text x="420" y="110" fill="#1f6fb2">a</text>
    <text x="560" y="150">a = −6000 / 1200 = −5 m/s²</text>
    <text x="560" y="172">a points backward, v points forward</text>
    <text x="560" y="204" font-weight="600" fill="#1f6fb2">stops after 20 / 5 = 4 s</text>
  </g>
</svg>
