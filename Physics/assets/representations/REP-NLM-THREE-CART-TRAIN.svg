<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-labelledby="rep-nlm-train-title rep-nlm-train-desc">
  <title id="rep-nlm-train-title">Three carts with a drag on the middle one: cut at each joint</title>
  <desc id="rep-nlm-train-desc">Stage 1: Three carts touch in a line on a level track, A (3 kg) at the back, then B (2 kg), then C (1 kg); a 30 N push acts on A toward the front and B's sticking wheel drags with 6 N. Stage 2: For the whole train a = (30 − 6)/6 = 4 m/s²; each joint force is found by cutting there and isolating one side. Stage 3: Isolating C gives the B–C joint force 1 × 4 = 4 N; isolating A gives 30 − N = 12, so the A–B joint carries 18 N; these are not the mass fractions 15 N and 5 N because the drag acts on B.</desc>
  <defs>
    <marker id="rep-nlm-train-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-train-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TRAIN-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Three carts in contact; a 30 N push on A; 6 N drag on B</text>
    <line x1="20" y1="200" x2="440" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="200" x2="418" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="80" y="132" width="100" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="130" y="162" text-anchor="middle">A 3 kg</text>
    <circle cx="100" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="160" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="180" y="132" width="90" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="225" y="162" text-anchor="middle">B 2 kg</text>
    <circle cx="198" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="252" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="270" y="132" width="70" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="305" y="162" text-anchor="middle">C 1 kg</text>
    <circle cx="284" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="326" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="20" y1="157" x2="76" y2="157" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-train-arrow)"/>
    <text x="20" y="147">30 N</text>
    <line x1="250" y1="226" x2="205" y2="226" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-train-arrow)"/>
    <text x="256" y="231">6 N drag on B</text>
    <text x="20" y="272">front is to the right; A and C roll freely; the carts stay in contact</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRAIN-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="60" font-weight="600">whole train:</text>
    <text x="480" y="82">a = (30 − 6)/6 = 4 m/s²</text>
    <text x="480" y="104">cut at each joint and isolate one side</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRAIN-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="180" y1="110" x2="180" y2="190" stroke="currentColor" stroke-width="2"/>
    <line x1="270" y1="110" x2="270" y2="190" stroke="currentColor" stroke-width="2"/>
    <text x="180" y="100" text-anchor="middle" fill="#1f6fb2">A–B</text>
    <text x="270" y="100" text-anchor="middle" fill="#1f6fb2">B–C</text>
    <text x="480" y="150" font-weight="600" fill="#1f6fb2">B–C: C alone: N = 1 × 4 = 4 N</text>
    <text x="480" y="172" font-weight="600" fill="#1f6fb2">A–B: A alone: 30 − N = 3 × 4, N = 18 N</text>
    <text x="480" y="194">not the mass fractions 15 N and 5 N:</text>
    <text x="480" y="216">the drag acts on the middle cart</text>
  </g>
</svg>
