<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="rep-nlm-p3trials-title rep-nlm-p3trials-desc">
  <title id="rep-nlm-p3trials-title">A 4 kg block on a rough 30° incline with a push P up the slope, in three trials</title>
  <desc id="rep-nlm-p3trials-desc">Stage 1: A 4 kg block rests on a rough fixed 30° incline with μ_s = 0.5; a force P acts up the slope parallel to the plane, in trials of 15 N, 20 N and 26 N, and the block stays at rest; g = 10 m/s². Stage 2: With up the slope positive, P − 20 + f = 0, so f = 20 − P, and its sign gives its direction; the limit is 0.5 × 34.6 ≈ 17.3 N. Stage 3: At 15 N friction is 5 N up the slope, at 20 N it is zero, and at 26 N it is 6 N down the slope; all are within 17.3 N.</desc>
  <defs>
    <marker id="rep-nlm-p3trials-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-p3trials-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-P3-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 4 kg block at rest on a rough 30° incline, pushed up the slope</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">30°</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 178.7 160.3)"><rect x="150.7 " y="143.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="178.7" y="165.3" text-anchor="middle" font-size="14">4 kg</text>
    <line x1="206.4" y1="144.3" x2="258.4" y2="114.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-p3trials-arrow)"/>
    <text x="266.4" y="108.3" text-anchor="start">P</text>
    <text x="20" y="300">μ_s = 0.5, g = 10 m/s²; trials P = 15 N, 20 N, 26 N; always at rest</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-P3-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="60" font-weight="600">along the slope, up +:</text>
    <text x="470" y="82">P − mg sin 30° + f = 0, mg sin 30° = 20 N</text>
    <text x="470" y="104">so f = 20 − P (sign gives direction)</text>
    <text x="470" y="126">limit μ_s N = 0.5 × 34.6 ≈ 17.3 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-P3-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="160" font-weight="600" fill="#1f6fb2">P = 15 N: f = 5 N up the slope</text>
    <text x="470" y="182" font-weight="600" fill="#1f6fb2">P = 20 N: f = 0</text>
    <text x="470" y="204" font-weight="600" fill="#1f6fb2">P = 26 N: f = 6 N down the slope</text>
    <text x="470" y="226">all within 17.3 N: rest is possible</text>
  </g>
</svg>
