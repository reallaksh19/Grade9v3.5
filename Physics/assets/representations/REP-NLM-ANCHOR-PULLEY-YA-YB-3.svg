<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 350" role="img" aria-labelledby="rep-nlm-anc-yayb3-title rep-nlm-anc-yayb3-desc">
  <title id="rep-nlm-anc-yayb3-title">Two bodies on a string over a fixed pulley, y_A and y_B measured from the pulley</title>
  <desc id="rep-nlm-anc-yayb3-desc">Stage 1: over a fixed pulley, y_A and y_B are measured away from the pulley along the string; A accelerates away from the pulley at 3 m/s². Stage 2: y_A + y_B stays constant, so a_A + a_B = 0. Stage 3: a_B = −3 m/s², so B accelerates toward the pulley at 3 m/s².</desc>
  <defs>
    <marker id="rep-nlm-anc-yayb3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-anc-yayb3-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ANC-YAYB3-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Two bodies on a string over a fixed pulley, y_A and y_B measured from the pulley</text>
    <line x1="200" y1="50" x2="440" y2="50" stroke="currentColor" stroke-width="3"/>
    <line x1="320" y1="50" x2="320" y2="80" stroke="currentColor" stroke-width="2"/>
    <circle cx="320" cy="120" r="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="280" y1="120" x2="280" y2="250" stroke="currentColor" stroke-width="2"/>
    <line x1="360" y1="120" x2="360" y2="190" stroke="currentColor" stroke-width="2"/>
    <rect x="250" y="250" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="280" y="280" text-anchor="middle" font-weight="600">A</text>
    <rect x="330" y="190" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="360" y="220" text-anchor="middle" font-weight="600">B</text>
    <line x1="230" y1="120" x2="230" y2="248" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-anc-yayb3-arrow)"/>
    <text x="222" y="190" text-anchor="end">y_A</text>
    <line x1="410" y1="120" x2="410" y2="188" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-anc-yayb3-arrow)"/>
    <text x="418" y="160">y_B</text>
    <line x1="200" y1="250" x2="200" y2="300" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-anc-yayb3-arrow)"/>
    <text x="192" y="285" text-anchor="end">a_A = 3 m/s² away</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ANC-YAYB3-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="80" font-weight="600">y_A + y_B stays constant,</text>
    <text x="480" y="102">so a_A + a_B = 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ANC-YAYB3-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="450" y1="240" x2="450" y2="190" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-anc-yayb3-arrow-acc)"/>
    <text x="462" y="220" font-weight="600" fill="#1f6fb2">a_B = −3 m/s²</text>
    <text x="40" y="334" fill="#1f6fb2">B accelerates toward the pulley at 3 m/s².</text>
  </g>
</svg>
