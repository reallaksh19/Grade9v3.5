<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-labelledby="rep-nlm-trolley-title rep-nlm-trolley-desc">
  <title id="rep-nlm-trolley-title">Trolley with a 9 N pull and 4 N drag, then the pull removed</title>
  <desc id="rep-nlm-trolley-desc">Stage 1: A 2.5 kg trolley on a level track is pulled forward with 9 N while a 4 N drag acts backward; forward is positive. Stage 2: With the pull, F_net = 9 − 4 = +5 N and a = +2 m/s². Stage 3: With the pull removed and the trolley still moving forward, F_net = −4 N and a = −1.6 m/s², backward while it moves forward.</desc>
  <defs>
    <marker id="rep-nlm-trolley-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-trolley-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TROLLEY-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2.5 kg trolley on a level track</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="150" y="132" width="110" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="205" y="162" text-anchor="middle">2.5 kg</text>
    <circle cx="172" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="238" cy="191" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="262" y1="157" x2="332" y2="157" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-trolley-arrow)"/>
    <text x="268" y="147">pull 9 N</text>
    <line x1="148" y1="157" x2="88" y2="157" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-trolley-arrow)"/>
    <text x="142" y="147" text-anchor="end">drag 4 N</text>
    <text x="20" y="240">forward (right) positive; drag stays 4 N back while moving forward</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TROLLEY-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="60" font-weight="600">with the pull:</text>
    <text x="460" y="82">F_net = 9 − 4 = +5 N</text>
    <text x="460" y="104" font-weight="600" fill="#1f6fb2">a = 5/2.5 = +2 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TROLLEY-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="150" font-weight="600">pull removed, still moving forward:</text>
    <text x="460" y="172">F_net = −4 N</text>
    <text x="460" y="194" font-weight="600" fill="#1f6fb2">a = −4/2.5 = −1.6 m/s²</text>
    <text x="460" y="216">backward a while moving forward</text>
  </g>
</svg>
