<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="rep-nlm-pulley16-title rep-nlm-pulley16-desc">
  <title id="rep-nlm-pulley16-title">Masses A and B on one string over a fixed pulley with y_A = 0.6 m and y_B = 1.0 m</title>
  <desc id="rep-nlm-pulley16-desc">Stage 1: a taut inextensible string over a fixed pulley holds A and B, with y_A = 0.6 m and y_B = 1.0 m measured downward from the pulley; A then rises by 0.1 m, and at one instant v_A = −0.2 m/s and a_A = +1.5 m/s² (down positive). Stage 2: the length gives y_A + y_B = 1.6 m, a constant, so v_A + v_B = 0 and a_A + a_B = 0. Stage 3: after A rises, y_A = 0.5 m and y_B = 1.6 − 0.5 = 1.1 m (dashed positions); v_B = +0.2 m/s (moving down) and a_B = −1.5 m/s² (upward).</desc>
  <defs>
    <marker id="rep-nlm-pulley16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-pulley16-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-PULLEY16-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">One taut string over a fixed pulley</text>
    <line x1="200" y1="40" x2="400" y2="40" stroke="currentColor" stroke-width="2"/>
    <line x1="210" y1="40" x2="202" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="40" x2="220" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="40" x2="238" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="40" x2="256" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="40" x2="274" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="40" x2="292" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="40" x2="310" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="40" x2="328" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="40" x2="346" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="40" x2="364" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="40" x2="382" y2="32" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="40" x2="300" y2="80" stroke="currentColor" stroke-width="2"/>
    <circle cx="300" cy="80" r="30" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="270" y1="80" x2="270" y2="200" stroke="currentColor" stroke-width="1.5"/>
    <line x1="330" y1="80" x2="330" y2="280" stroke="currentColor" stroke-width="1.5"/>
    <rect x="250" y="200" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="270" y="225" text-anchor="middle">A</text>
    <rect x="310" y="280" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="330" y="305" text-anchor="middle">B</text>
    <line x1="200" y1="80" x2="240" y2="80" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="220" y1="80" x2="220" y2="198" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-pulley16-arrow)"/>
    <text x="212" y="145" text-anchor="end">y_A = 0.6 m</text>
    <line x1="360" y1="80" x2="400" y2="80" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="380" y1="80" x2="380" y2="278" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-pulley16-arrow)"/>
    <text x="390" y="185">y_B = 1.0 m</text>
    <text x="510" y="60">y measured downward from the pulley</text>
    <text x="510" y="82">(down positive)</text>
    <text x="510" y="104">A rises by 0.1 m: find y_B</text>
    <text x="510" y="126">instant: v_A = −0.2 m/s, a_A = +1.5 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PULLEY16-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="510" y="170" font-weight="600">y_A + y_B = 1.6 m, constant</text>
    <text x="510" y="192">so v_A + v_B = 0 and a_A + a_B = 0</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-PULLEY16-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="250" y="180" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="310" y="300" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="510" y="240" fill="#1f6fb2">y_A = 0.5 m, so y_B = 1.6 − 0.5 = 1.1 m</text>
    <text x="510" y="262" fill="#1f6fb2">v_B = +0.2 m/s (moving down)</text>
    <text x="510" y="284" fill="#1f6fb2">a_B = −1.5 m/s² (1.5 m/s² upward)</text>
  </g>
</svg>
