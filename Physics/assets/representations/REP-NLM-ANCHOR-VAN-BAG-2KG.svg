  <title id="rep-nlm-anc-vanbag-title">A 2 kg bag on the floor of a van accelerating forward at 3 m/s²</title>
  <desc id="rep-nlm-anc-vanbag-desc">Stage 1: a 2 kg bag sits on the floor of a van that accelerates forward at 3 m/s². Stage 2: an observer riding in the van assigns the bag F_pseudo = −m a_frame = −2 × 3 = −6 N, that is 6 N backward. Stage 3: the pseudo-force is used only in the van's description and is never paired with a physical force.</desc>
