<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="rep-kin-bball-title rep-kin-bball-desc">
  <title id="rep-kin-bball-title">A basketball released 2 m above the floor with u_x = 6 m/s and u_y = 8 m/s</title>
  <desc id="rep-kin-bball-desc">Stage 1: a basketball leaves a player's hands 2 m above the floor with components u_x = 6 m/s and u_y = 8 m/s; the origin is on the floor directly below the release point, +y is up, g = 10 m/s² and air resistance is negligible. Stage 2: only gravity acts, so a = (0, −10) m/s², x = 6t, y = 2 + 8t − 5t², v_x = 6 and v_y = 8 − 10t. Stage 3: at t = 0.5 s the ball is at (3, 4.75) m moving with (6 i + 3 j) m/s; v_y &gt; 0, so it is still rising.</desc>
  <defs>
    <marker id="rep-kin-bball-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-bball-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
