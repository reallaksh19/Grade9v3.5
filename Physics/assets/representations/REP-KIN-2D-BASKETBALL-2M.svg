    <text x="500" y="272" fill="#1f6fb2">position (3, 4.75) m</text>
    <text x="500" y="294" fill="#1f6fb2">velocity (6 i + 3 j) m/s</text>
    <text x="500" y="316" fill="#1f6fb2">v_y &gt; 0: still rising</text>
  </g>
</svg>
