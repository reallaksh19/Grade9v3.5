    <text x="20" y="372">origin on the floor directly below the release point</text>
    <text x="500" y="60">g = 10 m/s²; air resistance negligible</text>
    <text x="500" y="82">Find the position and velocity</text>
    <text x="500" y="104">at t = 0.5 s.</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-BBALL-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="500" y="140" font-weight="600">Model and equations</text>
    <text x="500" y="162">only gravity acts: a = (0, −10) m/s²</text>
    <text x="500" y="184">x = 6t, y = 2 + 8t − 5t²</text>
    <text x="500" y="206">v_x = 6, v_y = 8 − 10t</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-BBALL-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M110 240 L140 202.5 L170 170 L200 142.5 L230 120 L260 102.5" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
