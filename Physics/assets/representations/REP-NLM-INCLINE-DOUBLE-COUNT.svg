<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="rep-nlm-fbdtriple-title rep-nlm-fbdtriple-desc">
  <title id="rep-nlm-fbdtriple-title">A student's free-body diagram of a block sliding down a smooth incline</title>
  <desc id="rep-nlm-fbdtriple-desc">Stage 1: A block slides down a smooth fixed incline; a student draws mg vertically down, mg sin θ down the plane and mg cos θ into the plane on the same diagram; the only interactions are gravity and the plane's normal contact. Stage 2: The three arrows describe one physical force, gravity, so the weight is drawn three times: once as mg and again as its two components. Stage 3: In plane-aligned equations the weight is represented either by mg or by its components mg sin θ down the plane and mg cos θ into the plane, never both, alongside the normal force N.</desc>
  <defs>
    <marker id="rep-nlm-fbdtriple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-fbdtriple-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-FBDTRIPLE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A student's free-body diagram of a block sliding down a smooth incline</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">θ</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 204.7 145.3)"><rect x="176.7 " y="128.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <line x1="204.7" y1="145.3" x2="204.7" y2="215.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-fbdtriple-arrow)"/>
    <text x="212.7" y="221.3">mg</text>
    <line x1="204.7" y1="145.3" x2="152.7" y2="175.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-fbdtriple-arrow)"/>
    <text x="144.7" y="191.3" text-anchor="end">mg sin θ</text>
    <line x1="204.7" y1="145.3" x2="229.7" y2="188.6" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-fbdtriple-arrow)"/>
    <text x="237.7" y="206.6">mg cos θ</text>
    <text x="20" y="310">interactions: Earth on block (gravity), plane on block (normal)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FBDTRIPLE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <ellipse cx="204.7" cy="175.3" rx="90" ry="60" fill="none" stroke="#1f6fb2" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="200" y="286" text-anchor="middle" font-weight="600" fill="#1f6fb2">one force drawn three times ✗</text>
    <text x="440" y="60" font-weight="600" fill="#1f6fb2">diagnosis:</text>
    <text x="440" y="82" fill="#1f6fb2">three downward-related arrows,</text>
    <text x="440" y="104" fill="#1f6fb2">but gravity is one force</text>
    <text x="440" y="126" font-weight="600" fill="#1f6fb2">the weight is drawn three times:</text>
    <text x="440" y="148" fill="#1f6fb2">once as mg, again as its two components</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FBDTRIPLE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="440" y="180" font-weight="600">in plane-aligned equations use</text>
    <text x="440" y="202">either mg, or its components</text>
    <text x="440" y="224">mg sin θ (down the plane) and</text>
    <text x="440" y="246">mg cos θ (into the plane), never both;</text>
    <text x="440" y="268">plus the normal force N</text>
  </g>
</svg>
