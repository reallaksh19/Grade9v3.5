<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 310" role="img" aria-labelledby="rep-nlm-heavyrope-title rep-nlm-heavyrope-desc">
  <title id="rep-nlm-heavyrope-title">Block on a heavy rope: tension grows toward the top</title>
  <desc id="rep-nlm-heavyrope-desc">Stage 1: A 2 kg block hangs from the lower end of a uniform rope of mass 1 kg; a hand pulls the top so that rope and block accelerate upward at 2 m/s²; g = 10 m/s², up positive. Stage 2: One T needs a massless string; this rope's own mass must also be accelerated, so the pull grows toward the top: tension at a point = mass below × (g + a) = 12 N per kg. Stage 3: The tension is 24 N at the bottom, 30 N at the middle and 36 N at the top.</desc>
  <defs>
    <marker id="rep-nlm-heavyrope-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-heavyrope-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-HEAVYROPE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2 kg block on a uniform 1 kg rope, pulled up by a hand</text>
    <path d="M150 70 q-12 -18 10 -22 q20 2 12 22 z" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="180" y="58">hand</text>
    <line x1="160" y1="72" x2="160" y2="220" stroke="currentColor" stroke-width="6"/>
    <text x="172" y="150">rope 1 kg (uniform)</text>
    <rect x="130" y="220" width="60" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="160" y="245" text-anchor="middle">2 kg</text>
    <line x1="230" y1="250" x2="230" y2="200" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-heavyrope-arrow)"/>
    <text x="238" y="214">a = 2 m/s² up</text>
    <text x="20" y="300">g = 10 m/s², up positive</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HEAVYROPE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="126" y="76" text-anchor="end">top</text>
    <text x="126" y="150" text-anchor="end">middle</text>
    <text x="126" y="222" text-anchor="end">bottom</text>
    <text x="470" y="60" font-weight="600">one T needs a massless string:</text>
    <text x="470" y="82">this rope's mass must be accelerated too,</text>
    <text x="470" y="104">so the pull grows toward the top</text>
    <text x="470" y="126">T(point) = (mass below) × (g + a) = 12 N/kg</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-HEAVYROPE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="170" font-weight="600" fill="#1f6fb2">bottom: 2 kg below → 24 N</text>
    <text x="470" y="192" font-weight="600" fill="#1f6fb2">middle: 2.5 kg below → 30 N</text>
    <text x="470" y="214" font-weight="600" fill="#1f6fb2">top: 3 kg below → 36 N</text>
  </g>
</svg>
