<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="rep-nlm-topF-title rep-nlm-topF-desc">
  <title id="rep-nlm-topF-title">2 kg on 4 kg with F on the upper block: friction must drive the lower one</title>
  <desc id="rep-nlm-topF-desc">Stage 1: A 2 kg block rests on a 4 kg block on a smooth floor; a horizontal force F acts on the upper block; between the blocks μ_s = 0.3 and μ_k = 0.2; g = 10 m/s². Stage 2: Moving together a = F/6 and the lower block needs friction 4a = 2F/3, at most 0.3 × 20 = 6 N, so F_max = 9 N. Stage 3: At 12 N the blocks slip: kinetic friction 4 N acts backward on the upper block and forward on the lower one, so a_upper = 4 m/s² and a_lower = 1 m/s².</desc>
  <defs>
    <marker id="rep-nlm-topF-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-topF-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TOPF-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2 kg block on a 4 kg block; F acts on the upper block</text>
    <line x1="20" y1="220" x2="420" y2="220" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="220" x2="22" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="220" x2="40" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="220" x2="58" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="220" x2="76" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="220" x2="94" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="220" x2="112" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="220" x2="130" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="220" x2="148" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="220" x2="166" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="220" x2="184" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="220" x2="202" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="220" x2="220" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="220" x2="238" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="220" x2="256" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="220" x2="274" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="220" x2="292" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="220" x2="310" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="220" x2="328" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="220" x2="346" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="220" x2="364" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="220" x2="382" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="220" x2="400" y2="228" stroke="currentColor" stroke-width="1"/>
    <rect x="100" y="160" width="220" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="195" text-anchor="middle">4 kg</text>
    <rect x="170" y="110" width="80" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="140" text-anchor="middle">2 kg</text>
    <line x1="252" y1="135" x2="322" y2="135" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-topF-arrow)"/>
    <text x="328" y="140">F</text>
    <text x="20" y="60">between blocks: μ_s = 0.3, μ_k = 0.2</text>
    <text x="20" y="260">smooth floor; g = 10 m/s²; cases: largest F together, and F = 12 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TOPF-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="210" y1="164" x2="260" y2="164" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-topF-arrow-acc)"/>
    <text x="262" y="184" fill="#1f6fb2">f on 4 kg</text>
    <text x="480" y="60" font-weight="600">together: a = F/6</text>
    <text x="480" y="82">lower block needs friction 4a = 2F/3</text>
    <text x="480" y="104">limit 0.3 × 20 = 6 N</text>
    <text x="480" y="126" font-weight="600" fill="#1f6fb2">F_max = 9 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TOPF-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="480" y="160" font-weight="600" fill="#1f6fb2">F = 12 N &gt; 9 N: the blocks slip</text>
    <text x="480" y="182" fill="#1f6fb2">kinetic 4 N: back on upper, forward on lower</text>
    <text x="480" y="204" font-weight="600" fill="#1f6fb2">a_upper = (12 − 4)/2 = 4 m/s²</text>
    <text x="480" y="226" font-weight="600" fill="#1f6fb2">a_lower = 4/4 = 1 m/s²</text>
  </g>
</svg>
