<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" role="img" aria-labelledby="rep-nlm-ramp70-title rep-nlm-ramp70-desc">
  <title id="rep-nlm-ramp70-title">Crate on a smooth 30° ramp pulled by 70 N: axes along and across the contact</title>
  <desc id="rep-nlm-ramp70-desc">Stage 1: A 10 kg crate on a smooth fixed ramp inclined at 30° is pulled by a rope parallel to the ramp with 70 N; g = 10 m/s². Stage 2: The forces on the crate are its 100 N weight, the normal force N and the 70 N tension; along the ramp 70 − 100 sin 30° = 10a, across it N − 100 cos 30° = 0 because the fixed contact gives a_perp = 0. Stage 3: a = 20/10 = 2 m/s² up the ramp, N ≈ 86.6 N, and a 50 N pull would give zero acceleration.</desc>
  <defs>
    <marker id="rep-nlm-ramp70-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-ramp70-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-RAMP70-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 10 kg crate pulled up a smooth 30° ramp</text>
    <polygon points="40,270 370,270 370,79.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="262" text-anchor="middle" font-size="14">30°</text>
    <path d="M70 270 A30 30 0 0 0 66 255" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 178.7 170.3)"><rect x="150.7 " y="153.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="178.7" y="175.3" text-anchor="middle" font-size="14">10 kg</text>
    <line x1="204.7" y1="155.3" x2="274" y2="115.3" stroke="currentColor" stroke-width="2"/>
    <text x="281.7" y="114.3">rope, 70 N</text>
    <text x="20" y="310">rope parallel to the ramp; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-RAMP70-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="178.7" y1="170.3" x2="178.7" y2="240.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-ramp70-arrow)"/>
    <text x="186.7" y="246.3">mg = 100 N</text>
    <line x1="169.7" y1="154.7" x2="139.7" y2="102.7" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-ramp70-arrow)"/>
    <text x="131.7" y="96.7" text-anchor="end">N</text>
    <line x1="204.7" y1="155.3" x2="256.7" y2="125.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-ramp70-arrow)"/>
    <text x="264.7" y="147.3">T = 70 N</text>
    <line x1="178.7" y1="170.3" x2="109.4" y2="210.3" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <line x1="178.7" y1="170.3" x2="208.7" y2="222.2" stroke="currentColor" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="440" y="60" font-weight="600">axes along / across the ramp</text>
    <text x="440" y="82">along (up +): 70 − 100 sin 30° = 10a</text>
    <text x="440" y="104">across: N − 100 cos 30° = 0</text>
    <text x="440" y="126">(fixed contact: a_perp = 0)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-RAMP70-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="440" y="170" font-weight="600" fill="#1f6fb2">a = 20/10 = 2 m/s² up the ramp</text>
    <text x="440" y="192" fill="#1f6fb2">N = 100 cos 30° ≈ 86.6 N</text>
    <text x="440" y="214">a = 0 needs a pull of 50 N</text>
  </g>
</svg>
