    <text x="235" y="130">child 50 kg</text>
    <text x="20" y="330">Everything is at rest; g = 10 m/s².</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CHILDBOX-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="130" y="190" width="160" height="110" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="470" y="40" font-weight="600">chosen body: the box</text>
    <text x="470" y="62">every arrow answers 'who acts on the box?'</text>
    <text x="470" y="84">agents: Earth, the child, the floor</text>
  </g>
