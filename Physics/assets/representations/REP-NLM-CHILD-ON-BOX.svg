    <line x1="640" y1="220" x2="640" y2="280" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-childbox-arrow)"/>
    <text x="650" y="276">Earth on box 200 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CHILDBOX-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="440" y="320" font-weight="600" fill="#1f6fb2">The child's 500 N weight acts on the child,</text>
    <text x="440" y="342" font-weight="600" fill="#1f6fb2">not on the box.</text>
  </g>
</svg>
