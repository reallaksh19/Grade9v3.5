<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="rep-nlm-childbox-title rep-nlm-childbox-desc">
  <title id="rep-nlm-childbox-title">A 50 kg child standing on a 20 kg box that rests on the floor</title>
  <desc id="rep-nlm-childbox-desc">Stage 1: a 50 kg child stands on a 20 kg box resting on the floor; everything is at rest and g = 10 m/s². Stage 2: the box is the chosen body; its agents are Earth, the child and the floor. Stage 3: on the box act its weight 200 N down (Earth), the child's push 500 N down (child) and the floor's push 700 N up (floor). Stage 4: the child's own 500 N weight acts on the child and does not belong on the box's diagram.</desc>
  <defs>
    <marker id="rep-nlm-childbox-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-childbox-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
