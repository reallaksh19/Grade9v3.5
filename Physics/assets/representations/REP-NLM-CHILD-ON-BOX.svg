    <text x="592" y="120" text-anchor="end">floor on box 700 N</text>
    <line x1="680" y1="110" x2="680" y2="158" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-childbox-arrow)"/>
    <text x="690" y="124">child on box</text>
