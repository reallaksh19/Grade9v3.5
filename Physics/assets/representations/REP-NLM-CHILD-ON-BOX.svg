    <text x="20" y="26" font-weight="600">A child standing on a box that rests on the floor</text>
    <line x1="20" y1="290" x2="420" y2="290" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="290" x2="22" y2="298" stroke="currentColor" stroke-width="1"/>
