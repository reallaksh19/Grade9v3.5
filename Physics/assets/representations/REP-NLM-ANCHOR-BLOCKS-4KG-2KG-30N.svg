  <title id="rep-nlm-anc-blocks42-title">A 30 N push on a 4 kg block pressing on a 2 kg block, on a smooth floor</title>
  <desc id="rep-nlm-anc-blocks42-desc">Stage 1: a 30 N push moves a 4 kg block and a 2 kg block together across a smooth floor, the first pressing on the second. Stage 2: the maintained contact fixes their separation, so both blocks share one acceleration. Stage 3: a = 30/(4 + 2) = 5 m/s² for both blocks.</desc>
