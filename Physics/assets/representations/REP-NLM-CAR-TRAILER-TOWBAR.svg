<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" role="img" aria-labelledby="rep-nlm-towbar-title rep-nlm-towbar-desc">
  <title id="rep-nlm-towbar-title">A 1000 kg car towing a 500 kg trailer with a rigid bar and a 3000 N driving force</title>
  <desc id="rep-nlm-towbar-desc">Stage 1: a 1000 kg car tows a 500 kg trailer with a light rigid tow bar on a level road; the road pushes the car's drive wheels forward with 3000 N and resistance is ignored. Stage 2: the bar keeps the separation fixed, so both share one acceleration a; the bar pulls the trailer forward with T and the car backward with T, giving 3000 − T = 1000 a for the car and T = 500 a for the trailer. Stage 3: a = 2 m/s² and T = 1000 N; check with the car: 3000 − 1000 = 2000 = 1000 × 2.</desc>
  <defs>
    <marker id="rep-nlm-towbar-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-towbar-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
