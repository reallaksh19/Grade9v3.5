    <text x="330" y="330">T</text>
    <line x1="510" y1="340" x2="610" y2="340" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-towbar-arrow)"/>
    <text x="520" y="330">3000 N</text>
    <text x="20" y="392">Car: 3000 − T = 1000 a</text>
    <text x="300" y="392">Trailer: T = 500 a</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TOWBAR-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="420" font-weight="600" fill="#1f6fb2">a = 2 m/s², T = 1000 N; check: 3000 − 1000 = 2000 = 1000 × 2</text>
