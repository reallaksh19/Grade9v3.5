  <g data-g9-stage-id="VIS-NLM-TOWBAR-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="300" font-weight="600">One acceleration a for both (the bar keeps the separation fixed).</text>
    <rect x="80" y="320" width="110" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
