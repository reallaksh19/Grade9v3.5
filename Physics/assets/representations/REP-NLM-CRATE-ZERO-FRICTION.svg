<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="rep-nlm-crate0-title rep-nlm-crate0-desc">
  <title id="rep-nlm-crate0-title">A crate at rest on a rough floor with no horizontal force</title>
  <desc id="rep-nlm-crate0-desc">Stage 1: A crate rests on a rough horizontal floor; no horizontal force acts on it and there is no tendency to slide. Stage 2: Only the weight and the floor's normal force act; nothing acts along the floor, and with the floor imagined slippery the crate would not slide. Stage 3: The friction force is zero: a rough floor does not by itself make friction act.</desc>
  <defs>
    <marker id="rep-nlm-crate0-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-crate0-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CRATE0-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A crate at rest on a rough horizontal floor</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="160" y="130" width="90" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="205" y="170" text-anchor="middle">crate</text>
    <text x="20" y="275">no horizontal force acts; no tendency to slide</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE0-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="193" y1="130" x2="193" y2="86" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate0-arrow)"/>
    <text x="201" y="100">N (floor on crate)</text>
    <line x1="217" y1="200" x2="217" y2="244" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-crate0-arrow)"/>
    <text x="225" y="240">weight (Earth on crate)</text>
    <text x="470" y="60" font-weight="600">forces on the crate:</text>
    <text x="470" y="82">weight down, floor's normal up</text>
    <text x="470" y="104">nothing along the floor</text>
    <text x="470" y="126">slippery-floor test: no slide</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CRATE0-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="160" font-weight="600" fill="#1f6fb2">friction force = 0</text>
    <text x="470" y="182">a rough floor does not by itself</text>
    <text x="470" y="204">make friction act</text>
  </g>
</svg>
