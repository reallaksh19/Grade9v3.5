<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" role="img" aria-labelledby="rep-nlm-trainball-title rep-nlm-trainball-desc">
  <title id="rep-nlm-trainball-title">A 0.5 kg ball on the smooth floor of a train braking at 2 m/s²</title>
  <desc id="rep-nlm-trainball-desc">Stage 1: a 0.5 kg ball rests on the frictionless floor of a train moving forward; the train brakes, so its acceleration is 2 m/s² backward. Stage 2: from the platform no horizontal force acts on the ball, so it keeps its speed while the train slows under it. Stage 3: from inside the train the ball accelerates forward at 2 m/s², explained by a pseudo-force of 0.5 × 2 = 1 N forward; no physical force has been added.</desc>
  <defs>
    <marker id="rep-nlm-trainball-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-trainball-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-TRAINBALL-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A ball on the smooth floor of a braking train</text>
    <line x1="20" y1="260" x2="500" y2="260" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="260" x2="22" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="260" x2="40" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="260" x2="58" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="260" x2="76" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="260" x2="94" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="260" x2="112" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="260" x2="130" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="260" x2="148" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="260" x2="166" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="260" x2="184" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="260" x2="202" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="260" x2="220" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="260" x2="238" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="260" x2="256" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="260" x2="274" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="260" x2="292" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="260" x2="310" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="260" x2="328" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="260" x2="346" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="260" x2="364" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="260" x2="382" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="260" x2="400" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="260" x2="418" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="444" y1="260" x2="436" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="462" y1="260" x2="454" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="480" y1="260" x2="472" y2="268" stroke="currentColor" stroke-width="1"/>
    <line x1="498" y1="260" x2="490" y2="268" stroke="currentColor" stroke-width="1"/>
    <rect x="60" y="120" width="400" height="110" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="110" cy="245" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="410" cy="245" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="260" cy="216" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="200" y="190">ball 0.5 kg, smooth floor</text>
    <line x1="80" y1="100" x2="200" y2="100" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-trainball-arrow)"/>
    <text x="80" y="88">train's velocity (forward)</text>
    <line x1="440" y1="75" x2="360" y2="75" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-trainball-arrow)"/>
    <text x="180" y="60">acceleration 2 m/s² backward (braking)</text>
    <text x="20" y="290">Describe the ball from the platform, then from inside the train.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRAINBALL-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="530" y="60" font-weight="600">From the platform</text>
    <text x="530" y="82">no horizontal force acts on the ball,</text>
    <text x="530" y="104">so it keeps its speed;</text>
    <text x="530" y="126">the train slows under it</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-TRAINBALL-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="276" y1="216" x2="340" y2="216" stroke="#1f6fb2" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rep-nlm-trainball-arrow-acc)"/>
    <text x="290" y="150" fill="#1f6fb2">pseudo-force 1 N</text>
    <text x="290" y="170" fill="#1f6fb2">(train frame only)</text>
    <text x="530" y="170" font-weight="600">From inside the train</text>
    <text x="530" y="192">the ball accelerates forward at 2 m/s²</text>
    <text x="530" y="214">pseudo-force = 0.5 × 2 = 1 N,</text>
    <text x="530" y="236">forward</text>
    <text x="530" y="266" font-weight="600" fill="#1f6fb2">No physical force has been added.</text>
  </g>
</svg>
