<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" role="img" aria-labelledby="rep-nlm-box4-title rep-nlm-box4-desc">
  <title id="rep-nlm-box4-title">4 kg box pulled with 15 N and 25 N: compare the need with μ_s N first</title>
  <desc id="rep-nlm-box4-desc">Stage 1: A 4 kg box rests on a rough horizontal floor with μ_s = 0.5 and μ_k = 0.4; a horizontal pull of 15 N is applied, and in a second trial 25 N; g = 10 m/s². Stage 2: In both trials N = mg = 40 N, so the static limit is μ_s N = 20 N, and the friction rest would need equals the pull. Stage 3: At 15 N the need is within 20 N, so the box stays at rest with 15 N of static friction; at 25 N it slides, kinetic friction is 0.4 × 40 = 16 N and a = (25 − 16)/4 = 2.25 m/s².</desc>
  <defs>
    <marker id="rep-nlm-box4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-box4-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BOX4-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">4 kg box on a rough floor: μ_s = 0.5, μ_k = 0.4</text>
    <text x="115" y="70" text-anchor="middle">trial 1</text>
    <text x="325" y="70" text-anchor="middle">trial 2</text>
    <line x1="20" y1="200" x2="210" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="70" y="150" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="100" y="180" text-anchor="middle">4 kg</text>
    <line x1="130" y1="175" x2="190" y2="175" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-box4-arrow)"/>
    <text x="132" y="165">15 N</text>
    <line x1="230" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="240" y1="200" x2="232" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="258" y1="200" x2="250" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="276" y1="200" x2="268" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="294" y1="200" x2="286" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="312" y1="200" x2="304" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="330" y1="200" x2="322" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="348" y1="200" x2="340" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="366" y1="200" x2="358" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="384" y1="200" x2="376" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="402" y1="200" x2="394" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="280" y="150" width="60" height="50" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="310" y="180" text-anchor="middle">4 kg</text>
    <line x1="340" y1="175" x2="400" y2="175" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-box4-arrow)"/>
    <text x="342" y="165">25 N</text>
    <text x="20" y="250">horizontal pull; box starts at rest; g = 10 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOX4-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="60" font-weight="600">both trials:</text>
    <text x="460" y="82">N = mg = 40 N</text>
    <text x="460" y="104">limit μ_s N = 0.5 × 40 = 20 N</text>
    <text x="460" y="126">need for rest = the pull</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOX4-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="70" y1="185" x2="25" y2="185" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-box4-arrow-acc)"/>
    <line x1="280" y1="185" x2="240" y2="185" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-box4-arrow-acc)"/>
    <text x="100" y="230" text-anchor="middle" fill="#1f6fb2">15 N ≤ 20 N: rest</text>
    <text x="330" y="230" text-anchor="middle" fill="#1f6fb2">25 N &gt; 20 N: slides</text>
    <text x="460" y="170" font-weight="600" fill="#1f6fb2">trial 1: static f = 15 N, a = 0</text>
    <text x="460" y="192" font-weight="600" fill="#1f6fb2">trial 2: kinetic f = 0.4 × 40 = 16 N</text>
    <text x="460" y="214" fill="#1f6fb2">a = (25 − 16)/4 = 2.25 m/s²</text>
    <text x="460" y="236">μ N is the friction value only at</text>
    <text x="460" y="258">impending slip or while sliding</text>
  </g>
</svg>
