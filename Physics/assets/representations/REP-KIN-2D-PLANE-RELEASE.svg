<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="rep-kin-plane-title rep-kin-plane-desc">
  <title id="rep-kin-plane-title">A package released 80 m up from a plane flying level at 50 m/s</title>
  <desc id="rep-kin-plane-desc">Stage 1: a plane flying horizontally at a steady 50 m/s releases a package 80 m above level ground; the ground frame has its origin O on the ground directly below the release, +x in the plane's direction of travel and +y up. Stage 2: after release only gravity acts on the package, because the thrust acts on the plane and air resistance is negligible, so a = (0, −10) m/s². Stage 3: the projectile model starts at the release with the package's own velocity, u = (50, 0) m/s in the ground frame, and its path curves forward; a straight-down drop from u = 0 is marked rejected. Stage 4: −80 = −5t² gives t = 4 s, the package lands x = 50 × 4 = 200 m ahead with velocity (50 i − 40 j) m/s, and the plane, also 200 m ahead, is directly above it, 80 m up.</desc>
  <defs>
    <marker id="rep-kin-plane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-plane-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-PLANE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A plane at a steady 50 m/s releases a package 80 m up</text>
    <line x1="20" y1="320" x2="560" y2="320" stroke="currentColor" stroke-width="2"/>
    <path d="M80 138 H142 L152 144 L142 150 H80 Z M110 138 L98 120 H106 L124 138 Z M80 138 L74 126 H82 L90 138 Z" fill="currentColor"/>
    <line x1="160" y1="144" x2="210" y2="144" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-plane-arrow)"/>
    <text x="216" y="149">50 m/s</text>
    <rect x="114" y="155" width="12" height="10" fill="currentColor"/>
    <text x="132" y="210">package at release</text>
    <path d="M88 160 H80 V320 H88" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="74" y="245" text-anchor="end">80 m</text>
    <line x1="120" y1="320" x2="180" y2="320" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-plane-arrow)"/>
    <line x1="120" y1="320" x2="120" y2="280" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-plane-arrow)"/>
    <text x="184" y="340">+x</text>
    <text x="126" y="278">+y</text>
    <text x="120" y="342" text-anchor="middle">O</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-PLANE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="720" y="60" font-weight="600">on the package after release:</text>
    <text x="720" y="82">gravity only</text>
    <text x="720" y="104">(thrust acts on the plane;</text>
    <text x="720" y="126">air resistance negligible)</text>
    <text x="720" y="148">a = (0, −10) m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-PLANE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <path d="M120 160 Q320 160 520 320" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="120" y1="160" x2="170" y2="160" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-plane-arrow-acc)"/>
    <text x="280" y="162" font-weight="600" fill="#1f6fb2">u = (50, 0) m/s</text>
    <line x1="120" y1="168" x2="120" y2="320" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="128" y="250">u = 0 (straight down): rejected ✗</text>
    <text x="720" y="190" font-weight="600" fill="#1f6fb2">model starts at release with</text>
    <text x="720" y="212" font-weight="600" fill="#1f6fb2">the package's own velocity</text>
    <text x="720" y="234" fill="#1f6fb2">u = (50, 0) m/s (ground frame)</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-PLANE-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <circle cx="520" cy="320" r="7" fill="#1f6fb2"/>
    <path d="M480 138 H542 L552 144 L542 150 H480 Z M510 138 L498 120 H506 L524 138 Z M480 138 L474 126 H482 L490 138 Z" fill="currentColor"/>
    <text x="514" y="116" text-anchor="middle">plane after 4 s: directly above</text>
    <line x1="530" y1="270" x2="570" y2="302" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-kin-plane-arrow-acc)"/>
    <text x="576" y="298" fill="#1f6fb2">(50 i − 40 j) m/s</text>
    <path d="M120 352 V360 H520 V352" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="320" y="380" text-anchor="middle" font-weight="600" fill="#1f6fb2">200 m ahead after 4 s</text>
    <text x="720" y="276">−80 = −5t²: t = 4 s</text>
    <text x="720" y="298">x = 50 × 4 = 200 m</text>
    <text x="720" y="320">plane: 50 × 4 = 200 m, 80 m up</text>
  </g>
</svg>
