<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" aria-label="Single-path circuit diagram"><title>Single-path circuit</title><desc>A single-loop circuit with one battery, one resistor component, and two ammeter positions before and after the component.</desc><rect x="10" y="40" width="40" height="20" fill="none" stroke="#333" stroke-width="2"/><text x="30" y="55" text-anchor="middle" font-size="8">Battery</text><line x1="50" y1="50" x2="80" y2="50" stroke="#333" stroke-width="2"/><circle cx="85" cy="50" r="5" fill="none" stroke="#333" stroke-width="2"/><text x="85" y="40" text-anchor="middle" font-size="6">A1</text><line x1="90" y1="50" x2="110" y2="50" stroke="#333" stroke-width="2"/><rect x="110" y="40" width="30" height="20" fill="none" stroke="#333" stroke-width="2"/><text x="125" y="55" text-anchor="middle" font-size="8">R</text><line x1="140" y1="50" x2="160" y2="50" stroke="#333" stroke-width="2"/><circle cx="165" cy="50" r="5" fill="none" stroke="#333" stroke-width="2"/><text x="165" y="40" text-anchor="middle" font-size="6">A2</text><line x1="170" y1="50" x2="190" y2="50" stroke="#333" stroke-width="2"/><line x1="190" y1="50" x2="190" y2="20" stroke="#333" stroke-width="2"/><line x1="190" y1="20" x2="10" y2="20" stroke="#333" stroke-width="2"/><line x1="10" y1="20" x2="10" y2="40" stroke="#333" stroke-width="2"/></svg>