<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-labelledby="rep-nlm-liftscale-title rep-nlm-liftscale-desc">
  <title id="rep-nlm-liftscale-title">A 60 kg person on a scale in a lift accelerating upward at 2 m/s²</title>
  <desc id="rep-nlm-liftscale-desc">Stage 1: a 60 kg person stands on a scale in a lift accelerating upward at 2 m/s²; g = 10 m/s² and up is positive. Stage 2: in the ground frame the forces are the scale's push N up and the 600 N weight down, and N − 600 = 60 × 2 gives N = 720 N. Stage 3: in the lift frame the person is at rest and a pseudo-force −m a_frame = −120 N is added, so N − 600 − 120 = 0 and N = 720 N. Stage 4: both frames give the same 720 N scale reading.</desc>
  <defs>
    <marker id="rep-nlm-liftscale-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-liftscale-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-LIFTSCALE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A person on a scale in a lift accelerating upward</text>
    <rect x="60" y="50" width="220" height="290" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="130" y="322" width="80" height="18" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="170" y="336" text-anchor="middle">scale</text>
    <circle cx="170" cy="221" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="170" y1="230" x2="170" y2="294" stroke="currentColor" stroke-width="2"/>
    <line x1="170" y1="294" x2="160" y2="322" stroke="currentColor" stroke-width="2"/>
    <line x1="170" y1="294" x2="180" y2="322" stroke="currentColor" stroke-width="2"/>
    <line x1="156" y1="244" x2="184" y2="244" stroke="currentColor" stroke-width="2"/>
    <text x="195" y="230">60 kg</text>
    <line x1="305" y1="260" x2="305" y2="160" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftscale-arrow)"/>
    <text x="290" y="285">a = 2 m/s² up</text>
    <text x="20" y="370">g = 10 m/s²; up is positive.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTSCALE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <circle cx="420" cy="170" r="6" fill="currentColor" stroke="currentColor" stroke-width="2"/>
    <line x1="420" y1="170" x2="420" y2="80" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftscale-arrow)"/>
    <text x="430" y="90">N (scale on person)</text>
    <line x1="420" y1="170" x2="420" y2="250" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-liftscale-arrow)"/>
    <text x="430" y="246">weight 600 N (Earth)</text>
    <text x="610" y="60" font-weight="600">Ground frame</text>
    <text x="610" y="84">N − 600 = 60 × 2</text>
    <text x="610" y="106">N = 720 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTSCALE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="395" y1="170" x2="395" y2="230" stroke="#1f6fb2" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#rep-nlm-liftscale-arrow-acc)"/>
    <text x="360" y="320" fill="#1f6fb2">pseudo-force 120 N</text>
    <text x="360" y="340" fill="#1f6fb2">(lift frame only)</text>
    <text x="610" y="150" font-weight="600">Lift frame</text>
    <text x="610" y="174">person at rest; add</text>
    <text x="610" y="196">−m a_frame = −120 N</text>
    <text x="610" y="218">N − 600 − 120 = 0,</text>
    <text x="610" y="240">so N = 720 N</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LIFTSCALE-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="610" y="300" font-weight="600" fill="#1f6fb2">Both frames: the scale</text>
    <text x="610" y="322" font-weight="600" fill="#1f6fb2">reads 720 N</text>
  </g>
</svg>
