<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-labelledby="rep-kin-ancv5-title rep-kin-ancv5-desc">
  <title id="rep-kin-ancv5-title">Initial velocity u = (1, 2) m/s with constant acceleration a = (2, −2) m/s²</title>
  <desc id="rep-kin-ancv5-desc">Stage 1: an initial velocity u = (1, 2) m/s and a constant acceleration a = (2, −2) m/s² are drawn in one x-y frame. Stage 2: each axis is updated on the same clock to t = 2 s: v_x = 1 + 2 × 2 = 5 m/s and v_y = 2 − 2 × 2 = −2 m/s. Stage 3: the two same-time components recombine into v = (5, −2) m/s.</desc>
  <defs>
    <marker id="rep-kin-ancv5-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-ancv5-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-ANCV5-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Initial velocity u = (1, 2) m/s with constant a = (2, −2) m/s²</text>
    <line x1="60" y1="170" x2="420" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-ancv5-arrow)"/>
    <text x="426" y="175">+x</text>
    <line x1="120" y1="320" x2="120" y2="50" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-ancv5-arrow)"/>
    <text x="128" y="56">+y</text>
    <line x1="120" y1="170" x2="150" y2="110" stroke="currentColor" stroke-width="3" marker-end="url(#rep-kin-ancv5-arrow)"/>
    <text x="158" y="108">u = (1, 2) m/s</text>
    <line x1="300" y1="80" x2="360" y2="140" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-ancv5-arrow)"/>
    <text x="280" y="70">a = (2, −2) m/s², constant</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-ANCV5-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="90" font-weight="600">Each axis, one clock t = 2 s</text>
    <text x="470" y="112">v_x = 1 + 2 × 2 = 5 m/s</text>
    <text x="470" y="134">v_y = 2 − 2 × 2 = −2 m/s</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-ANCV5-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="120" y1="170" x2="270" y2="170" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="270" y1="170" x2="270" y2="230" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="120" y1="170" x2="270" y2="230" stroke="#1f6fb2" stroke-width="3" marker-end="url(#rep-kin-ancv5-arrow-acc)"/>
    <text x="200" y="262" fill="#1f6fb2">v = (5, −2) m/s at t = 2 s</text>
  </g>
</svg>
