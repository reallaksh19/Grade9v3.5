<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="rep-nlm-mOnM-title rep-nlm-mOnM-desc">
  <title id="rep-nlm-mOnM-title">Block m on block M with F on M: friction must drive m</title>
  <desc id="rep-nlm-mOnM-desc">Stage 1: A small block of mass m rests on a larger block of mass M on a smooth floor; a horizontal force F acts on the larger block; the coefficient of static friction between the blocks is μ_s. Stage 2: Without slip both move at a = F/(M + m); friction is the only horizontal force on m, so it must supply m a = mF/(M + m), and N = mg gives a limit μ_s m g. Stage 3: No slip needs mF/(M + m) ≤ μ_s m g, so F_max = μ_s (M + m) g.</desc>
  <defs>
    <marker id="rep-nlm-mOnM-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-mOnM-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-MONM-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Block m on block M; F pulls M; smooth floor</text>
    <line x1="20" y1="220" x2="420" y2="220" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="220" x2="22" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="220" x2="40" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="220" x2="58" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="220" x2="76" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="220" x2="94" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="220" x2="112" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="220" x2="130" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="220" x2="148" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="220" x2="166" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="220" x2="184" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="220" x2="202" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="220" x2="220" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="220" x2="238" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="220" x2="256" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="220" x2="274" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="220" x2="292" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="220" x2="310" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="220" x2="328" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="220" x2="346" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="220" x2="364" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="220" x2="382" y2="228" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="220" x2="400" y2="228" stroke="currentColor" stroke-width="1"/>
    <rect x="120" y="160" width="200" height="60" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="195" text-anchor="middle">M</text>
    <rect x="180" y="120" width="70" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="215" y="145" text-anchor="middle">m</text>
    <line x1="322" y1="190" x2="392" y2="190" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-mOnM-arrow)"/>
    <text x="398" y="195">F</text>
    <text x="20" y="120">μ_s between the blocks</text>
    <text x="20" y="260">no other horizontal force on m; surfaces horizontal</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-MONM-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="216" y1="136" x2="266" y2="136" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-mOnM-arrow-acc)"/>
    <text x="250" y="110" fill="#1f6fb2">f on m</text>
    <text x="470" y="60" font-weight="600">no slip: one a = F/(M + m)</text>
    <text x="470" y="82">only friction drives m:</text>
    <text x="470" y="104">f_required = m a = mF/(M + m)</text>
    <text x="470" y="126">N = mg, limit μ_s m g</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-MONM-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="470" y="160" fill="#1f6fb2">no slip needs mF/(M + m) ≤ μ_s m g</text>
    <text x="470" y="182" font-weight="600" fill="#1f6fb2">F_max = μ_s (M + m) g</text>
    <text x="470" y="204">μ_s N is used only at impending slip</text>
  </g>
</svg>
