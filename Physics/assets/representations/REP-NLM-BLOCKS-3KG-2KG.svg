<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" role="img" aria-labelledby="rep-nlm-ab32-title rep-nlm-ab32-desc">
  <title id="rep-nlm-ab32-title">Blocks 3 kg and 2 kg pushed together: one equation per block</title>
  <desc id="rep-nlm-ab32-desc">Stage 1: Blocks A (3 kg) and B (2 kg) touch on a smooth floor, A on the left; a 20 N force pushes A to the right into B and a 5 N force pushes B to the left; rightward is positive. Stage 2: Each block is isolated: A: 20 − N = 3a and B: N − 5 = 2a, with one a because the contact fixes the separation. Stage 3: Adding gives 15 = 5a, so a = 3 m/s² to the right, and N = 20 − 3 × 3 = 11 N; on B, 11 − 5 = 2 × 3 checks.</desc>
  <defs>
    <marker id="rep-nlm-ab32-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-ab32-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-AB32-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">Blocks A (3 kg) and B (2 kg) touch on a smooth floor</text>
    <line x1="20" y1="200" x2="420" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="200" x2="22" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="200" x2="40" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="200" x2="58" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="200" x2="76" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="200" x2="94" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="200" x2="112" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="200" x2="130" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="200" x2="148" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="200" x2="166" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="200" x2="184" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="200" x2="202" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="200" x2="220" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="200" x2="238" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="200" x2="256" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="200" x2="274" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="200" x2="292" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="200" x2="310" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="200" x2="328" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="200" x2="346" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="200" x2="364" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="200" x2="382" y2="208" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="200" x2="400" y2="208" stroke="currentColor" stroke-width="1"/>
    <rect x="140" y="130" width="80" height="70" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="180" y="170" text-anchor="middle">A 3 kg</text>
    <rect x="220" y="145" width="76" height="55" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="258" y="177.5" text-anchor="middle">B 2 kg</text>
    <line x1="60" y1="165" x2="136" y2="165" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-ab32-arrow)"/>
    <text x="60" y="155">20 N</text>
    <line x1="376" y1="172" x2="300" y2="172" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-ab32-arrow)"/>
    <text x="376" y="162" text-anchor="end">5 N</text>
    <text x="20" y="240">rightward positive; the blocks stay in contact</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-AB32-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="128" y="118" width="104" height="94" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="214" y="136" width="90" height="74" rx="8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="450" y="60" font-weight="600">one link, one a (contact fixes the gap)</text>
    <text x="450" y="82">A: 20 − N = 3a</text>
    <text x="450" y="104">B: N − 5 = 2a</text>
    <text x="450" y="126">N = contact force, B on A / A on B</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-AB32-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="450" y="170" font-weight="600" fill="#1f6fb2">add: 15 = 5a, a = 3 m/s² right</text>
    <text x="450" y="192" font-weight="600" fill="#1f6fb2">N = 20 − 3 × 3 = 11 N</text>
    <text x="450" y="214">check on B: 11 − 5 = 2 × 3 ✓</text>
  </g>
</svg>
