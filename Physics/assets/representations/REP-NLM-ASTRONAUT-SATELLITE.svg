<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" role="img" aria-labelledby="rep-nlm-space-title rep-nlm-space-desc">
  <title id="rep-nlm-space-title">Astronaut and satellite: one interaction, two forces on two bodies</title>
  <desc id="rep-nlm-space-desc">Stage 1: In space a 70 kg astronaut pushes a 350 kg satellite with a force of 140 N; no other forces act and both start at rest. Stage 2: The astronaut pushes the satellite with 140 N away from the astronaut, and the satellite pushes the astronaut with 140 N the other way: same size, opposite direction, different bodies. Stage 3: The satellite accelerates at 140/350 = 0.4 m/s² away from the astronaut and the astronaut at 140/70 = 2 m/s² the other way.</desc>
  <defs>
    <marker id="rep-nlm-space-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-space-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-SPACE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">In space: a 70 kg astronaut pushes a 350 kg satellite</text>
    <circle cx="120" cy="120.8" r="10.8" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="120" y1="131.6" x2="120" y2="164" stroke="currentColor" stroke-width="2"/>
    <line x1="120" y1="164" x2="106.5" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="120" y1="164" x2="133.5" y2="200" stroke="currentColor" stroke-width="2"/>
    <line x1="102" y1="144.2" x2="138" y2="144.2" stroke="currentColor" stroke-width="2"/>
    <rect x="200" y="110" width="130" height="80" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="265" y="146" text-anchor="middle">satellite</text>
    <text x="265" y="168" text-anchor="middle">350 kg</text>
    <line x1="128" y1="148" x2="200" y2="148" stroke="currentColor" stroke-width="2"/>
    <text x="80" y="226">astronaut 70 kg</text>
    <text x="20" y="285">push 140 N; no other forces; both start at rest</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-SPACE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="332" y1="150" x2="402" y2="150" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-space-arrow)"/>
    <text x="200" y="96">astronaut on satellite: +140 N</text>
    <line x1="100" y1="170" x2="30" y2="170" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-space-arrow)"/>
    <text x="20" y="254" text-anchor="start">satellite on astronaut: −140 N</text>
    <text x="460" y="60" font-weight="600">each force on its own body:</text>
    <text x="460" y="82">on satellite: 140 N away</text>
    <text x="460" y="104">on astronaut: 140 N back</text>
    <text x="460" y="126">same size, opposite, different bodies</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-SPACE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="460" y="170" font-weight="600" fill="#1f6fb2">a_satellite = 140/350 = 0.4 m/s²</text>
    <text x="460" y="192" font-weight="600" fill="#1f6fb2">a_astronaut = 140/70 = 2 m/s²</text>
    <text x="460" y="214">opposite directions; the pair never</text>
    <text x="460" y="236">sits in one body's sum</text>
  </g>
</svg>
