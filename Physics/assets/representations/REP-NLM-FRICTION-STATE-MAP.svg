<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" role="img" aria-labelledby="frs-title frs-desc">
<title id="frs-title">Friction contact-state decision map</title><desc id="frs-desc">Four stages: solve the normal reaction and allow contact loss; find the no-slip friction demand; compare it with the static limit; after sliding starts use kinetic friction. Contact loss has N and friction zero.</desc>
<defs><marker id="frs-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker></defs>
<g data-g9-stage-id="VIS-NLM-FRICTION-STATE-V0" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
<text x="16" y="24" stroke="none" font-weight="700">1 · Solve perpendicular dynamics first</text><line x1="20" y1="145" x2="190" y2="145" stroke-width="2" /><rect x="72" y="95" width="70" height="50" fill="none" stroke-width="2" /><line x1="107" y1="95" x2="107" y2="55" stroke-width="2" marker-end="url(#frs-a)"/><text x="116" y="62" stroke="none" >N</text><line x1="107" y1="120" x2="107" y2="188" stroke-width="2" marker-end="url(#frs-a)"/><text x="116" y="184" stroke="none" >mg</text><line x1="142" y1="110" x2="205" y2="78" stroke-width="2" marker-end="url(#frs-a)"/><text x="211" y="82" stroke="none" >upward force</text>
<text x="16" y="218" stroke="none" >Use ΣF⊥ = ma⊥. N = mg only when justified.</text><text x="16" y="242" stroke="none" >If the equation requires N &lt; 0: contact is lost.</text><text x="16" y="266" stroke="none" font-weight="700">CONTACT LOST → N = 0 and f = 0</text></g>
<g data-g9-stage-id="VIS-NLM-FRICTION-STATE-V1" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
<text x="16" y="24" stroke="none" font-weight="700">2 · Assume no slip and find f_required</text><line x1="20" y1="145" x2="250" y2="145" stroke-width="2" /><rect x="82" y="95" width="70" height="50" fill="none" stroke-width="2" /><line x1="152" y1="119" x2="230" y2="119" stroke-width="2" marker-end="url(#frs-a)"/><text x="162" y="105" stroke="none" >applied force</text><line x1="82" y1="130" x2="34" y2="130" stroke-width="2" marker-end="url(#frs-a)"/><text x="18" y="115" stroke="none" >f_required</text><text x="16" y="202" stroke="none" >Solve the tangential Newton-II equation.</text><text x="16" y="226" stroke="none" >Do not set static friction to μ_sN yet.</text></g>
<g data-g9-stage-id="VIS-NLM-FRICTION-STATE-V2" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
<text x="16" y="24" stroke="none" font-weight="700">3 · Compare demand with the static capacity</text><text x="28" y="78" stroke="none" >STATIC BELOW LIMIT</text><text x="238" y="78" stroke="none" >IMPENDING SLIP</text><text x="28" y="105" stroke="none" >|f_required| &lt; μ_sN</text><text x="238" y="105" stroke="none" >|f_s| = μ_sN</text><text x="28" y="132" stroke="none" >f_s = f_required</text><text x="238" y="132" stroke="none" >equality only here</text><line x1="45" y1="170" x2="386" y2="170" stroke-width="2" /><text x="45" y="194" stroke="none" >0</text><text x="350" y="194" stroke="none" >μ_sN</text><text x="16" y="240" stroke="none">On an incline this comparison gives the</text><text x="16" y="262" stroke="none">angle where sliding starts.</text></g>
<g data-g9-stage-id="VIS-NLM-FRICTION-STATE-V3" font-family="system-ui,sans-serif" font-size="14" fill="currentColor" stroke="currentColor">
<text x="16" y="24" stroke="none" font-weight="700">4 · Once sliding starts, switch model</text><line x1="20" y1="145" x2="250" y2="145" stroke-width="2" /><rect x="88" y="95" width="70" height="50" fill="none" stroke-width="2" /><line x1="158" y1="118" x2="235" y2="118" stroke-width="2" marker-end="url(#frs-a)"/><text x="165" y="105" stroke="none" >relative sliding</text><line x1="88" y1="132" x2="32" y2="132" stroke-width="2" marker-end="url(#frs-a)"/><text x="18" y="116" stroke="none" >f_k</text><text x="16" y="205" stroke="none" >SLIDING → |f_k| = μ_kN, opposite relative sliding.</text><text x="16" y="230" stroke="none">For several contacts, update N and each state</text><text x="16" y="252" stroke="none">after a switch.</text><text x="16" y="282" stroke="none">CONTACT LOST remains separate: N = f = 0.</text></g></svg>
