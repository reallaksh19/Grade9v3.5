<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-labelledby="rep-nlm-roughslide-title rep-nlm-roughslide-desc">
  <title id="rep-nlm-roughslide-title">Block sliding down a rough incline: a = g(sin θ − μ_k cos θ)</title>
  <desc id="rep-nlm-roughslide-desc">Stage 1: A block is already sliding down a rough fixed plane inclined at θ with coefficient of kinetic friction μ_k; no other force acts. Stage 2: N = mg cos θ, and kinetic friction of size μ_k mg cos θ acts up the plane, opposite the sliding. Stage 3: Down the plane mg sin θ − μ_k mg cos θ = m a, so a = g(sin θ − μ_k cos θ).</desc>
  <defs>
    <marker id="rep-nlm-roughslide-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-roughslide-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-ROUGHSLIDE-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A block already sliding down a rough incline</text>
    <polygon points="40,260 370,260 370,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="84" y="252" text-anchor="middle" font-size="14">θ</text>
    <path d="M70 260 A30 30 0 0 0 66 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(-30 161.4 170.3)"><rect x="133.4 " y="153.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="20" y="300">coefficient of kinetic friction μ_k; no other force</text>
    <line x1="101.8" y1="147" x2="58.5" y2="172" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-roughslide-arrow)"/>
    <text x="50.5" y="188" text-anchor="end">sliding</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ROUGHSLIDE-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="161.4" y1="170.3" x2="161.4" y2="240.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-roughslide-arrow)"/>
    <text x="169.4" y="246.3">mg</text>
    <line x1="152.4" y1="154.7" x2="124.4" y2="106.2" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-roughslide-arrow)"/>
    <text x="116.4" y="100.2" text-anchor="end">N</text>
    <line x1="187.4" y1="155.3" x2="235.9" y2="127.3" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-roughslide-arrow-acc)"/>
    <text x="243.9" y="121.3" text-anchor="start" fill="#1f6fb2">f_k</text>
    <text x="440" y="60" font-weight="600">N = mg cos θ</text>
    <text x="440" y="82">f_k = μ_k mg cos θ, up the plane</text>
    <text x="440" y="104">(opposite the sliding)</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-ROUGHSLIDE-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="440" y="150" fill="#1f6fb2">down-plane: mg sin θ − μ_k mg cos θ = m a</text>
    <text x="440" y="172" font-weight="600" fill="#1f6fb2">a = g (sin θ − μ_k cos θ)</text>
  </g>
</svg>
