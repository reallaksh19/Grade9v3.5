<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="rep-kin-verbal-title rep-kin-verbal-desc">
  <title id="rep-kin-verbal-title">Verbal motion to signed components: east 6 m/s, north 2 m/s, acceleration 3 m/s² south</title>
  <desc id="rep-kin-verbal-desc">Stage 1: a compass rose (N, E, S, W) and a particle at the origin at t = 0, moving east at 6 m/s and north at 2 m/s, with an acceleration of 3 m/s² south and zero east–west, all given in words. Stage 2: a declared frame: +x east, +y north, origin at the start. Stage 3: the signed components in that frame: u_x = +6 m/s, u_y = +2 m/s, a_x = 0, a_y = −3 m/s². Stage 4: one common t serves both axes; another consistent frame also works if every sign changes with it.</desc>
  <defs>
    <marker id="rep-kin-verbal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-kin-verbal-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-KIN-2D-VERBAL-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A particle described in words</text>
    <circle cx="80" cy="90" r="30" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <line x1="80" y1="64" x2="80" y2="116" stroke="currentColor" stroke-width="1.5"/>
    <line x1="54" y1="90" x2="106" y2="90" stroke="currentColor" stroke-width="1.5"/>
    <text x="80" y="54" text-anchor="middle" font-weight="600">N</text>
    <text x="80" y="138" text-anchor="middle" font-weight="600">S</text>
    <text x="118" y="95" font-weight="600">E</text>
    <text x="34" y="95" text-anchor="end" font-weight="600">W</text>
    <circle cx="200" cy="210" r="7" fill="currentColor"/>
    <text x="190" y="236" text-anchor="end">t = 0: at the origin</text>
    <line x1="200" y1="210" x2="380" y2="210" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-verbal-arrow)"/>
    <text x="290" y="234" text-anchor="middle">moving east at 6 m/s</text>
    <line x1="200" y1="210" x2="200" y2="150" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-verbal-arrow)"/>
    <text x="208" y="146">moving north at 2 m/s</text>
    <line x1="350" y1="246" x2="350" y2="321" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-kin-verbal-arrow)" stroke-dasharray="7 4"/>
    <text x="360" y="306">acceleration 3 m/s² south</text>
    <text x="360" y="326">(zero east–west)</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-VERBAL-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="600" y="60" font-weight="600">declared frame</text>
    <text x="600" y="82">+x = east, +y = north</text>
    <text x="600" y="104">origin at the start, t = 0 there</text>
    <line x1="600" y1="190" x2="670" y2="190" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-verbal-arrow)"/>
    <line x1="600" y1="190" x2="600" y2="136" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-kin-verbal-arrow)"/>
    <text x="676" y="195">+x (E)</text>
    <text x="608" y="142">+y (N)</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-VERBAL-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="600" y="236" font-weight="600" fill="#1f6fb2">signed components</text>
    <text x="600" y="258" fill="#1f6fb2">u_x = +6 m/s,  u_y = +2 m/s</text>
    <text x="600" y="280" fill="#1f6fb2">a_x = 0,  a_y = −3 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-KIN-2D-VERBAL-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="600" y="320" font-weight="600">one common t on both axes</text>
    <text x="600" y="342">another consistent frame also works</text>
    <text x="600" y="364">if every sign changes with it</text>
  </g>
</svg>
