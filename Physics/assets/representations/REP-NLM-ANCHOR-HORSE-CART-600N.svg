<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="rep-nlm-anc-horsecart-title rep-nlm-anc-horsecart-desc">
  <title id="rep-nlm-anc-horsecart-title">A horse pulling a 200 kg cart along a road</title>
  <desc id="rep-nlm-anc-horsecart-desc">Stage 1: a horse pulls a 200 kg cart with 600 N, and road friction on the cart is 200 N. Stage 2: the cart's horizontal diagram has the horse's 600 N pull forward and the road's 200 N friction backward. Stage 3: F_net = 600 − 200 = 400 N, so a = 400/200 = 2 m/s²; the cart's pull on the horse acts on the horse and belongs on the horse's diagram, not in this sum.</desc>
