<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="rep-nlm-labaxes-title rep-nlm-labaxes-desc">
  <title id="rep-nlm-labaxes-title">2 kg block on a smooth 30° incline in horizontal and vertical axes</title>
  <desc id="rep-nlm-labaxes-desc">Stage 1: A 2 kg block slides down a smooth fixed 30° incline that slopes down to the right; +x is horizontal to the right and +y vertically up; g = 10 m/s². Stage 2: N sin 30° = m a_x and N cos 30° − mg = m a_y, and staying on the plane requires a_y = −a_x tan 30°. Stage 3: N = mg cos 30° ≈ 17.3 N, a_x ≈ 4.33 m/s² and a_y = −2.5 m/s², so |a| = 5 m/s² = g sin 30° down the slope, as with plane axes, where the contact condition is simply a_perp = 0.</desc>
  <defs>
    <marker id="rep-nlm-labaxes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-labaxes-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-LABAXES-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A 2 kg block slides down a smooth 30° incline (down to the right)</text>
    <polygon points="40,260 370,260 40,69.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="326" y="252" text-anchor="middle" font-size="14">30°</text>
    <path d="M340 260 A30 30 0 0 1 344 245" fill="none" stroke="currentColor" stroke-width="1.2"/>
    <g transform="rotate(30 231.3 160.3)"><rect x="203.3 " y="143.3" width="56" height="34" fill="none" stroke="currentColor" stroke-width="2"/></g>
    <text x="231.3" y="165.3" text-anchor="middle" font-size="14">2 kg</text>
    <line x1="420" y1="250" x2="480" y2="250" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-labaxes-arrow)"/>
    <text x="486" y="255">+x</text>
    <line x1="420" y1="250" x2="420" y2="190" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-labaxes-arrow)"/>
    <text x="428" y="196">+y</text>
    <text x="20" y="300">g = 10 m/s²; Student B uses horizontal x and vertical y</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LABAXES-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="231.3" y1="160.3" x2="231.3" y2="220.3" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-labaxes-arrow)"/>
    <text x="239.3" y="230.3">mg = 20 N</text>
    <line x1="240.3" y1="144.7" x2="268.3" y2="96.2" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-labaxes-arrow)"/>
    <text x="276.3" y="90.2" text-anchor="start">N</text>
    <text x="520" y="60" font-weight="600">lab axes:</text>
    <text x="520" y="82">x: N sin 30° = m a_x</text>
    <text x="520" y="104">y: N cos 30° − mg = m a_y</text>
    <text x="520" y="126" font-weight="600" fill="#1f6fb2">stays on plane: a_y = −a_x tan 30°</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-LABAXES-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="520" y="170" font-weight="600" fill="#1f6fb2">N = mg cos 30° ≈ 17.3 N</text>
    <text x="520" y="192" fill="#1f6fb2">a_x ≈ 4.33 m/s², a_y = −2.5 m/s²</text>
    <text x="520" y="214" font-weight="600" fill="#1f6fb2">|a| = 5 m/s² = g sin 30°, down the slope</text>
    <text x="520" y="236">plane axes are simpler: a_perp = 0</text>
  </g>
</svg>
