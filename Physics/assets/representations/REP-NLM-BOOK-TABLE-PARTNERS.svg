<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="rep-nlm-bookpartners-title rep-nlm-bookpartners-desc">
  <title id="rep-nlm-bookpartners-title">Book on a table: the partners of its weight and of the table's push</title>
  <desc id="rep-nlm-bookpartners-desc">Stage 1: A book rests on a horizontal table on the Earth. Stage 2: Two forces act on the book: (a) the Earth's pull, its weight, and (b) the table's upward push; both act on the book, so they are not partners. Stage 3: The partner of (a) is the book's pull on the Earth, acting on the Earth and pointing up; the partner of (b) is the book's push on the table, acting on the table and pointing down.</desc>
  <defs>
    <marker id="rep-nlm-bookpartners-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-bookpartners-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-BOOKPARTNERS-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A book at rest on a horizontal table</text>
    <line x1="60" y1="170" x2="360" y2="170" stroke="currentColor" stroke-width="3"/>
    <line x1="80" y1="170" x2="80" y2="250" stroke="currentColor" stroke-width="3"/>
    <line x1="340" y1="170" x2="340" y2="250" stroke="currentColor" stroke-width="3"/>
    <rect x="170" y="138" width="90" height="32" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="215" y="159" text-anchor="middle">book</text>
    <path d="M20 330 A400 60 0 0 1 420 330" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="210" y="312" text-anchor="middle">Earth</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOOKPARTNERS-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="180" y1="150" x2="180" y2="200" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-bookpartners-arrow)"/>
    <text x="20" y="214" text-anchor="start">(a) Earth on book (weight)</text>
    <line x1="235" y1="168" x2="235" y2="108" stroke="currentColor" stroke-width="2.5" marker-end="url(#rep-nlm-bookpartners-arrow)"/>
    <text x="243" y="112">(b) table on book</text>
    <text x="470" y="60" font-weight="600">both act on the book:</text>
    <text x="470" y="82">they are not partners of each other</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-BOOKPARTNERS-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="210" y1="300" x2="210" y2="260" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-bookpartners-arrow-acc)"/>
    <text x="218" y="274" fill="#1f6fb2">book on Earth: up</text>
    <line x1="300" y1="172" x2="300" y2="212" stroke="#1f6fb2" stroke-width="2.5" marker-end="url(#rep-nlm-bookpartners-arrow-acc)"/>
    <text x="308" y="214" fill="#1f6fb2">book on table: down</text>
    <text x="470" y="130" font-weight="600" fill="#1f6fb2">(a) partner: book pulls the Earth,</text>
    <text x="470" y="152" fill="#1f6fb2">acts on the Earth, points up</text>
    <text x="470" y="174" font-weight="600" fill="#1f6fb2">(b) partner: book pushes the table,</text>
    <text x="470" y="196" fill="#1f6fb2">acts on the table, points down</text>
  </g>
</svg>
