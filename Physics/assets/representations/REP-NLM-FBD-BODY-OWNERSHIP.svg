<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="rep-nlm-fbd-title rep-nlm-fbd-desc">
  <title id="rep-nlm-fbd-title">Free-body diagram owned by one chosen body: the cart pulled by a horse</title>
  <desc id="rep-nlm-fbd-desc">Drawn qualitatively, without values. Stage 1: the physical situation: a horse pulls a cart along level ground through shafts that rise from the cart to the horse. Stage 2: the cart is chosen as the body, outlined heavily, and axes are declared: +x forward toward the horse, +y upward. Stage 3: the external agents that act on the cart are named: the horse, the Earth and the ground; a dashed system boundary encloses the cart only. Stage 4: the owned force arrows, each labelled with agent and receiver: F, horse on cart, along the shafts, forward and upward at angle θ; W, Earth on cart, downward; N, ground on cart, upward. The partner force, cart on horse, is drawn dashed on the horse outside the boundary: it belongs on the horse's diagram and never cancels F on the cart's diagram. Stage 5: F is resolved into components F_x along +x and F_y along +y; the components replace F in the axis equations and are not extra forces.</desc>
  <defs>
    <marker id="rep-nlm-fbd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-fbd-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-FBD-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="10" y1="280" x2="630" y2="280" stroke="currentColor" stroke-width="2"/>
    <path d="M20 280 l-10 10 M60 280 l-10 10 M100 280 l-10 10 M140 280 l-10 10 M180 280 l-10 10 M220 280 l-10 10 M260 280 l-10 10 M300 280 l-10 10 M340 280 l-10 10 M380 280 l-10 10 M420 280 l-10 10 M460 280 l-10 10 M500 280 l-10 10 M540 280 l-10 10 M580 280 l-10 10 M620 280 l-10 10" stroke="currentColor"/>
    <rect x="70" y="190" width="140" height="55" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="140" cy="257" r="23" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="210" y1="210" x2="425" y2="124" stroke="currentColor" stroke-width="3"/>
    <ellipse cx="490" cy="128" rx="65" ry="26" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M442 146 V280 M460 152 V280 M518 152 V280 M536 146 V280" stroke="currentColor" stroke-width="2"/>
    <path d="M542 114 L575 68 L600 76 L580 92 L552 126" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="80" y="223">cart</text>
    <text x="472" y="133">horse</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FBD-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="70" y="190" width="140" height="55" fill="none" stroke="currentColor" stroke-width="5"/>
    <circle cx="140" cy="257" r="23" fill="none" stroke="currentColor" stroke-width="4"/>
    <text x="20" y="28" font-weight="600">chosen body: cart</text>
    <line x1="30" y1="110" x2="85" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-fbd-arrow)"/>
    <line x1="30" y1="110" x2="30" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-fbd-arrow)"/>
    <text x="70" y="130">+x</text>
    <text x="38" y="64">+y</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FBD-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="54" y="172" width="172" height="118" rx="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="236" y="306">system boundary: cart only</text>
    <text x="20" y="366" font-weight="600">External agents acting on the cart: horse, Earth, ground</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FBD-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="210" y1="210" x2="303" y2="173" stroke="#1f6fb2" stroke-width="3.5" marker-end="url(#rep-nlm-fbd-arrow-accent)"/>
    <text x="218" y="132" fill="#1f6fb2" font-weight="600">F (horse on cart)</text>
    <line x1="120" y1="217" x2="120" y2="332" stroke="#1f6fb2" stroke-width="3.5" marker-end="url(#rep-nlm-fbd-arrow-accent)"/>
    <text x="130" y="336" fill="#1f6fb2" font-weight="600">W (Earth on cart)</text>
    <line x1="165" y1="280" x2="165" y2="150" stroke="#1f6fb2" stroke-width="3.5" marker-end="url(#rep-nlm-fbd-arrow-accent)"/>
    <text x="158" y="152" text-anchor="end" fill="#1f6fb2" font-weight="600">N (ground on cart)</text>
    <line x1="425" y1="124" x2="365" y2="148" stroke="currentColor" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#rep-nlm-fbd-arrow)"/>
    <text x="370" y="30">cart on horse (dashed arrow):</text>
    <text x="370" y="50">belongs on the horse's diagram</text>
    <text x="20" y="392">Every arrow answers "who acts on the cart?". Partner forces act on</text>
    <text x="20" y="414">the other body and never cancel on this diagram.</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-FBD-V4" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <line x1="210" y1="210" x2="303" y2="210" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#rep-nlm-fbd-arrow)"/>
    <line x1="303" y1="210" x2="303" y2="175" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#rep-nlm-fbd-arrow)"/>
    <text x="244" y="230">F_x</text>
    <text x="310" y="198">F_y</text>
    <path d="M250 210 A40 40 0 0 0 247 195" fill="none" stroke="currentColor"/>
    <text x="254" y="204" font-size="14">θ</text>
    <text x="20" y="446" font-weight="600">Components: F_x = F cos θ along +x, F_y = F sin θ along +y.</text>
    <text x="20" y="468">They replace F in the axis equations; they are not extra forces.</text>
  </g>
</svg>
