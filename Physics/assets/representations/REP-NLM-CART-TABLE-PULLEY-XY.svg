<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img" aria-labelledby="rep-nlm-cartxy-title rep-nlm-cartxy-desc">
  <title id="rep-nlm-cartxy-title">A cart on a table tied over a fixed pulley to a hanging mass, with x = 0.9 m and y = 0.5 m</title>
  <desc id="rep-nlm-cartxy-desc">Stage 1: a cart on a table is tied by a light inextensible string over a fixed pulley at the table's edge to a hanging mass; x, the cart's distance from the pulley, is 0.9 m and y, the mass's depth below the pulley, is 0.5 m, both measured away from the pulley. Stage 2: only the two straight segments change length, so x + y = 1.4 m. Stage 3: when y = 1.3 m, x = 1.4 − 1.3 = 0.1 m (dashed positions). Stage 4: with the cart moving toward the pulley at 0.3 m/s and speeding up at 1.2 m/s², dx/dt = −0.3 m/s and d²x/dt² = −1.2 m/s², so dy/dt = +0.3 m/s and d²y/dt² = +1.2 m/s²: the mass moves down, speeding up.</desc>
  <defs>
    <marker id="rep-nlm-cartxy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-cartxy-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
  <g data-g9-stage-id="VIS-NLM-CARTXY-V0" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="20" y="26" font-weight="600">A cart on a table tied over a fixed pulley to a hanging mass</text>
    <line x1="20" y1="110" x2="440" y2="110" stroke="currentColor" stroke-width="2"/>
    <line x1="30" y1="110" x2="22" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="48" y1="110" x2="40" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="66" y1="110" x2="58" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="84" y1="110" x2="76" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="102" y1="110" x2="94" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="120" y1="110" x2="112" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="138" y1="110" x2="130" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="156" y1="110" x2="148" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="174" y1="110" x2="166" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="192" y1="110" x2="184" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="210" y1="110" x2="202" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="228" y1="110" x2="220" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="246" y1="110" x2="238" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="264" y1="110" x2="256" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="282" y1="110" x2="274" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="300" y1="110" x2="292" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="318" y1="110" x2="310" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="336" y1="110" x2="328" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="354" y1="110" x2="346" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="372" y1="110" x2="364" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="390" y1="110" x2="382" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="408" y1="110" x2="400" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="426" y1="110" x2="418" y2="118" stroke="currentColor" stroke-width="1"/>
    <line x1="425" y1="110" x2="425" y2="400" stroke="currentColor" stroke-width="2"/>
    <circle cx="440" cy="100" r="15" fill="none" stroke="currentColor" stroke-width="2"/>
    <rect x="180" y="70" width="80" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="220" y="95" text-anchor="middle">cart</text>
    <line x1="260" y1="85" x2="440" y2="85" stroke="currentColor" stroke-width="1.5"/>
    <line x1="455" y1="100" x2="455" y2="200" stroke="currentColor" stroke-width="1.5"/>
    <rect x="435" y="200" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2"/>
    <text x="455" y="225" text-anchor="middle">m</text>
    <line x1="440" y1="55" x2="262" y2="55" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-cartxy-arrow)"/>
    <text x="300" y="45">x = 0.9 m</text>
    <line x1="470" y1="100" x2="530" y2="100" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
    <line x1="515" y1="100" x2="515" y2="198" stroke="currentColor" stroke-width="1.5" marker-end="url(#rep-nlm-cartxy-arrow)"/>
    <text x="522" y="160">y = 0.5 m</text>
    <text x="600" y="60">x and y measured away</text>
    <text x="600" y="82">from the pulley</text>
    <text x="600" y="104">pulley fixed; string taut</text>
    <text x="600" y="126">and inextensible</text>
    <text x="20" y="150">(b) the mass reaches the</text>
    <text x="20" y="172">floor when y = 1.3 m</text>
    <text x="20" y="194">(c) cart moves toward the</text>
    <text x="20" y="216">pulley at 0.3 m/s, speeding</text>
    <text x="20" y="238">up at 1.2 m/s²</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARTXY-V1" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="600" y="170" font-weight="600">x + y = 0.9 + 0.5 = 1.4 m</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARTXY-V2" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <rect x="340" y="70" width="80" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="435" y="360" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="600" y="210">y = 1.3 m:</text>
    <text x="600" y="232">x = 1.4 − 1.3 = 0.1 m</text>
  </g>
  <g data-g9-stage-id="VIS-NLM-CARTXY-V3" font-family="system-ui,sans-serif" font-size="15" fill="currentColor">
    <text x="600" y="276" fill="#1f6fb2">dx/dt = −0.3 m/s,</text>
    <text x="600" y="298" fill="#1f6fb2">d²x/dt² = −1.2 m/s²</text>
    <text x="600" y="320" fill="#1f6fb2">dy/dt = +0.3 m/s,</text>
    <text x="600" y="342" fill="#1f6fb2">d²y/dt² = +1.2 m/s²</text>
    <text x="600" y="376" font-weight="600" fill="#1f6fb2">the mass moves down,</text>
    <text x="600" y="398" font-weight="600" fill="#1f6fb2">speeding up</text>
  </g>
</svg>
