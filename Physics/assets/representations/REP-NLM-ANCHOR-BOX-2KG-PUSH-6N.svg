<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="rep-nlm-anc-box2push6-title rep-nlm-anc-box2push6-desc">
  <title id="rep-nlm-anc-box2push6-title">A 2 kg box on a rough floor pushed sideways with 6 N</title>
  <desc id="rep-nlm-anc-box2push6-desc">Stage 1: a 2 kg box on a rough floor with μ_s = 0.5 and g = 10 m/s² is pushed sideways with 6 N and does not move. Stage 2: N = 20 N, so static friction can give at most μ_s N = 0.5 × 20 = 10 N. Stage 3: rest needs friction to balance the push, so friction is 6 N opposite the push, within the 10 N limit.</desc>
  <defs>
    <marker id="rep-nlm-anc-box2push6-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="currentColor"/></marker>
    <marker id="rep-nlm-anc-box2push6-arrow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1f6fb2"/></marker>
  </defs>
